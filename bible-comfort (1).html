<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>말씀위로</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#0e1825;--bg2:#152032;--bg3:#1c2a42;--bg4:#233555;
  --cream:#faf6ef;--cream2:#f0e8db;--cream3:#e4dace;
  --gold:#c4a265;--gold2:#d4b88a;--gold3:#a88b4a;
  --olive:#7a9462;--olive2:#9bb07e;
  --coral:#e8725c;--coral2:rgba(232,114,92,.12);
  --navy-t:#1b2d4a;--body:#3a4a5e;--sub:#8294a8;--sub2:#5a6f85;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--cream3)}
svg{fill:currentColor}

/* ===== 인트로 — 한 문장 + 시그니처 로고 ===== */
.intro{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;animation:introOut .8s ease-in 4.2s forwards}
@keyframes introOut{to{opacity:0;visibility:hidden;pointer-events:none}}

/* 글로우 */
.i-glow{position:absolute;width:200px;height:200px;border-radius:50%;top:43%;left:50%;transform:translate(-50%,-50%);filter:blur(60px);background:rgba(196,162,101,.06);animation:iGlow 4.2s ease-in-out forwards}
@keyframes iGlow{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}30%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:.6;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0}}

/* 메인 문구: 천천히 나타나고 → 머물고 → 사라짐 */
.i-msg{position:relative;z-index:5;font-family:'Noto Serif KR',serif;font-size:20px;font-weight:600;color:var(--cream);line-height:1.8;opacity:0;animation:iMsg 2.8s ease-in-out .3s forwards}
@keyframes iMsg{0%{opacity:0;transform:translateY(8px)}20%{opacity:1;transform:translateY(0)}75%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-4px)}}

/* 시그니처 로고: 문구 사라진 후 딱 나타남 */
.i-logo{position:relative;z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;animation:iLogo 1.2s ease-out 3s forwards}
@keyframes iLogo{0%{opacity:0;transform:scale(.85)}30%{opacity:1;transform:scale(1.02)}50%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}

/* 로고 십자가 마크 */
.i-logo-mark{width:32px;height:32px}
.i-logo-mark svg{width:100%;height:100%}

/* 로고 텍스트 */
.i-logo-text{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--gold);letter-spacing:3px}

/* 로고 서브 */
.i-logo-sub{font-size:9px;color:var(--sub);letter-spacing:4px;margin-top:-2px}


/* (인트로 애니메이션은 인트로 섹션에 통합) */

/* ===== 앱 쉘 ===== */
.app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-top:var(--safe-t)}

/* ===== 탭 화면 ===== */
.tab{flex:1;display:none;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.tab.on{display:flex}
.pad{padding:0 20px}

/* ===== 하단 5탭 네비 ===== */
.bnav{position:relative;z-index:50;flex-shrink:0;display:flex;background:var(--bg);border-top:1px solid rgba(255,255,255,.04);padding:6px 0 calc(4px + var(--safe-b))}
.nb{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 4px;color:var(--sub2);transition:.2s;font-family:'Noto Sans KR',sans-serif}
.nb.on{color:var(--gold2)}
.nb svg{width:20px;height:20px}
.nb span{font-size:9px;font-weight:500}
.nb-center{position:relative;margin-top:-16px}
.nb-center-circle{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold3));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(196,162,101,.3)}
.nb-center-circle svg{width:22px;height:22px;color:var(--bg)}

/* ===== SVG 심볼 ===== */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ===== 섹션 라벨 ===== */
.sec{padding:20px 20px 10px;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:1.5px}

/* ===== 카드 공통 ===== */
.card{background:var(--bg3);border-radius:18px;padding:22px 20px;margin:0 20px 14px;position:relative;overflow:hidden}
.card-glass{background:rgba(255,255,255,.04);border-radius:18px;padding:22px 20px;margin:0 20px 14px}
.card-cream{background:var(--cream);border-radius:18px;padding:22px 20px;margin:0 20px 14px;color:var(--navy-t)}

/* ===== 공통 버튼 ===== */
.btn-gold{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;background:none;border:1.5px solid rgba(255,255,255,.2);border-radius:24px;color:var(--cream3);font-size:13px;font-weight:500;cursor:pointer;transition:.2s;font-family:'Noto Sans KR',sans-serif}
.btn-gold:active{background:rgba(255,255,255,.06)}
.btn-gold svg{width:14px;height:14px}
.btn-fill{display:inline-flex;align-items:center;gap:6px;padding:12px 24px;background:linear-gradient(135deg,var(--gold),var(--gold3));border:none;border-radius:14px;color:var(--bg);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.5px;font-family:'Noto Sans KR',sans-serif;transition:.2s}
.btn-fill:active{transform:scale(.97);opacity:.9}
.btn-fill:disabled{opacity:.3;cursor:not-allowed;transform:none}
.badge-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--coral);color:#fff;font-size:11px;font-weight:700}
.lock-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:var(--coral2);border-radius:12px;font-size:10px;color:var(--coral);font-weight:600}

/* ==========================================================
   TAB 1: 묵상 (Reflect) — 고민 입력
   ========================================================== */
.reflect-bg{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px}
.reflect-logo{text-align:center;margin-bottom:16px}
.reflect-logo svg{width:28px;height:28px;color:var(--gold2)}
.reflect-q{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:700;color:var(--cream);text-align:center;line-height:1.6;margin-bottom:auto}
.reflect-prompts{display:flex;gap:6px;justify-content:center;margin-bottom:20px;flex-wrap:wrap}
.rp-chip{padding:6px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:20px;font-size:11px;color:var(--sub);cursor:pointer;transition:.2s;font-family:'Noto Sans KR',sans-serif}
.rp-chip:active,.rp-chip.on{background:rgba(196,162,101,.12);border-color:var(--gold);color:var(--gold2)}
.reflect-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px 18px 12px;margin-top:auto}
.reflect-ta{width:100%;min-height:80px;background:none;border:none;color:var(--cream);font-size:14px;line-height:1.8;resize:none;outline:none;font-family:'Noto Sans KR',sans-serif}
.reflect-ta::placeholder{color:var(--sub)}
.reflect-bottom{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:8px}
.reflect-cc{font-size:11px;color:var(--sub)}
.reflect-send{width:36px;height:36px;border-radius:50%;background:var(--gold);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;opacity:.3}
.reflect-send.ready{opacity:1}
.reflect-send:active{transform:scale(.9)}
.reflect-send svg{width:16px;height:16px;color:var(--bg)}

/* ==========================================================
   TAB 2: 홈 (Overview)
   ========================================================== */
.home-greeting{padding:20px 20px 4px}
.home-greeting h1{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:900;color:var(--cream)}
.home-greeting p{font-size:13px;color:var(--sub);margin-top:4px}

/* 진행중 플레이북 */
.pb-card{margin:0 20px 14px;background:var(--bg3);border-radius:18px;padding:0;overflow:hidden}
.pb-head{padding:14px 18px;background:var(--bg4);display:flex;align-items:center;gap:10px}
.pb-cat{padding:4px 12px;background:rgba(232,114,92,.15);border-radius:8px;font-size:10px;font-weight:700;color:var(--coral)}
.pb-title{padding:14px 18px 8px;font-size:15px;font-weight:700;color:var(--cream);line-height:1.5}
.pb-concern{padding:0 18px 12px;font-size:12px;color:var(--sub);line-height:1.5}
.pb-steps{padding:0 18px 16px}
.pb-step{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.04);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:.2s}
.pb-step:active{background:rgba(255,255,255,.08)}
.pb-step-circle{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--sub);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--olive2)}
.pb-step-circle.done{border-color:var(--olive);background:var(--olive);color:#fff}
.pb-step-name{flex:1;font-size:12px;color:var(--cream3)}
.pb-step-meta{font-size:10px;color:var(--sub)}
.pb-step-icon{width:16px;height:16px;color:var(--sub)}

/* 실천행동 가로 스크롤 */
.action-scroll{display:flex;gap:12px;padding:0 20px 16px;overflow-x:auto;scrollbar-width:none}
.action-scroll::-webkit-scrollbar{display:none}
.action-card{flex-shrink:0;width:260px;background:var(--bg3);border-radius:16px;padding:18px;cursor:pointer;transition:.2s}
.action-card:active{background:var(--bg4)}
.ac-date{font-size:10px;color:var(--sub);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.ac-badge{display:inline-block;padding:3px 10px;background:rgba(255,255,255,.06);border-radius:6px;font-size:10px;font-weight:600;color:var(--sub);margin-bottom:10px}
.ac-title{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.ac-title .badge-num{flex-shrink:0}
.ac-title-text{font-size:13px;font-weight:600;color:var(--cream);line-height:1.5}
.ac-from{font-size:10px;color:var(--sub);margin-bottom:4px}
.ac-from-title{font-size:12px;font-weight:600;color:var(--cream3);margin-bottom:8px}
.ac-progress{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--sub);margin-bottom:6px}
.ac-bar{height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden}
.ac-bar-fill{height:100%;background:var(--gold);border-radius:2px;transition:.3s}
.ac-updated{font-size:10px;color:var(--sub);margin-top:8px;display:flex;align-items:center;gap:4px}

/* 묵상 질문 가로 스크롤 */
.prompt-scroll{display:flex;gap:12px;padding:0 20px 20px;overflow-x:auto;scrollbar-width:none}
.prompt-scroll::-webkit-scrollbar{display:none}
.prompt-card{flex-shrink:0;width:280px;background:var(--bg3);border-radius:18px;padding:28px 22px;text-align:center;cursor:pointer;transition:.2s;position:relative}
.prompt-card:active{background:var(--bg4)}
.prompt-card svg{width:24px;height:24px;color:var(--sub);margin-bottom:8px}
.prompt-card-label{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:1.5px;margin-bottom:12px}
.prompt-card-q{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:600;color:var(--cream);line-height:1.7;margin-bottom:16px}
.prompt-card .lock-badge{position:absolute;top:14px;right:14px}

/* ==========================================================
   TAB 3: 말씀 (오늘의 말씀 + 스와이프)
   ========================================================== */
.verse-hero{padding:20px;text-align:center}
.verse-hero-date{font-size:11px;color:var(--sub);letter-spacing:1px;margin-bottom:12px}
.verse-card-main{margin:0 20px 20px;background:var(--cream);border-radius:22px;padding:28px 24px;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.verse-card-main::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:22px 22px 0 0;background:linear-gradient(90deg,var(--gold),var(--olive),var(--gold));opacity:.5}
.vcm-label{font-size:10px;font-weight:700;color:var(--olive);letter-spacing:1.5px;margin-bottom:10px}
.vcm-text{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:600;color:var(--navy-t);line-height:2;margin-bottom:14px}
.vcm-ref{font-size:13px;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:6px;margin-bottom:16px}
.vcm-ref svg{width:14px;height:14px;color:var(--olive)}
.vcm-divider{text-align:center;color:var(--olive);opacity:.3;margin-bottom:14px;font-size:14px;letter-spacing:6px}
.vcm-actions{display:flex;gap:8px;justify-content:center}
.vcm-btn{padding:8px 18px;background:none;border:1px solid rgba(27,45,74,.12);border-radius:20px;font-size:12px;color:var(--body);cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Noto Sans KR',sans-serif}
.vcm-btn svg{width:14px;height:14px}

/* 해설 */
.interp-area{margin:0 20px 20px}
.interp-card{background:var(--bg3);border-radius:16px;overflow:hidden;margin-bottom:10px}
.interp-toggle{width:100%;padding:14px 18px;background:none;border:none;color:var(--cream3);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:'Noto Sans KR',sans-serif}
.interp-toggle svg{width:14px;height:14px;color:var(--gold)}
.interp-toggle .arr{transition:.3s;font-size:10px;color:var(--sub)}
.interp-toggle.open .arr{transform:rotate(180deg)}
.interp-body{max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s;padding:0 18px}
.interp-body.open{max-height:500px;padding:0 18px 16px}
.ib-title{font-size:11px;font-weight:700;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.ib-title svg{width:12px;height:12px}
.ib-text{font-size:12px;color:var(--cream3);line-height:1.85;margin-bottom:12px}

/* ==========================================================
   TAB 4: 일기 (Journal)
   ========================================================== */
.journal-cal{display:flex;padding:14px 20px;gap:4px}
.jc-day{flex:1;text-align:center;padding:8px 4px;border-radius:12px;cursor:pointer;transition:.2s}
.jc-day.today{background:var(--coral);color:#fff;border-radius:12px}
.jc-day:active{background:rgba(255,255,255,.06)}
.jc-dow{font-size:9px;color:var(--sub);margin-bottom:4px;font-weight:600}
.jc-num{font-size:14px;font-weight:600;color:var(--cream)}
.jc-day.today .jc-dow,.jc-day.today .jc-num{color:#fff}

.journal-card{margin:0 20px 14px;background:var(--bg3);border-radius:18px;padding:28px 22px;text-align:center;cursor:pointer;transition:.2s}
.journal-card:active{background:var(--bg4)}
.journal-card svg{width:28px;height:28px;color:var(--sub);margin-bottom:8px}
.jc-label{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:1.5px;margin-bottom:8px}
.jc-title{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--cream);line-height:1.5;margin-bottom:6px}
.jc-desc{font-size:12px;color:var(--sub);line-height:1.6;margin-bottom:14px}

/* ==========================================================
   TAB 5: 보관함
   ========================================================== */
.saved-item{margin:0 20px 10px;background:rgba(255,255,255,.03);border-bottom:1px solid rgba(255,255,255,.04);border-radius:14px;padding:16px 18px;cursor:pointer;position:relative;transition:.2s}
.saved-item:active{background:rgba(196,162,101,.05)}
.sv-date{font-size:10px;color:var(--sub);margin-bottom:6px}
.sv-verse{font-family:'Noto Serif KR',serif;font-size:13px;color:var(--cream);line-height:1.7;margin-bottom:5px}
.sv-ref{font-size:11px;color:var(--gold);font-weight:600}
.sv-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:rgba(196,162,101,.1);color:var(--gold2);padding:3px 10px;border-radius:20px;margin-top:6px}
.sv-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--sub);font-size:14px;cursor:pointer;opacity:.3;padding:4px}

/* ===== 설정모달 ===== */
.modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-c{width:100%;max-width:480px;background:var(--bg2);border-radius:20px 20px 0 0;padding:20px 20px calc(20px + var(--safe-b));animation:su .3s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-h{width:36px;height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin:0 auto 14px}
.m-title{font-size:16px;font-weight:700;color:var(--gold2);margin-bottom:12px}
.m-label{font-size:11px;color:var(--sub);margin-bottom:5px}
.m-input{width:100%;padding:12px 14px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08);border-radius:12px;font-size:13px;color:var(--cream);outline:none;font-family:'Noto Sans KR',sans-serif}
.m-hint{font-size:10px;color:var(--sub);margin-top:5px;line-height:1.5}
.api-s{display:flex;align-items:center;gap:6px;font-size:10px;margin-top:5px}
.dot-on{width:7px;height:7px;border-radius:50%;background:#4ade80}
.dot-off{width:7px;height:7px;border-radius:50%;background:var(--coral)}

/* 로딩 */
.loading-overlay{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loading-overlay.on{display:flex}
.loading-overlay svg{width:44px;height:44px;color:var(--gold);animation:ldp 2s ease-in-out infinite}
@keyframes ldp{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:1;transform:scale(1.1)}}
.ld-t{font-family:'Noto Serif KR',serif;font-size:14px;color:var(--gold2)}
.ld-dots::after{content:'';animation:dots 1.5s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}

/* 토스트 */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--cream);color:var(--navy-t);padding:10px 22px;border-radius:30px;font-size:12px;font-weight:600;opacity:0;transition:.3s;z-index:600;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.canvas-h{display:none}

/* 스와이프 피드 — 기존 유지 */
.feed{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;overflow:hidden}
.feed.on{display:flex}
.f-hdr{position:absolute;top:0;left:0;right:0;z-index:110;padding:calc(12px + var(--safe-t)) 16px 10px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(14,24,37,.95),transparent)}
.f-close{background:rgba(255,255,255,.1);border:none;width:36px;height:36px;border-radius:50%;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.f-logo{font-family:'Noto Serif KR',serif;font-size:14px;color:var(--gold2);font-weight:600}
.f-cnt{font-size:12px;color:var(--sub)}
.sw-wrap{flex:1;position:relative;touch-action:pan-y;overflow:hidden}
.sw-track{position:absolute;inset:0;transition:transform .45s cubic-bezier(.22,.85,.32,1)}
.sw-card{position:absolute;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:calc(56px + var(--safe-t)) 18px calc(72px + var(--safe-b))}
.c-card{position:relative;z-index:5;width:100%;max-width:380px;background:var(--cream);border-radius:22px;padding:26px 22px 22px;box-shadow:0 10px 50px rgba(0,0,0,.35);max-height:calc(100vh - 160px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.c-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:22px 22px 0 0;background:linear-gradient(90deg,var(--gold),var(--olive),var(--gold));opacity:.5}
.cc-tag{font-size:11px;font-weight:700;color:var(--gold);letter-spacing:1px;margin-bottom:4px}
.cc-date{font-size:10px;color:#b5aa9c;float:right}
.cc-div{display:flex;align-items:center;gap:8px;margin:12px 0;color:var(--gold);opacity:.3}
.cc-div hr{flex:1;border:none;height:1px;background:currentColor}
.cc-div svg{width:10px;height:10px}
.cc-vlabel{font-size:10px;color:var(--olive);font-weight:700;letter-spacing:1.5px;margin-bottom:8px}
.cc-verse{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:600;color:var(--navy-t);line-height:2;margin-bottom:12px}
.cc-ref{font-size:12px;font-weight:600;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.cc-ref svg{width:12px;height:12px;color:var(--olive)}
.cc-ornament{text-align:center;color:var(--olive);opacity:.3;margin-bottom:12px;letter-spacing:6px;font-size:12px}
.cc-interp{background:var(--cream2);border-radius:14px;overflow:hidden;margin-bottom:10px}
.cc-pledge{background:var(--cream2);border-radius:14px;padding:14px 16px}
.cc-pledge-label{font-size:11px;font-weight:700;color:var(--olive);margin-bottom:8px}
.cc-pledge-ta{width:100%;min-height:44px;background:var(--cream);border:1px solid rgba(27,45,74,.06);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--navy-t);line-height:1.7;resize:none;outline:none;font-family:'Noto Sans KR',sans-serif}
.s-act{position:absolute;right:8px;bottom:calc(66px + var(--safe-b));z-index:110;display:flex;flex-direction:column;align-items:center;gap:4px}
.sb{background:rgba(255,255,255,.08);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.06);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;color:#fff}
.sb svg{width:18px;height:18px}
.sb:active{transform:scale(.9)}
.sb.liked{color:#ff6b6b;background:rgba(255,107,107,.12)}
.sl{font-size:9px;color:rgba(255,255,255,.4);margin-bottom:4px}
.sw-hint{position:absolute;bottom:calc(12px + var(--safe-b));left:0;right:0;z-index:110;text-align:center;pointer-events:none}
.sw-hint span{font-size:10px;color:rgba(255,255,255,.2)}
.dbl-h{position:fixed;z-index:300;font-size:70px;pointer-events:none;animation:hpop .7s ease forwards}
@keyframes hpop{0%{transform:scale(0);opacity:1}50%{transform:scale(1.3);opacity:1}100%{transform:scale(1.5);opacity:0}}
</style>
</head>

      <div class="nb-center-circle"><svg><use href="#i-cross"/></svg></div>

const ACTIONS_TEMPLATES=[
  '오늘 받은 말씀을 3번 소리 내어 선포하기',
  '한 사람에게 감사와 축복의 문자 보내기',
  '잠들기 전 하나님께 오늘 하루 감사 기도',
  '걱정을 하나씩 적고 기도로 올려드리기',
  '내 다짐을 적어 눈에 보이는 곳에 붙이기'
];

let S={cat:null,res:[],idx:0,saved:[],key:'',name:'',streak:[],playbooks:[],ty:0,dy:0,sw:false,lt:0};

function init(){
  load();setupNav();renderReflect();renderHome();renderVerse();renderJournal();renderSaved();
}

function load(){try{const d=localStorage.getItem('mw5');if(d){const p=JSON.parse(d);Object.assign(S,p)}}catch(e){}}
function save(){try{localStorage.setItem('mw5',JSON.stringify({saved:S.saved,key:S.key,name:S.name,streak:S.streak,playbooks:S.playbooks}))}catch(e){}}

function setupNav(){
  document.querySelectorAll('.nb[data-tab]').forEach(b=>{
    b.addEventListener('click',()=>{
      const tid=b.dataset.tab;
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
      document.getElementById(tid).classList.add('on');
      document.querySelectorAll('.nb').forEach(n=>n.classList.remove('on'));
      // 중앙 버튼 특수 처리
      document.querySelectorAll(`.nb[data-tab="${tid}"]`).forEach(n=>n.classList.add('on'));
      if(tid==='tHome')renderHome();
      if(tid==='tVerse')renderVerse();
      if(tid==='tJournal')renderJournal();
      if(tid==='tSaved')renderSaved();
    });
  });
  // 초기 홈 활성
  document.querySelector('.nb[data-tab="tHome"]').classList.add('on');
  // 설정
  document.querySelector('.nb[data-tab="tJournal"]').insertAdjacentHTML('afterend','');
  document.getElementById('bSaveSet').addEventListener('click',()=>{
    S.key=document.getElementById('iKey').value.trim();
    S.name=document.getElementById('iName').value.trim();
    save();updateApi();document.getElementById('modal').classList.remove('show');
    tt(S.key?'API 키 저장!':'설정 저장!');
    document.getElementById('greetName').textContent=S.name?`안녕하세요, ${S.name}님`:'안녕하세요';
  });
  document.getElementById('bCloseSet').addEventListener('click',()=>document.getElementById('modal').classList.remove('show'));
  document.getElementById('modal').addEventListener('click',e=>{if(e.target===document.getElementById('modal'))document.getElementById('modal').classList.remove('show')});
}

function updateApi(){
  document.getElementById('apiS').innerHTML=S.key
    ?'<span class="dot-on"></span><span>AI 맞춤 말씀 모드</span>'
    :'<span class="dot-off"></span><span>내장 말씀 모드</span>';
}

/* ===== TAB 1: 묵상 ===== */
function renderReflect(){
  const rp=document.getElementById('reflectPrompts');
  rp.innerHTML=CATS.map(c=>`<div class="rp-chip" data-cid="${c.id}">${c.name}</div>`).join('');
  rp.addEventListener('click',e=>{
    const ch=e.target.closest('.rp-chip');if(!ch)return;
    document.querySelectorAll('.rp-chip').forEach(c=>c.classList.remove('on'));
    ch.classList.add('on');
    S.cat=CATS.find(c=>c.id===ch.dataset.cid);
    document.getElementById('reflectQ').textContent=S.cat.q;
  });
  document.getElementById('rTa').addEventListener('input',function(){
    document.getElementById('rCc').textContent=this.value.length;
    document.getElementById('rSend').classList.toggle('ready',this.value.trim().length>=2);
  });
  document.getElementById('rSend').addEventListener('click',submitReflect);
}

async function submitReflect(){
  const txt=document.getElementById('rTa').value.trim();
  if(txt.length<2)return;
  if(!S.cat)S.cat=CATS[0];
  document.getElementById('loadO').classList.add('on');
  markToday();

  let res=[];
  if(S.key){const a=await apiCall(txt);if(a)res.push(a)}
  const pool=[...(V[S.cat.id]||V.comfort)];
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  res=res.concat(pool.slice(0,3-res.length));

  S.res=res.map(r=>({...r,cat:S.cat,concern:txt,date:new Date().toISOString(),liked:false}));

  // 플레이북 생성
  const pb={id:Date.now(),cat:S.cat,concern:txt,date:new Date().toISOString(),verse:S.res[0],
    steps:[
      {name:'📖 하나님의 말씀 읽기',done:false,meta:'1분'},
      {name:'💡 말씀의 의미 깨닫기',done:false},
      {name:'✊ 나의 다짐과 각오',done:false},
      {name:'🙏 기도로 올려드리기',done:false},
      {name:'✝ 축복의 말씀 선포',done:false}
    ],
    actions:ACTIONS_TEMPLATES.map((a,i)=>({num:i+1,text:a,done:false}))
  };
  S.playbooks.unshift(pb);
  if(S.playbooks.length>10)S.playbooks=S.playbooks.slice(0,10);
  save();

  S.idx=0;
  document.getElementById('loadO').classList.remove('on');
  openFeed();
}

async function apiCall(concern){
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':S.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1024,system:'당신은 하나님의 따뜻한 음성으로 말씀을 전하는 상담사입니다. 사용자의 기도(고민, 간절함, 소망)를 듣고, 가장 적합한 성경 말씀을 찾아 하나님의 응답처럼 위로와 희망, 각오와 축복을 전해주세요. JSON만: {"ref":"책 장:절","text":"구절(개역개정)","meaning":"이 말씀이 당신의 기도에 주는 응답(3문장, 따뜻하게)","application":"이 말씀으로 세울 수 있는 다짐과 각오(2문장)"}',messages:[{role:'user',content:`기도 종류: ${S.cat.name}\n나의 기도: ${concern}\n\n이 기도에 하나님의 응답이 되는 성경 말씀을 찾아주세요. 위로와 희망, 각오를 세울 수 있는 말씀으로.`}]})});
    if(!res.ok)return null;
    const d=await res.json();return JSON.parse(d.content[0].text.replace(/```json|```/g,'').trim());
  }catch(e){return null}
}

/* ===== TAB 2: 홈 ===== */

  if(S.playbooks.length===0){

    aEl.innerHTML=(pb.actions||[]).map((a,i)=>`
      <div class="action-card">

        <div class="ac-bar"><div class="ac-bar-fill" style="width:0%"></div></div>

  // 묵상 질문
  document.getElementById('homePrompts').innerHTML=PROMPTS.map((p,i)=>`
    <div class="prompt-card" data-pi="${i}">

  document.querySelectorAll('.prompt-card').forEach(el=>{
    el.addEventListener('click',()=>{
      const pi=parseInt(el.dataset.pi);
      if(pi>1){tt('프리미엄 기능입니다 (준비중)');return}
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
      document.getElementById('tReflect').classList.add('on');
      document.getElementById('reflectQ').textContent=PROMPTS[pi].q;

/* ===== TAB 3: 말씀 ===== */
function renderVerse(){
  const now=new Date();
  const days=['일','월','화','수','목','금','토'];
  document.getElementById('verseDate').textContent=`${days[now.getDay()]}요일 · ${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`;

  const all=Object.values(V).flat();
  const di=(now.getFullYear()*366+now.getMonth()*31+now.getDate())%all.length;
  const v=all[di];

  document.getElementById('verseMain').innerHTML=`
    <div class="vcm-label">오늘 하나님이 주시는 말씀</div>
    <div class="vcm-text">${v.text}</div>
    <div class="vcm-ref"><svg style="color:var(--olive)"><use href="#i-olive"/></svg>${v.ref}</div>
    <div class="vcm-divider">❦</div>
    <div class="vcm-actions">
      <button class="vcm-btn" id="vSave"><svg style="color:var(--gold)"><use href="#i-heart"/></svg>저장</button>
      <button class="vcm-btn" id="vShare"><svg style="color:var(--gold)"><use href="#i-share"/></svg>공유</button>
    </div>`;
  
  document.getElementById('vSave').addEventListener('click',()=>{
    if(S.saved.some(s=>s.ref===v.ref)){tt('이미 저장됨');return}
    S.saved.unshift({...v,cat:{name:'오늘의 말씀'},savedAt:new Date().toISOString()});
    save();tt('❤️ 보관함에 저장!');
  });
  document.getElementById('vShare').addEventListener('click',async()=>{
    const t=`✝ 말씀위로\n\n📖 ${v.ref}\n\n"${v.text}"`;
    try{if(navigator.share)await navigator.share({title:'말씀위로',text:t});else{await navigator.clipboard.writeText(t);tt('복사됨!')}}catch(e){tt('공유 실패')}
  });

  document.getElementById('interpArea').innerHTML=`
    <div class="interp-card">
      <button class="interp-toggle" id="itgl"><svg style="color:var(--gold)"><use href="#i-book"/></svg>말씀 해설 보기 <span class="arr">▼</span></button>
      <div class="interp-body" id="ibody">
        <div class="ib-title"><svg style="color:var(--gold)"><use href="#i-book"/></svg>말씀의 의미</div>
        <div class="ib-text">${v.meaning}</div>
        <div class="ib-title"><svg style="color:var(--gold)"><use href="#i-light"/></svg>오늘의 적용</div>
        <div class="ib-text">${v.application}</div>
      </div>
    </div>`;
  document.getElementById('itgl').addEventListener('click',function(){
    this.classList.toggle('open');
    document.getElementById('ibody').classList.toggle('open');
  });
}

/* ===== TAB 4: 일기 ===== */
function renderJournal(){
  const now=new Date();
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('journalMonth').textContent=`${now.getFullYear()}년 ${months[now.getMonth()]}`;

  const days=['일','월','화','수','목','금','토'];
  const startOfWeek=new Date(now);startOfWeek.setDate(now.getDate()-now.getDay());
  let calHtml='';
  for(let i=0;i<7;i++){
    const d=new Date(startOfWeek);d.setDate(startOfWeek.getDate()+i);
    const isToday=d.toDateString()===now.toDateString();
    calHtml+=`<div class="jc-day ${isToday?'today':''}"><div class="jc-dow">${days[d.getDay()]}</div><div class="jc-num">${d.getDate()}</div></div>`;
  }
  document.getElementById('journalCal').innerHTML=calHtml;

  ['plan','grow','pray'].forEach(sec=>{
    const el=document.getElementById('journal'+sec.charAt(0).toUpperCase()+sec.slice(1));
    el.innerHTML=JOURNAL_CARDS[sec].map(c=>`
      <div class="journal-card">
        <svg style="color:var(--sub)"><use href="#${c.icon}"/></svg>
        <div class="jc-label">${c.label}</div>
        <div class="jc-title">${c.title}</div>
        <div class="jc-desc">${c.desc}</div>
        <button class="btn-gold">✏️ 시작하기</button>
      </div>`).join('');
  });
  document.querySelectorAll('.journal-card .btn-gold').forEach(b=>{
    b.addEventListener('click',e=>{
      e.stopPropagation();
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
      document.getElementById('tReflect').classList.add('on');
    });
  });
}

    const ds=`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    return`<div class="saved-item" data-i="${i}">
      <button class="sv-del" data-d="${i}">✕</button>
      <div class="sv-date">${ds}</div>
      <div class="sv-verse">${v.text.substring(0,45)}...</div>
      <div class="sv-ref">${v.ref}</div>
      ${v.cat?`<span class="sv-tag">${v.cat.name}</span>`:''}
    </div>`;
  }).join('');
  el.querySelectorAll('.sv-del').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();S.saved.splice(parseInt(b.dataset.d),1);save();renderSaved();tt('삭제됨')});
  });
  el.querySelectorAll('.saved-item').forEach(it=>{
    it.addEventListener('click',()=>{
      const v=S.saved[parseInt(it.dataset.i)];
      if(v){S.cat=v.cat||CATS[0];S.res=[{...v,liked:true}];S.idx=0;openFeed()}
    });
  });
}

/* ===== 스와이프 피드 ===== */
function openFeed(){
  renderCards();renderSide();
  document.getElementById('feed').classList.add('on');
  document.getElementById('fCnt').textContent=`1/${S.res.length}`;
  const w=document.getElementById('swWrap');
  w.addEventListener('touchstart',ts,{passive:true});
  w.addEventListener('touchmove',tm,{passive:false});
  w.addEventListener('touchend',te);
  w.addEventListener('click',tap);
}

function renderCards(){
  const t=document.getElementById('swTrack');
  const now=new Date();const days=['일','월','화','수','목','금','토'];
  const ds=`${days[now.getDay()]}요일 · ${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
  t.innerHTML=S.res.map((r,i)=>`
    <div class="sw-card" style="top:${i*100}%">
      <div style="position:absolute;inset:0;background:linear-gradient(170deg,#0e1825,#152032 40%,#1b2d4a 100%)"></div>
      <div class="c-card">
        <div class="cc-tag">${r.cat?r.cat.name:'말씀'}</div>
        <span class="cc-date">${ds}</span>
        <div class="cc-div"><hr><svg style="color:var(--gold)"><use href="#i-cross"/></svg><hr></div>
        <div class="cc-vlabel">하나님의 응답</div>
        <div class="cc-verse">${r.text}</div>
        <div class="cc-ref"><svg style="color:var(--olive)"><use href="#i-olive"/></svg>${r.ref}</div>
        <div class="cc-ornament">❦</div>
        <div class="cc-interp">
          <button class="interp-toggle" data-t="${i}"><svg style="color:var(--gold)"><use href="#i-book"/></svg>하나님의 응답 해설 <span class="arr">▼</span></button>
          <div class="interp-body" id="ib${i}">
            <div class="ib-title"><svg style="color:var(--gold)"><use href="#i-book"/></svg>이 말씀이 주는 응답</div>
            <div class="ib-text">${r.meaning}</div>
            <div class="ib-title"><svg style="color:var(--gold)"><use href="#i-light"/></svg>나의 각오와 다짐</div>
            <div class="ib-text">${r.application}</div>
          </div>
        </div>
        <div class="cc-pledge">
          <div class="cc-pledge-label">✊ 나의 각오와 다짐</div>
          <textarea class="cc-pledge-ta" placeholder="이 말씀을 받고 내가 다짐하는 것은..."></textarea>
        </div>
      </div>
    </div>`).join('');
  t.style.transform='translateY(0)';S.idx=0;
  t.querySelectorAll('.interp-toggle').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();b.classList.toggle('open');document.getElementById('ib'+b.dataset.t).classList.toggle('open')});
  });
}

function renderSide(){
  document.getElementById('sAct').innerHTML=`
    <button class="sb" id="sH"><svg style="color:#fff"><use href="#i-heart"/></svg></button><span class="sl" id="sHL">저장</span>
    <button class="sb" id="sSh"><svg style="color:#fff"><use href="#i-share"/></svg></button><span class="sl">공유</span>
    <button class="sb" id="sIm"><svg style="color:#fff"><use href="#i-image"/></svg></button><span class="sl">카드</span>`;
  document.getElementById('sH').addEventListener('click',e=>{e.stopPropagation();tglLike()});
  document.getElementById('sSh').addEventListener('click',e=>{e.stopPropagation();shareV()});
  document.getElementById('sIm').addEventListener('click',e=>{e.stopPropagation();saveImg()});
}

function ts(e){S.ty=e.touches[0].clientY;S.sw=true;document.getElementById('swTrack').style.transition='none'}
function tm(e){if(!S.sw)return;S.dy=e.touches[0].clientY-S.ty;const h=document.getElementById('swWrap').offsetHeight;let d=S.dy;if((S.idx===0&&d>0)||(S.idx===S.res.length-1&&d<0))d*=.25;document.getElementById('swTrack').style.transform=`translateY(${-(S.idx*h)+d}px)`;if(Math.abs(S.dy)>10)e.preventDefault()}
function te(){S.sw=false;const t=document.getElementById('swTrack');t.style.transition='transform .45s cubic-bezier(.22,.85,.32,1)';if(S.dy<-50&&S.idx<S.res.length-1)S.idx++;else if(S.dy>50&&S.idx>0)S.idx--;const h=document.getElementById('swWrap').offsetHeight;t.style.transform=`translateY(${-(S.idx*h)}px)`;document.getElementById('fCnt').textContent=`${S.idx+1}/${S.res.length}`;upH();S.dy=0}
function tap(e){const n=Date.now();if(n-S.lt<300){const c=S.res[S.idx];if(c&&!c.liked){c.liked=true;saveTo(c);upH()}const h=document.createElement('div');h.className='dbl-h';h.textContent='❤️';h.style.left=(e.clientX-35)+'px';h.style.top=(e.clientY-35)+'px';document.body.appendChild(h);setTimeout(()=>h.remove(),700);S.lt=0}else S.lt=n}
function tglLike(){const c=S.res[S.idx];if(!c)return;if(c.liked){c.liked=false;S.saved=S.saved.filter(v=>v.ref!==c.ref);save();tt('제거됨')}else{c.liked=true;saveTo(c)}upH()}
function upH(){const b=document.getElementById('sH'),l=document.getElementById('sHL');if(!b||!S.res[S.idx])return;if(S.res[S.idx].liked){b.classList.add('liked');l.textContent='저장됨'}else{b.classList.remove('liked');l.textContent='저장'}}
function saveTo(v){if(S.saved.some(s=>s.ref===v.ref)){tt('이미 저장됨');return}S.saved.unshift({...v,savedAt:new Date().toISOString()});save();tt('❤️ 저장!')}

async function shareV(){try{const v=S.res[S.idx];if(!v)return;const t=`✝ 말씀위로\n\n📖 ${v.ref}\n\n"${v.text}"`;if(navigator.share)await navigator.share({title:'말씀위로',text:t});else{await navigator.clipboard.writeText(t);tt('복사됨!')}}catch(e){}}

function saveImg(){try{const v=S.res[S.idx];if(!v)return;const c=document.getElementById('cvs'),x=c.getContext('2d'),W=1080,H=1080;x.fillStyle='#faf6ef';x.fillRect(0,0,W,H);x.fillStyle='#1b2d4a';x.fillRect(0,0,W,180);x.font='italic 28px serif';x.fillStyle='#d4b88a';x.textAlign='center';x.fillText('✝ 말씀위로',W/2,70);const d=new Date();x.font='20px sans-serif';x.fillStyle='rgba(255,255,255,.4)';x.fillText(`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`,W/2,120);x.font='22px sans-serif';x.fillStyle='#d4b88a';x.fillText(S.cat?S.cat.name:'말씀',W/2,160);x.strokeStyle='#c4a265';x.lineWidth=1.5;x.beginPath();x.moveTo(W*.25,200);x.lineTo(W*.75,200);x.stroke();x.fillStyle='#c4a265';x.beginPath();x.arc(W/2,200,3,0,Math.PI*2);x.fill();x.font='18px sans-serif';x.fillStyle='#7a9462';x.fillText('VERSE OF COMFORT',W/2,245);x.font='36px serif';x.fillStyle='#1b2d4a';const lines=[];let cur='';for(const ch of v.text){if(x.measureText(cur+ch).width>W-160&&cur){lines.push(cur);cur=ch}else cur+=ch}if(cur)lines.push(cur);const sY=300;lines.slice(0,9).forEach((l,i)=>x.fillText(l,W/2,sY+i*58));const rY=sY+Math.min(lines.length,9)*58+35;x.font='24px serif';x.fillStyle='#c4a265';x.fillText('🌿 '+v.ref,W/2,rY);const link=document.createElement('a');link.download=`말씀위로_${v.ref.replace(/\s/g,'_')}.png`;link.href=c.toDataURL('image/png');link.click();tt('이미지 저장!')}catch(e){tt('저장 실패')}}

document.getElementById('fClose').addEventListener('click',()=>{
  document.getElementById('feed').classList.remove('on');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('tHome').classList.add('on');
  renderHome();
});

function markToday(){const ds=new Date().toISOString().split('T')[0];if(!S.streak.includes(ds)){S.streak.push(ds);save()}}
function tt(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
window.addEventListener('resize',()=>{if(!document.getElementById('feed').classList.contains('on'))return;const h=document.getElementById('swWrap').offsetHeight;const t=document.getElementById('swTrack');t.style.transition='none';t.style.transform=`translateY(${-(S.idx*h)}px)`});
document.addEventListener('DOMContentLoaded',function(){
  const intro=document.getElementById('intro');
  if(!intro){init();return}

  /* ===== 인트로: CSS가 4초 자동 애니메이션 처리 ===== */
  function goToPray(){
    intro.remove();
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
    document.getElementById('tReflect').classList.add('on');
    document.querySelectorAll('.nb').forEach(n=>n.classList.remove('on'));
    document.querySelectorAll('.nb[data-tab="tReflect"]').forEach(n=>n.classList.add('on'));
    // 기도 화면에서 첫 터치 시 BGM
    document.addEventListener('click',playIntroBGM,{once:true});
    document.addEventListener('touchstart',playIntroBGM,{once:true});
  }

  // 4.8초 후 자동 전환 (CSS introOut 4s + 0.8s 페이드)
  setTimeout(goToPray, 4800);

  // 터치 스킵
  intro.addEventListener('click',()=>{
    intro.style.transition='opacity .4s';
    intro.style.opacity='0';
    setTimeout(goToPray,400);
  });

  /* ===== 시그니처 BGM (기도 화면 진입 시) ===== */
  function playIntroBGM(){
    try{
      const ac=new(window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended')ac.resume();
      const now=ac.currentTime;

      // 차임벨 멜로디: C5-E5-G5-C6 (올라가는 4음)
      const notes=[523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq,i)=>{
        const o=ac.createOscillator();
        const g=ac.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(freq,now+i*.35);
        g.gain.setValueAtTime(0,now+i*.35);
        g.gain.linearRampToValueAtTime(.15,now+i*.35+.05);
        g.gain.exponentialRampToValueAtTime(.01,now+i*.35+.8);
        o.connect(g);g.connect(ac.destination);
        o.start(now+i*.35);o.stop(now+i*.35+1);
      });

      // 패드 코드 (Am: A3+C4+E4)
      const pad=[220,261.63,329.63];
      pad.forEach(freq=>{
        const o=ac.createOscillator();
        const g=ac.createGain();
        o.type='sine';
        o.frequency.setValueAtTime(freq,now+1.5);
        g.gain.setValueAtTime(0,now+1.5);
        g.gain.linearRampToValueAtTime(.06,now+3);
        g.gain.linearRampToValueAtTime(.04,now+6);
        g.gain.linearRampToValueAtTime(0,now+10);
        o.connect(g);g.connect(ac.destination);
        o.start(now+1.5);o.stop(now+11);
      });

      // 저음 드론
      const od=ac.createOscillator();
      const gd=ac.createGain();
      od.type='sine';od.frequency.setValueAtTime(110,now+1.5);
      gd.gain.setValueAtTime(0,now+1.5);
      gd.gain.linearRampToValueAtTime(.04,now+3);
      gd.gain.linearRampToValueAtTime(0,now+10);
      od.connect(gd);gd.connect(ac.destination);
      od.start(now+1.5);od.stop(now+11);

      setTimeout(()=>{try{ac.close()}catch(e){}},12000);
    }catch(e){}
  }

  init();
});

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>룸메이드 음성 비서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Gothic+A1:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================
   1. 브랜드 색상
   ============================================ */
:root{
  --cream:#EDEEE7; --navy:#1D4468; --paper:#F7F8F4;
  --line:rgba(29,68,104,.16); --muted:rgba(29,68,104,.62);
  --live:#C2543D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);color:var(--navy);
  font-family:'Gothic A1','Apple SD Gothic Neo',sans-serif;
  padding-bottom:70px;
}

.head{padding:26px 20px 20px;border-bottom:1px solid var(--line);}
.head .eyebrow{
  font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.32em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px;
}
.head h1{font-family:'Jost',sans-serif;font-weight:500;font-size:25px;letter-spacing:.03em;margin:0 0 8px;}
.head p{font-size:13px;line-height:1.65;color:var(--muted);margin:0;}

/* ============================================
   2. 마이크
   ============================================ */
.micWrap{padding:32px 20px 24px;text-align:center;}
.mic{
  width:136px;height:136px;border-radius:50%;border:none;
  background:var(--navy);color:var(--cream);cursor:pointer;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.03em;
  box-shadow:0 8px 26px rgba(29,68,104,.22);
}
.mic svg{width:34px;height:34px;}
.mic.live{background:var(--live);animation:pulse 1.3s ease-in-out infinite;}
.mic:disabled{opacity:.45;}
.mic:focus-visible{outline:3px solid var(--navy);outline-offset:4px;}
@keyframes pulse{
  0%,100%{box-shadow:0 8px 26px rgba(194,84,61,.28);}
  50%{box-shadow:0 8px 26px rgba(194,84,61,.6),0 0 0 16px rgba(194,84,61,.09);}
}
.status{font-size:13px;color:var(--muted);margin:18px 0 0;min-height:20px;}

/* ============================================
   3. 대화 카드
   ============================================ */
.io{padding:0 20px;display:flex;flex-direction:column;gap:14px;}
.box{border-radius:16px;padding:18px;border:1px solid var(--line);}
.box .cap{
  font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px;
}
.box.heard{background:var(--paper);}
.box.heard .txt{font-size:19px;font-weight:600;line-height:1.5;margin:0;min-height:26px;}
.box.heard .txt.empty{color:var(--muted);font-weight:400;}
.box.answer{background:var(--navy);border-color:var(--navy);color:var(--cream);}
.box.answer .cap{color:rgba(237,238,231,.6);}
.box.answer .txt{font-size:19px;font-weight:700;line-height:1.6;margin:0;}
.box.answer .detail{
  margin:14px 0 0;padding-top:14px;border-top:1px solid rgba(237,238,231,.24);
  font-size:14.5px;line-height:1.9;opacity:.85;
}
.replay{
  margin-top:14px;background:rgba(237,238,231,.14);border:none;border-radius:10px;
  color:var(--cream);font-family:inherit;font-size:13px;font-weight:600;
  padding:11px 16px;cursor:pointer;
}

/* ============================================
   4. 예시 질문
   ============================================ */
.chips{padding:26px 20px 0;}
.chips .label{font-size:12px;color:var(--muted);margin:0 0 12px;}
.chipRow{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:10px 15px;font-family:inherit;font-size:13px;font-weight:600;
  color:var(--navy);cursor:pointer;
}
.chip:active{background:var(--navy);color:var(--cream);}

/* ============================================
   5. 설정 / 데이터
   ============================================ */
.sec{padding:30px 20px 0;}
.sec h2{font-size:14px;font-weight:800;margin:0 0 12px;}
.row{
  display:flex;align-items:center;gap:11px;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;
}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--navy);flex:none;}
.row span{font-size:13.5px;font-weight:600;}
.hint{font-size:11.5px;line-height:1.7;color:var(--muted);margin:8px 2px 0;}

.keyItem{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:8px;}
.keyItem .kn{font-size:13px;font-weight:700;word-break:break-all;}
.keyItem .ks{font-size:11.5px;color:var(--muted);margin-top:4px;}
.keyItem pre{
  margin:10px 0 0;padding:11px;background:var(--paper);border-radius:9px;
  font-size:11px;line-height:1.6;white-space:pre-wrap;word-break:break-all;
  max-height:170px;overflow:auto;display:none;
}
.mini{
  margin-top:9px;background:transparent;border:1px solid var(--line);border-radius:9px;
  padding:8px 13px;font-family:inherit;font-size:12px;font-weight:600;color:var(--navy);cursor:pointer;
}
.mini.wide{width:100%;margin-top:12px;padding:13px;}
.empty{font-size:12.5px;color:var(--muted);padding:6px 2px;}

/* ============================================
   6. 기록창
   ============================================ */
#log{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:12px;font-size:11.5px;line-height:1.7;
  max-height:190px;overflow:auto;white-space:pre-wrap;word-break:break-all;
  font-family:'Courier New',monospace;margin-top:10px;
}
#log div{padding:2px 0;}

.note{
  margin:26px 20px 0;padding:14px 16px;border-radius:12px;
  background:rgba(29,68,104,.06);font-size:12.5px;line-height:1.75;color:var(--muted);
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>

<header class="head">
  <p class="eyebrow">Voice Test 02</p>
  <h1>룸메이드 음성 비서</h1>
  <p>마이크를 누르고 "오늘 일정 알려줘" 라고 말해보세요.</p>
</header>

<div class="micWrap">
  <button class="mic" id="mic" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <path d="M12 19v3"/>
    </svg>
    <span id="micLabel">눌러서 말하기</span>
  </button>
  <p class="status" id="status">대기 중</p>
</div>

<div class="io">
  <div class="box heard">
    <p class="cap">들은 말</p>
    <p class="txt empty" id="heard">아직 없습니다</p>
  </div>
  <div class="box answer">
    <p class="cap">룸메이드</p>
    <p class="txt" id="answer">안녕하세요. 무엇을 알려드릴까요?</p>
    <div class="detail" id="detail" style="display:none;"></div>
    <button class="replay" id="replay" type="button">다시 듣기</button>
  </div>
</div>

<div class="chips">
  <p class="label">눌러서도 시험할 수 있습니다</p>
  <div class="chipRow" id="chipRow"></div>
</div>

<section class="sec">
  <h2>설정</h2>
  <label class="row"><input type="checkbox" id="speakOn" checked><span>목소리로 대답하기</span></label>
  <label class="row"><input type="checkbox" id="autoMic"><span>열자마자 마이크 켜기</span></label>
  <label class="row"><input type="checkbox" id="showLog"><span>기록창 보기</span></label>
  <div id="logWrap" style="display:none;"><div id="log"></div></div>
</section>

<section class="sec">
  <h2>이 폰에 저장된 데이터</h2>
  <p class="hint" style="margin-top:0;">룸메이드원이 저장해 둔 자료입니다. 예약이 들어 있는 항목 이름을 클로에게 알려주세요.</p>
  <div id="keyList"></div>
  <button class="mini wide" id="copyKeys" type="button">목록 전체 복사</button>
</section>

<p class="note">
  지금은 <b>시험용 가짜 예약</b>으로 답합니다. 위 목록에서 진짜 예약이 담긴 항목을 알려주시면 실제 데이터로 연결해 드립니다.
</p>

<script>
/* ============================================
   7. 기본값
   ============================================ */
var KEY_SET = 'roommade-voice-set';
var W = ['일','월','화','수','목','금','토'];
var lastSpeak = '';
var listening = false;

/* ============================================
   8. 기록 남기기
   ============================================ */
function log(msg){
  try{
    var box = document.getElementById('log');
    if (!box) return;
    var t = new Date();
    var d = document.createElement('div');
    d.textContent = '[' + ('0'+t.getMinutes()).slice(-2) + ':' + ('0'+t.getSeconds()).slice(-2) + '] ' + msg;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }catch(e){}
}

/* ============================================
   9. 샘플 예약 (오늘 기준 자동 생성)
   ============================================ */
function ymd(d){
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function shift(n){
  var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return d;
}
var SAMPLE = [
  {n:0, branch:'영종', room:'101호',        time:'11:00'},
  {n:0, branch:'영종', room:'203호',        time:'11:00'},
  {n:0, branch:'송도', room:'802호',        time:'12:00'},
  {n:1, branch:'송도', room:'1204호',       time:'11:00'},
  {n:1, branch:'펜트', room:'한라A 501호',  time:'13:00'},
  {n:2, branch:'영종', room:'101호',        time:'11:00'},
  {n:3, branch:'영종', room:'305호',        time:'11:00'},
  {n:4, branch:'송도', room:'802호',        time:'11:00'},
  {n:4, branch:'송도', room:'905호',        time:'12:00'},
  {n:6, branch:'펜트', room:'한라C 302호',  time:'13:00'}
].map(function(x){ x.d = ymd(shift(x.n)); return x; });

/* ============================================
   10. 말에서 날짜 뽑기
   ============================================ */
function parseRange(text){
  var t = text.replace(/\s/g,'');
  var m;

  var words = {'하루':1,'이틀':2,'사흘':3,'나흘':4,'닷새':5,'엿새':6,'일주일':7};
  for (var k in words){
    if (t.indexOf(k) >= 0 && /(뒤|후)/.test(t)) return one(words[k], k+' 뒤');
  }
  m = t.match(/(\d+)일(뒤|후)/);
  if (m) return one(parseInt(m[1],10), m[1]+'일 뒤');

  m = t.match(/(\d{1,2})월(\d{1,2})일/);
  if (m){
    var target = new Date(new Date().getFullYear(), parseInt(m[1],10)-1, parseInt(m[2],10));
    target.setHours(0,0,0,0);
    return one(Math.round((target - shift(0))/86400000), m[1]+'월 '+m[2]+'일');
  }

  if (/(그제|그저께)/.test(t)) return one(-2,'그제');
  if (/어제/.test(t))          return one(-1,'어제');
  if (/모레/.test(t))          return one(2,'모레');
  if (/글피/.test(t))          return one(3,'글피');
  if (/(내일|낼)/.test(t))     return one(1,'내일');
  if (/이번주/.test(t))        return span(0,6,'이번 주');
  if (/다음주|담주/.test(t))   return span(7,13,'다음 주');
  if (/주말/.test(t))          return weekend();
  if (/이번달|이달/.test(t))   return span(0,30,'이번 달');

  m = t.match(/(\d+)일(간|치|동안)/);
  if (m) return span(0, parseInt(m[1],10)-1, m[1]+'일간');

  return one(0,'오늘');

  function one(n,label){
    var d = shift(n);
    return { from:ymd(d), to:ymd(d), label:label, single:true, date:d };
  }
  function span(a,b,label){
    return { from:ymd(shift(a)), to:ymd(shift(b)), label:label, single:false };
  }
  function weekend(){
    var dow = new Date().getDay();
    var toSat = (6-dow+7)%7;
    return { from:ymd(shift(toSat)), to:ymd(shift(toSat+1)), label:'이번 주말', single:false };
  }
}

function parseBranch(text){
  var t = text.replace(/\s/g,'');
  if (/영종/.test(t)) return '영종';
  if (/송도/.test(t)) return '송도';
  if (/펜트|펜타|한라/.test(t)) return '펜트';
  return null;
}

/* ============================================
   11. 답 만들기
   ============================================ */
function answerFor(text){
  var range  = parseRange(text);
  var branch = parseBranch(text);

  var list = SAMPLE.filter(function(x){
    if (x.d < range.from || x.d > range.to) return false;
    if (branch && x.branch !== branch) return false;
    return true;
  });
  list.sort(function(a,b){
    return a.d === b.d ? a.time.localeCompare(b.time) : a.d.localeCompare(b.d);
  });

  var who = branch ? branch + ' ' : '';

  if (list.length === 0){
    var none = range.label + '은 ' + who + '일정이 없습니다.';
    return { speak:none, text:none, lines:[] };
  }

  var head, lines;
  if (range.single){
    var d = range.date;
    head = range.label + ' ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + W[d.getDay()] + '요일, '
         + who + '청소 ' + list.length + '건입니다.';
    lines = list.map(function(x){ return x.time + '   ' + x.branch + ' ' + x.room; });
  } else {
    head = range.label + ' ' + who + '청소는 모두 ' + list.length + '건입니다.';
    lines = list.map(function(x){
      var dd = new Date(x.d + 'T00:00:00');
      return (dd.getMonth()+1) + '/' + dd.getDate() + ' (' + W[dd.getDay()] + ')   ' + x.branch + ' ' + x.room;
    });
  }

  var spoken = head + ' ' + list.slice(0,5).map(function(x){ return x.branch + ' ' + x.room; }).join(', ') + '.';
  if (list.length > 5) spoken += ' 그 외 ' + (list.length-5) + '건 더 있습니다.';

  return { speak:spoken, text:head, lines:lines };
}

/* ============================================
   12. 화면 표시 + 읽어주기
   ============================================ */
function respond(text){
  try{
    var hd = document.getElementById('heard');
    hd.textContent = text;
    hd.classList.remove('empty');

    var res = answerFor(text);
    document.getElementById('answer').textContent = res.text;

    var det = document.getElementById('detail');
    det.innerHTML = '';
    if (res.lines.length){
      res.lines.forEach(function(l){
        var div = document.createElement('div');
        div.textContent = l;
        det.appendChild(div);
      });
      det.style.display = 'block';
    } else {
      det.style.display = 'none';
    }

    lastSpeak = res.speak;
    log('답변: ' + res.text);
    if (document.getElementById('speakOn').checked) speak(res.speak);
  }catch(e){
    log('답변 실패: ' + e.message);
    setStatus('답을 만들지 못했습니다');
  }
}

function speak(msg){
  try{
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();

    var go = function(){
      var u = new SpeechSynthesisUtterance(msg);
      u.lang = 'ko-KR';
      u.rate = 1.02;
      var vs = window.speechSynthesis.getVoices();
      for (var i = 0; i < vs.length; i++){
        if (vs[i].lang && vs[i].lang.indexOf('ko') === 0){ u.voice = vs[i]; break; }
      }
      u.onerror = function(ev){ log('말하기 오류: ' + ev.error); };
      window.speechSynthesis.speak(u);
    };

    // 목소리 목록이 아직 안 왔으면 잠시 뒤 재시도
    if (window.speechSynthesis.getVoices().length === 0) setTimeout(go, 350);
    else go();
  }catch(e){ log('말하기 실패: ' + e.message); }
}

/* ============================================
   13. 음성인식 — 누를 때마다 새로 만든다 (안드로이드 크롬 대응)
   ============================================ */
var rec = null;

function setStatus(s){
  var el = document.getElementById('status');
  if (el) el.textContent = s;
}
function setLive(on){
  listening = on;
  document.getElementById('mic').classList.toggle('live', on);
  document.getElementById('micLabel').textContent = on ? '듣는 중' : '눌러서 말하기';
}

function startListen(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    setStatus('이 브라우저는 음성인식을 지원하지 않습니다. 크롬으로 열어주세요.');
    log('음성인식 기능 없음');
    return;
  }

  try{
    if (rec){ try{ rec.abort(); }catch(e){} rec = null; }
    window.speechSynthesis && window.speechSynthesis.cancel();

    rec = new SR();
    rec.lang = 'ko-KR';
    rec.continuous = false;
    rec.interimResults = true;

    // 반드시 on- 방식으로 연결 (addEventListener 는 안드로이드에서 동작 안 함)
    rec.onstart = function(){ setLive(true); setStatus('말씀하세요'); log('듣기 시작'); };
    rec.onspeechstart = function(){ setStatus('듣는 중...'); };

    rec.onresult = function(ev){
      try{
        var txt = '', fin = false, i;
        for (i = ev.resultIndex; i < ev.results.length; i++){
          txt += ev.results[i][0].transcript;
          if (ev.results[i].isFinal) fin = true;
        }
        var hd = document.getElementById('heard');
        hd.textContent = txt;
        hd.classList.remove('empty');
        if (fin && txt.trim()){
          log('인식 완료: ' + txt.trim());
          setStatus('처리 중');
          respond(txt.trim());
        }
      }catch(e){ log('결과 처리 오류: ' + e.message); }
    };

    rec.onerror = function(ev){
      setLive(false);
      log('오류: ' + ev.error);
      if (ev.error === 'not-allowed')        setStatus('마이크 권한이 필요합니다. 자물쇠 아이콘에서 허용해 주세요.');
      else if (ev.error === 'no-speech')     setStatus('소리를 못 들었습니다. 다시 눌러주세요.');
      else if (ev.error === 'network')       setStatus('인터넷 연결을 확인해 주세요.');
      else if (ev.error === 'audio-capture') setStatus('마이크를 찾지 못했습니다.');
      else if (ev.error === 'aborted')       setStatus('대기 중');
      else setStatus('오류: ' + ev.error);
    };

    rec.onend = function(){
      setLive(false);
      log('듣기 종료');
      if (document.getElementById('status').textContent === '말씀하세요') setStatus('대기 중');
    };

    rec.start();
    log('시작 명령 보냄');
  }catch(e){
    setLive(false);
    setStatus('다시 눌러주세요');
    log('시작 실패: ' + e.name + ' ' + e.message);
  }
}

function stopListen(){
  try{ if (rec) rec.stop(); }catch(e){ log('정지 실패: ' + e.message); }
  setLive(false);
}

function toggleMic(){
  if (listening) stopListen();
  else startListen();
}

/* ============================================
   14. 예시 질문 버튼
   ============================================ */
var EXAMPLES = ['오늘 일정','내일 예약','모레 일정','이번 주 일정','3일 뒤 예약','영종도 오늘','송도 내일','이번 주말'];

function buildChips(){
  try{
    var row = document.getElementById('chipRow');
    EXAMPLES.forEach(function(q){
      var b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = q;
      b.onclick = function(){ respond(q); };
      row.appendChild(b);
    });
  }catch(e){ log('예시 버튼 실패: ' + e.message); }
}

/* ============================================
   15. 저장된 데이터 목록
   ============================================ */
var keySummary = '';

function listKeys(){
  try{
    var host = document.getElementById('keyList');
    host.innerHTML = '';
    var keys = [], i;
    for (i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if (k) keys.push(k);
    }
    if (!keys.length){
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '저장된 자료가 없습니다.';
      host.appendChild(p);
      keySummary = '(없음)';
      return;
    }
    keys.sort();
    var sum = [];

    keys.forEach(function(key){
      var val = '';
      try{ val = localStorage.getItem(key) || ''; }catch(e){}
      var kb = Math.round(val.length/1024*10)/10;
      sum.push(key + '  (' + kb + ' KB)');

      var item = document.createElement('div');
      item.className = 'keyItem';

      var nm = document.createElement('div');
      nm.className = 'kn'; nm.textContent = key;

      var sz = document.createElement('div');
      sz.className = 'ks'; sz.textContent = kb + ' KB';

      var pre = document.createElement('pre');
      pre.textContent = val.slice(0,700) + (val.length > 700 ? '\n… (뒷부분 생략)' : '');

      var btn = document.createElement('button');
      btn.className = 'mini'; btn.type = 'button'; btn.textContent = '내용 보기';
      btn.onclick = function(){
        var open = pre.style.display === 'block';
        pre.style.display = open ? 'none' : 'block';
        btn.textContent = open ? '내용 보기' : '접기';
      };

      item.appendChild(nm); item.appendChild(sz); item.appendChild(btn); item.appendChild(pre);
      host.appendChild(item);
    });

    keySummary = sum.join('\n');
  }catch(e){ log('데이터 목록 실패: ' + e.message); }
}

function copyKeys(){
  try{
    var text = '저장된 항목 목록\n' + keySummary;
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ alert('복사했습니다.'); })
        .catch(function(){ alert('복사 실패. 화면을 캡처해 주세요.'); });
    } else {
      alert('복사 기능을 쓸 수 없습니다. 화면을 캡처해 주세요.');
    }
  }catch(e){ alert('복사 실패. 화면을 캡처해 주세요.'); }
}

/* ============================================
   16. 설정 저장
   ============================================ */
function saveSet(){
  try{
    localStorage.setItem(KEY_SET, JSON.stringify({
      speakOn: document.getElementById('speakOn').checked,
      autoMic: document.getElementById('autoMic').checked,
      showLog: document.getElementById('showLog').checked
    }));
  }catch(e){}
}
function loadSet(){
  try{
    var raw = localStorage.getItem(KEY_SET);
    if (!raw) return;
    var d = JSON.parse(raw);
    document.getElementById('speakOn').checked = d.speakOn !== false;
    document.getElementById('autoMic').checked = !!d.autoMic;
    document.getElementById('showLog').checked = !!d.showLog;
  }catch(e){}
}

/* ============================================
   17. 시작
   ============================================ */
function boot(){
  try{
    loadSet();
    buildChips();
    listKeys();

    document.getElementById('mic').onclick = toggleMic;
    document.getElementById('replay').onclick = function(){ if (lastSpeak) speak(lastSpeak); };
    document.getElementById('copyKeys').onclick = copyKeys;

    document.getElementById('speakOn').onchange = saveSet;
    document.getElementById('autoMic').onchange = saveSet;
    document.getElementById('showLog').onchange = function(){
      document.getElementById('logWrap').style.display = this.checked ? 'block' : 'none';
      saveSet();
    };
    if (document.getElementById('showLog').checked){
      document.getElementById('logWrap').style.display = 'block';
    }

    log('준비 완료');

    if (location.protocol !== 'https:'){
      setStatus('https 주소로 열어야 마이크가 켜집니다');
      log('https 아님: ' + location.protocol);
    }

    if (document.getElementById('autoMic').checked){
      setTimeout(function(){ if (!listening) startListen(); }, 800);
    }
  }catch(e){
    alert('시작 실패: ' + e.message);
  }
}

document.addEventListener('DOMContentLoaded', boot);
</script>

<script>
(function(){

  // 주소 뒤에 붙은 ?id=...&rooms=... 을 그대로 들고 진짜 현황판으로 넘어갑니다.
  var target = 'roommade-host.html' + (location.search || '');

  if (a) a.href = target;
  // 뒤로가기 눌렀을 때 이 표지로 다시 돌아오지 않도록 replace 사용
  setTimeout(function(){ location.replace(target); }, 60);

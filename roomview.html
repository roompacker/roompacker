<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ROOMMADE 룸뷰 · 호스트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root{
    --navy:#2B4865; --navy-d:#1F3650; --sky:#EAF1F8; --sky-2:#DCE8F4;
    --cream:#F7F4EE; --paper:#FFFFFF; --ink:#2A2E34; --sub:#5A6573; --muted:#9AA4B2;
    --line:#E9E4DA; --line-2:#DFE6EE;
    --green:#3F9C82; --green-bg:#EAF6F1;
    --red:#D8765F; --red-bg:#FBEEEA;
    --gold:#C99A52; --gold-bg:#FBF3E3;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Pretendard',sans-serif;background:var(--cream);color:var(--ink);padding-bottom:50px;font-size:14px;line-height:1.55}
  .top{background:var(--navy);color:#fff;padding:22px 20px 26px}
  .top .eyebrow{font-size:11px;letter-spacing:.18em;color:rgba(255,255,255,.55);font-weight:700;text-transform:uppercase}
  .top h1{font-size:21px;font-weight:800;margin-top:7px;letter-spacing:-.4px}
  .top .host{font-size:13px;color:rgba(255,255,255,.8);margin-top:3px}
  .wrap{padding:16px 14px 0}
  .month{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 16px}
  .month b{font-size:16px;font-weight:800}
  .month button{width:34px;height:34px;border-radius:11px;border:1px solid var(--line-2);background:#fff;font-size:15px;cursor:pointer;color:var(--navy)}
  .sec{margin-bottom:22px}
  .sec-h{display:flex;align-items:center;gap:8px;margin:0 4px 10px}
  .sec-h .ic{font-size:16px}
  .sec-h b{font-size:14px;font-weight:800}
  .sec-h small{font-size:11px;color:var(--muted);margin-left:auto}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .room{padding:0}
  .room-h{display:flex;align-items:center;gap:10px;padding:13px 15px;background:var(--sky);border-bottom:1px solid var(--line-2)}
  .room-h .rico{width:34px;height:34px;border-radius:11px;background:#fff;display:grid;place-items:center;font-size:16px}
  .room-h b{font-size:14px;font-weight:800}
  .room-h small{font-size:11px;color:var(--sub);display:block;margin-top:1px}
  .row{display:flex;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .d{width:62px;flex-shrink:0;font-size:12px;font-weight:800;color:var(--sub)}
  .row .body{flex:1;min-width:0}
  .row .body .t{font-size:13px;font-weight:700}
  .row .body .s{font-size:11px;color:var(--sub);margin-top:2px}
  .tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:100px;margin-right:5px}
  .tag.in{background:var(--green-bg);color:var(--green)}
  .tag.out{background:var(--red-bg);color:var(--red)}
  .tag.set{background:var(--gold-bg);color:var(--gold)}
  .empty{text-align:center;padding:34px 20px;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:8px}
  .note{font-size:11px;color:var(--muted);text-align:center;padding:18px 20px 30px;line-height:1.7}
  .err{max-width:420px;margin:60px auto;padding:0 24px;text-align:center}
  .err .big{font-size:46px;margin-bottom:14px}
  .err h2{font-size:18px;font-weight:800;margin-bottom:8px}
  .err p{font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  'use strict';
  var WD=['일','월','화','수','목','금','토'];

  // URL 해시에서 데이터 읽기 (#d=base64)
  function readPayload(){
    try{
      var h=location.hash||'';
      var m=h.match(/[#&]d=([^&]+)/);
      if(!m)return null;
      var json=decodeURIComponent(escape(atob(decodeURIComponent(m[1]))));
      return JSON.parse(json);
    }catch(e){ console.error('데이터 해독 실패',e); return null; }
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function dlabel(date){var p=date.split('-');var d=new Date(p[0],p[1]-1,p[2]);return parseInt(p[2])+'일 ('+WD[d.getDay()]+')';}

  function render(){
    var data=readPayload();
    var app=document.getElementById('app');
    if(!data || !data.rooms){
      app.innerHTML='<div class="err"><div class="big">🔑</div><h2>링크를 다시 확인해주세요</h2>'
        +'<p>이 페이지는 룸메이드에서 보내드린<br>전용 링크로만 열 수 있어요.</p></div>';
      return;
    }

    var host=data.host||'호스트';
    var month=data.month||'';
    var rooms=data.rooms||[];

    var html='';
    html+='<div class="top"><div class="eyebrow">ROOMMADE · 룸뷰</div>'
      +'<h1>'+esc(host)+' 님 객실 현황</h1>'
      +'<div class="host">'+esc(month)+' · 룸메이드가 관리합니다</div></div>';

    html+='<div class="wrap">';

    if(rooms.length===0){
      html+='<div class="empty"><div class="big">🏠</div>표시할 객실이 없어요</div>';
    }

    rooms.forEach(function(room){
      var stays=room.stays||room.events||[];
      html+='<div class="sec"><div class="card room">';
      html+='<div class="room-h"><div class="rico">🏠</div><div><b>'+esc(room.name)+'</b>'
        +'<small>'+esc(room.branch||'')+' · 예약 '+stays.length+'건</small></div></div>';

      if(stays.length===0){
        html+='<div class="empty" style="padding:24px"><div class="big">🗓️</div>이 달 일정이 없어요</div>';
      } else {
        stays.forEach(function(s){
          // 6/1~2(1박) 4명
          var ci=s.checkIn.split('-'), co=s.checkOut.split('-');
          var range=parseInt(ci[1])+'/'+parseInt(ci[2])+'~'+parseInt(co[2]);
          var line=range+'('+s.nights+'박)'+(s.guests?' '+s.guests+'명':'');
          var extra='';
          if(s.supplies) extra+='<div class="s"><span class="tag set">추가</span>'+esc(s.supplies)+'</div>';
          if(s.memo)     extra+='<div class="s" style="color:var(--gold);">* '+esc(s.memo)+'</div>';
          html+='<div class="row"><div class="d">'+parseInt(ci[2])+'일</div>'
            +'<div class="body"><div class="t">'+line+'</div>'+extra+'</div></div>';
        });
      }
      html+='</div></div>';
    });

    html+='</div>';
    html+='<div class="note">이 화면은 보기 전용입니다.<br>문의는 룸메이드로 연락해주세요.</div>';

    app.innerHTML=html;
  }

  window.addEventListener('hashchange',render);
  render();
})();
</script>
</body>
</html>

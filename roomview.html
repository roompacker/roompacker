<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ROOMMADE 현황판</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  :root {
    --ink:#2C2C2C; --ink-2:#6B6B6B; --ink-3:#B8B8B8;
    --bg:#FFFFFF; --bg-2:#F8F6F3; --card:#FAF7F3;
    --line:#EFEFED; --line-2:#E2E0DC;
    --ink-btn:#2D2D2D;
    --ok:#16A34A; --ok-2:#F0FDF4;
    --warn:#D97706; --warn-2:#FFFBEB;
    --red:#DC2626; --red-2:#FEF2F2;
    --grn:#16A34A; --grn-2:#F0FDF4;
    --blue:#5A9EC8; --blue-2:#EAF3F9;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Pretendard',sans-serif; background:var(--bg); color:var(--ink);
    padding-bottom:80px; font-size:14px; line-height:1.5;
  }
  .header {
    background:#fff; padding:14px 16px; position:sticky; top:0; z-index:10;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
  }
  .header h1 { font-size:18px; font-weight:800; color:var(--blue); letter-spacing:-0.5px; }
  .header .sub { font-size:11px; color:var(--ink-3); font-weight:600; }
  .branch-toggle { display:flex; background:var(--bg-2); border-radius:10px; padding:3px; gap:2px; }
  .branch-btn {
    padding:6px 11px; border:none; background:transparent; border-radius:8px;
    font-family:inherit; font-size:12px; font-weight:700; color:var(--ink-3); cursor:pointer;
  }
  .branch-btn.active { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .wrap { padding:14px; }
  .empty { text-align:center; padding:40px 20px; color:var(--ink-3); }
  .empty .big { font-size:40px; margin-bottom:10px; }

  /* 날짜 네비 */
  .datenav { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .datenav .title { font-size:16px; font-weight:800; }
  .navbtn { width:34px; height:34px; border:1px solid var(--line-2); background:#fff; border-radius:9px; font-size:14px; cursor:pointer; }
  .todaybtn { background:var(--bg-2); border:1px solid var(--line-2); border-radius:8px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
  .addbtn { background:var(--ink-btn); color:#fff; border:none; border-radius:10px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }

  /* 타임라인 */
  .tl-wrap { background:#fff; border-radius:16px; box-shadow:0 2px 12px rgba(0,0,0,.06); overflow:hidden; }
  .tl-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tl-grid { display:grid; min-width:max-content; }
  /* 날짜 헤더 행 */
  .tl-hdr { display:flex; background:#2D2D2D; position:sticky; top:0; z-index:5; }
  .tl-hdr-room { width:78px; min-width:78px; padding:9px 8px; font-size:10px; color:rgba(255,255,255,.5); font-weight:700; border-right:1px solid rgba(255,255,255,.08); position:sticky; left:0; z-index:6; background:#2D2D2D; }
  .tl-hdr-day { width:46px; min-width:46px; text-align:center; padding:7px 2px; }
  .tl-hdr-day .dn { font-size:13px; font-weight:800; color:#fff; line-height:1; }
  .tl-hdr-day .dw { font-size:9px; color:rgba(255,255,255,.5); margin-top:2px; }
  .tl-hdr-day.today { background:var(--blue); }
  .tl-hdr-day.today .dw { color:rgba(255,255,255,.85); }
  .tl-hdr-day.sun .dn { color:#F8A0A0; }
  .tl-hdr-day.sat .dn { color:#A0C4F8; }
  /* 건물 헤더 */
  .tl-bldg { display:flex; align-items:center; gap:6px; padding:6px 10px; background:var(--bg-2); border-bottom:1px solid var(--line); position:sticky; left:0; }
  .tl-bldg .bar { width:3px; height:13px; border-radius:2px; }
  .tl-bldg .nm { font-size:11px; font-weight:700; color:var(--ink-2); }
  /* 객실 행 */
  .tl-row { display:flex; border-bottom:1px solid var(--line); min-height:48px; }
  .tl-room { width:78px; min-width:78px; padding:6px 8px; border-right:2px solid var(--line-2); display:flex; flex-direction:column; justify-content:center; position:sticky; left:0; z-index:4; background:#fff; }
  .tl-room .ho { font-size:12px; font-weight:800; color:var(--ink); }
  .tl-cell { width:46px; min-width:46px; border-right:1px solid var(--line); position:relative; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .tl-cell.today { background:rgba(90,158,200,.06); }
  .tl-cell.sun { background:rgba(220,38,38,.03); }
  .tl-cell.sat { background:rgba(90,158,200,.04); }
  /* 예약 바 */
  .tl-stay { position:absolute; top:50%; transform:translateY(-50%); height:22px; border-radius:4px; display:flex; align-items:center; padding:0 6px; font-size:10px; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; z-index:2; }
  /* 청소 마커 */
  .tl-clean { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#fff; z-index:3; box-shadow:0 2px 6px rgba(0,0,0,.18); }

  /* 범례 */
  .legend { display:flex; gap:14px; padding:10px 4px 2px; flex-wrap:wrap; }
  .legend .item { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--ink-2); }
  .legend .dot { width:10px; height:10px; border-radius:3px; }

  /* 모달 */
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; align-items:flex-end; }
  .modal.active { display:flex; }
  .modal-content { background:#fff; width:100%; border-radius:24px 24px 0 0; padding:20px; max-height:88vh; overflow-y:auto; }
  .modal-title { font-size:18px; font-weight:800; margin-bottom:16px; }
  .field { margin-bottom:12px; }
  .field label { display:block; font-size:12px; font-weight:700; color:var(--ink-2); margin-bottom:5px; }
  .field input, .field select { width:100%; padding:11px 12px; border:1.5px solid var(--line-2); border-radius:10px; font-family:inherit; font-size:14px; background:#fff; color:var(--ink); }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .mbtns { display:flex; gap:8px; margin-top:8px; }
  .btn-cancel { flex:1; padding:13px; background:var(--bg-2); color:var(--ink-2); border:1px solid var(--line-2); border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn-save { flex:2; padding:13px; background:var(--ink-btn); color:#fff; border:none; border-radius:12px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; }
  .btn-del { padding:13px 16px; background:var(--red-2); color:var(--red); border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; }
  .toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:11px 20px; border-radius:100px; font-size:13px; font-weight:600; z-index:200; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
</style></style>
</head>
<body>
<div class="header">
  <div>
    <h1>ROOMMADE 현황판</h1>
    <div class="sub">객실별 예약 · 청소 한눈에</div>
  </div>
  <div class="branch-toggle" id="branchToggle">
    <button class="branch-btn" data-branch="영종점">영종</button>
    <button class="branch-btn" data-branch="송도점">송도</button>
    <button class="branch-btn active" data-branch="전체">전체</button>
  </div>
</div>
<div class="wrap" id="main"></div>

<!-- 예약 입력 모달 -->
<div class="modal" id="bkModal">
  <div class="modal-content">
    <div class="modal-title" id="bkModalTitle">예약 추가</div>
    <div class="field">
      <label>객실</label>
      <select id="bkRoom"></select>
    </div>
    <div class="row2">
      <div class="field">
        <label>체크인 날짜</label>
        <input type="date" id="bkIn">
      </div>
      <div class="field">
        <label>체크아웃 날짜</label>
        <input type="date" id="bkOut">
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>인원 (명)</label>
        <input type="text" id="bkGuests" inputmode="numeric" placeholder="2">
      </div>
      <div class="field">
        <label>예약 유형</label>
        <select id="bkType">
          <option value="예약">신규 예약</option>
          <option value="연박">연박</option>
          <option value="장기">장기</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>메모 (선택)</label>
      <input type="text" id="bkMemo" placeholder="예: 늦은 체크인, 반려동물 동반">
    </div>
    <div class="mbtns">
      <button class="btn-cancel" id="bkCancel">취소</button>
      <button class="btn-del" id="bkDel" style="display:none;">🗑️</button>
      <button class="btn-save" id="bkSave">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
// ROOMMADE 현황판 v1.0 — 룸메이드 캐쉬와 객실/예약 데이터 공유
(function(){
  'use strict';

  // 룸메이드 캐쉬와 동일한 키 사용 → 자동 연동
  var K_ROOM  = '룸메이드캐쉬-객실';
  var K_BOOKS = 'rcal2026-books';
  var K_TX    = '룸메이드캐쉬-거래내역';

  var WDAYS = ['일','월','화','수','목','금','토'];
  var DAYS_SHOWN = 14; // 2주 보기
  var branch = '전체';
  var weekOffset = 0;
  var editId = null;

  function load(key){ try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e){ return []; } }
  function save(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch(e){ alert('저장 실패: '+e.message); return false; } }
  function ds(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function nights(ci, co){ if(!ci||!co) return 0; return Math.round((new Date(co)-new Date(ci))/86400000); }
  function ho(name){ var m=(name||'').match(/(\d+호)$/); return m?m[1]:name; }
  function bldgOf(r){ return r.building || (r.name||'').replace(/\s*\d+호\s*$/,'').trim() || '기타'; }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  var BCOLOR = ['#5A9EC8','#16A34A','#D97706','#9B59B6','#E07878','#48B0A0','#C77DBB','#8AA85A'];
  function bldgColor(name, list){ var i=list.indexOf(name); return BCOLOR[(i<0?0:i)%BCOLOR.length]; }

  function toast(msg){
    var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }

  // ───────────── 렌더 ─────────────
  function render(){
    var main = document.getElementById('main');
    var rooms = load(K_ROOM).filter(function(r){ return branch==='전체' || r.branch===branch; });
    var books = load(K_BOOKS);
    var tx    = load(K_TX);

    if (rooms.length === 0) {
      main.innerHTML = '<div class="empty"><div class="big">🏠</div>'
        + '<div style="font-size:15px;font-weight:700;color:var(--ink-2);">등록된 객실이 없어요</div>'
        + '<div style="font-size:12px;margin-top:6px;">룸메이드 캐쉬 앱에서 객실을 먼저 등록하면<br>여기에 자동으로 나타나요</div></div>';
      return;
    }

    // 보여줄 14일 날짜 배열
    var start = new Date(); start.setHours(0,0,0,0);
    start.setDate(start.getDate() + weekOffset*DAYS_SHOWN);
    var dates = [];
    for (var i=0;i<DAYS_SHOWN;i++){ var d=new Date(start); d.setDate(d.getDate()+i); dates.push(ds(d)); }
    var todayStr = ds(new Date());

    // 날짜 라벨
    var s0=dates[0].split('-'), s1=dates[DAYS_SHOWN-1].split('-');

    var html = '';
    // 날짜 네비
    html += '<div class="datenav">';
    html += '<div style="display:flex;align-items:center;gap:8px;">';
    html += '<button class="navbtn" id="prevBtn">◀</button>';
    html += '<button class="todaybtn" id="todayBtn">오늘</button>';
    html += '<button class="navbtn" id="nextBtn">▶</button>';
    html += '</div>';
    html += '<button class="addbtn" id="addBtn">+ 예약</button>';
    html += '</div>';
    html += '<div style="font-size:13px;color:var(--ink-3);font-weight:600;margin-bottom:10px;">'
      + s0[1]+'월 '+s0[2]+'일 ~ '+s1[1]+'월 '+s1[2]+'일</div>';

    // 타임라인
    html += '<div class="tl-wrap"><div class="tl-scroll"><div class="tl-grid">';

    // 날짜 헤더
    html += '<div class="tl-hdr"><div class="tl-hdr-room">객실</div>';
    dates.forEach(function(dt){
      var p=dt.split('-'), dow=new Date(p[0],p[1]-1,p[2]).getDay();
      var cls='tl-hdr-day'+(dt===todayStr?' today':'')+(dow===0?' sun':dow===6?' sat':'');
      html += '<div class="'+cls+'"><div class="dn">'+parseInt(p[2])+'</div><div class="dw">'+WDAYS[dow]+'</div></div>';
    });
    html += '</div>';

    // 건물별 그룹
    var bOrd=[], bMap={};
    rooms.forEach(function(r){ var b=bldgOf(r); if(!bMap[b]){bMap[b]=[];bOrd.push(b);} bMap[b].push(r); });

    bOrd.forEach(function(bname){
      var col = bldgColor(bname, bOrd);
      html += '<div class="tl-bldg"><span class="bar" style="background:'+col+'"></span><span class="nm">'+bname+'</span></div>';

      bMap[bname].forEach(function(room){
        html += '<div class="tl-row"><div class="tl-room"><div class="ho">'+ho(room.name)+'</div></div>';

        // 각 날짜 셀
        dates.forEach(function(dt, di){
          var p=dt.split('-'), dow=new Date(p[0],p[1]-1,p[2]).getDay();
          var cls='tl-cell'+(dt===todayStr?' today':'')+(dow===0?' sun':dow===6?' sat':'');

          // 이 날 체크아웃 = 청소 필요
          var coutBk = books.find(function(b){ return b.roomId===room.id && b.checkOut===dt; });
          var doneTx = tx.find(function(t){ return t.type==='income' && t.targetId===room.id && t.date===dt; });

          var inner = '';
          if (coutBk) {
            var cc = doneTx ? '#16A34A' : '#DC2626';
            inner = '<div class="tl-clean" style="background:'+cc+'" data-clean="'+room.id+'|'+dt+'">'+(doneTx?'✓':'청')+'</div>';
          }
          html += '<div class="'+cls+'" data-cell="'+room.id+'|'+dt+'">'+inner+'</div>';
        });

        html += '</div>';
      });
    });

    html += '</div></div></div>';

    // 범례
    html += '<div class="legend">';
    html += '<div class="item"><span class="dot" style="background:#5A9EC8"></span>예약중</div>';
    html += '<div class="item"><span class="dot" style="border-radius:50%;background:#DC2626"></span>청소 필요</div>';
    html += '<div class="item"><span class="dot" style="border-radius:50%;background:#16A34A"></span>청소 완료</div>';
    html += '</div>';

    main.innerHTML = html;

    // 예약 바를 셀 위에 절대배치로 그리기
    drawStayBars(rooms, books, dates);

    // 이벤트
    document.getElementById('prevBtn').onclick  = function(){ weekOffset--; render(); };
    document.getElementById('nextBtn').onclick  = function(){ weekOffset++; render(); };
    document.getElementById('todayBtn').onclick = function(){ weekOffset=0; render(); };
    document.getElementById('addBtn').onclick   = function(){ openModal(null); };

    main.querySelectorAll('[data-cell]').forEach(function(cell){
      cell.addEventListener('click', function(e){
        if (e.target.closest('[data-clean]')) return;
        var parts = cell.dataset.cell.split('|');
        openModalForCell(parts[0], parts[1]);
      });
    });
    main.querySelectorAll('[data-clean]').forEach(function(c){
      c.addEventListener('click', function(e){
        e.stopPropagation();
        var parts = c.dataset.clean.split('|');
        var bk = books.find(function(b){ return b.roomId===parts[0] && b.checkOut===parts[1]; });
        if (bk) openModal(bk.id);
      });
    });
  }

  // 예약 바 그리기 (연박 표시)
  function drawStayBars(rooms, books, dates){
    var rowEls = document.querySelectorAll('.tl-row');
    var bOrd=[], bMap={};
    rooms.forEach(function(r){ var b=bldgOf(r); if(!bMap[b]){bMap[b]=[];bOrd.push(b);} bMap[b].push(r); });
    var flat = [];
    bOrd.forEach(function(b){ bMap[b].forEach(function(r){ flat.push(r); }); });

    flat.forEach(function(room, idx){
      var row = rowEls[idx];
      if (!row) return;
      var cells = row.querySelectorAll('.tl-cell');
      if (!cells.length) return;

      books.filter(function(b){ return b.roomId===room.id; }).forEach(function(bk){
        var ci = bk.checkIn, co = bk.checkOut;
        if (!ci || !co) return;
        if (co <= dates[0] || ci > dates[dates.length-1]) return;
        var startIdx = dates.indexOf(ci);
        var endIdx   = dates.indexOf(co);
        var sIdx = startIdx<0 ? 0 : startIdx;
        var eIdx = endIdx<0 ? dates.length : endIdx;
        var widthCells = eIdx - sIdx;
        if (widthCells <= 0) return;

        // 실제 셀의 offsetLeft 사용 (정확한 정렬)
        var startCell = cells[sIdx];
        if (!startCell) return;
        var leftPx = startCell.offsetLeft;
        var cellW = startCell.offsetWidth;

        var bar = document.createElement('div');
        bar.className = 'tl-stay';
        var colorMap = {'예약':'#5A9EC8','연박':'#48B0A0','장기':'#9B59B6'};
        bar.style.background = colorMap[bk.type] || '#5A9EC8';
        bar.style.left  = (leftPx + 3) + 'px';
        bar.style.width = (widthCells*cellW - 6) + 'px';
        bar.textContent = (bk.guests?bk.guests+'명':'') + ' ' + nights(ci,co) + '박';
        bar.dataset.bkid = bk.id;
        bar.addEventListener('click', function(e){ e.stopPropagation(); openModal(bk.id); });
        row.style.position = 'relative';
        row.appendChild(bar);
      });
    });
  }

  // ───────────── 모달 ─────────────
  function openModal(id){
    editId = id;
    var rooms = load(K_ROOM);
    var sel = document.getElementById('bkRoom');
    sel.innerHTML = rooms.map(function(r){ return '<option value="'+r.id+'">'+r.name+'</option>'; }).join('');

    var del = document.getElementById('bkDel');
    if (id) {
      var bk = load(K_BOOKS).find(function(b){ return b.id===id; });
      if (bk) {
        document.getElementById('bkModalTitle').textContent = '예약 수정';
        sel.value = bk.roomId;
        document.getElementById('bkIn').value = bk.checkIn || '';
        document.getElementById('bkOut').value = bk.checkOut || '';
        document.getElementById('bkGuests').value = bk.guests || '';
        document.getElementById('bkType').value = bk.type || '예약';
        document.getElementById('bkMemo').value = bk.memo || '';
      }
      del.style.display = 'block';
    } else {
      document.getElementById('bkModalTitle').textContent = '예약 추가';
      document.getElementById('bkIn').value = '';
      document.getElementById('bkOut').value = '';
      document.getElementById('bkGuests').value = '';
      document.getElementById('bkType').value = '예약';
      document.getElementById('bkMemo').value = '';
      del.style.display = 'none';
    }
    document.getElementById('bkModal').classList.add('active');
  }

  function openModalForCell(roomId, date){
    openModal(null);
    document.getElementById('bkRoom').value = roomId;
    document.getElementById('bkIn').value = date;
    // 체크아웃 기본값 = 다음날
    var d = new Date(date); d.setDate(d.getDate()+1);
    document.getElementById('bkOut').value = ds(d);
  }

  function saveModal(){
    var roomId = document.getElementById('bkRoom').value;
    var ci = document.getElementById('bkIn').value;
    var co = document.getElementById('bkOut').value;
    if (!roomId) { alert('객실을 선택하세요'); return; }
    if (!ci || !co) { alert('체크인/체크아웃 날짜를 입력하세요'); return; }
    if (co <= ci) { alert('체크아웃은 체크인보다 뒤여야 해요'); return; }

    var rooms = load(K_ROOM);
    var room = rooms.find(function(r){ return r.id===roomId; });
    var books = load(K_BOOKS);

    var data = {
      id: editId || uid(),
      roomId: roomId,
      checkIn: ci,
      checkOut: co,
      guests: parseInt(document.getElementById('bkGuests').value) || 0,
      type: document.getElementById('bkType').value,
      memo: document.getElementById('bkMemo').value.trim(),
      branch: room ? room.branch : '',
      color: 0,
    };

    if (editId) {
      var i = books.findIndex(function(b){ return b.id===editId; });
      if (i>=0) books[i] = Object.assign(books[i], data);
    } else {
      books.push(data);
    }
    if (!save(K_BOOKS, books)) return;
    document.getElementById('bkModal').classList.remove('active');
    toast(editId ? '✅ 수정됐어요' : '✅ 예약 추가됐어요');
    render();
  }

  function delModal(){
    if (!editId) return;
    if (!confirm('이 예약을 삭제할까요?')) return;
    var books = load(K_BOOKS).filter(function(b){ return b.id!==editId; });
    save(K_BOOKS, books);
    document.getElementById('bkModal').classList.remove('active');
    toast('🗑 삭제됐어요');
    render();
  }

  // ───────────── 초기화 ─────────────
  function init(){
    document.querySelectorAll('.branch-btn').forEach(function(b){
      b.addEventListener('click', function(){
        branch = b.dataset.branch;
        document.querySelectorAll('.branch-btn').forEach(function(x){ x.classList.toggle('active', x.dataset.branch===branch); });
        render();
      });
    });
    document.getElementById('bkCancel').onclick = function(){ document.getElementById('bkModal').classList.remove('active'); };
    document.getElementById('bkSave').onclick   = saveModal;
    document.getElementById('bkDel').onclick    = delModal;
    document.getElementById('bkModal').addEventListener('click', function(e){ if(e.target.id==='bkModal') e.target.classList.remove('active'); });
    render();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
</body>
</html>

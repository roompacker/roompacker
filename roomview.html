<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#2F6FAF" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<title>ROOMMADE 객실 현황</title>
<style>
:root{
  --navy:#2F6FAF;--blue:#6CA4D9;--sky:#EAF3FB;--cream:#F8F5F0;--card:#fff;
  --ink:#243140;--sub:#65707E;--muted:#97A1AC;--line:#E3E0DA;
  --green:#358879;--green-bg:#EDF7F4;--red:#D95C5C;--red-bg:#FDEEEE;
  --amber:#D77E22;--amber-bg:#FFF2E5;--shadow:0 12px 32px rgba(47,86,122,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:#EEF3F8;overscroll-behavior-y:none}
body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#F8F4EE 0%,#EEF3F8 100%);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;overscroll-behavior-y:none}
button{font:inherit;touch-action:manipulation;cursor:pointer}
.app{width:100%;max-width:560px;min-height:100dvh;margin:0 auto;background:var(--cream);padding-bottom:calc(92px + env(safe-area-inset-bottom));box-shadow:0 0 40px rgba(58,78,100,.08)}
.topbar{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 15px 11px;background:rgba(248,245,240,.94);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(227,224,218,.92)}
.brandrow{display:flex;align-items:center;gap:10px}.logo{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:18px;font-weight:900;background:linear-gradient(145deg,var(--navy),var(--blue));box-shadow:0 8px 18px rgba(47,111,175,.23)}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:15px;letter-spacing:-.3px}.brand small{display:block;margin-top:2px;font-size:9px;font-weight:800;letter-spacing:1.1px;color:var(--muted)}
.iconbtn{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--navy);font-size:17px;box-shadow:0 5px 14px rgba(90,107,126,.08)}
main{padding:15px 14px 4px}
.hero{position:relative;overflow:hidden;border-radius:27px;padding:20px;background:linear-gradient(135deg,#2F6FAF 0%,#5A97D0 72%,#F1A247 125%);color:#fff;box-shadow:0 18px 34px rgba(47,111,175,.22)}
.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;right:-78px;top:-82px;background:rgba(255,255,255,.09)}
.hero .eyebrow{font-size:10px;font-weight:800;letter-spacing:.5px;opacity:.78}.hero h1{position:relative;z-index:1;margin:5px 0 4px;font-size:24px;letter-spacing:-.8px}.hero p{position:relative;z-index:1;margin:0;font-size:12px;opacity:.86}.hero .updated{position:relative;z-index:1;display:inline-flex;margin-top:13px;padding:7px 10px;border:1px solid rgba(255,255,255,.16);border-radius:99px;background:rgba(255,255,255,.11);font-size:9px;font-weight:800}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.metric{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 9px;box-shadow:0 7px 20px rgba(35,64,92,.045)}.metric span{display:block;font-size:9px;color:var(--muted);font-weight:800}.metric b{display:block;margin-top:4px;font-size:16px;letter-spacing:-.3px}.metric:nth-child(1) b{color:var(--navy)}.metric:nth-child(2) b{color:var(--green)}.metric:nth-child(3) b{color:var(--amber)}
.section{margin-top:15px}.sectiontitle{display:flex;align-items:center;justify-content:space-between;margin:0 4px 9px}.sectiontitle h2{margin:0;font-size:15px;letter-spacing:-.4px}.sectiontitle small{font-size:9px;color:var(--muted)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 4px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:0 0 auto;min-height:42px;padding:9px 13px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--sub);font-size:11px;font-weight:800;white-space:nowrap}.filter.active{border-color:transparent;background:linear-gradient(145deg,var(--navy),#4C89C2);color:#fff;box-shadow:0 7px 18px rgba(47,111,175,.2)}
.room{margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:23px;overflow:hidden;box-shadow:0 8px 22px rgba(35,64,92,.05)}.roomhead{display:flex;align-items:center;gap:11px;padding:14px 15px;background:linear-gradient(180deg,#fff 0%,#FBF8F3 100%);border-bottom:1px solid var(--line)}.roomico{width:42px;height:42px;border-radius:14px;background:var(--sky);display:grid;place-items:center;font-size:18px}.roomname{flex:1;min-width:0}.roomname b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.roomname small{display:block;margin-top:3px;font-size:9px;color:var(--muted)}.roomcount{padding:7px 9px;border-radius:99px;background:var(--sky);font-size:9px;font-weight:900;color:var(--navy)}
.event{padding:14px 15px;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.eventtop{display:flex;align-items:flex-start;gap:10px}.datebox{width:52px;flex:0 0 52px;text-align:center;padding:8px 4px;border-radius:14px;background:#F6F2EC}.datebox b{display:block;font-size:15px}.datebox small{display:block;margin-top:2px;font-size:9px;color:var(--muted);font-weight:800}.eventmain{flex:1;min-width:0}.statusline{display:flex;align-items:center;justify-content:space-between;gap:8px}.statusline b{font-size:13px}.badge{flex:0 0 auto;padding:6px 8px;border-radius:99px;font-size:9px;font-weight:900}.badge.done{background:var(--green-bg);color:var(--green)}.badge.wait{background:var(--amber-bg);color:var(--amber)}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:stretch;margin-top:10px}.flowbox{padding:10px;border-radius:14px;background:#FAF8F4;border:1px solid #EEE9E2}.flowbox.out{background:var(--red-bg);border-color:#F4D8D8}.flowbox.in{background:var(--sky);border-color:#D6E5F3}.flowbox span{display:block;font-size:9px;font-weight:900}.flowbox.out span{color:var(--red)}.flowbox.in span{color:var(--navy)}.flowbox b{display:block;margin-top:4px;font-size:11px;line-height:1.45}.arrow{display:grid;place-items:center;color:var(--muted);font-size:13px}
.prep{margin-top:8px;padding:10px 11px;border-radius:13px;background:#F3F4F6;font-size:10px;line-height:1.55;color:var(--sub)}.prep.attn{background:var(--amber-bg);color:#995D1C}.nextclean{margin-top:7px;font-size:9px;color:var(--muted);font-weight:700}
.empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:12px}.empty .big{font-size:31px;margin-bottom:8px}
.notice{margin-top:14px;padding:13px 14px;border-radius:17px;background:#fff;border:1px solid var(--line);font-size:10px;color:var(--sub);line-height:1.6}.notice b{color:var(--navy)}
.error{display:none;padding:34px 18px;text-align:center}.error .big{font-size:42px}.error h1{font-size:19px}.error p{font-size:12px;color:var(--sub);line-height:1.65}.error code{display:block;margin-top:10px;padding:10px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:10px;word-break:break-all}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:25;width:100%;max-width:560px;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px 14px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}.bottom button{min-height:46px;border-radius:14px;font-size:11px;font-weight:900}.share{border:0;color:#fff;background:linear-gradient(145deg,var(--navy),#4C89C2)}.topbtn{border:1px solid var(--line);color:var(--navy);background:#fff}
.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;padding:11px 15px;border-radius:99px;background:#243140;color:#fff;font-size:11px;font-weight:800;white-space:nowrap;box-shadow:0 9px 24px rgba(36,49,64,.25)}
@media(min-width:561px){.app{margin:18px auto;min-height:calc(100dvh - 36px);border-radius:28px;overflow:hidden}.topbar{border-radius:28px 28px 0 0}.bottom{bottom:18px;border-radius:0 0 28px 28px}}
@supports(-webkit-touch-callout:none){.app{min-height:-webkit-fill-available}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brandrow">
      <div class="logo">R</div>
      <div class="brand"><b>ROOMMADE 객실 현황</b><small>HOST ROOM STATUS</small></div>
      <button class="iconbtn" id="shareTop" aria-label="공유">↗</button>
    </div>
  </header>

  <div class="error" id="errorBox">
    <div class="big">🔗</div>
    <h1>객실 현황 링크를 확인해주세요</h1>
    <p>링크 정보가 없거나 손상되었습니다.<br>룸메이드 관리자에게 새 링크를 요청해주세요.</p>
    <code id="errorText"></code>
  </div>

  <main id="content" hidden>
    <section class="hero">
      <div class="eyebrow" id="monthLabel">객실 운영 현황</div>
      <h1 id="hostTitle">호스트님</h1>
      <p>예약 · 청소 · 준비사항을 한눈에 확인하세요.</p>
      <div class="updated" id="updatedLabel">업데이트 기준</div>
    </section>

    <section class="summary">
      <div class="metric"><span>예약</span><b id="reservationCount">0건</b></div>
      <div class="metric"><span>청소 완료</span><b id="cleanCount">0건</b></div>
      <div class="metric"><span>준비 필요</span><b id="prepCount">0건</b></div>
    </section>

    <section class="section" id="filterSection">
      <div class="sectiontitle"><h2>내 객실</h2><small id="roomTotal"></small></div>
      <div class="filters" id="filters"></div>
    </section>

    <section class="section">
      <div class="sectiontitle"><h2 id="scheduleTitle">월간 일정</h2><small>날짜순</small></div>
      <div id="roomList"></div>
    </section>

    <div class="notice"><b>안내</b><br>이 화면에는 호스트 확인용 정보만 표시됩니다. 금액, 도어락 비밀번호, 직원 정보, 내부 메모는 포함되지 않습니다.</div>
  </main>
</div>

<div class="bottom" id="bottomBar" hidden>
  <button class="topbtn" id="goTop">맨 위로</button>
  <button class="share" id="shareBottom">링크 공유</button>
</div>

<script>
(() => {
  'use strict';
  const $=(s,r=document)=>r.querySelector(s);
  const esc=(v='')=>String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const pad=n=>String(n).padStart(2,'0');
  const monthText=v=>{if(!v)return '';const [y,m]=String(v).split('-');return `${y}년 ${Number(m)}월`;};
  const dayNames=['일','월','화','수','목','금','토'];
  const dateObj=s=>new Date(s+'T00:00:00');
  const addDays=(s,n)=>{const d=dateObj(s);d.setDate(d.getDate()+Number(n||0));return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
  const dateShort=s=>{const d=dateObj(s);return `${d.getMonth()+1}/${d.getDate()}(${dayNames[d.getDay()]})`;};
  const dateParts=s=>{const d=dateObj(s);return {day:d.getDate(),week:dayNames[d.getDay()]};};
  const statusName=s=>s==='done'?'청소 완료':'청소 예정';
  let data=null,activeRoom='all';

  function toast(text){$('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=text;document.body.appendChild(t);setTimeout(()=>t.remove(),1900);}

  function decodePayload(){
    const match=location.hash.match(/(?:^#|&)d=([^&]+)/);if(!match)throw new Error('링크 데이터가 없습니다.');
    let b64=match[1].replace(/-/g,'+').replace(/_/g,'/');while(b64.length%4)b64+='=';
    const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    let json;
    if(window.TextDecoder)json=new TextDecoder('utf-8').decode(bytes);
    else json=decodeURIComponent(Array.from(bytes,b=>'%'+b.toString(16).padStart(2,'0')).join(''));
    return normalize(JSON.parse(json));
  }

  function normalize(p){
    if(p&&p.v===2&&Array.isArray(p.r))return p;
    // 이전 버전 링크도 표시
    if(p&&Array.isArray(p.r)){
      const year=new Date().getFullYear(),month=String(p.m||new Date().getMonth()+1).padStart(2,'0');
      return {v:1,h:p.h||'호스트',m:`${year}-${month}`,g:'',r:p.r.map((r,idx)=>({id:'legacy'+idx,n:r[0]||'객실',short:r[0]||'객실',b:'',bg:0,e:(r[1]||[]).map(a=>({d:`${year}-${month}-${String(a[0]).padStart(2,'0')}`,s:'booked',o:{n:'',g:'',t:''},i:{n:a[1]||'',g:a[2]||'',t:''},p:a[3]||''}))}))};
    }
    throw new Error('지원하지 않는 링크 형식입니다.');
  }

  function prepInfo(room,e){
    const guests=Number(e.i?.g||0),base=Number(room.bg||0),supplies=String(e.p||'').trim();
    if(supplies)return {attention:true,text:`🛒 준비사항: ${supplies}`};
    if(base>0&&guests>base)return {attention:true,text:`⚠️ 추가 셋팅 필요 · 기본 ${base}명 → ${guests}명`};
    return {attention:false,text:'✓ 기본 셋팅'};
  }

  function eventHTML(room,e){
    const dp=dateParts(e.d),out=e.o||{},inn=e.i||{},prep=prepInfo(room,e);
    const outText=[out.n?`${out.n}박`:'',out.g?`${out.g}명`:'',out.t||''].filter(Boolean).join(' · ')||'퇴실 정보 없음';
    const inText=[inn.n?`${inn.n}박`:'',inn.g?`${inn.g}명`:'',inn.t||''].filter(Boolean).join(' · ')||'체크인 없음';
    const next=Number(inn.n)>0?addDays(e.d,inn.n):'';
    return `<article class="event"><div class="eventtop"><div class="datebox"><b>${dp.day}일</b><small>${dp.week}요일</small></div><div class="eventmain"><div class="statusline"><b>${esc(room.short||room.n)}</b><span class="badge ${e.s==='done'?'done':'wait'}">${statusName(e.s)}</span></div><div class="flow"><div class="flowbox out"><span>🚪 체크아웃</span><b>${esc(outText)}</b></div><div class="arrow">›</div><div class="flowbox in"><span>🏠 체크인</span><b>${esc(inText)}</b></div></div><div class="prep ${prep.attention?'attn':''}">${esc(prep.text)}</div>${next?`<div class="nextclean">다음 청소 예상일 · ${dateShort(next)}</div>`:''}</div></div></article>`;
  }

  function roomHTML(room){
    const events=(room.e||[]).slice().sort((a,b)=>a.d.localeCompare(b.d));
    return `<section class="room" data-room-block="${esc(room.id)}"><div class="roomhead"><div class="roomico">🏠</div><div class="roomname"><b>${esc(room.n||room.short||'객실')}</b><small>${esc(room.b||'')}${room.b?' · ':''}${monthText(data.m)}</small></div><div class="roomcount">${events.length}건</div></div>${events.length?events.map(e=>eventHTML(room,e)).join(''):'<div class="empty"><div class="big">📭</div>이 달에 등록된 일정이 없어요.</div>'}</section>`;
  }

  function render(){
    $('#hostTitle').textContent=(data.h||'호스트')+' 님';
    $('#monthLabel').textContent=monthText(data.m)+' 객실 운영 현황';
    $('#scheduleTitle').textContent=monthText(data.m)+' 일정';
    $('#updatedLabel').textContent=data.g?`업데이트 기준 ${data.g}`:'공유된 일정 기준';
    const rooms=data.r||[],events=rooms.flatMap(r=>(r.e||[]).map(e=>({room:r,e})));
    const reservations=events.filter(x=>Number(x.e.i?.n)>0).length;
    const cleanDone=events.filter(x=>x.e.s==='done').length;
    const prep=events.filter(x=>prepInfo(x.room,x.e).attention).length;
    $('#reservationCount').textContent=reservations+'건';
    $('#cleanCount').textContent=cleanDone+'건';
    $('#prepCount').textContent=prep+'건';
    $('#roomTotal').textContent=rooms.length+'개 객실';

    const filters=[{id:'all',name:'전체'},...rooms.map(r=>({id:r.id,name:r.short||r.n}))];
    $('#filters').innerHTML=filters.map(f=>`<button class="filter ${activeRoom===f.id?'active':''}" data-room-filter="${esc(f.id)}">${esc(f.name)}</button>`).join('');
    $('#filterSection').style.display=rooms.length>1?'block':'none';
    const visible=activeRoom==='all'?rooms:rooms.filter(r=>r.id===activeRoom);
    $('#roomList').innerHTML=visible.length?visible.map(roomHTML).join(''):'<div class="room"><div class="empty"><div class="big">🏠</div>표시할 객실이 없어요.</div></div>';
  }

  async function share(){
    const title='ROOMMADE 객실 현황',text=`${data?.h||'호스트'} 님의 ${monthText(data?.m)} 객실 현황`;
    if(navigator.share){try{await navigator.share({title,text,url:location.href});return;}catch(e){if(e&&e.name==='AbortError')return;}}
    copyLink();
  }
  function copyLink(){
    const value=location.href;
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(value).then(()=>toast('링크를 복사했어요')).catch(()=>legacyCopy(value));}
    else legacyCopy(value);
  }
  function legacyCopy(value){
    const ta=document.createElement('textarea');ta.value=value;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,value.length);let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();if(ok)toast('링크를 복사했어요');else prompt('아래 링크를 복사하세요',value);
  }

  document.addEventListener('click',e=>{
    const f=e.target.closest('[data-room-filter]');if(f){activeRoom=f.dataset.roomFilter;render();window.scrollTo({top:0,behavior:'smooth'});}
  });
  $('#shareTop').addEventListener('click',share);$('#shareBottom').addEventListener('click',share);$('#goTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));

  try{
    data=decodePayload();
    $('#content').hidden=false;$('#bottomBar').hidden=false;render();
  }catch(err){
    $('#errorBox').style.display='block';$('#errorText').textContent=err.message||String(err);$('#shareTop').style.display='none';
  }
})();
</script>
</body>
</html>

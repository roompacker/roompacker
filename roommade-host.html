<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#2F6FAF" />
<title>🧹 청소 일정 · ROOMMADE</title>
<meta property="og:title" content="🧹 청소 일정 · ROOMMADE" />
<meta property="og:description" content="체크인·체크아웃과 청소 일정을 한눈에 확인하세요." />
<meta property="og:type" content="website" />
<style>
:root{
  --navy:#2F6FAF;--navy2:#4C89C2;--blue:#6CA4D9;--sky:#EAF3FB;
  --green:#2F6FAF;--red:#D95C5C;--amber:#E58E33;--purple:#7E8896;
  --ink:#243140;--sub:#65707E;--muted:#97A1AC;--line:#E3E0DA;--bg:#F8F5F0;
  --radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#F8F4EE 0%,#EEF3F8 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
body{display:flex;justify-content:center}
.app{width:100%;max-width:560px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:30px;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:30;background:rgba(248,245,240,.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:14px 17px 10px;border-bottom:1px solid rgba(227,224,218,.92)}
.brandrow{display:flex;align-items:center;gap:11px}
.logo{width:39px;height:39px;border-radius:14px;background:linear-gradient(145deg,var(--navy),var(--blue));color:white;display:flex;align-items:center;justify-content:center;font-size:18px}
.brand{flex:1;min-width:0}.brand strong{display:block;font-size:16px;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1.2px;margin-top:1px}
.iconbtn{width:39px;height:39px;border:1px solid rgba(227,224,218,.9);background:white;border-radius:13px;font-size:17px;color:var(--navy)}
.view{padding:15px 14px 4px}
.updated{text-align:center;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:12px}
.section{margin-top:14px}.sectitle{display:flex;align-items:center;justify-content:space-between;margin:0 4px 9px}.sectitle h2{margin:0;font-size:15px;letter-spacing:-.4px}
.card{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 20px rgba(35,64,92,.045)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:6px;background:white;border:1px solid var(--line);border-radius:19px;padding:10px 12px;margin-bottom:10px}
.monthnav button{border:0;background:#F1EEE8;width:36px;height:36px;border-radius:11px;color:var(--navy);font-weight:900;font-size:18px}
.monthnav .todaybtn{width:auto;padding:0 12px;font-size:12px;font-weight:800}
.monthnav .mnlabel{flex:1;text-align:center;min-width:0}
.monthnav b{font-size:15px}.monthnav small{display:block;text-align:center;color:var(--muted);font-size:9px;margin-top:1px}

/* ── 가로 타임라인 ── */
.tlwrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding:12px 0 14px;margin-left:-14px;margin-right:-14px;border-radius:0;border-left:0;border-right:0;width:calc(100% + 28px)}
.tlrow{display:flex;align-items:stretch;width:max-content;min-width:100%}
.tlname{position:sticky;left:0;z-index:20;flex:0 0 50px;width:50px;background:white;border-right:1px solid var(--line);box-shadow:2px 0 4px rgba(0,0,0,.05);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ink);padding:0 2px;text-align:center;line-height:1.2}
.tlname.head{color:var(--muted);font-size:10px}
.tldays{display:flex}
.tlday{flex:0 0 40px;width:40px;text-align:center;padding:3px 0 8px}
.tlday .wd{font-size:9px;color:var(--muted);font-weight:800}
.tlday.sun .wd{color:var(--red)}
.tlday .dn{display:inline-block;min-width:25px;height:25px;line-height:25px;border-radius:50%;font-size:12px;font-weight:800;margin-top:2px}
.tlday .dn.co{line-height:21px;border:2px solid var(--red);color:var(--red)}
.tlday .dn.today{background:var(--navy);color:white}
.tlday .dn.cotoday{background:var(--red);color:white;line-height:25px;border:0}
.tltrack{position:relative;height:32px;flex:0 0 auto}
.tlgrid{position:absolute;inset:0;display:flex;pointer-events:none}
.tlcell{flex:0 0 40px;width:40px;border-right:1px solid #F2EFE9}
.tlcell.sun{background:#FCF9F5}
.tlcell.now{background:#EAF3FB}
.bar{position:absolute;top:4px;height:24px;line-height:24px;border-radius:12px;color:white;font-size:10px;font-weight:800;padding:0 7px;overflow:hidden;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar.openL{border-top-left-radius:3px;border-bottom-left-radius:3px}
.bar.openR{border-top-right-radius:3px;border-bottom-right-radius:3px}
.tlhint{text-align:center;font-size:10px;color:var(--muted);font-weight:700;margin-top:6px}
.legend{display:flex;gap:12px;justify-content:center;margin-top:10px;font-size:10px;color:var(--sub);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.legend i.bar2{width:16px;height:8px;border-radius:4px;display:inline-block}
.legend i.circ{width:11px;height:11px;border-radius:50%;border:2px solid var(--red);display:inline-block}

.roomcard{margin-bottom:10px;overflow:hidden}
.roomhead{display:flex;align-items:center;gap:11px;padding:13px 14px;background:#FFF9F3;border-bottom:1px solid var(--line)}
.roomico{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,var(--sky),#FFF3E4);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--navy)}
.roomname{flex:1;min-width:0}.roomname b{display:block;font-size:13px}.roomname small{font-size:9px;color:var(--muted)}
.roombadge{border-radius:10px;padding:6px 10px;font-size:10px;font-weight:800}
.roombadge.in{background:var(--sky);color:var(--green)}.roombadge.empty{background:#F0F2F5;color:var(--purple)}
.empty{padding:26px 15px;text-align:center;color:var(--muted);font-size:12px}.empty .big{font-size:30px;margin-bottom:7px}
.flowstay{padding:12px 14px;border-bottom:1px solid var(--line)}.flowstay:last-child{border-bottom:0}
.flowline{font-size:13px;margin-bottom:4px;color:var(--ink)}.flowline b{font-weight:800}.flowline.in{color:var(--green)}.flowline.out{color:var(--amber)}
.ftime{background:#F0EEE9;border-radius:7px;padding:1px 6px;font-size:11px;font-weight:700;color:var(--sub)}
.flowsupplies{margin-top:6px;background:#FFF3E4;border-radius:10px;padding:8px 11px;font-size:12px;font-weight:700;color:#B5701A;line-height:1.5}
.flownote{margin-top:5px;background:#FDEEF0;border-radius:10px;padding:7px 11px;font-size:11px;color:#C0556B;font-weight:700;line-height:1.5}
.flowempty{padding:9px 14px;font-size:11px;color:var(--purple);background:#FAFAFA;border-bottom:1px solid var(--line);font-weight:700}
.loadbox{padding:60px 20px;text-align:center;color:var(--muted)}.loadbox .big{font-size:36px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:200;background:linear-gradient(145deg,var(--navy),var(--navy2));color:white;padding:11px 16px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brandrow">
      <div class="logo">🧹</div>
      <div class="brand"><strong id="hdTitle">ROOMMADE 청소 일정</strong><small>호스트 전용 보기</small></div>
      <button class="iconbtn" id="btnRefresh">↻</button>
    </div>
  </div>

  <div class="view">
    <div class="updated" id="updatedAt"></div>

    <div id="loadingBox" class="loadbox">
      <div class="big">☁️</div>
      <div>데이터를 불러오는 중...</div>
    </div>

    <div id="content" style="display:none">
      <div class="section">
        <div class="sectitle"><h2>📅 이번 달 일정</h2></div>
        <div class="monthnav">
          <button id="prevMonth">‹</button>
          <div class="mnlabel"><b id="monthLabel"></b><small>막대 = 숙박 · 빨간 동그라미 = 청소일</small></div>
          <button id="todayBtn" class="todaybtn">오늘</button>
          <button id="nextMonth">›</button>
        </div>
        <div class="card tlwrap" id="tlWrap"></div>
        <div class="tlhint">← 좌우로 밀어서 다른 날짜를 보세요 →</div>
        <div class="legend" id="calLegend"></div>
      </div>

      <div class="section">
        <div class="sectitle"><h2>🏠 내 객실 현황</h2></div>
        <div id="roomList"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var DB_URL = 'https://roompacker-48249-default-rtdb.asia-southeast1.firebasedatabase.app';
  var DATA = null;
  var BIN_ID = null;
  var allowedRoomIds = null;           // 링크로 지정된 객실만 (null이면 전체)
  var calYear = new Date().getFullYear();
  var calMonth = new Date().getMonth();
  var DAY_W = 40;                      // 타임라인 하루 칸 너비(px)
  var PALETTE = ['#5B8DEF','#7C6FD9','#2FA98C','#E58E33','#C05C8A','#4BA3C7'];
  var WD = ['일','월','화','수','목','금','토'];

  function $(id){ return document.getElementById(id); }

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.className = 'toast show';
    setTimeout(function(){ t.className = 'toast'; }, 1800);
  }

  // URL 파라미터 읽기
  function getParam(name){
    var q = location.search.replace(/^\?/, '');
    var parts = q.split('&');
    for (var i=0;i<parts.length;i++){
      var kv = parts[i].split('=');
      if (decodeURIComponent(kv[0]) === name) return decodeURIComponent(kv[1]||'');
    }
    return null;
  }

  // 객실 이름에서 호수만 뽑기 (예: "한라웨스턴파크A 3709호" → "3709호")
  function shortName(n){
    var s = String(n||'');
    var m = s.match(/(\d{3,4})\s*호/);
    if (m) return m[1] + '호';
    return s.length > 6 ? s.slice(-6) : (s || '객실');
  }

  function loadData(){
    var binId = getParam('id');
    BIN_ID = binId;
    var roomsParam = getParam('rooms');
    if (roomsParam){
      allowedRoomIds = roomsParam.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    }
    if (!binId){
      $('loadingBox').innerHTML = '<div class="big">⚠️</div><div>잘못된 링크예요.<br>사장님께 링크를 다시 받아주세요.</div>';
      return;
    }
    $('loadingBox').style.display = 'block';
    $('content').style.display = 'none';

    fetch(DB_URL + '/shares/' + binId + '.json')
    .then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(json){
      DATA = json || {};
      if (!DATA.rooms) DATA.rooms = [];
      if (!DATA.transactions) DATA.transactions = [];
      render();
    })
    .catch(function(e){
      console.error(e);
      $('loadingBox').innerHTML = '<div class="big">❌</div><div>불러오기 실패<br><small>' + esc(e.message) + '</small></div>';
    });
  }

  function myRooms(){
    var rooms = DATA.rooms || [];
    if (!allowedRoomIds) return rooms;
    return rooms.filter(function(r){ return allowedRoomIds.indexOf(String(r.id)) >= 0; });
  }

  // 거래(TX)에서 체류 정보 뽑기
  function staysForRoom(roomId){
    var txs = DATA.transactions || [];
    var stays = [];
    var seen = {};
    var noteByCleanDate = {};
    txs.forEach(function(tx){
      if (String(tx.targetId) !== String(roomId)) return;
      if (tx.type && tx.type !== 'income' && tx.type !== '수입') return;
      if (tx.status === 'cancelled') return;
      if (!tx.date) return;
      if (tx.memo) noteByCleanDate[dateStr(new Date(tx.date))] = tx.memo;
      var inN = parseInt(tx.inNights, 10);
      if (inN > 0){
        var ci = new Date(tx.date);
        var co = new Date(tx.date); co.setDate(co.getDate() + inN);
        // 한 객실의 같은 퇴실일 = 같은 손님 → 퇴실일로 중복 판단
        seen[dateStr(co)] = 1;
        stays.push({
          checkIn: dateStr(ci), checkOut: dateStr(co), nights: inN,
          guests: tx.inGuests || '',
          inTime: tx.inTime || tx.checkinTime || '',
          supplies: tx.inSupplies || '', note: ''
        });
      }
    });
    txs.forEach(function(tx){
      if (String(tx.targetId) !== String(roomId)) return;
      if (tx.type && tx.type !== 'income' && tx.type !== '수입') return;
      if (tx.status === 'cancelled') return;
      if (!tx.date) return;
      var outN = parseInt(tx.outNights != null && tx.outNights !== '' ? tx.outNights : tx.nights, 10);
      if (outN > 0){
        var ci = new Date(tx.date); ci.setDate(ci.getDate() - outN);
        if (seen[dateStr(new Date(tx.date))]) return;  // 이미 입실 기준으로 잡힌 손님
        seen[dateStr(new Date(tx.date))] = 1;
        stays.push({
          checkIn: dateStr(ci), checkOut: dateStr(new Date(tx.date)), nights: outN,
          guests: (tx.outGuests != null && tx.outGuests !== '') ? tx.outGuests : (tx.guests || ''),
          inTime: '', supplies: '', note: ''
        });
      }
    });
    stays.forEach(function(s){
      if (noteByCleanDate[s.checkOut]) s.note = noteByCleanDate[s.checkOut];
    });
    stays.sort(function(a,b){ return (a.checkIn||'').localeCompare(b.checkIn||''); });

    // 겹치는 체류 정리: 앞 손님 퇴실 전에 시작하는 기록은 걸러냄
    var clean = [];
    stays.forEach(function(s){
      if (!s.checkIn || !s.checkOut) return;
      if (s.checkOut <= s.checkIn) return;              // 날짜가 거꾸로인 잘못된 기록
      var prev = clean[clean.length-1];
      if (prev && s.checkIn < prev.checkOut) return;    // 앞 손님과 겹치면 제외
      clean.push(s);
    });
    return clean;
  }

  // 이번 달 체류 + 공실 흐름
  function buildTimeline(stays){
    var monthStart = new Date(calYear, calMonth, 1);
    var monthEnd = new Date(calYear, calMonth+1, 0);
    monthEnd.setHours(23,59,59,999);
    var inMonth = stays.filter(function(s){
      var ci = new Date(s.checkIn), co = new Date(s.checkOut);
      return co >= monthStart && ci <= monthEnd;
    });
    var items = [];
    for (var i=0;i<inMonth.length;i++){
      var s = inMonth[i];
      items.push({ kind:'stay', stay:s });
      var next = inMonth[i+1];
      if (next){
        var thisOut = new Date(s.checkOut);
        var nextIn = new Date(next.checkIn);
        var gap = Math.round((nextIn - thisOut) / 86400000);
        if (gap >= 1){
          var emptyTo = new Date(nextIn); emptyTo.setDate(emptyTo.getDate() - 1);
          items.push({ kind:'empty', from: dateStr(thisOut), to: dateStr(emptyTo), days: gap });
        }
      }
    }
    return items;
  }

  function renderRooms(){
    var list = $('roomList');
    list.innerHTML = '';
    var rooms = myRooms();
    if (rooms.length === 0){
      list.innerHTML = '<div class="card empty"><div class="big">🏠</div>표시할 객실이 없어요</div>';
      return;
    }
    var today = new Date(); today.setHours(0,0,0,0);

    rooms.forEach(function(r, ri){
      var name = r.name || '객실';
      var stays = staysForRoom(r.id);
      var color = PALETTE[ri % PALETTE.length];
      var occupied = stays.some(function(s){
        var ci = new Date(s.checkIn); ci.setHours(0,0,0,0);
        var co = new Date(s.checkOut); co.setHours(0,0,0,0);
        return ci <= today && co > today;
      });

      var card = document.createElement('div');
      card.className = 'card roomcard';
      var html = '<div class="roomhead">' +
        '<div class="roomico" style="background:'+color+';color:white">🛏️</div>' +
        '<div class="roomname"><b>' + esc(name) + '</b><small>' + esc(r.branch||'') + ' · ' + (calMonth+1) + '월 일정</small></div>' +
        '<div class="roombadge ' + (occupied?'in':'empty') + '">' + (occupied?'사용중':'공실') + '</div>' +
        '</div>';

      var items = buildTimeline(stays);
      if (items.length === 0){
        html += '<div class="empty" style="padding:18px">이 달 일정 없음</div>';
      } else {
        items.forEach(function(it){
          if (it.kind === 'empty'){
            html += '<div class="flowempty">⚪ ' + fmtMD(it.from) + ' ~ ' + fmtMD(it.to) + ' 공실 (' + it.days + '일)</div>';
          } else {
            var s = it.stay;
            var guestTxt = s.guests ? ' · ' + esc(s.guests) + '명' : '';
            var nightTxt = s.nights ? ' · ' + s.nights + '박' : '';
            html += '<div class="flowstay">' +
              '<div class="flowline in">🟦 입실 <b>' + fmtMD(s.checkIn) + '</b>' + (s.inTime ? ' <span class="ftime">'+esc(s.inTime)+'</span>' : '') + nightTxt + guestTxt + '</div>';
            if (s.supplies) html += '<div class="flowsupplies">🛒 셋팅준비: ' + esc(s.supplies) + '</div>';
            html += '<div class="flowline out">🟧 퇴실 <b>' + fmtMD(s.checkOut) + '</b></div>';
            if (s.note) html += '<div class="flownote">💰 추가/메모: ' + esc(s.note) + '</div>';
            html += '</div>';
          }
        });
      }
      card.innerHTML = html;
      list.appendChild(card);
    });
  }

  // ── 가로 타임라인 그리기 ──
  function renderCalendar(){
    $('monthLabel').textContent = calYear + '년 ' + (calMonth+1) + '월';
    var wrap = $('tlWrap');
    wrap.innerHTML = '';

    var lastDate = new Date(calYear, calMonth+1, 0).getDate();
    var monthStart = new Date(calYear, calMonth, 1); monthStart.setHours(0,0,0,0);
    var monthEnd = new Date(calYear, calMonth, lastDate); monthEnd.setHours(0,0,0,0);
    var today = new Date(); today.setHours(0,0,0,0);
    var isThisMonth = (today.getFullYear()===calYear && today.getMonth()===calMonth);
    var trackW = lastDate * DAY_W;

    var rooms = myRooms();
    if (rooms.length === 0){
      wrap.innerHTML = '<div class="empty">표시할 객실이 없어요</div>';
      $('calLegend').innerHTML = '';
      return;
    }

    // 방별 체류 계산
    var roomStays = rooms.map(function(r){
      return staysForRoom(r.id).map(function(s){
        var ci = new Date(s.checkIn); ci.setHours(0,0,0,0);
        var co = new Date(s.checkOut); co.setHours(0,0,0,0);
        return { ci: ci, co: co, nights: s.nights };
      });
    });

    // 체크아웃(청소) 날짜 모으기
    var outs = {};
    roomStays.forEach(function(stays){
      stays.forEach(function(s){
        if (s.co.getFullYear()===calYear && s.co.getMonth()===calMonth) outs[s.co.getDate()] = 1;
      });
    });

    // 1) 날짜 머리줄
    var head = document.createElement('div');
    head.className = 'tlrow';
    var headHtml = '<div class="tlname head">' + (calMonth+1) + '월</div><div class="tldays" style="width:'+trackW+'px">';
    for (var d=1; d<=lastDate; d++){
      var wd = new Date(calYear, calMonth, d).getDay();
      var isToday = isThisMonth && today.getDate()===d;
      var cls = 'dn';
      if (outs[d] && isToday) cls += ' cotoday';
      else if (outs[d]) cls += ' co';
      else if (isToday) cls += ' today';
      headHtml += '<div class="tlday' + (wd===0?' sun':'') + '">' +
        '<div class="wd">' + WD[wd] + '</div>' +
        '<div class="' + cls + '">' + d + '</div></div>';
    }
    headHtml += '</div>';
    head.innerHTML = headHtml;
    wrap.appendChild(head);

    // 2) 방마다 한 줄씩 막대
    rooms.forEach(function(r, ri){
      var color = PALETTE[ri % PALETTE.length];
      var row = document.createElement('div');
      row.className = 'tlrow';

      // 배경 격자
      var gridHtml = '<div class="tlgrid">';
      for (var g=1; g<=lastDate; g++){
        var gwd = new Date(calYear, calMonth, g).getDay();
        var gcls = 'tlcell';
        if (gwd===0) gcls += ' sun';
        if (isThisMonth && today.getDate()===g) gcls += ' now';
        gridHtml += '<div class="'+gcls+'"></div>';
      }
      gridHtml += '</div>';

      // 막대
      var barsHtml = '';
      roomStays[ri].forEach(function(s){
        if (s.co < monthStart || s.ci > monthEnd) return;   // 이번 달과 안 겹치면 건너뜀
        var ciIn = (s.ci >= monthStart && s.ci <= monthEnd);
        var coIn = (s.co >= monthStart && s.co <= monthEnd);
        // 왼쪽 위치: 입실일이면 칸 중간부터 시작, 아니면 달 시작(0)
        var left = ciIn ? ((s.ci.getDate()-1) * DAY_W + DAY_W*0.5) : 0;
        // 오른쪽 위치: 퇴실일이면 칸 중간에서 끝, 아니면 달 끝
        var right = coIn ? ((s.co.getDate()-1) * DAY_W + DAY_W*0.5) : trackW;
        var w = right - left;
        if (w < 14) w = 14;
        var cls = 'bar' + (ciIn?'':' openL') + (coIn?'':' openR');
        var label = (w >= 30 && s.nights) ? (s.nights + '박') : '';
        barsHtml += '<div class="'+cls+'" style="left:'+left+'px;width:'+w+'px;background:'+color+'">'+esc(label)+'</div>';
      });

      row.innerHTML = '<div class="tlname">' + esc(shortName(r.name)) + '</div>' +
        '<div class="tltrack" style="width:'+trackW+'px">' + gridHtml + barsHtml + '</div>';
      wrap.appendChild(row);
    });

    // 3) 범례
    var legendHtml = '';
    rooms.forEach(function(r, ri){
      legendHtml += '<span><i class="bar2" style="background:'+PALETTE[ri % PALETTE.length]+'"></i>' + esc(shortName(r.name)) + '</span>';
    });
    legendHtml += '<span><i class="circ"></i>체크아웃(청소일)</span>';
    $('calLegend').innerHTML = legendHtml;

    // 4) 오늘 위치로 스크롤 (오늘이 있는 달일 때)
    if (isThisMonth){
      var target = (today.getDate()-1) * DAY_W - 60;
      wrap.scrollLeft = target > 0 ? target : 0;
    } else {
      wrap.scrollLeft = 0;
    }
  }

  function render(){
    $('loadingBox').style.display = 'none';
    $('content').style.display = 'block';

    // 상단 제목에 객실 호수 표시 (한 객실만 보는 링크일 때)
    try {
      var rs = myRooms();
      if (rs.length === 1) {
        $('hdTitle').textContent = shortName(rs[0].name) + ' 청소 일정';
        document.title = shortName(rs[0].name) + ' 청소 일정 · ROOMMADE';
      } else if (rs.length > 1) {
        $('hdTitle').textContent = rs.map(function(r){ return shortName(r.name).replace('호',''); }).join(' · ') + ' 청소 일정';
      }
    } catch(e){}

    if (DATA.updatedAt){
      var d = new Date(DATA.updatedAt);
      var now = new Date();
      var mins = Math.floor((now - d)/60000);
      var timeStr = '🕐 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' +
        pad(d.getHours())+':'+pad(d.getMinutes()) + ' 기준';
      if (mins >= 0 && mins < 360){
        var ago = mins < 1 ? '방금' : (mins < 60 ? mins+'분 전' : Math.floor(mins/60)+'시간 전');
        $('updatedAt').innerHTML = '<span style="color:#D95C5C;">🔴 '+ago+' 업데이트됨</span> · '+timeStr;
      } else {
        $('updatedAt').textContent = timeStr;
      }
      try {
        var seenKey = 'roommade-host-lastseen-' + BIN_ID;
        window._prevSeen = localStorage.getItem(seenKey) || '';
        localStorage.setItem(seenKey, DATA.updatedAt);
      } catch(e){ window._prevSeen = ''; }
      try {
        if (window._prevSeen && DATA.updatedAt && DATA.updatedAt > window._prevSeen) {
          var banner = document.createElement('div');
          banner.style.cssText = 'background:#FFF3E4;color:#B8860B;border:1px solid #F0D890;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:12px;font-weight:700;text-align:center;';
          banner.textContent = '🆕 지난번 확인 이후 새로 업데이트되었어요!';
          var content = document.getElementById('content');
          if (content && content.firstChild) content.insertBefore(banner, content.firstChild);
          else if (content) content.appendChild(banner);
        }
      } catch(e){}
    }
    renderCalendar();
    renderRooms();
  }

  // 유틸
  function pad(n){ return String(n).padStart(2,'0'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function dateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fmtMD(s){ if(!s) return '-'; var d=new Date(s); if(isNaN(d.getTime())) return esc(s); return (d.getMonth()+1)+'/'+d.getDate(); }

  $('btnRefresh').addEventListener('click', function(){ toast('새로고침'); loadData(); });
  $('prevMonth').addEventListener('click', function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); renderRooms(); });
  $('nextMonth').addEventListener('click', function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); renderRooms(); });
  $('todayBtn').addEventListener('click', function(){
    var n = new Date();
    calYear = n.getFullYear(); calMonth = n.getMonth();
    renderCalendar(); renderRooms();
    toast('이번 달로 이동');
  });

  loadData();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#2F6FAF" />
<title>ROOMMADE 현황판 (호스트용)</title>
<style>
:root{
  --cream:#F6F0E8;--navy:#2F6FAF;--navy2:#4C89C2;--blue:#6CA4D9;--sky:#EAF3FB;
  --green:#2F6FAF;--red:#D95C5C;--amber:#E58E33;--purple:#7E8896;
  --ink:#243140;--sub:#65707E;--muted:#97A1AC;--line:#E3E0DA;--bg:#F8F5F0;--card:#FFFFFF;
  --radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#F8F4EE 0%,#EEF3F8 100%);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
body{display:flex;justify-content:center}
.app{width:100%;max-width:560px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:30px;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:30;background:rgba(248,245,240,.95);backdrop-filter:blur(16px);padding:14px 17px 10px;border-bottom:1px solid rgba(227,224,218,.92)}
.brandrow{display:flex;align-items:center;gap:11px}
.logo{width:39px;height:39px;border-radius:14px;background:linear-gradient(145deg,var(--navy),var(--blue));color:white;display:grid;place-items:center;font-size:18px;box-shadow:0 7px 16px rgba(18,59,102,.22)}
.brand{flex:1}.brand strong{display:block;font-size:16px;letter-spacing:-.4px}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1.2px;margin-top:1px}
.iconbtn{width:39px;height:39px;border:1px solid rgba(227,224,218,.9);background:white;border-radius:13px;font-size:17px;color:var(--navy)}
.branchbar{display:flex;gap:5px;margin-top:12px;padding:4px;background:#EEE9E0;border-radius:14px}
.branchbtn{flex:1;border:0;background:transparent;border-radius:11px;padding:8px 5px;color:var(--sub);font-size:12px;font-weight:800}.branchbtn.active{background:white;color:var(--navy);box-shadow:0 6px 12px rgba(90,107,126,.08)}
.view{padding:15px 14px 4px}
.updated{text-align:center;font-size:10px;color:var(--muted);font-weight:700;margin-bottom:12px}
.section{margin-top:14px}.sectitle{display:flex;align-items:center;justify-content:space-between;margin:0 4px 9px}.sectitle h2{margin:0;font-size:15px;letter-spacing:-.4px}
.card{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 20px rgba(35,64,92,.045)}
.monthnav{display:flex;align-items:center;justify-content:space-between;background:white;border:1px solid var(--line);border-radius:19px;padding:10px 12px;margin-bottom:10px}.monthnav button{border:0;background:#F1EEE8;width:34px;height:34px;border-radius:11px;color:var(--navy);font-weight:900}.monthnav b{font-size:15px}.monthnav small{display:block;text-align:center;color:var(--muted);font-size:9px;margin-top:1px}
.roomcard{margin-bottom:10px;overflow:hidden}
.roomhead{display:flex;align-items:center;gap:11px;padding:13px 14px;background:#FFF9F3;border-bottom:1px solid var(--line)}
.roomico{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,var(--sky),#FFF3E4);display:grid;place-items:center;font-size:17px;color:var(--navy)}
.roomname{flex:1}.roomname b{display:block;font-size:13px}.roomname small{font-size:9px;color:var(--muted)}
.roombadge{border-radius:10px;padding:6px 10px;font-size:10px;font-weight:800}
.roombadge.in{background:var(--sky);color:var(--green)}.roombadge.empty{background:#F0F2F5;color:var(--purple)}
.stayrow{display:flex;gap:11px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}.stayrow:last-child{border-bottom:0}
.staydate{width:88px}.staydate b{font-size:11px;display:block}.staydate small{font-size:9px;color:var(--muted)}
.stayinfo{flex:1;min-width:0}.stayinfo b{font-size:12px;display:block}.stayinfo small{font-size:9px;color:var(--muted)}
.staytag{border-radius:9px;padding:5px 8px;font-size:9px;font-weight:800}.staytag.in{background:var(--sky);color:var(--green)}.staytag.out{background:#FFF3E4;color:var(--amber)}
.empty{padding:30px 15px;text-align:center;color:var(--muted);font-size:12px}.empty .big{font-size:30px;margin-bottom:7px}
.loadbox{padding:60px 20px;text-align:center;color:var(--muted)}.loadbox .big{font-size:36px;margin-bottom:12px}
.calendar{padding:12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;font-size:10px;color:var(--muted);font-weight:800;padding:5px 0}.days{gap:4px}.day{min-height:50px;border:0;background:#FBF8F3;border-radius:13px;padding:5px 2px;position:relative;color:var(--ink)}.day.other{opacity:.28}.day.today{outline:2px solid #B7CFE7}.daynum{font-size:11px;font-weight:800}.dotwrap{display:flex;justify-content:center;gap:2px;margin-top:4px;flex-wrap:wrap}.dot{width:5px;height:5px;border-radius:50%;background:var(--green)}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:9px;color:var(--sub)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:200;background:linear-gradient(145deg,var(--navy),var(--navy2));color:white;padding:11px 16px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .2s}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brandrow">
      <div class="logo">🏠</div>
      <div class="brand"><strong>ROOMMADE 현황판</strong><small>HOST VIEW · 호스트 전용</small></div>
      <button class="iconbtn" id="btnRefresh">↻</button>
    </div>
    <div class="branchbar" id="branchBar"></div>
  </div>

  <div class="view">
    <div class="updated" id="updatedAt"></div>

    <div id="loadingBox" class="loadbox">
      <div class="big">☁️</div>
      <div>데이터를 불러오는 중...</div>
    </div>

    <div id="content" style="display:none">
      <!-- 월별 캘린더 -->
      <div class="section">
        <div class="sectitle"><h2>📅 이번 달 일정</h2></div>
        <div class="monthnav">
          <button id="prevMonth">‹</button>
          <div><b id="monthLabel"></b><small>체크인/아웃 일정</small></div>
          <button id="nextMonth">›</button>
        </div>
        <div class="card calendar">
          <div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
          <div class="days" id="calDays"></div>
        </div>
        <div class="legend">
          <span><i style="background:var(--green)"></i>체크인</span>
          <span><i style="background:var(--amber)"></i>체크아웃</span>
        </div>
      </div>

      <!-- 객실별 현황 -->
      <div class="section">
        <div class="sectitle"><h2>🏠 객실별 현황</h2></div>
        <div id="roomList"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var MASTER_KEY = '$2a$10$0j0SQzPJDyCB6qaxU/6tj.Sdun6GDxdyiiJXaP84FcBNxRsOSxAa6';
  var DATA = null;
  var branch = '전체';
  var calYear = new Date().getFullYear();
  var calMonth = new Date().getMonth();

  function $(id){ return document.getElementById(id); }

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }

  // URL에서 빈 ID 가져오기
  function getBinId(){
    try {
      var p = new URLSearchParams(location.search);
      return p.get('id');
    } catch(e){ return null; }
  }

  // 클라우드에서 데이터 불러오기
  function loadData(){
    var binId = getBinId();
    if (!binId){
      $('loadingBox').innerHTML = '<div class="big">⚠️</div><div>잘못된 링크예요.<br>사장님께 링크를 다시 받아주세요.</div>';
      return;
    }
    $('loadingBox').style.display = 'block';
    $('content').style.display = 'none';

    fetch('https://api.jsonbin.io/v3/b/' + binId + '/latest', {
      headers: { 'X-Master-Key': MASTER_KEY }
    })
    .then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(json){
      DATA = json.record || json;
      render();
    })
    .catch(function(e){
      console.error(e);
      $('loadingBox').innerHTML = '<div class="big">❌</div><div>불러오기 실패<br><small>' + e.message + '</small></div>';
    });
  }

  // 지점 필터된 객실
  function filteredRooms(){
    var rooms = DATA.rooms || [];
    if (branch === '전체') return rooms;
    return rooms.filter(function(r){ return (r.branch || r.지점 || '') === branch; });
  }

  // 객실에 연결된 거래(체크인/아웃) 가져오기
  function staysForRoom(roomId, roomName){
    var txs = DATA.transactions || [];
    var result = [];
    txs.forEach(function(tx){
      var rid = tx.roomId || tx.객실id;
      var rname = tx.room || tx.객실 || tx.roomName;
      var match = (rid && roomId && rid === roomId) || (rname && roomName && rname === roomName);
      if (!match) return;
      var ci = tx.checkIn || tx.체크인 || tx.checkin;
      var co = tx.checkOut || tx.체크아웃 || tx.checkout;
      if (ci || co){
        result.push({ checkIn: ci, checkOut: co, note: tx.memo || tx.메모 || tx.note || '' });
      }
    });
    return result;
  }

  // 지점 바 그리기
  function renderBranchBar(){
    var rooms = DATA.rooms || [];
    var set = {};
    rooms.forEach(function(r){ var b = r.branch || r.지점; if(b) set[b]=1; });
    var branches = ['전체'].concat(Object.keys(set));
    var bar = $('branchBar');
    bar.innerHTML = '';
    branches.forEach(function(b){
      var btn = document.createElement('button');
      btn.className = 'branchbtn' + (b===branch?' active':'');
      btn.textContent = b;
      btn.addEventListener('click', function(){ branch = b; render(); });
      bar.appendChild(btn);
    });
  }

  // 객실 목록 그리기
  function renderRooms(){
    var list = $('roomList');
    list.innerHTML = '';
    var rooms = filteredRooms();
    if (rooms.length === 0){
      list.innerHTML = '<div class="card empty"><div class="big">🏠</div>등록된 객실이 없어요</div>';
      return;
    }
    var today = new Date(); today.setHours(0,0,0,0);
    rooms.forEach(function(r){
      var name = r.name || r.이름 || r.객실명 || '객실';
      var rid = r.id || r.객실id;
      var stays = staysForRoom(rid, name).sort(function(a,b){
        return (a.checkIn||'').localeCompare(b.checkIn||'');
      });

      // 현재 체크인 상태 판단
      var occupied = stays.some(function(s){
        if (!s.checkIn) return false;
        var ci = new Date(s.checkIn); ci.setHours(0,0,0,0);
        var co = s.checkOut ? new Date(s.checkOut) : null; if(co) co.setHours(0,0,0,0);
        return ci <= today && (!co || co > today);
      });

      var card = document.createElement('div');
      card.className = 'card roomcard';
      var html = '<div class="roomhead">' +
        '<div class="roomico">🛏️</div>' +
        '<div class="roomname"><b>' + esc(name) + '</b><small>' + esc(r.branch||r.지점||'') + '</small></div>' +
        '<div class="roombadge ' + (occupied?'in':'empty') + '">' + (occupied?'사용중':'공실') + '</div>' +
        '</div>';

      // 다가오는 일정만 (오늘 이후 또는 진행중)
      var upcoming = stays.filter(function(s){
        var ref = s.checkOut || s.checkIn;
        if (!ref) return false;
        var d = new Date(ref); d.setHours(0,0,0,0);
        return d >= today;
      }).slice(0, 5);

      if (upcoming.length === 0){
        html += '<div class="empty" style="padding:18px">예정된 일정 없음</div>';
      } else {
        upcoming.forEach(function(s){
          html += '<div class="stayrow">' +
            '<div class="staydate"><b>' + fmtDate(s.checkIn) + '</b><small>~ ' + fmtDate(s.checkOut) + '</small></div>' +
            '<div class="stayinfo"><b>' + nights(s.checkIn,s.checkOut) + '</b>' +
            (s.note ? '<small>' + esc(s.note) + '</small>' : '') + '</div>' +
            '<div class="staytag in">예약</div>' +
            '</div>';
        });
      }
      card.innerHTML = html;
      list.appendChild(card);
    });
  }

  // 캘린더 그리기
  function renderCalendar(){
    $('monthLabel').textContent = calYear + '년 ' + (calMonth+1) + '월';
    var days = $('calDays');
    days.innerHTML = '';
    var first = new Date(calYear, calMonth, 1);
    var startDay = first.getDay();
    var lastDate = new Date(calYear, calMonth+1, 0).getDate();
    var prevLast = new Date(calYear, calMonth, 0).getDate();
    var today = new Date();

    // 이번 달 체크인/아웃 모으기
    var ins = {}, outs = {};
    var rooms = filteredRooms();
    var roomIds = {}; rooms.forEach(function(r){ roomIds[r.id||r.객실id] = 1; roomIds[r.name||r.이름] = 1; });
    (DATA.transactions||[]).forEach(function(tx){
      var rid = tx.roomId || tx.객실id;
      var rname = tx.room || tx.객실 || tx.roomName;
      if (branch !== '전체' && !roomIds[rid] && !roomIds[rname]) return;
      var ci = tx.checkIn || tx.체크인 || tx.checkin;
      var co = tx.checkOut || tx.체크아웃 || tx.checkout;
      if (ci){ var d1=new Date(ci); if(d1.getFullYear()===calYear&&d1.getMonth()===calMonth){ ins[d1.getDate()]=(ins[d1.getDate()]||0)+1; } }
      if (co){ var d2=new Date(co); if(d2.getFullYear()===calYear&&d2.getMonth()===calMonth){ outs[d2.getDate()]=(outs[d2.getDate()]||0)+1; } }
    });

    for (var i=0;i<startDay;i++){
      var d=document.createElement('div'); d.className='day other';
      d.innerHTML='<div class="daynum">'+(prevLast-startDay+i+1)+'</div>'; days.appendChild(d);
    }
    for (var day=1;day<=lastDate;day++){
      var cell=document.createElement('div'); cell.className='day';
      if (today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===day) cell.className+=' today';
      var dots='';
      if (ins[day]) dots+='<span class="dot" style="background:var(--green)"></span>';
      if (outs[day]) dots+='<span class="dot" style="background:var(--amber)"></span>';
      cell.innerHTML='<div class="daynum">'+day+'</div><div class="dotwrap">'+dots+'</div>';
      days.appendChild(cell);
    }
  }

  function render(){
    $('loadingBox').style.display = 'none';
    $('content').style.display = 'block';
    if (DATA.updatedAt){
      var d = new Date(DATA.updatedAt);
      $('updatedAt').textContent = '🕐 ' + d.getMonth()+1 + '월 ' + d.getDate() + '일 ' +
        String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0') + ' 기준';
    }
    renderBranchBar();
    renderCalendar();
    renderRooms();
  }

  // 유틸
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function fmtDate(s){ if(!s) return '-'; var d=new Date(s); if(isNaN(d)) return esc(s); return (d.getMonth()+1)+'/'+d.getDate(); }
  function nights(ci,co){ if(!ci||!co) return '체크인 예정'; var a=new Date(ci),b=new Date(co); var n=Math.round((b-a)/86400000); return n>0?n+'박':'당일'; }

  // 이벤트
  $('btnRefresh').addEventListener('click', function(){ toast('새로고침'); loadData(); });
  $('prevMonth').addEventListener('click', function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); });
  $('nextMonth').addEventListener('click', function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); });

  loadData();
})();
</script>
</body>
</html>

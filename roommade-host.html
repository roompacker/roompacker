<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<meta name="theme-color" content="#2F6FAF" />
<title>ROOMMADE 현황판 (호스트용)</title>
<style>
:root{
  --navy:#2F6FAF;--navy2:#4C89C2;--blue:#6CA4D9;--sky:#EAF3FB;
  --green:#2F6FAF;--red:#D95C5C;--amber:#E58E33;--purple:#7E8896;
  --ink:#243140;--sub:#65707E;--muted:#97A1AC;--line:#E3E0DA;--bg:#F8F5F0;
  --radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#F8F4EE 0%,#EEF3F8 100%);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
body{display:flex;justify-content:center}
.app{width:100%;max-width:560px;min-height:100vh;background:var(--bg);position:relative;padding-bottom:30px;overflow-x:hidden}
.topbar{position:sticky;top:0;z-index:30;background:rgba(248,245,240,.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:14px 17px 10px;border-bottom:1px solid rgba(227,224,218,.92)}
.brandrow{display:flex;align-items:center;gap:11px}
.logo{width:39px;height:39px;border-radius:14px;background:linear-gradient(145deg,var(--navy),var(--blue));color:white;display:flex;align-items:center;justify-content:center;font-size:18px}
.brand{flex:1}.brand strong{display:block;font-size:16px;letter-spacing:-.4px}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:700;letter-spacing:1.2px;margin-top:1px}
.iconbtn{width:39px;height:39px;border:1px solid rgba(227,224,218,.9);background:white;border-radius:13px;font-size:17px;color:var(--navy)}
.view{padding:15px 14px 4px}
.updated{text-align:center;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:12px}
.section{margin-top:14px}.sectitle{display:flex;align-items:center;justify-content:space-between;margin:0 4px 9px}.sectitle h2{margin:0;font-size:15px;letter-spacing:-.4px}
.card{background:white;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 6px 20px rgba(35,64,92,.045)}
.monthnav{display:flex;align-items:center;justify-content:space-between;background:white;border:1px solid var(--line);border-radius:19px;padding:10px 12px;margin-bottom:10px}.monthnav button{border:0;background:#F1EEE8;width:36px;height:36px;border-radius:11px;color:var(--navy);font-weight:900;font-size:18px}.monthnav b{font-size:15px}.monthnav small{display:block;text-align:center;color:var(--muted);font-size:9px;margin-top:1px}
.roomcard{margin-bottom:10px;overflow:hidden}
.roomhead{display:flex;align-items:center;gap:11px;padding:13px 14px;background:#FFF9F3;border-bottom:1px solid var(--line)}
.roomico{width:38px;height:38px;border-radius:13px;background:linear-gradient(145deg,var(--sky),#FFF3E4);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--navy)}
.roomname{flex:1}.roomname b{display:block;font-size:13px}.roomname small{font-size:9px;color:var(--muted)}
.roombadge{border-radius:10px;padding:6px 10px;font-size:10px;font-weight:800}
.roombadge.in{background:var(--sky);color:var(--green)}.roombadge.empty{background:#F0F2F5;color:var(--purple)}
.stayrow{display:flex;gap:11px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}.stayrow:last-child{border-bottom:0}
.staydate{width:96px}.staydate b{font-size:12px;display:block;color:var(--green)}.staydate small{font-size:10px;color:var(--amber)}
.stayinfo{flex:1;min-width:0}.stayinfo b{font-size:12px;display:block}.stayinfo small{font-size:10px;color:var(--muted)}
.empty{padding:26px 15px;text-align:center;color:var(--muted);font-size:12px}.empty .big{font-size:30px;margin-bottom:7px}
.flowstay{padding:12px 14px;border-bottom:1px solid var(--line)}.flowstay:last-child{border-bottom:0}
.flowline{font-size:13px;margin-bottom:4px;color:var(--ink)}.flowline b{font-weight:800}.flowline.in{color:var(--green)}.flowline.out{color:var(--amber)}
.ftime{background:#F0EEE9;border-radius:7px;padding:1px 6px;font-size:11px;font-weight:700;color:var(--sub)}
.flowsupplies{margin-top:6px;background:#FFF3E4;border-radius:10px;padding:8px 11px;font-size:12px;font-weight:700;color:#B5701A;line-height:1.5}
.flownote{margin-top:5px;background:#FDEEF0;border-radius:10px;padding:7px 11px;font-size:11px;color:#C0556B;font-weight:700;line-height:1.5}
.flowempty{padding:9px 14px;font-size:11px;color:var(--purple);background:#FAFAFA;border-bottom:1px solid var(--line);font-weight:700}
.loadbox{padding:60px 20px;text-align:center;color:var(--muted)}.loadbox .big{font-size:36px;margin-bottom:12px}
.calendar{padding:12px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr)}.week div{text-align:center;font-size:10px;color:var(--muted);font-weight:800;padding:5px 0}.days{gap:4px}.day{min-height:50px;background:#FBF8F3;border-radius:13px;padding:5px 2px;position:relative}.day.other{opacity:.28}.day.today{outline:2px solid #B7CFE7}.daynum{font-size:11px;font-weight:800;text-align:center}.dotwrap{display:flex;justify-content:center;gap:3px;margin-top:5px;flex-wrap:wrap}.dot{width:6px;height:6px;border-radius:50%}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:10px;color:var(--sub)}.legend span{display:flex;align-items:center;gap:4px}.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:200;background:linear-gradient(145deg,var(--navy),var(--navy2));color:white;padding:11px 16px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brandrow">
      <div class="logo">🏠</div>
      <div class="brand"><strong>ROOMMADE 현황판</strong><small>호스트 전용 보기</small></div>
      <button class="iconbtn" id="btnRefresh">↻</button>
    </div>
  </div>

  <div class="view">
    <div class="updated" id="updatedAt"></div>

    <div id="loadingBox" class="loadbox">
      <div class="big">☁️</div>
      <div>데이터를 불러오는 중...</div>
    </div>

    <div id="content" style="display:none">
      <div class="section">
        <div class="sectitle"><h2>📅 이번 달 일정</h2></div>
        <div class="monthnav">
          <button id="prevMonth">‹</button>
          <div><b id="monthLabel"></b><small>체크인 / 체크아웃</small></div>
          <button id="nextMonth">›</button>
        </div>
        <div class="card calendar">
          <div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
          <div class="days" id="calDays"></div>
        </div>
        <div class="legend">
          <span><i style="background:#2F6FAF"></i>체크인</span>
          <span><i style="background:#E58E33"></i>체크아웃</span>
        </div>
      </div>

      <div class="section">
        <div class="sectitle"><h2>🏠 내 객실 현황</h2></div>
        <div id="roomList"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var DB_URL = 'https://roompacker-48249-default-rtdb.asia-southeast1.firebasedatabase.app';
  var DATA = null;
  var allowedRoomIds = null; // 링크로 지정된 객실만 (null이면 전체)
  var calYear = new Date().getFullYear();
  var calMonth = new Date().getMonth();

  function $(id){ return document.getElementById(id); }

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.className = 'toast show';
    setTimeout(function(){ t.className = 'toast'; }, 1800);
  }

  // URL 파라미터 읽기 (구형 사파리도 안전하게 직접 파싱)
  function getParam(name){
    var q = location.search.replace(/^\?/, '');
    var parts = q.split('&');
    for (var i=0;i<parts.length;i++){
      var kv = parts[i].split('=');
      if (decodeURIComponent(kv[0]) === name) return decodeURIComponent(kv[1]||'');
    }
    return null;
  }

  // 클라우드에서 데이터 불러오기
  function loadData(){
    var binId = getParam('id');
    var roomsParam = getParam('rooms');
    if (roomsParam){
      allowedRoomIds = roomsParam.split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    }
    if (!binId){
      $('loadingBox').innerHTML = '<div class="big">⚠️</div><div>잘못된 링크예요.<br>사장님께 링크를 다시 받아주세요.</div>';
      return;
    }
    $('loadingBox').style.display = 'block';
    $('content').style.display = 'none';

    fetch(DB_URL + '/shares/' + binId + '.json')
    .then(function(res){
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function(json){
      DATA = json || {};
      if (!DATA.rooms) DATA.rooms = [];
      if (!DATA.transactions) DATA.transactions = [];
      render();
    })
    .catch(function(e){
      console.error(e);
      $('loadingBox').innerHTML = '<div class="big">❌</div><div>불러오기 실패<br><small>' + esc(e.message) + '</small></div>';
    });
  }

  // 보여줄 객실 (링크에 지정된 것만)
  function myRooms(){
    var rooms = DATA.rooms || [];
    if (!allowedRoomIds) return rooms;
    return rooms.filter(function(r){ return allowedRoomIds.indexOf(String(r.id)) >= 0; });
  }

  // 거래(TX)에서 체류 정보 뽑기 — '입실 손님' 기준
  //   date     = 청소일 = 그날 새 손님 입실
  //   inNights = 그 손님 박수 → 퇴실 = date + inNights
  //   inSupplies = 그 입실 손님 셋팅 준비물 (입실에 붙음 → 자연스러움)
  // 입실 정보 없이 퇴실만 있는 손님은 outNights로 입실 역산해 보강
  function staysForRoom(roomId){
    var txs = DATA.transactions || [];
    var stays = [];
    var seen = {};
    // 1) 입실 손님 기준
    var noteByCleanDate = {}; // 청소일(=그날 퇴실) → 메모
    var suppliesByInDate = {}; // 입실일 → 준비물
    txs.forEach(function(tx){
      if (String(tx.targetId) !== String(roomId)) return;
      if (tx.type && tx.type !== 'income' && tx.type !== '수입') return;
      if (tx.status === 'cancelled') return;
      if (!tx.date) return;
      // 메모는 '그날 청소(=그날 퇴실)'에 대한 것 → 청소일에 매핑
      if (tx.memo) noteByCleanDate[dateStr(new Date(tx.date))] = tx.memo;
      var inN = parseInt(tx.inNights, 10);
      if (inN > 0){
        var ci = new Date(tx.date);
        var co = new Date(tx.date); co.setDate(co.getDate() + inN);
        var key = dateStr(ci);
        seen[key] = 1;
        stays.push({
          checkIn: dateStr(ci),
          checkOut: dateStr(co),
          nights: inN,
          guests: tx.inGuests || '',
          inTime: tx.inTime || tx.checkinTime || '',
          supplies: tx.inSupplies || '',   // 입실 손님 준비물
          note: ''  // 메모는 아래에서 '퇴실일' 기준으로 다시 붙임
        });
      }
    });
    // 2) 퇴실만 있는 손님 보강 (outNights로 입실 역산)
    txs.forEach(function(tx){
      if (String(tx.targetId) !== String(roomId)) return;
      if (tx.type && tx.type !== 'income' && tx.type !== '수입') return;
      if (tx.status === 'cancelled') return;
      if (!tx.date) return;
      var outN = parseInt(tx.outNights != null && tx.outNights !== '' ? tx.outNights : tx.nights, 10);
      if (outN > 0){
        var ci = new Date(tx.date); ci.setDate(ci.getDate() - outN);
        var key = dateStr(ci);
        if (seen[key]) return; // 이미 입실 기준으로 잡힌 손님
        seen[key] = 1;
        stays.push({
          checkIn: dateStr(ci),
          checkOut: dateStr(new Date(tx.date)),
          nights: outN,
          guests: (tx.outGuests != null && tx.outGuests !== '') ? tx.outGuests : (tx.guests || ''),
          inTime: '',
          supplies: '',
          note: ''
        });
      }
    });
    // 메모를 '퇴실일' 기준으로 각 stay에 붙임 (그날 청소=그날 퇴실 메모)
    stays.forEach(function(s){
      if (noteByCleanDate[s.checkOut]) s.note = noteByCleanDate[s.checkOut];
    });
    // 날짜 흐름순 (과거→미래) — 입실일 기준
    stays.sort(function(a,b){ return (a.checkIn||'').localeCompare(b.checkIn||''); });
    return stays;
  }

  // 현재 보여줄 달의 범위 안에 걸치는 체류만 + 공실 흐름 만들기
  function buildTimeline(stays){
    var monthStart = new Date(calYear, calMonth, 1);
    var monthEnd = new Date(calYear, calMonth+1, 0); // 말일
    monthEnd.setHours(23,59,59,999);

    // 이번 달과 조금이라도 겹치는 체류만
    var inMonth = stays.filter(function(s){
      var ci = new Date(s.checkIn), co = new Date(s.checkOut);
      return co >= monthStart && ci <= monthEnd;
    });

    var items = [];
    for (var i=0;i<inMonth.length;i++){
      var s = inMonth[i];
      items.push({ kind:'stay', stay:s });
      // 다음 체류와의 사이 공실 계산
      var next = inMonth[i+1];
      if (next){
        var thisOut = new Date(s.checkOut);
        var nextIn = new Date(next.checkIn);
        var gap = Math.round((nextIn - thisOut) / 86400000);
        // gap>=1 이면 퇴실 후 다음 입실까지 비는 기간
        // 방식2: 실제 빈 밤 = 퇴실일 ~ 입실 전날
        if (gap >= 1){
          var emptyFrom = new Date(thisOut); // 퇴실일(청소 후 빈 상태 시작)
          var emptyTo = new Date(nextIn); emptyTo.setDate(emptyTo.getDate() - 1); // 입실 전날
          items.push({
            kind:'empty',
            from: dateStr(emptyFrom),
            to: dateStr(emptyTo),
            days: gap   // 비는 일수 (퇴실~입실 사이)
          });
        }
      }
    }
    return items;
  }

  // 객실 목록 그리기 (타임라인 흐름)
  function renderRooms(){
    var list = $('roomList');
    list.innerHTML = '';
    var rooms = myRooms();
    if (rooms.length === 0){
      list.innerHTML = '<div class="card empty"><div class="big">🏠</div>표시할 객실이 없어요</div>';
      return;
    }
    var today = new Date(); today.setHours(0,0,0,0);

    rooms.forEach(function(r){
      var name = r.name || '객실';
      var stays = staysForRoom(r.id);

      // 현재 사용중 판단
      var occupied = stays.some(function(s){
        var ci = new Date(s.checkIn); ci.setHours(0,0,0,0);
        var co = new Date(s.checkOut); co.setHours(0,0,0,0);
        return ci <= today && co > today;
      });

      var card = document.createElement('div');
      card.className = 'card roomcard';
      var html = '<div class="roomhead">' +
        '<div class="roomico">🛏️</div>' +
        '<div class="roomname"><b>' + esc(name) + '</b><small>' + esc(r.branch||'') + ' · ' + (calMonth+1) + '월 일정</small></div>' +
        '<div class="roombadge ' + (occupied?'in':'empty') + '">' + (occupied?'사용중':'공실') + '</div>' +
        '</div>';

      var items = buildTimeline(stays);

      if (items.length === 0){
        html += '<div class="empty" style="padding:18px">이 달 일정 없음</div>';
      } else {
        items.forEach(function(it){
          if (it.kind === 'empty'){
            html += '<div class="flowempty">⚪ ' + fmtMD(it.from) + ' ~ ' + fmtMD(it.to) + ' 공실 (' + it.days + '일)</div>';
          } else {
            var s = it.stay;
            var guestTxt = s.guests ? ' · ' + esc(s.guests) + '명' : '';
            var nightTxt = s.nights ? ' · ' + s.nights + '박' : '';
            html += '<div class="flowstay">' +
              '<div class="flowline in">🟦 입실 <b>' + fmtMD(s.checkIn) + '</b>' + (s.inTime ? ' <span class="ftime">'+esc(s.inTime)+'</span>' : '') + nightTxt + guestTxt + '</div>';
            if (s.supplies){
              html += '<div class="flowsupplies">🛒 셋팅준비: ' + esc(s.supplies) + '</div>';
            }
            html += '<div class="flowline out">🟧 퇴실 <b>' + fmtMD(s.checkOut) + '</b></div>';
            if (s.note){
              html += '<div class="flownote">💰 추가/메모: ' + esc(s.note) + '</div>';
            }
            html += '</div>';
          }
        });
      }
      card.innerHTML = html;
      list.appendChild(card);
    });
  }

  // 캘린더 그리기
  function renderCalendar(){
    $('monthLabel').textContent = calYear + '년 ' + (calMonth+1) + '월';
    var days = $('calDays');
    days.innerHTML = '';
    var first = new Date(calYear, calMonth, 1);
    var startDay = first.getDay();
    var lastDate = new Date(calYear, calMonth+1, 0).getDate();
    var prevLast = new Date(calYear, calMonth, 0).getDate();
    var today = new Date();

    var ins = {}, outs = {};
    var rooms = myRooms();
    rooms.forEach(function(r){
      staysForRoom(r.id).forEach(function(s){
        if (s.checkIn){
          var d1 = new Date(s.checkIn);
          if (d1.getFullYear()===calYear && d1.getMonth()===calMonth) ins[d1.getDate()] = (ins[d1.getDate()]||0)+1;
        }
        if (s.checkOut){
          var d2 = new Date(s.checkOut);
          if (d2.getFullYear()===calYear && d2.getMonth()===calMonth) outs[d2.getDate()] = (outs[d2.getDate()]||0)+1;
        }
      });
    });

    var i;
    for (i=0;i<startDay;i++){
      var d=document.createElement('div'); d.className='day other';
      d.innerHTML='<div class="daynum">'+(prevLast-startDay+i+1)+'</div>'; days.appendChild(d);
    }
    for (var day=1;day<=lastDate;day++){
      var cell=document.createElement('div'); cell.className='day';
      if (today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===day) cell.className+=' today';
      var dots='';
      if (ins[day]) dots+='<span class="dot" style="background:#2F6FAF"></span>';
      if (outs[day]) dots+='<span class="dot" style="background:#E58E33"></span>';
      cell.innerHTML='<div class="daynum">'+day+'</div><div class="dotwrap">'+dots+'</div>';
      days.appendChild(cell);
    }
  }

  function render(){
    $('loadingBox').style.display = 'none';
    $('content').style.display = 'block';
    if (DATA.updatedAt){
      var d = new Date(DATA.updatedAt);
      $('updatedAt').textContent = '🕐 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' +
        pad(d.getHours())+':'+pad(d.getMinutes()) + ' 기준';
    }
    renderCalendar();
    renderRooms();
  }

  // 유틸
  function pad(n){ return String(n).padStart(2,'0'); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function dateStr(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fmtMD(s){ if(!s) return '-'; var d=new Date(s); if(isNaN(d.getTime())) return esc(s); return (d.getMonth()+1)+'/'+d.getDate(); }

  $('btnRefresh').addEventListener('click', function(){ toast('새로고침'); loadData(); });
  $('prevMonth').addEventListener('click', function(){ calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); });
  $('nextMonth').addEventListener('click', function(){ calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); });

  loadData();
})();
</script>
</body>
</html>

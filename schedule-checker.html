<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>일정 비교 체크</title>
<style>
  :root{
    --teal:#0e7490;
    --teal-light:#0891b2;
    --cream:#faf7f1;
    --navy:#1e3a5f;
    --danger:#dc2626;
    --warn:#d97706;
    --ok:#15803d;
    --border:#e5ddd0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    background:var(--cream); color:var(--navy); max-width:480px; margin:0 auto; min-height:100vh;
  }
  header{ position:sticky; top:0; z-index:20; background:var(--teal); color:#fff; padding:16px 14px; }
  header h1{ margin:0; font-size:18px; }
  header p{ margin:4px 0 0; font-size:12px; opacity:0.85; }
  main{ padding:14px 14px 60px; }

  .group-card{
    background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:14px;
  }
  .group-header{ display:flex; gap:8px; align-items:center; margin-bottom:12px; }
  .room-name-input{
    flex:1; border:1px solid var(--border); border-radius:8px; padding:10px; font-size:15px;
    font-weight:bold; color:var(--navy); background:#faf9f6;
  }
  .room-name-input::placeholder{ font-weight:normal; color:#bbb; }
  .del-group-btn{
    background:var(--danger); color:#fff; border:none; border-radius:8px; width:36px; height:36px;
    font-size:15px; cursor:pointer; flex-shrink:0;
  }
  .sub-label{ font-size:12px; color:var(--teal); font-weight:bold; margin:10px 0 6px; }

  .photo-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .photo-item{ position:relative; width:80px; height:80px; border-radius:10px; overflow:hidden; background:#f0ece4; border:1px solid var(--border); }
  .photo-item img{ width:100%; height:100%; object-fit:cover; }
  .photo-item .photo-del{
    position:absolute; top:2px; right:2px; background:rgba(220,38,38,0.92); color:#fff; border:none;
    border-radius:50%; width:20px; height:20px; font-size:11px; cursor:pointer;
  }
  .photo-add-tile{
    width:80px; height:80px; border-radius:10px; border:2px dashed var(--teal-light);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    color:var(--teal-light); font-size:11px; cursor:pointer; background:#f6fbfb; text-align:center;
  }

  .add-group-btn{
    width:100%; background:none; border:2px dashed var(--teal-light); color:var(--teal);
    border-radius:12px; padding:14px; font-size:14px; cursor:pointer; margin-bottom:14px;
  }

  .compare-btn{
    width:100%; background:var(--teal); color:#fff; border:none; border-radius:12px; padding:14px;
    font-size:15px; font-weight:bold; cursor:pointer; margin-top:4px;
  }
  .compare-btn:disabled{ background:#c9c2b4; cursor:not-allowed; }
  .clear-btn{
    width:100%; background:#fff; border:1px solid var(--border); color:#888; border-radius:12px; padding:10px;
    font-size:13px; cursor:pointer; margin-top:8px;
  }

  .progress-box{ text-align:center; padding:20px 10px; color:var(--teal); font-size:14px; }
  .progress-box .spinner{
    width:32px; height:32px; border:3px solid #e0e0e0; border-top-color:var(--teal); border-radius:50%;
    margin:0 auto 10px; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .summary-box{
    display:flex; justify-content:space-around; background:#fff; border:1px solid var(--border);
    border-radius:14px; padding:14px; margin-bottom:14px;
  }
  .summary-box .num{ font-size:20px; font-weight:bold; }
  .summary-box .lbl{ font-size:11px; color:#888; margin-top:2px; }

  .room-result{ background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; }
  .room-result h3{ font-size:14px; margin:0 0 10px; color:var(--navy); }

  .item-row{ display:flex; gap:8px; padding:7px 0; border-bottom:1px solid #f2eee4; font-size:13px; align-items:flex-start; }
  .item-row:last-child{ border-bottom:none; }
  .tag{ flex-shrink:0; font-size:11px; padding:2px 6px; border-radius:6px; color:#fff; margin-top:1px; white-space:nowrap; }
  .tag.ok{ background:var(--ok); }
  .tag.warn-missing{ background:var(--warn); }
  .tag.warn-extra{ background:var(--danger); }
  .item-row .txt{ flex:1; line-height:1.4; }
  .no-issue{ color:#999; font-size:12px; padding:4px 0; }
  .skip-msg{ color:var(--warn); font-size:12px; padding:4px 0; }

  input[type="file"]{ display:none; }
</style>
</head>
<body>

<header>
  <h1>🔍 일정 비교 체크</h1>
  <p>호실별로 에어비앤비 캘린더 ↔ 로메이드원 사진을 넣으면 AI가 비교해드려요</p>
</header>

<main id="mainArea">

  <div id="groupsArea"></div>

  <button type="button" class="compare-btn" id="compareBtn" disabled>객실을 추가해주세요</button>
  <button type="button" class="clear-btn" id="clearBtn">전체 초기화</button>

  <div id="resultArea"></div>

</main>

<input type="file" id="channelFileInput" accept="image/*" multiple>
<input type="file" id="roommadeFileInput" accept="image/*" multiple>

<script>
(function(){
  "use strict";

  var groups = []; // { id, roomName, channelPhotos:[{id,dataUrl}], roommadePhotos:[{id,dataUrl}] }
  var pendingGroupId = null;
  var pendingType = null; // "channel" | "roommade"

  var groupsArea = document.getElementById("groupsArea");
  var compareBtn = document.getElementById("compareBtn");
  var clearBtn = document.getElementById("clearBtn");
  var resultArea = document.getElementById("resultArea");
  var channelFileInput = document.getElementById("channelFileInput");
  var roommadeFileInput = document.getElementById("roommadeFileInput");

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function addGroup(){
    groups.push({ id: uid(), roomName: "", channelPhotos: [], roommadePhotos: [] });
    renderGroups();
  }

  // ---------- 사진 리사이즈 (OCR용이라 화질을 좀 더 높게 유지) ----------
  function resizeImageFile(file, callback){
    try{
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var maxW = 1100;
          var w = img.width, h = img.height;
          if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          var dataUrl = canvas.toDataURL("image/jpeg", 0.78);
          callback(dataUrl);
        };
        img.onerror = function(){ console.error("이미지 로드 실패"); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ console.error("파일 읽기 실패"); };
      reader.readAsDataURL(file);
    }catch(err){ console.error("리사이즈 오류:", err); }
  }

  function findGroup(groupId){
    for(var i=0;i<groups.length;i++){ if(groups[i].id === groupId) return groups[i]; }
    return null;
  }

  function photoGridHtml(photos, groupId, type){
    var html = "";
    photos.forEach(function(p){
      html += '<div class="photo-item"><img src="'+p.dataUrl+'">'
        + '<button type="button" class="photo-del" data-action="del-photo" data-group-id="'+groupId+'" data-type="'+type+'" data-photo-id="'+p.id+'">✕</button></div>';
    });
    html += '<div class="photo-add-tile" data-action="add-photo" data-group-id="'+groupId+'" data-type="'+type+'">📷<br>추가</div>';
    return html;
  }

  function renderGroups(){
    if(groups.length === 0){
      groupsArea.innerHTML = '';
    } else {
      var html = "";
      groups.forEach(function(g){
        html += '<div class="group-card">'
          + '<div class="group-header">'
          + '<input type="text" class="room-name-input" data-action="room-name" data-group-id="'+g.id+'" placeholder="객실 호실 입력 (예: 3709호)" value="'+escapeHtml(g.roomName)+'">'
          + '<button type="button" class="del-group-btn" data-action="del-group" data-group-id="'+g.id+'">✕</button>'
          + '</div>'
          + '<div class="sub-label">① 에어비앤비(예약채널) 캘린더 사진</div>'
          + '<div class="photo-grid">' + photoGridHtml(g.channelPhotos, g.id, "channel") + '</div>'
          + '<div class="sub-label">② 로메이드원 객실현황판 사진</div>'
          + '<div class="photo-grid">' + photoGridHtml(g.roommadePhotos, g.id, "roommade") + '</div>'
          + '</div>';
      });
      groupsArea.innerHTML = html;
    }
    updateCompareBtn();
  }

  function updateCompareBtn(){
    var ready = groups.filter(function(g){
      return g.roomName.trim() !== "" && g.channelPhotos.length > 0 && g.roommadePhotos.length > 0;
    });
    if(groups.length === 0){
      compareBtn.disabled = true;
      compareBtn.textContent = "객실을 추가해주세요";
    } else if(ready.length === 0){
      compareBtn.disabled = true;
      compareBtn.textContent = "호실명 + 사진 2종류를 모두 넣어주세요";
    } else {
      compareBtn.disabled = false;
      compareBtn.textContent = "🔍 AI로 비교하기 (" + ready.length + "개 객실)";
    }
  }

  // 객실 추가 버튼: groupsArea 아래쪽에 고정 버튼으로 배치
  var addGroupBtnEl = document.createElement("button");
  addGroupBtnEl.type = "button";
  addGroupBtnEl.className = "add-group-btn";
  addGroupBtnEl.textContent = "+ 객실 추가";
  addGroupBtnEl.addEventListener("click", addGroup);
  groupsArea.parentNode.insertBefore(addGroupBtnEl, groupsArea.nextSibling);

  groupsArea.addEventListener("click", function(e){
    var target = e.target.closest("[data-action]");
    if(!target) return;
    var action = target.getAttribute("data-action");
    var groupId = target.getAttribute("data-group-id");

    if(action === "del-group"){
      if(confirm("이 객실 항목을 삭제할까요?")){
        groups = groups.filter(function(g){ return g.id !== groupId; });
        renderGroups();
      }
    }
    else if(action === "add-photo"){
      pendingGroupId = groupId;
      pendingType = target.getAttribute("data-type");
      if(pendingType === "channel"){ channelFileInput.click(); } else { roommadeFileInput.click(); }
    }
    else if(action === "del-photo"){
      var group = findGroup(groupId);
      if(!group) return;
      var type = target.getAttribute("data-type");
      var photoId = target.getAttribute("data-photo-id");
      if(type === "channel"){ group.channelPhotos = group.channelPhotos.filter(function(p){ return p.id !== photoId; }); }
      else{ group.roommadePhotos = group.roommadePhotos.filter(function(p){ return p.id !== photoId; }); }
      renderGroups();
    }
  });

  groupsArea.addEventListener("change", function(e){
    var target = e.target;
    if(target.matches('[data-action="room-name"]')){
      var group = findGroup(target.getAttribute("data-group-id"));
      if(group){ group.roomName = target.value; updateCompareBtn(); }
    }
  });
  // 입력 중에도 버튼 상태 갱신
  groupsArea.addEventListener("input", function(e){
    var target = e.target;
    if(target.matches('[data-action="room-name"]')){
      var group = findGroup(target.getAttribute("data-group-id"));
      if(group){ group.roomName = target.value; updateCompareBtn(); }
    }
  });

  channelFileInput.addEventListener("change", function(){
    if(!pendingGroupId) return;
    var group = findGroup(pendingGroupId);
    if(!group){ channelFileInput.value = ""; return; }
    var files = Array.prototype.slice.call(channelFileInput.files || []);
    files.forEach(function(file){
      resizeImageFile(file, function(dataUrl){
        group.channelPhotos.push({ id: uid(), dataUrl: dataUrl });
        renderGroups();
      });
    });
    channelFileInput.value = "";
  });

  roommadeFileInput.addEventListener("change", function(){
    if(!pendingGroupId) return;
    var group = findGroup(pendingGroupId);
    if(!group){ roommadeFileInput.value = ""; return; }
    var files = Array.prototype.slice.call(roommadeFileInput.files || []);
    files.forEach(function(file){
      resizeImageFile(file, function(dataUrl){
        group.roommadePhotos.push({ id: uid(), dataUrl: dataUrl });
        renderGroups();
      });
    });
    roommadeFileInput.value = "";
  });

  clearBtn.addEventListener("click", function(){
    if(!confirm("등록한 객실과 사진, 비교 결과를 모두 지울까요?")) return;
    groups = [];
    resultArea.innerHTML = "";
    renderGroups();
  });

  // ---------- Claude API 호출 ----------
  function buildPrompt(roomName, sourceLabel){
    return "이 이미지는 '" + roomName + "' 객실의 " + sourceLabel + " 화면입니다. "
      + "화면에 표시된 예약(투숙) 일정을 읽어서 예약자 이름과 체크인~체크아웃 날짜를 추출해주세요. "
      + "화면이 옆으로 잘려서 체크아웃 날짜를 정확히 알 수 없으면 checkOut을 null로 두세요. "
      + "예약자 이름이 안보이면 guest를 빈 문자열로 두세요. "
      + "여러 달(예: 7월, 8월)이 같이 보이면 각 예약이 몇 월인지 month 필드에 숫자로 넣어주세요. "
      + "다른 설명 없이 아래 JSON 형식으로만 답하세요:\n"
      + '{"bookings":[{"guest":"예약자명","month":7,"checkIn":12,"checkOut":14}]}';
  }

  async function callClaudeVision(dataUrl, promptText){
    var base64 = dataUrl.split(",")[1];
    try{
      var response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{
            role: "user",
            content: [
              { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } },
              { type: "text", text: promptText }
            ]
          }]
        })
      });
      var data = await response.json();
      var textBlock = null;
      if(data && data.content){
        for(var i=0;i<data.content.length;i++){
          if(data.content[i].type === "text"){ textBlock = data.content[i].text; break; }
        }
      }
      if(!textBlock) return [];
      var cleaned = textBlock.replace(/```json/g, "").replace(/```/g, "").trim();
      var parsed = JSON.parse(cleaned);
      return parsed.bookings || [];
    }catch(err){
      console.error("API 호출/파싱 오류:", err);
      return [];
    }
  }

  function datesOverlapOrClose(a, b){
    if(a.month !== b.month) return false;
    var aIn = a.checkIn, aOut = (a.checkOut === null || a.checkOut === undefined) ? a.checkIn : a.checkOut;
    var bIn = b.checkIn, bOut = (b.checkOut === null || b.checkOut === undefined) ? b.checkIn : b.checkOut;
    return Math.abs(aIn - bIn) <= 1 || (aIn <= bOut + 1 && bIn <= aOut + 1);
  }

  function guestSimilar(g1, g2){
    if(!g1 || !g2) return true;
    var s1 = g1.replace(/\s+/g,"").toLowerCase();
    var s2 = g2.replace(/\s+/g,"").toLowerCase();
    return s1.indexOf(s2) !== -1 || s2.indexOf(s1) !== -1;
  }

  function escapeHtml(str){
    if(!str) return "";
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  // ---------- 비교하기 ----------
  compareBtn.addEventListener("click", async function(){
    var readyGroups = groups.filter(function(g){
      return g.roomName.trim() !== "" && g.channelPhotos.length > 0 && g.roommadePhotos.length > 0;
    });
    var skippedGroups = groups.filter(function(g){
      return readyGroups.indexOf(g) === -1;
    });

    compareBtn.disabled = true;
    var totalPhotos = 0;
    readyGroups.forEach(function(g){ totalPhotos += g.channelPhotos.length + g.roommadePhotos.length; });
    resultArea.innerHTML = '<div class="progress-box"><div class="spinner"></div>사진을 분석하고 있어요...<br><span id="progressText">0 / '+totalPhotos+'</span></div>';
    var progressText = document.getElementById("progressText");
    var done = 0;

    var resultsHtml = "";
    var totalOk = 0, totalMissing = 0, totalExtra = 0;

    for(var gi=0; gi<readyGroups.length; gi++){
      var g = readyGroups[gi];
      var channelBookings = [];
      var roommadeBookings = [];

      for(var ci=0; ci<g.channelPhotos.length; ci++){
        var cb = await callClaudeVision(g.channelPhotos[ci].dataUrl, buildPrompt(g.roomName, "에어비앤비(예약채널) 예약 캘린더"));
        channelBookings = channelBookings.concat(cb);
        done++; if(progressText) progressText.textContent = done + " / " + totalPhotos;
      }
      for(var ri=0; ri<g.roommadePhotos.length; ri++){
        var rb = await callClaudeVision(g.roommadePhotos[ri].dataUrl, buildPrompt(g.roomName, "로메이드원 객실 현황판"));
        roommadeBookings = roommadeBookings.concat(rb);
        done++; if(progressText) progressText.textContent = done + " / " + totalPhotos;
      }

      var usedRoommade = roommadeBookings.map(function(){ return false; });
      var rows = "";

      channelBookings.forEach(function(cbk){
        var foundIdx = -1;
        roommadeBookings.forEach(function(rbk, idx){
          if(!usedRoommade[idx] && datesOverlapOrClose(cbk, rbk) && guestSimilar(cbk.guest, rbk.guest)){
            foundIdx = idx;
          }
        });
        var dateLabel = cbk.month + "월 " + cbk.checkIn + "일" + (cbk.checkOut ? "~" + cbk.checkOut + "일" : "일 (종료일 불명확)");
        var guestLabel = cbk.guest ? cbk.guest : "(이름 미상)";
        if(foundIdx !== -1){
          usedRoommade[foundIdx] = true;
          rows += '<div class="item-row"><span class="tag ok">일치</span><span class="txt">'+dateLabel+' · '+escapeHtml(guestLabel)+'</span></div>';
          totalOk++;
        } else {
          rows += '<div class="item-row"><span class="tag warn-missing">확인필요</span><span class="txt">'+dateLabel+' · '+escapeHtml(guestLabel)+' — 로메이드원에서 못 찾았어요</span></div>';
          totalMissing++;
        }
      });

      roommadeBookings.forEach(function(rbk, idx){
        if(!usedRoommade[idx]){
          var dl = rbk.month + "월 " + rbk.checkIn + "일" + (rbk.checkOut ? "~" + rbk.checkOut + "일" : "일");
          var gl = rbk.guest ? rbk.guest : "(이름 미상)";
          rows += '<div class="item-row"><span class="tag warn-extra">확인필요</span><span class="txt">'+dl+' · '+escapeHtml(gl)+' — 예약채널에서 못 찾았어요 (취소 의심)</span></div>';
          totalExtra++;
        }
      });

      if(rows === ""){ rows = '<div class="no-issue">비교할 예약 정보가 없어요.</div>'; }
      resultsHtml += '<div class="room-result"><h3>🏠 '+escapeHtml(g.roomName)+'</h3>'+rows+'</div>';
    }

    if(skippedGroups.length > 0){
      var skipNames = skippedGroups.map(function(g){ return g.roomName.trim() || "(호실명 없음)"; }).join(", ");
      resultsHtml += '<div class="room-result"><div class="skip-msg">⚠️ 다음 객실은 호실명 또는 사진이 부족해서 건너뛰었어요: '+escapeHtml(skipNames)+'</div></div>';
    }

    var summaryHtml = '<div class="summary-box">'
      + '<div><div class="num" style="color:var(--ok)">'+totalOk+'</div><div class="lbl">일치</div></div>'
      + '<div><div class="num" style="color:var(--warn)">'+totalMissing+'</div><div class="lbl">채널에만있음</div></div>'
      + '<div><div class="num" style="color:var(--danger)">'+totalExtra+'</div><div class="lbl">로메이드원에만있음</div></div>'
      + '</div>';

    resultArea.innerHTML = summaryHtml + resultsHtml;
    compareBtn.disabled = false;
    updateCompareBtn();
  });

  // ---------- 시작 ----------
  addGroup(); // 처음 화면에 객실 입력칸 1개는 기본으로 보여주기
})();
</script>
</body>
</html>

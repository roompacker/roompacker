<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase 정보</title>
<style>
body{font-family:-apple-system,sans-serif;background:#F8F4EC;padding:20px;color:#1F2937;line-height:1.6}
h1{font-size:22px;color:#0F766E;margin-bottom:16px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.label{font-size:12px;color:#9B9588;margin-bottom:4px;font-weight:600}
.value{font-family:monospace;font-size:13px;background:#F3F4F6;padding:12px;border-radius:8px;word-break:break-all;margin-bottom:14px}
.btn{background:#0F766E;color:#fff;border:none;padding:14px;width:100%;border-radius:12px;font-size:15px;font-weight:600;margin-top:8px}
.empty{background:#FEF3C7;border:1px solid #F59E0B;color:#92400E;padding:16px;border-radius:12px;text-align:center}
.warn{background:#FEE2E2;border:1px solid #EF4444;color:#991B1B;padding:16px;border-radius:12px;font-size:13px;margin-bottom:16px}
</style>
</head>
<body>
<h1>🔑 Firebase 정보</h1>
<div class="warn">⚠️ 확인 후 이 파일은 GitHub에서 삭제하세요</div>
<div id="r"></div>
<script>
const r=document.getElementById('r');
const c=localStorage.getItem('rpFirebaseConfig');
if(!c){r.innerHTML='<div class="empty">저장된 Firebase 설정이 없습니다.<br>v5.3을 사용한 적 없는 기기일 수 있어요.</div>';}
else{try{const cfg=JSON.parse(c);
r.innerHTML=`<div class="card">
<div class="label">API Key</div><div class="value">${cfg.apiKey||'(없음)'}</div>
<div class="label">Project ID</div><div class="value">${cfg.projectId||'(없음)'}</div>
<div class="label">Database URL</div><div class="value">${cfg.databaseURL||'(없음)'}</div>
<div class="label">Auth Domain</div><div class="value">${cfg.authDomain||'(자동)'}</div>
<button class="btn" id="b">📋 전체 복사하기</button></div>`;
document.getElementById('b').addEventListener('click',async()=>{
const t=JSON.stringify(cfg,null,2);
try{await navigator.clipboard.writeText(t);document.getElementById('b').textContent='✓ 복사 완료!';}
catch(e){prompt('이 텍스트를 길게 눌러서 복사하세요:',t);}
});
}catch(e){r.innerHTML='<div class="empty">읽기 오류: '+e.message+'</div>';}}
</script>
</body>
</html>

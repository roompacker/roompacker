 s.habits=[{id:uid(),title:'물 충분히 마시기',icon:'water',checkins:[TODAY]},{id:uid(),title:'책 20쪽 읽기',icon:'book',checkins:[]},{id:uid(),title:'20분 걷기',icon:'walk',checkins:[TODAY]}];

 s.notes=[{id:uid(),title:'작은 여유를 만드는 것들',body:'점심 먹고 10분만 걸어도 하루의 분위기가 바뀐다.\n\n오늘은 서두르지 말고, 한 가지씩 해보기.',category:'daily',date:shift(TODAY,-1),pinned:true,photo:''},{id:uid(),title:'나만의 작은 앱',body:'일정, 취미, 메모, 쇼핑.\n각각의 조각이 하나의 하루가 된다.\n\n기록을 숙제처럼 느끼지 않게 만들기.',category:'idea',date:TODAY,pinned:false,photo:''},{id:uid(),title:'다음 주에 해보고 싶은 일',body:'새로운 카페에서 책 읽기\n미뤄둔 사진 정리\n주말에는 가벼운 운동',category:'memo',date:shift(TODAY,-2),pinned:false,photo:''}];

function validState(s){if(!s||s.version!==1||!s.profile||typeof s.profile.name!=='string'||s.profile.name.length>60)return false;
 const dateOK=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&dateKey(fromKey(d))===d;
 const textOK=(v,max=50000)=>typeof v==='string'&&v.length<=max;
 const photoOK=p=>!p||(typeof p==='string'&&p.length<1500000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p));
 const numOK=n=>typeof n==='number'&&Number.isFinite(n)&&n>=0&&n<=1e12;
 if(!['cream','blue','lilac'].includes(s.profile.theme)||!numOK(s.profile.budget)||typeof s.profile.sample!=='boolean')return false;
 const base=a=>Array.isArray(a)&&a.length<=20000&&a.every(x=>x&&textOK(x.id,100));
 if(!['tasks','habits','moods','notes','collections','workouts','transactions','focus'].every(k=>base(s[k])))return false;
 if(!s.tasks.every(t=>textOK(t.title,200)&&dateOK(t.date)&&['work','life','hobby','shop'].includes(t.category)&&typeof t.done==='boolean'&&/^(([01]\d|2[0-3]):[0-5]\d)?$/.test(t.time)&&numOK(t.duration)&&textOK(t.notes)))return false;
 if(!s.habits.every(h=>textOK(h.title,200)&&['water','book','walk','heart','sun','dumbbell'].includes(h.icon)&&Array.isArray(h.checkins)&&h.checkins.every(dateOK)))return false;
 if(!s.moods.every(m=>dateOK(m.date)&&Object.keys(MOODS).includes(m.value)&&textOK(m.time,10)&&textOK(m.note)))return false;
 if(!s.notes.every(n=>dateOK(n.date)&&textOK(n.title,200)&&textOK(n.body)&&NOTE_CAT[n.category]&&typeof n.pinned==='boolean'&&photoOK(n.photo)))return false;
 if(!s.collections.every(c=>textOK(c.title,200)&&['book','wishlist','hobby'].includes(c.type)&&textOK(c.description)&&numOK(c.price)&&textOK(c.url,2000)&&photoOK(c.photo)&&numOK(c.progress)&&numOK(c.target)&&c.target>0&&['saved','doing','done','bought'].includes(c.status)))return false;
 if(!s.workouts.every(w=>dateOK(w.date)&&textOK(w.name,200)&&['sets','reps','weight','duration'].every(k=>numOK(w[k]))))return false;
 if(!s.transactions.every(t=>dateOK(t.date)&&textOK(t.title,200)&&['income','expense','pending'].includes(t.type)&&numOK(t.amount)))return false;
 if(!s.focus.every(f=>dateOK(f.date)&&numOK(f.minutes)))return false;
 if(!Array.isArray(s.cards)||s.cards.length!==Object.keys(CARD_DEFS).length||new Set(s.cards.map(c=>c.id)).size!==s.cards.length||!s.cards.every(c=>CARD_DEFS[c.id]&&typeof c.on==='boolean'))return false;
 if(!s.timer||typeof s.timer.running!=='boolean'||!numOK(s.timer.remaining)||![15,25,50].includes(s.timer.sessionMinutes)||(s.timer.running&&(!numOK(s.timer.endAt)||!dateOK(s.timer.date))))return false;
 // Drafts are not executable. Imported drafts are discarded after validation.
 return true;
}
let storageIssue='',persisted=true;
function loadState(){try{const raw=localStorage.getItem(KEY);if(!raw)return seedState();const s=JSON.parse(raw);if(validState(s)){s.draft=s.draft&&typeof s.draft==='object'?s.draft:null;return s}throw new Error('invalid')}catch(e){try{const backup=JSON.parse(localStorage.getItem(KEY+'.previous'));if(validState(backup)){storageIssue='이전 저장본을 복구했어요. 백업 파일도 만들어두세요.';backup.draft=null;return backup}}catch(_){}storageIssue='이 브라우저의 저장 기록을 읽지 못했어요. 기존 저장값은 덮어쓰지 않았습니다. 설정에서 백업을 불러오거나 새로 시작할 수 있어요.';persisted=false;return freshState()}}
let state=loadState();
let baseRevision=Number(state.updatedAt)||0;
let ui={view:VIEWS[location.hash.slice(1)]?location.hash.slice(1):'today',date:TODAY,month:monthKey(TODAY),calendarMode:'month',recordTab:'notes',noteFilter:'all',shelfFilter:'all',insightTab:'life',onboardInterests:['work','life','hobby','shop'],photo:'',search:''};
const $=s=>document.querySelector(s);
function save(){try{if(!persisted)throw new Error('blocked');const previous=localStorage.getItem(KEY);let stored=null;try{stored=previous?JSON.parse(previous):null}catch(_){}if(stored&&validState(stored)&&Number(stored.updatedAt)>baseRevision){storageIssue='다른 탭에 더 최신 기록이 있어 저장을 멈췄어요. 현재 입력을 백업한 뒤 최신 기록을 불러와주세요.';renderWarning();toast('다른 탭의 기록을 보호했어요. 현재 내용은 백업할 수 있어요.');return false;}state.updatedAt=Math.max(Date.now(),baseRevision+1);const next=JSON.stringify(state);localStorage.setItem(KEY,next);baseRevision=state.updatedAt;if(previous&&previous.length<1800000){try{localStorage.setItem(KEY+'.previous',previous)}catch(_){}}$('#saveStatus').innerHTML=icon('check',12)+' 기기에 저장됨';return true}catch(e){$('#saveStatus').textContent='저장 확인 필요';storageIssue=persisted?'저장 공간이 부족하거나 브라우저가 저장을 허용하지 않아요. 현재 내용을 백업하고 사진 수를 줄여주세요.':'기존 기록 보호를 위해 저장을 멈춘 상태예요. 설정에서 백업을 불러오거나 새로 시작해주세요.';renderWarning();toast('기기에 저장하지 못했어요. 설정에서 백업해주세요.');return false}}
function renderWarning(){$('#storageWarning').innerHTML=storageIssue?`<div class="persistent-warning">${esc(storageIssue)} <button class="text-button" data-act="settings">백업·설정</button> <button class="text-button" data-act="sync-reload">최신 기록 불러오기</button></div>`:'';}
let toastTimeout;function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),3200)}
function tasksOn(d){return state.tasks.filter(t=>t.date===d).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))}
function moodsOn(d){return state.moods.filter(m=>m.date===d).sort((a,b)=>a.time.localeCompare(b.time))}
function moodOn(d){return moodsOn(d).at(-1)}
function monthTx(){return state.transactions.filter(t=>monthKey(t.date)===monthKey(ui.date))}
function expense(){return monthTx().filter(t=>t.type==='expense').reduce((a,t)=>a+t.amount,0)}
function percent(n,d){return d?Math.min(100,Math.round(n/d*100)):0}
function taskRow(t){return `<div class="task ${t.done?'is-done':''}"><button class="check ${t.done?'done':''}" data-act="task-check" data-id="${esc(t.id)}" aria-label="${esc(t.title)} ${t.done?'완료 취소':'완료'}" aria-pressed="${t.done}">${t.done?icon('check',14):''}</button><button class="task-edit" data-act="task-edit" data-id="${esc(t.id)}"><div class="task-title truncate">${esc(t.title)}</div><div class="task-meta"><i class="category-dot ${t.category}"></i>${CAT[t.category]} <span>·</span> ${t.duration}분</div></button><span class="task-time">${esc(t.time)||'언제든'}</span></div>`}
function heading(title,subtitle,action=''){return `<section class="page-heading"><div><div class="heading-date">${esc(dateLabel(ui.date))}</div><h1>${title}</h1><p>${subtitle}</p></div>${action}</section>`}

function nav(){const entries=Object.entries(VIEWS);$('#sideNav').innerHTML=entries.map(([id,v])=>`<button class="nav-item ${ui.view===id?'active':''}" data-act="navigate" data-view="${id}" ${ui.view===id?'aria-current="page"':''}>${icon(v.icon,19)}<span>${v.label}</span></button>`).join('');$('#bottomNav').innerHTML=entries.map(([id,v])=>`<button class="${ui.view===id?'active':''}" data-act="navigate" data-view="${id}" ${ui.view===id?'aria-current="page"':''}>${icon(v.icon,19)}<span>${v.label}</span></button>`).join('');$('#breadcrumb').textContent=VIEWS[ui.view].label;$('#profileName').textContent=state.profile.name+'의 공간';$('#profileAvatar').textContent=state.profile.name.slice(0,1);document.body.dataset.theme=state.profile.theme;}
function weekStrip(){const start=weekStart(ui.date);return `<div class="date-row"><button class="icon-btn small week-nav" data-act="date-shift" data-n="-7" aria-label="이전 주">${icon('left',14)}</button><div class="week-strip">${Array.from({length:7},(_,i)=>{const d=shift(start,i),date=fromKey(d);return `<button class="day-pill ${d===ui.date?'selected':''}" data-act="select-date" data-date="${d}" aria-label="${dateLabel(d)}" aria-pressed="${d===ui.date}"><span class="weekday">${['일','월','화','수','목','금','토'][date.getDay()]}</span><span class="day-num">${date.getDate()}</span><i class="dot" style="opacity:${tasksOn(d).length||moodOn(d)?1:0}"></i></button>`}).join('')}</div><button class="icon-btn small week-nav" data-act="date-shift" data-n="7" aria-label="다음 주">${icon('right',14)}</button></div>`}
function thumb(c){if(c.photo)return `<div class="shelf-thumb ${c.type}"><img src="${esc(c.photo)}" alt="${esc(c.title)}" loading="lazy"></div>`;if(c.type==='book')return '<div class="shelf-thumb book"><div class="book-art"><small>MY READING LIST</small><b>Slow<br>days,<br>good<br>pages.</b><small>A CHAPTER A DAY</small></div></div>';if(c.type==='hobby')return '<div class="shelf-thumb hobby"><div class="hobby-art"></div></div>';return `<div class="shelf-thumb wishlist">${icon('headphones',70)}</div>`;}
function pixelGrid(weeks=13){const end=shift(weekStart(ui.date),6),start=shift(end,-weeks*7+1);const m=new Map();state.moods.forEach(x=>{const old=m.get(x.date);if(!old||x.time>=old.time)m.set(x.date,x)});return `<div class="pixel-grid">${Array.from({length:weeks*7},(_,i)=>{const d=shift(start,i),v=m.get(d);return `<button class="pixel ${d===ui.date?'selected':''}" ${v?'data-mood="'+v.value+'"':''} data-act="pixel" data-date="${d}" title="${esc(dateLabel(d))} · ${v?MOODS[v.value].label:'기록 없음'}" aria-label="${esc(dateLabel(d))} ${v?MOODS[v.value].label:'기록 없음'}"></button>`}).join('')}</div>`}
function pixelLegend(){return `<div class="pixel-legend">${Object.values(MOODS).map(m=>`<span><i style="background:${m.color}"></i>${m.label}</span>`).join('')}<span><i style="background:#eceadf"></i>기록 없음</span></div>`}
function cardContent(id){const tasks=tasksOn(ui.date),done=tasks.filter(t=>t.done).length,checked=state.habits.filter(h=>h.checkins.includes(ui.date)).length;switch(id){
 case 'hero':return `<div class="hero-copy"><div class="eyebrow">A SPACE FOR YOUR EVERYDAY</div><h2>Make room<br>for your day.</h2><p>해야 할 일도, 좋아하는 일도.<br>오늘은 나의 속도로 채워봐요.</p><button class="button" data-act="quick">오늘의 조각 더하기 ${icon('plus',13)}</button></div><div class="sculpture" aria-hidden="true"><i class="ring one"></i><i class="ring two"></i><i class="ring three"></i></div><span class="hero-footnote">LIFE, IN YOUR OWN COLORS.</span>`;
 case 'mood':{const current=moodOn(ui.date);return `<div class="card-top"><span class="small-label">오늘의 마음 · CHECK IN</span>${iconButton('mood-edit','upRight','감정과 메모 기록하기')}</div><h2 class="mood-title">${current?'지금은 '+MOODS[current.value].label+'.':'지금, 어떤 기분인가요?'}</h2><div class="mood-options">${Object.entries(MOODS).map(([id,m])=>`<button class="mood-btn ${current?.value===id?'selected':''}" data-act="mood-check" data-mood="${id}" aria-pressed="${current?.value===id}"><span>${m.emoji}</span><span>${({bright:'신남',calm:'편안',okay:'보통',tired:'피곤',low:'울적'}[id])}</span></button>`).join('')}</div><p class="mood-note">${current?`${current.time} 체크인 · 언제든 다시 기록해도 괜찮아요`:'있는 그대로의 오늘을 남겨요.'}</p>`;}
 case 'tasks':return `<div class="card-top"><div><div class="eyebrow muted" style="font-size:8px;margin-bottom:6px">ONE THING AT A TIME</div><h2 class="card-title">오늘의 할 일</h2></div><div class="row"><div class="task-progress"><strong>${done}</strong><small>/ ${tasks.length}</small></div>${iconButton('task-edit','plus','할 일 추가')}</div></div><div class="task-list">${tasks.length?tasks.slice(0,5).map(taskRow).join(''):'<div class="empty">'+icon('sun',25)+'아직 비어 있는 하루예요.<br>가벼운 할 일 하나부터 시작해볼까요?</div>'}</div>${tasks.length>5?'<button class="text-button" data-act="navigate" data-view="calendar">나머지 일정 '+(tasks.length-5)+'개 보기 ↗</button>':''}<button class="task-add" data-act="task-edit">${icon('plus',15)} 할 일 하나 더하기</button>`;
 case 'habits':return `<div class="card-top"><h2 class="card-title">작게, 꾸준하게.</h2><div class="row"><div class="habit-ring" style="--p:${percent(checked,state.habits.length)}"><span>${checked}/${state.habits.length}</span></div>${iconButton('habit-edit','plus','습관 추가')}</div></div>${state.habits.length?state.habits.slice(0,5).map(h=>`<div class="habit-row"><button class="habit-icon" data-act="habit-edit" data-id="${esc(h.id)}" aria-label="${esc(h.title)} 수정">${icon(h.icon,17)}</button><div class="grow"><div class="habit-label">${esc(h.title)}</div><div class="habit-streak">${h.challenge?'7일 챌린지 · '+h.checkins.filter(d=>d>=h.challenge.start&&d<=h.challenge.end).length+'/7일 실천':'최근 7일 '+Array.from({length:7},(_,i)=>shift(ui.date,-i)).filter(d=>h.checkins.includes(d)).length+'일 실천'}</div></div><button class="check ${h.checkins.includes(ui.date)?'done':''}" data-act="habit-check" data-id="${esc(h.id)}" aria-label="${esc(h.title)} 체크" aria-pressed="${h.checkins.includes(ui.date)}">${h.checkins.includes(ui.date)?icon('check',14):''}</button></div>`).join(''):'<div class="empty">내가 지키고 싶은 작은 약속을<br>하나 만들어보세요.</div>'}${state.habits.length>5?'<button class="text-button" data-act="habit-manage">전체 습관 '+state.habits.length+'개 관리 ↗</button>':''}<button class="text-button" style="margin-top:10px" data-act="challenge">7일 챌린지 만들기 ${icon('arrow',13)}</button>`;
 case 'timeline':{const upcoming=tasks.filter(t=>t.time).slice(0,3);return `<div class="card-top"><h2 class="card-title">하루의 흐름</h2>${iconButton('navigate','upRight','캘린더 보기','data-view="calendar"')}</div><div class="timeline">${upcoming.length?upcoming.map((t,i)=>`<div class="timeline-entry"><button class="time-card ${['blue','lilac','yellow'][i]}" data-act="task-edit" data-id="${esc(t.id)}"><small>${esc(t.time)} · ${t.duration}분</small><h3>${esc(t.title)}</h3><small>${CAT[t.category]} ${t.done?'· 완료':''}</small></button></div>`).join(''):'<div class="empty">시간이 정해진 일정이 없어요.<br>여유로운 하루를 보내세요.</div>'}</div>`;}
 case 'journal':{const n=state.notes.find(n=>n.date===ui.date&&n.category==='daily');return `<div class="card-top"><h2 class="card-title">오늘의 한 페이지</h2>${icon('note',17)}</div><div class="quote">${n?esc(n.title):'오늘의 나에게\n건네고 싶은 말은?'}</div><p>${n?esc(n.body.slice(0,90)):'거창하지 않아도 좋아요.<br>오늘 떠오른 생각 한 줄이면 충분해요.'}</p><button class="text-button" data-act="note-edit" ${n?'data-id="'+esc(n.id)+'"':'data-category="daily"'}>${n?'기록 이어 쓰기':'한 줄 남기기'} ${icon('upRight',14)}</button>`;}
 case 'focus':return `<div class="card-top"><h2 class="card-title">오롯이, 집중</h2><button class="chip white" style="color:#eee;background:#ffffff13" data-act="timer-length" id="timerLength">${state.timer.sessionMinutes}분 ${icon('clock',11)}</button></div><div class="focus-dial" id="timerDisplay">${timerText()}</div><p class="focus-desc">나에게 온전히 쓰는 시간.</p><div class="focus-actions"><button class="button" data-act="timer-toggle" id="timerToggle">${icon(state.timer.running?'pause':'play',14)} ${state.timer.running?'잠깐 쉬기':'집중 시작'}</button><button class="icon-btn" data-act="timer-reset" aria-label="타이머 초기화">${icon('reset',16)}</button></div>`;
 case 'shelf':return `<div class="card-top"><div><div class="eyebrow muted" style="font-size:8px;margin-bottom:6px">THINGS I LOVE</div><h2 class="card-title">내 취향의 보관함</h2></div>${iconButton('navigate','upRight','전체 보관함 보기','data-view="shelf"')}</div>${state.collections.length?`<div class="shelf-grid">${state.collections.slice(0,3).map(c=>`<button class="shelf-preview" data-act="collection-edit" data-id="${esc(c.id)}">${thumb(c)}<div class="shelf-title truncate">${esc(c.title)}</div><div class="shelf-sub">${c.type==='wishlist'?'₩'+money(c.price):`${c.type==='book'?'독서':'취미'} · ${c.progress}/${c.target}`}</div></button>`).join('')}</div>`:'<div class="empty">'+icon('heart',25)+'읽고 싶은 책, 배우고 싶은 취미,<br>찜해둔 물건을 모아보세요.</div><button class="task-add" data-act="collection-edit">'+icon('plus',14)+' 첫 번째 취향 담기</button>'}`;
 case 'money':{const e=expense(),budget=state.profile.budget;return `<div class="card-top"><h2 class="card-title">이번 달의 지갑</h2>${iconButton('transaction-edit','plus','수입·지출 추가')}</div><span class="small-label">${Number(ui.date.slice(5,7))}월 기록한 지출</span><div class="money-number">₩${money(e)}</div><div class="small-label">월 예산 ₩${money(budget)}</div><div class="budget-bar"><i style="width:${percent(e,budget)}%"></i></div><div class="money-row"><span class="muted">${e>budget?'예산 초과':'남은 예산'}</span><span>₩${money(Math.abs(budget-e))}</span></div><button class="text-button" style="margin-top:16px" data-act="money-view">돈의 흐름 보기 ${icon('upRight',13)}</button>`;}
 case 'pixels':return `<div class="card-top"><span class="eyebrow muted" style="font-size:9px">LIFE IN PIXELS</span><span class="small-label">최근 13주 · ${state.profile.sample?'샘플 기록':'내 기록'}</span></div><div class="pixel-wrap"><div class="pixel-copy"><h3>하루하루, 다른 색.</h3><p>작은 조각들이 모여<br>나의 계절이 돼요.</p></div>${pixelGrid()}</div>${pixelLegend()}`;
 default:return '';}}
function renderToday(){return heading(`오늘도, ${esc(state.profile.name)}님답게.`,ui.date===TODAY?'해야 할 일 사이에, 좋아하는 일도 잊지 말아요.':'이날의 계획과 기록을 보고 있어요.',`<button class="icon-btn" data-act="date-picker" aria-label="날짜 선택">${icon('calendar',17)}</button>`)+weekStrip()+`<div class="dashboard-grid">${state.cards.filter(c=>c.on).map(c=>`<section class="card span-${CARD_DEFS[c.id].span} ${c.id==='hero'?'hero':c.id==='mood'?'mood-card':c.id==='journal'?'journal-card':c.id==='focus'?'focus-card':c.id==='pixels'?'pixel-card':''}" data-card="${c.id}">${cardContent(c.id)}</section>`).join('')}</div>${state.cards.every(c=>!c.on)?'<div class="empty">보여줄 카드를 골라보세요.<br><button class="button soft" data-act="customize">내 공간 꾸미기</button></div>':''}`;}
function renderCalendar(){const d=fromKey(ui.month+'-01'),year=d.getFullYear(),month=d.getMonth(),start=shift(ui.month+'-01',-((d.getDay()+6)%7)),days=new Date(year,month+1,0).getDate(),count=Math.ceil((days+((d.getDay()+6)%7))/7)*7;
 let content='';if(ui.calendarMode==='month'){content=`<div class="calendar-header">${['월','화','수','목','금','토','일'].map(x=>'<span>'+x+'</span>').join('')}</div><div class="month-grid">${Array.from({length:count},(_,i)=>{const k=shift(start,i),ts=tasksOn(k);return `<div class="month-cell ${k===ui.date?'selected':''} ${monthKey(k)!==ui.month?'other':''}" data-act="calendar-date" data-date="${k}" role="button" tabindex="0" aria-label="${dateLabel(k)}, 일정 ${ts.length}개"><span class="month-date ${k===TODAY?'today':''}">${fromKey(k).getDate()}</span>${ts.slice(0,3).map(t=>`<div class="mini-event ${t.category}">${t.done?'✓ ':''}${esc(t.title)}</div>`).join('')}${ts.length>3?'<small class="muted">+'+(ts.length-3)+'</small>':''}${moodOn(k)?'<span style="font-size:10px">'+MOODS[moodOn(k).value].emoji+'</span>':''}</div>`}).join('')}</div>`;}else{content=`<div class="week-calendar">${Array.from({length:7},(_,i)=>{const k=shift(weekStart(ui.date),i),ts=tasksOn(k);return `<div class="week-col ${k===ui.date?'selected':''}"><button class="week-col-head" data-act="calendar-date" data-date="${k}"><span>${['일','월','화','수','목','금','토'][fromKey(k).getDay()]}</span><span class="month-date ${k===TODAY?'today':''}">${fromKey(k).getDate()}</span></button>${ts.map(t=>`<button class="week-event ${t.category}" data-act="task-edit" data-id="${esc(t.id)}"><time>${esc(t.time)||'언제든'} · ${t.duration}분</time>${esc(t.title)}${t.done?' ✓':''}</button>`).join('')}<button class="task-add" data-act="task-edit" data-date="${k}" aria-label="${dateLabel(k)} 일정 추가">${icon('plus',14)}</button></div>`}).join('')}</div>`;}
 const selected=tasksOn(ui.date);return heading('나의 시간들.','바쁜 날도, 비워두는 날도 모두 나의 계획.',`<button class="button" data-act="task-edit">${icon('plus',14)} 일정</button>`)+`<div class="view-toolbar"><div class="row month-controls">${iconButton('calendar-prev','left','이전 달 또는 주')}<b style="font-weight:500">${ui.calendarMode==='month'?year+'년 '+(month+1)+'월':dateLabel(weekStart(ui.date),{month:'short',day:'numeric'})+' — '+dateLabel(shift(weekStart(ui.date),6),{month:'short',day:'numeric'})}</b>${iconButton('calendar-next','right','다음 달 또는 주')}<button class="chip" data-act="today-date">오늘</button></div><div class="segmented"><button class="segment ${ui.calendarMode==='month'?'active':''}" data-act="calendar-mode" data-mode="month">월간</button><button class="segment ${ui.calendarMode==='week'?'active':''}" data-act="calendar-mode" data-mode="week">주간</button></div></div><section class="card calendar-card">${content}</section><section class="card calendar-agenda"><div class="card-top"><h2 class="card-title">${dateLabel(ui.date)} <span class="muted" style="font-size:11px;margin-left:8px">${selected.length}개의 일정</span></h2>${iconButton('task-edit','plus','선택한 날짜에 일정 추가')}</div><div class="task-list">${selected.length?selected.map(taskRow).join(''):'<div class="empty">아직 일정이 없어요. 여유를 즐기거나 새 계획을 더해보세요.</div>'}</div></section>`;}
function renderNotes(){const notes=state.notes.filter(n=>ui.noteFilter==='all'||(ui.noteFilter==='pinned'?n.pinned:n.category===ui.noteFilter)).sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.date.localeCompare(a.date));return `<div class="filter-chips">${[['all','전체'],['daily','하루 기록'],['memo','메모'],['work','업무'],['idea','아이디어'],['pinned','고정한 기록']].map(([id,label])=>`<button class="filter-chip ${ui.noteFilter===id?'active':''}" data-act="note-filter" data-filter="${id}">${label}</button>`).join('')}</div><div class="notes-grid">${notes.map(n=>`<button class="note-card" data-act="note-edit" data-id="${esc(n.id)}"><div class="between"><span class="chip white">${NOTE_CAT[n.category]}</span>${n.pinned?icon('pin',14):icon('upRight',16)}</div><h3>${esc(n.title)}</h3><div class="note-body">${esc(n.body)}</div>${n.photo?`<img class="note-photo" src="${esc(n.photo)}" alt="기록 사진" loading="lazy">`:''}<div class="note-footer">${dateLabel(n.date,{month:'short',day:'numeric'})} · 나의 기록</div></button>`).join('')}</div>${notes.length?'':'<div class="empty">'+icon('note',30)+'떠오르는 생각부터 가볍게 남겨보세요.<br><button class="text-button" data-act="note-edit">첫 기록 남기기 ↗</button></div>'}`;}
function renderJournal(){const logs=moodsOn(ui.date),notes=state.notes.filter(n=>n.date===ui.date&&n.category==='daily');return weekStrip()+`<div class="journal-layout"><section class="card mood-card">${cardContent('mood')}<button class="text-button" data-act="mood-edit">이유도 함께 남기기 ↗</button><div style="margin-top:20px">${logs.slice().reverse().map(m=>`<div class="mood-history"><div class="between"><span>${MOODS[m.value].emoji} ${MOODS[m.value].label}</span><span class="small-label">${esc(m.time)}</span></div>${m.note?'<p style="font-size:11px;line-height:1.8;margin-top:9px">'+esc(m.note)+'</p>':''}<button class="text-button" style="font-size:10px" data-act="mood-delete" data-id="${esc(m.id)}">삭제</button></div>`).join('')}</div></section><section class="card journal-card"><div class="card-top"><h2 class="card-title">하루를 담는 질문</h2>${icon('spark',18)}</div><div class="quote">오늘 가장 오래<br>기억하고 싶은 순간은?</div><p>한 문장, 사진 한 장. 어떤 방식이든 좋아요.</p><button class="button" style="margin-top:20px" data-act="note-edit" data-category="daily">${icon('edit',14)} 오늘 기록하기</button>${notes.map(n=>`<button class="note-card" style="margin-top:20px;min-height:0;background:var(--card)" data-act="note-edit" data-id="${esc(n.id)}"><h3 style="margin-top:0">${esc(n.title)}</h3><p class="note-body">${esc(n.body)}</p>${n.photo?'<img class="note-photo" src="'+esc(n.photo)+'" alt="오늘의 사진">':''}</button>`).join('')}</section><section class="card" style="grid-column:1/-1">${cardContent('pixels')}</section></div>`;}
function renderRecords(){return heading('사라지기 전에, 기록.','짧은 메모도, 소중한 순간도 여기에.',`<button class="button" data-act="note-edit">${icon('plus',14)} 기록</button>`)+`<div class="view-toolbar"><div class="segmented"><button class="segment ${ui.recordTab==='notes'?'active':''}" data-act="record-tab" data-tab="notes">모든 노트</button><button class="segment ${ui.recordTab==='journal'?'active':''}" data-act="record-tab" data-tab="journal">일기와 마음</button></div>${state.draft?'<button class="text-button" data-act="note-edit">작성 중인 기록 이어쓰기 ↗</button>':''}</div>`+(ui.recordTab==='journal'?renderJournal():renderNotes());}
function collectionCard(c){const pct=percent(c.progress,c.target);return `<article class="collection-card">${thumb(c)}<div class="collection-details"><div class="between"><h3>${esc(c.title)}</h3>${iconButton('collection-edit','dots','항목 수정','data-id="'+esc(c.id)+'"')}</div><span class="chip">${{book:'READING',wishlist:'WISHLIST',hobby:'HOBBY'}[c.type]}</span><p class="collection-description">${esc(c.description)}</p>${c.type==='wishlist'?`<div class="collection-price">₩${money(c.price)}</div>`:`<div class="collection-progress"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><small>${c.progress}/${c.target}</small>${iconButton('collection-step','plus','진행량 추가','data-id="'+esc(c.id)+'"')}</div>`}<div class="collection-footer">${c.type==='wishlist'?`<button class="button ${c.status==='bought'?'light':'soft'}" data-act="collection-bought" data-id="${esc(c.id)}">${icon(c.status==='bought'?'check':'bag',12)} ${c.status==='bought'?'구매 완료':'구매 기록'}</button>`:`<span class="small-label">${pct>=100?'차곡차곡, 목표 달성!':pct+'% 진행 중'}</span>`}${safeUrl(c.url)?`<a class="icon-btn small" href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener noreferrer" aria-label="${esc(c.title)} 링크 열기">${icon('upRight',14)}</a>`:''}</div></div></article>`;}
function renderWorkouts(){const list=state.workouts.slice().sort((a,b)=>b.date.localeCompare(a.date));return `<div class="between" style="margin:15px 0 18px"><p class="small-label">운동도 나만의 페이스로. 세트·횟수·중량·시간을 기록해요.</p><button class="button soft" data-act="workout-edit">${icon('plus',14)} 운동 기록</button></div><div class="workout-list">${list.map(w=>`<div class="workout-item"><div class="workout-icon">${icon('dumbbell',22)}</div><div class="grow"><h3 style="font-size:15px;font-weight:500">${esc(w.name)}</h3><p class="small-label" style="margin-top:7px">${dateLabel(w.date,{month:'short',day:'numeric'})} · ${w.duration}분</p></div><div class="workout-metrics"><span>세트<b>${w.sets}</b></span><span>횟수<b>${w.reps}</b></span><span>kg<b>${w.weight}</b></span></div>${iconButton('workout-edit','edit','운동 수정','data-id="'+esc(w.id)+'"')}</div>`).join('')}${list.length?'':'<div class="empty">'+icon('dumbbell',30)+'가벼운 산책부터 근력 운동까지,<br>움직인 시간을 남겨보세요.</div>'}</div>`;}
function renderShelf(){const items=state.collections.filter(c=>ui.shelfFilter==='all'||c.type===ui.shelfFilter),wish=state.collections.filter(c=>c.type==='wishlist'&&c.status!=='bought');return heading('좋아하는 것의 모양.','취미, 읽고 있는 책, 언젠가 사고 싶은 물건.',`<button class="button" data-act="collection-edit">${icon('plus',14)} 담기</button>`)+`<div class="filter-chips">${[['all','전체'],['book','책'],['hobby','취미'],['wishlist','쇼핑'],['workout','운동']].map(([id,label])=>`<button class="filter-chip ${ui.shelfFilter===id?'active':''}" data-act="shelf-filter" data-filter="${id}">${label}</button>`).join('')}</div>${ui.shelfFilter==='workout'?renderWorkouts():`${ui.shelfFilter==='wishlist'?`<div class="all-good" style="margin:5px 0 20px">${icon('bag',20)}<div>찜한 물건 ${wish.length}개 · 합계 ₩${money(wish.reduce((a,c)=>a+c.price,0))}<br><small class="muted">구매 기록을 누르면 지출에도 한 번만 반영돼요.</small></div></div>`:''}<div class="large-collection-grid">${items.map(collectionCard).join('')}</div>${items.length?'':'<div class="empty">'+icon('heart',30)+'좋아하는 것부터 하나 담아보세요.</div>'}`}`;}
function renderLifeInsights(){const start=weekStart(ui.date),weekTasks=state.tasks.filter(t=>t.date>=start&&t.date<=shift(start,6)),done=weekTasks.filter(t=>t.done).length,focus=state.focus.filter(f=>f.date>=start&&f.date<=shift(start,6)).reduce((a,f)=>a+f.minutes,0),moodDays=new Set(state.moods.filter(m=>monthKey(m.date)===monthKey(ui.date)).map(m=>m.date)).size;const bars=Array.from({length:7},(_,i)=>{const d=shift(start,i);return {date:d,count:tasksOn(d).filter(t=>t.done).length,label:['월','화','수','목','금','토','일'][i]}}),max=Math.max(1,...bars.map(b=>b.count));return `<div class="stat-cards"><div class="stat-card"><span class="small-label">이번 주 완료한 일</span><strong>${done}<span style="font-size:14px"> / ${weekTasks.length}</span></strong><p>완료한 일정 기준</p></div><div class="stat-card"><span class="small-label">이번 주 집중 시간</span><strong>${focus}<span style="font-size:14px">분</span></strong><p>완료한 타이머 세션</p></div><div class="stat-card"><span class="small-label">이달의 마음 기록</span><strong>${moodDays}<span style="font-size:14px">일</span></strong><p>하루 한 번의 체크인부터</p></div><div class="stat-card"><span class="small-label">남긴 이야기</span><strong>${state.notes.length}<span style="font-size:14px">개</span></strong><p>일기와 메모를 합쳐서</p></div></div><div class="insight-grid"><section class="card"><div class="card-top"><h2 class="card-title">이번 주, 하나씩 해냈어요.</h2><span class="small-label">완료한 일</span></div><div class="bar-chart">${bars.map(b=>`<div class="bar-col ${b.date===ui.date?'active':''}"><small>${b.count}</small><i style="height:${Math.round(b.count/max*105)}px"></i><span>${b.label}</span></div>`).join('')}</div></section><section class="card"><div class="card-top"><h2 class="card-title">내 작은 약속들</h2>${iconButton('habit-edit','plus','습관 추가')}</div>${state.habits.length?state.habits.map(h=>{const n=Array.from({length:7},(_,i)=>shift(start,i)).filter(d=>h.checkins.includes(d)).length;return `<div class="habit-row"><div class="habit-icon">${icon(h.icon,17)}</div><div class="grow"><div class="habit-label">${esc(h.title)}</div><div class="progress-track" style="margin-top:8px"><div class="progress-fill" style="width:${percent(n,7)}%"></div></div></div><small>${n}/7일</small>${iconButton('habit-edit','edit','습관 수정','data-id="'+esc(h.id)+'"')}</div>`}).join(''):'<div class="empty">실천하고 싶은 습관을 만들어보세요.</div>'}</section><section class="card" style="grid-column:1/-1">${cardContent('pixels')}</section></div>`;}
function renderMoneyInsights(){const tx=monthTx().sort((a,b)=>b.date.localeCompare(a.date)),e=expense(),income=tx.filter(t=>t.type==='income').reduce((a,t)=>a+t.amount,0),pending=tx.filter(t=>t.type==='pending').reduce((a,t)=>a+t.amount,0);return `<div class="stat-cards"><div class="stat-card"><span class="small-label">${Number(ui.date.slice(5,7))}월 들어온 돈</span><strong style="font-size:25px">₩${money(income)}</strong><p>실제 수입만 합산</p></div><div class="stat-card"><span class="small-label">기록한 지출</span><strong style="font-size:25px">₩${money(e)}</strong><p>구매 기록 포함</p></div><div class="stat-card"><span class="small-label">수입 − 지출</span><strong style="font-size:25px">₩${money(income-e)}</strong><p>미수금 제외</p></div><div class="stat-card"><span class="small-label">받을 예정</span><strong style="font-size:25px">₩${money(pending)}</strong><p>입금 완료 시 수입으로 전환</p></div></div><div class="insight-grid"><section class="card"><div class="card-top"><h2 class="card-title">돈의 흐름</h2><button class="button soft" data-act="transaction-edit">${icon('plus',14)} 내역 추가</button></div>${tx.length?tx.map(t=>`<div class="transaction"><div class="habit-icon" style="background:${t.type==='expense'?'var(--sand)':t.type==='income'?'var(--blue)':'var(--yellow)'}">${icon(t.type==='expense'?'bag':'wallet',17)}</div><button class="grow" style="text-align:left;padding:0" data-act="transaction-edit" data-id="${esc(t.id)}"><div style="font-size:12px">${esc(t.title)}</div><p class="small-label" style="margin-top:5px">${dateLabel(t.date,{month:'short',day:'numeric'})} · ${{expense:'지출',income:'수입',pending:'받을 예정'}[t.type]}</p></button><span class="amount ${t.type}">${t.type==='expense'?'−':'+'}₩${money(t.amount)}</span>${t.type==='pending'?iconButton('transaction-paid','check','입금 완료 처리','data-id="'+esc(t.id)+'"'):''}</div>`).join(''):'<div class="empty">아직 기록한 수입·지출이 없어요.</div>'}</section><section class="card"><div class="card-top"><h2 class="card-title">이번 달의 예산</h2><button class="text-button" data-act="budget-edit">수정</button></div><div class="money-pie" style="--p:${percent(e,state.profile.budget)}"><b>${state.profile.budget?Math.round(e/state.profile.budget*100)+'%':'미설정'}</b></div><div class="money-row"><span class="muted">예산</span><b>₩${money(state.profile.budget)}</b></div><div class="money-row"><span class="muted">사용한 돈</span><b>₩${money(e)}</b></div><div class="money-row"><span class="muted">${e>state.profile.budget?'초과한 금액':'남은 금액'}</span><b>₩${money(Math.abs(state.profile.budget-e))}</b></div><p class="preview-tag" style="margin-top:20px">직접 기록한 내역만 보여요.<br>은행·카드 내역은 연결되지 않습니다.</p></section></div>`;}
function renderInsights(){return heading('쌓인 하루를 돌아보면.','잘한 날도, 쉬어간 날도 의미 있는 기록이에요.',`<button class="icon-btn" data-act="date-picker" aria-label="기준 날짜 선택">${icon('calendar',17)}</button>`)+`<div class="view-toolbar"><div class="segmented"><button class="segment ${ui.insightTab==='life'?'active':''}" data-act="insight-tab" data-tab="life">생활 리포트</button><button class="segment ${ui.insightTab==='money'?'active':''}" data-act="insight-tab" data-tab="money">수입과 지출</button></div><span class="stats-month">${dateLabel(ui.date,{year:'numeric',month:'long'})}</span></div>`+(ui.insightTab==='money'?renderMoneyInsights():renderLifeInsights());}
function render(){nav();renderWarning();$('#sampleBanner').innerHTML=state.profile.sample?`<div class="sample-banner"><span>✳ 샘플로 둘러보는 중이에요.<span class="sample-detail"> 기록과 통계는 사용 예시입니다.</span></span><button data-act="onboarding">내 하루 시작하기 ↗</button></div>`:'';$('#app').innerHTML=({today:renderToday,calendar:renderCalendar,records:renderRecords,shelf:renderShelf,insights:renderInsights}[ui.view])();$('#saveStatus').innerHTML=persisted?icon('lock',11)+' 이 기기에 저장':icon('lock',11)+' 저장 확인 필요';updateTimerUI();}
function modal(title,body){$('#modalContent').innerHTML=`<div class="sheet-head"><h2 id="dialogTitle">${title}</h2><button class="icon-btn small" data-act="close" aria-label="닫기">${icon('close',17)}</button></div>${body}`;$('#modal').setAttribute('aria-labelledby','dialogTitle');if(!$('#modal').open)$('#modal').showModal();requestAnimationFrame(()=>$('#modalContent').querySelector('[autofocus]')?.focus());}
function closeModal(){$('#modal').close();}
function formActions(kind,id){return `<div class="form-actions">${id?`<button type="button" class="button danger" data-act="delete" data-kind="${kind}" data-id="${esc(id)}">${icon('trash',13)} 삭제</button>`:''}<button type="button" class="button light" data-act="close">닫기</button><button type="submit" class="button">저장하기 ${icon('check',14)}</button></div>`;}
function field(label,name,value='',type='text',extra=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;}
function selectField(label,name,value,options){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${Object.entries(options).map(([v,l])=>`<option value="${v}" ${v===value?'selected':''}>${l}</option>`).join('')}</select></div>`;}
function textareaField(label,name,value,placeholder=''){return `<div class="field"><label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" maxlength="30000" placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`;}
function photoField(){return `<label class="file-field">${icon('camera',18)} 사진 한 장 더하기<input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp,image/heic"><small class="muted">8MB 이하 · 용량을 줄여 기기에 저장해요.</small></label><img id="photoPreview" class="photo-preview ${ui.photo?'':'hidden'}" ${ui.photo?'src="'+esc(ui.photo)+'"':''} alt="선택한 사진 미리보기"><button type="button" class="text-button ${ui.photo?'':'hidden'}" id="removePhoto" data-act="remove-photo">사진 빼기</button>`;}
function taskEditor(id,date){const t=state.tasks.find(t=>t.id===id)||{id:'',title:'',date:date||ui.date,time:'',duration:30,category:'life',notes:'',done:false};modal(t.id?'일정의 모양 바꾸기':'새로운 하루의 조각',`<form data-kind="task" data-id="${esc(t.id)}"><div class="form-fields">${field('무엇을 할까요?','title',t.title,'text','required maxlength="180" autofocus placeholder="예: 저녁에 책 20쪽 읽기"')}<div class="field-row">${field('날짜','date',t.date,'date','required')}${field('시작 시간 · 선택','time',t.time,'time')}</div><div class="field-row">${selectField('어떤 조각인가요?','category',t.category,CAT)}${field('예상 시간 · 분','duration',t.duration,'number','required min="1" max="1440"')}</div>${textareaField('기억할 내용','notes',t.notes,'장소, 준비물, 작은 메모를 남겨요.')}${t.id?`<label class="form-check"><input class="checkbox-input" name="done" type="checkbox" ${t.done?'checked':''}> 이미 완료했어요</label>`:''}</div>${formActions('tasks',t.id)}</form>`);}
function noteEditor(id,category='memo'){const old=state.notes.find(n=>n.id===id);let n=old||{id:'',title:'',body:'',category,date:ui.date,pinned:false,photo:''};if(!old&&state.draft&&!id)n={...n,...state.draft,id:''};ui.photo=n.photo||'';modal(n.id?'나의 기록':'흘러가기 전에, 한 줄',`<form data-kind="note" data-id="${esc(n.id)}"><div class="form-fields">${field('기록의 제목','title',n.title,'text','required maxlength="180" autofocus placeholder="오늘을 어떤 이름으로 남길까요?"')}<div class="field-row">${selectField('기록 종류','category',n.category,NOTE_CAT)}${field('기록 날짜','date',n.date,'date','required')}</div>${textareaField('나의 이야기','body',n.body,'생각나는 대로 편하게 적어보세요.')}<small class="muted" style="font-size:10px">새 기록은 작성 중에도 임시 저장돼요. 저장 버튼으로 완성해주세요.</small>${photoField()}<label class="form-check"><input class="checkbox-input" name="pinned" type="checkbox" ${n.pinned?'checked':''}> 자주 보고 싶어요 · 상단 고정</label></div>${formActions('notes',n.id)}</form>`);}
function habitEditor(id){const h=state.habits.find(h=>h.id===id)||{id:'',title:'',icon:'sun'};modal(h.id?'작은 약속 바꾸기':'나와의 작은 약속',`<form data-kind="habit" data-id="${esc(h.id)}"><p class="sheet-description">거창한 목표보다 매일 할 수 있는 작은 행동 하나.<br>완료 체크는 날짜별로 따로 기록돼요.</p><div class="form-fields">${field('어떤 습관을 만들까요?','title',h.title,'text','required maxlength="100" autofocus placeholder="예: 자기 전에 10분 스트레칭"')}${selectField('아이콘','icon',h.icon,{water:'물방울 · 수분',book:'책 · 독서',walk:'걷기 · 산책',sun:'태양 · 아침 루틴',heart:'마음 · 나 돌보기',dumbbell:'운동 · 건강'})}</div>${formActions('habits',h.id)}</form>`);}
function moodEditor(){modal('지금의 마음, 그대로.',`<p class="sheet-description">좋고 나쁜 마음을 나누지 않아요. 오늘의 느낌을 남겨두세요.<br>${dateLabel(ui.date)}의 기록입니다.</p><form data-kind="mood"><div class="form-fields">${selectField('어떤 기분인가요?','value',moodOn(ui.date)?.value||'calm',Object.fromEntries(Object.entries(MOODS).map(([k,m])=>[k,m.emoji+' '+m.label])))}${textareaField('왜 그런 기분이 들었나요? · 선택','note','','기분에 이름을 붙이고, 나를 조금 더 이해해요.')}</div>${formActions('moods','')}</form>`);}
function collectionEditor(id,type){const c=state.collections.find(c=>c.id===id)||{id:'',title:'',type:type||'wishlist',description:'',price:0,url:'',photo:'',progress:0,target:100,status:'saved'};ui.photo=c.photo||'';modal(c.id?'내 취향을 조금 더 자세히':'좋아하는 것 담기',`<form data-kind="collection" data-id="${esc(c.id)}"><div class="form-fields">${field('이름','title',c.title,'text','required maxlength="180" autofocus placeholder="책, 배우고 싶은 취미, 찜한 물건"')}${selectField('어느 보관함에 둘까요?','type',c.type,{wishlist:'쇼핑 위시리스트',book:'읽는 책',hobby:'배우는 취미'})}${textareaField('마음에 든 이유','description',c.description,'왜 담아두고 싶은지 적어보세요.')}<div class="field-row">${field('가격 · 원','price',c.price,'number','required min="0" max="999999999"')}${selectField('상태','status',c.status,{saved:'보관 중',doing:'진행 중',done:'완료',bought:'구매 완료'})}</div><div class="field-row">${field('현재 진행량 · 책은 쪽수','progress',c.progress,'number','required min="0" max="999999"')}${field('목표량 · 취미는 횟수','target',c.target,'number','required min="1" max="999999"')}</div>${field('구매·참고 링크 · 선택','url',c.url,'url','maxlength="2000" placeholder="https://"')}<p class="small-label" style="line-height:1.8">책·취미는 진행량/목표량으로 관리해요.<br>쇼핑의 지출 반영은 보관함의 ‘구매 기록’ 버튼을 이용해주세요.</p>${photoField()}</div>${formActions('collections',c.id)}</form>`);}
function workoutEditor(id){const w=state.workouts.find(w=>w.id===id)||{id:'',date:ui.date,name:'',sets:3,reps:12,weight:0,duration:30};modal(w.id?'움직임의 기록 수정':'오늘의 움직임',`<form data-kind="workout" data-id="${esc(w.id)}"><div class="form-fields">${field('운동 이름','name',w.name,'text','required maxlength="180" autofocus placeholder="예: 스쿼트, 러닝, 요가"')}${field('날짜','date',w.date,'date','required')}<div class="field-row">${field('세트','sets',w.sets,'number','required min="1" max="999"')}${field('세트당 횟수','reps',w.reps,'number','required min="1" max="9999"')}</div><div class="field-row">${field('중량 · kg','weight',w.weight,'number','required min="0" max="9999" step="0.1"')}${field('운동 시간 · 분','duration',w.duration,'number','required min="1" max="1440"')}</div></div>${formActions('workouts',w.id)}</form>`);}
function transactionEditor(id){const t=state.transactions.find(t=>t.id===id)||{id:'',date:ui.date,title:'',amount:0,type:'expense'};modal(t.id?'돈의 기록 수정':'돈의 흐름 남기기',`<form data-kind="transaction" data-id="${esc(t.id)}"><div class="form-fields">${field('어떤 내역인가요?','title',t.title,'text','required maxlength="180" autofocus placeholder="예: 커피, 재료비, 프로젝트 작업비"')}<div class="field-row">${selectField('종류','type',t.type,{expense:'나간 돈 · 지출',income:'들어온 돈 · 수입',pending:'받을 예정 · 미수금'})}${field('날짜','date',t.date,'date','required')}</div>${field('금액 · 원','amount',t.amount||'','number','required min="1" max="99999999999" step="1"')}${t.collectionId?'<p class="sheet-description">쇼핑 보관함의 구매 기록과 연결된 내역이에요.</p>':''}</div>${formActions('transactions',t.id)}</form>`);}
function safeUrl(url){try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:''}catch(_){return ''}}
function quickAdd(){modal('오늘에 무엇을 더할까요?',`<p class="sheet-description">일도 일상도, 나를 이루는 작은 조각들.</p><div class="quick-grid">${[['task-edit','calendar','일정과 할 일','할 일 · 약속 · 업무'],['note-edit','note','메모와 아이디어','떠오르는 생각 한 줄'],['journal-add','camera','오늘의 기록','사진 · 일기 · 순간'],['shop-add','bag','쇼핑과 취향','찜한 물건 · 책 · 취미'],['workout-edit','dumbbell','운동 기록','세트 · 횟수 · 중량'],['transaction-edit','wallet','수입과 지출','내 돈의 작은 흐름']].map(([act,ic,title,sub])=>`<button class="quick-button" data-act="${act}">${icon(ic,23)}<span>${title}</span><small>${sub}</small></button>`).join('')}</div>`);}
function customize(){modal('나에게 맞는 대시보드',`<p class="sheet-description">필요한 카드만 켜고, 자주 보는 카드를 위로 올려보세요.<br>오늘 화면에 바로 반영돼요.</p><div class="theme-swatches" style="margin-bottom:20px">${[['cream','크림'],['blue','블루'],['lilac','라벤더']].map(([id,label])=>`<button class="theme-swatch ${state.profile.theme===id?'active':''}" data-act="theme" data-theme="${id}" data-return="customize">${label}</button>`).join('')}</div>${state.cards.map((c,i)=>`<div class="card-config"><div class="grow" style="font-size:12px">${CARD_DEFS[c.id].label}</div><button class="icon-btn small" data-act="card-move" data-id="${c.id}" data-n="-1" aria-label="${CARD_DEFS[c.id].label} 위로" ${i===0?'disabled':''}>${icon('up',13)}</button><button class="icon-btn small" data-act="card-move" data-id="${c.id}" data-n="1" aria-label="${CARD_DEFS[c.id].label} 아래로" ${i===state.cards.length-1?'disabled':''}>${icon('down',13)}</button><button class="toggle ${c.on?'on':''}" data-act="card-toggle" data-id="${c.id}" role="switch" aria-checked="${c.on}" aria-label="${CARD_DEFS[c.id].label} 표시"></button></div>`).join('')}<div class="form-actions"><button class="button" data-act="close">내 공간 보기 ${icon('check',14)}</button></div>`);}
function settings(){modal('내 공간의 설정',`<form data-kind="profile"><div class="form-fields">${field('어떻게 불러드릴까요?','name',state.profile.name,'text','required maxlength="30"')}<button class="button light" type="submit" style="justify-self:start">이름 저장</button></div></form><div class="settings-block" style="margin-top:22px"><h3>오늘의 분위기</h3><div class="theme-swatches">${[['cream','크림'],['blue','블루'],['lilac','라벤더']].map(([id,label])=>`<button class="theme-swatch ${state.profile.theme===id?'active':''}" data-act="theme" data-theme="${id}" data-return="settings">${label}</button>`).join('')}</div></div><div class="settings-block"><h3>내 데이터, 내가 보관하기</h3><p>기록과 사진은 현재 브라우저의 이 기기에 저장됩니다. 다른 휴대폰·브라우저와 자동으로 동기화되지는 않아요. 브라우저 데이터를 지우기 전 백업을 내려받아주세요.</p><div class="settings-buttons"><button class="button light" data-act="export">${icon('download',14)} 백업 내보내기</button><button class="button light" data-act="import">${icon('upload',14)} 백업 불러오기</button></div><p>JSON 백업에는 사진, 기록, 설정이 함께 담겨요.<br>백업 불러오기는 현재 기록을 대체하므로 먼저 내보내주세요.</p></div><div class="settings-block"><h3>나만의 첫 하루</h3><p>${state.profile.sample?'현재 보이는 기록과 통계는 샘플입니다. 내 하루를 시작하면 샘플을 비우고 새 공간을 만들어요.':'나만의 기록으로 사용 중이에요.'}</p><div class="settings-buttons"><button class="button soft" data-act="onboarding">${icon('spark',14)} ${state.profile.sample?'내 하루 시작하기':'새 공간 시작하기'}</button><button class="button light" data-act="demo-reset">샘플로 둘러보기</button></div></div><div class="settings-block"><h3>DAYFORM · FIRST EDITION</h3><p>일정 · 메모 · 일기 · 취미 · 운동 · 쇼핑 · 수입과 지출.<br>사진 속 카드 디자인에서 출발한 개인용 웹앱 첫 버전입니다.<br>계정·클라우드 동기화, 자동 외부 연동, 친구 커뮤니티, 결제는 포함되어 있지 않습니다.</p><button class="text-button" data-act="customize">대시보드 카드 편집하기 ↗</button></div>`);}
function onboarding(){ui.onboardInterests=['work','life','hobby','shop'];modal('나만의 하루를 시작해요.',`<p class="sheet-description">샘플 대신 나의 기록으로 채울 준비가 됐나요?<br>현재 기록이 있다면 먼저 백업해주세요.</p><form data-kind="onboarding"><div class="form-fields">${field('나를 부를 이름','name',state.profile.sample?'':state.profile.name,'text','required maxlength="30" autofocus placeholder="이름 또는 닉네임"')}<div class="field"><span class="field-label">하루에 담고 싶은 것들</span><div class="onboarding-chips">${[['work','일과 업무'],['life','일상과 마음'],['hobby','취미와 운동'],['shop','쇼핑과 지출']].map(([id,label])=>`<button class="onboard-choice on" type="button" data-act="onboard-interest" data-id="${id}">${label} ✓</button>`).join('')}</div><small>고른 관심사에 맞게 카드를 켜드려요. 나중에 바꿔도 괜찮아요.</small></div><label class="form-check"><input name="ack" class="checkbox-input" type="checkbox" required> 기존 기록을 비우고 시작하는 것을 확인했어요.</label></div><div class="form-actions"><button class="button light" type="button" data-act="export">기존 기록 백업</button><button class="button" type="submit">내 하루 시작 ${icon('arrow',14)}</button></div></form>`);}
function confirmAction(title,message,action){modal(title,`<p class="sheet-description">${message}</p><div class="form-actions"><button class="button light" data-act="close">취소</button><button class="button" data-act="confirm-action">계속하기</button></div>`);pendingAction=action;}
let pendingAction=null;
function upsert(key,item){const i=state[key].findIndex(x=>x.id===item.id);if(i>=0)state[key][i]={...state[key][i],...item};else state[key].unshift(item);}
function nowTime(){return new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
function addMood(value,note=''){state.moods.push({id:uid(),date:ui.date,time:nowTime(),value,note});save();render();toast('지금의 마음을 남겼어요.');}
function timerRemaining(){return state.timer.running?Math.max(0,Math.ceil((state.timer.endAt-Date.now())/1000)):state.timer.remaining}
function timerText(){const s=timerRemaining();return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function updateTimerUI(){const display=$('#timerDisplay');if(display)display.textContent=timerText();const toggle=$('#timerToggle');if(toggle)toggle.innerHTML=icon(state.timer.running?'pause':'play',14)+(state.timer.running?' 잠깐 쉬기':' 집중 시작');}
function timerTick(){if(state.timer.running&&timerRemaining()===0){state.focus.push({id:uid(),date:state.timer.date||TODAY,minutes:state.timer.sessionMinutes});state.timer.running=false;state.timer.remaining=state.timer.sessionMinutes*60;state.timer.endAt=null;save();render();toast('집중 시간을 기록했어요. 가볍게 쉬어가세요.');}else updateTimerUI();}
function exportBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});download(blob,`dayform-backup-${TODAY}.json`);toast('기록과 사진을 백업했어요.');}
function download(blob,name){const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function searchModal(){ui.search='';modal('내 하루에서 찾기',`<div class="search-input-wrap">${icon('search',20)}<input id="searchInput" type="search" placeholder="기록, 일정, 취향을 검색해요" autofocus aria-label="검색어"></div><div id="searchResults"><div class="empty">무엇을 찾고 있나요?</div></div>`);}
function searchResults(q){q=q.trim().toLocaleLowerCase();const results=[];if(q){for(const [key,act,ic,label,title] of [['tasks','task-edit','calendar','일정','title'],['notes','note-edit','note','기록','title'],['collections','collection-edit','heart','보관함','title'],['workouts','workout-edit','dumbbell','운동','name'],['transactions','transaction-edit','wallet','수입·지출','title']]){state[key].filter(x=>[x[title],x.body,x.description,x.notes].filter(Boolean).join(' ').toLocaleLowerCase().includes(q)).forEach(x=>results.push({x,act,ic,label,title}))}}$('#searchResults').innerHTML=results.length?results.slice(0,35).map(({x,act,ic,label,title})=>`<button class="search-result" data-act="${act}" data-id="${esc(x.id)}"><div class="result-icon">${icon(ic,17)}</div><div class="grow"><h3>${esc(x[title])}</h3><p>${label}${x.date?' · '+dateLabel(x.date,{month:'short',day:'numeric'}):''}</p></div>${icon('upRight',15)}</button>`).join(''):`<div class="empty">${q?'아직 찾은 기록이 없어요.':'무엇을 찾고 있나요?'}</div>`;}
async function resizePhoto(file){if(!file)return '';if(file.size>8*1024*1024)throw new Error('8MB 이하의 사진을 골라주세요.');if(!/^image\/(jpeg|png|webp|heic)$/.test(file.type))throw new Error('JPG, PNG, WEBP 사진을 골라주세요.');return new Promise((resolve,reject)=>{const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{try{const canvas=document.createElement('canvas'),scale=Math.min(1,900/image.width,900/image.height);canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.74));}catch(e){reject(new Error('사진을 처리하지 못했어요. 다른 사진을 골라주세요.'));}finally{URL.revokeObjectURL(url)}};image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('이 사진은 브라우저에서 열 수 없어요. JPG로 바꿔주세요.'))};image.src=url;});}
function draftFromForm(form){const f=new FormData(form);return {title:String(f.get('title')||''),body:String(f.get('body')||''),category:String(f.get('category')||'memo'),date:String(f.get('date')||ui.date),pinned:f.has('pinned'),photo:ui.photo};}
let draftTimeout;
document.addEventListener('input',e=>{if(e.target.id==='searchInput'){searchResults(e.target.value);return}const form=e.target.closest('form[data-kind="note"]');if(form&&!form.dataset.id){state.draft=draftFromForm(form);clearTimeout(draftTimeout);draftTimeout=setTimeout(()=>save(),450);}});
document.addEventListener('change',async e=>{if(e.target.id==='photoInput'){const submit=$('#modalContent button[type="submit"]');if(submit)submit.disabled=true;try{ui.photo=await resizePhoto(e.target.files[0]);$('#photoPreview').src=ui.photo;$('#photoPreview').classList.remove('hidden');$('#removePhoto').classList.remove('hidden');const form=e.target.closest('form');if(form.dataset.kind==='note'&&!form.dataset.id){state.draft=draftFromForm(form);save()}}catch(err){toast(err.message)}finally{if(submit)submit.disabled=false;}}});
document.addEventListener('submit',e=>{const form=e.target.closest('form[data-kind]');if(!form)return;e.preventDefault();if(!form.reportValidity())return;clearTimeout(draftTimeout);const f=new FormData(form),id=form.dataset.id||uid(),kind=form.dataset.kind,val=k=>String(f.get(k)||'').trim(),num=k=>Number(f.get(k));
 if(['task','note','collection','transaction','habit','workout'].includes(kind)&&!(val(kind==='workout'?'name':'title'))){toast('이름 또는 제목을 입력해주세요.');return}
 switch(kind){case 'task':upsert('tasks',{id,title:val('title'),date:val('date'),time:val('time'),duration:num('duration'),category:val('category'),notes:val('notes'),done:f.has('done')});break;
 case 'note':upsert('notes',{id,title:val('title'),body:val('body'),category:val('category'),date:val('date'),pinned:f.has('pinned'),photo:ui.photo});if(!form.dataset.id)state.draft=null;break;
 case 'habit':{const old=state.habits.find(x=>x.id===id);upsert('habits',{id,title:val('title'),icon:val('icon'),checkins:old?.checkins||[]});break;}
 case 'mood':closeModal();addMood(val('value'),val('note'));return;
 case 'collection':{const progress=num('progress'),target=num('target');if(progress>target){toast('현재 진행량은 목표량 이하로 입력해주세요.');return}if(val('url')&&!safeUrl(val('url'))){toast('http 또는 https 링크를 입력해주세요.');return}upsert('collections',{id,title:val('title'),type:val('type'),description:val('description'),price:num('price'),status:val('status'),progress,target,url:val('url'),photo:ui.photo});break;}
 case 'workout':upsert('workouts',{id,name:val('name'),date:val('date'),sets:num('sets'),reps:num('reps'),weight:num('weight'),duration:num('duration')});break;
 case 'transaction':upsert('transactions',{id,title:val('title'),date:val('date'),amount:num('amount'),type:val('type')});break;
 case 'profile':if(!val('name'))return;state.profile.name=val('name');save();render();toast('이름을 저장했어요.');return;
 case 'budget':state.profile.budget=num('budget');break;
 case 'date':ui.date=val('date');ui.month=monthKey(ui.date);closeModal();render();return;
 case 'challenge':state.habits.push({id,title:val('title'),icon:val('icon'),checkins:[],challenge:{start:ui.date,end:shift(ui.date,6)}});break;
 case 'onboarding':{if(!val('name'))return;const interests=ui.onboardInterests,newState=freshState();newState.profile={...newState.profile,name:val('name'),theme:state.profile.theme,budget:state.profile.budget};newState.cards.forEach(c=>{if(c.id==='money'&&!interests.includes('shop')&&!interests.includes('work'))c.on=false;if(c.id==='shelf'&&!interests.includes('hobby')&&!interests.includes('shop'))c.on=false;if(c.id==='focus'&&!interests.includes('work'))c.on=false;if(['mood','journal','pixels'].includes(c.id)&&!interests.includes('life'))c.on=false;});state=newState;persisted=true;storageIssue='';ui.date=TODAY;ui.month=monthKey(TODAY);ui.view='today';location.hash='today';break;}
 default:return;}
 const ok=save();closeModal();render();if(ok)toast(kind==='onboarding'?'나만의 첫 하루를 시작해요.':'기록을 저장했어요.');});
function navigate(view){if(!VIEWS[view])return;ui.view=view;location.hash=view;render();window.scrollTo({top:0,behavior:'instant'});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const act=b.dataset.act,id=b.dataset.id;switch(act){
 case 'navigate':navigate(b.dataset.view);break;
 case 'close':closeModal();break;
 case 'quick':quickAdd();break;
 case 'task-edit':taskEditor(id,b.dataset.date);break;
 case 'task-check':{const t=state.tasks.find(t=>t.id===id);if(t){t.done=!t.done;save();render();if(t.done)toast('작은 성취 하나, 잘했어요.')}break;}
 case 'habit-check':{const h=state.habits.find(h=>h.id===id);if(h){const i=h.checkins.indexOf(ui.date);if(i>=0)h.checkins.splice(i,1);else h.checkins.push(ui.date);save();render();}break;}
 case 'habit-edit':habitEditor(id);break;
 case 'habit-manage':modal('나와의 작은 약속들',`<div class="stack">${state.habits.map(h=>`<button class="task" data-act="habit-edit" data-id="${esc(h.id)}">${icon(h.icon,18)}<span class="grow" style="text-align:left">${esc(h.title)}</span>${icon('edit',16)}</button>`).join('')}</div><div class="form-actions"><button class="button" data-act="habit-edit">새 습관 추가</button></div>`);break;
 case 'challenge':modal('일주일, 작은 도전.',`<p class="sheet-description">비교할 사람은 어제의 나뿐.<br>오늘부터 7일 동안 실천할 작은 습관을 정해봐요.</p><form data-kind="challenge"><div class="form-fields">${field('7일 동안 해보고 싶은 일','title','하루 10분, 나를 위한 시간','text','required maxlength="100"')}${selectField('도전의 아이콘','icon','heart',{heart:'나 돌보기',book:'매일 독서',walk:'매일 산책',water:'물 마시기',sun:'아침 루틴',dumbbell:'꾸준한 운동'})}<p class="small-label">기간: ${dateLabel(ui.date,{month:'short',day:'numeric'})} — ${dateLabel(shift(ui.date,6),{month:'short',day:'numeric'})}<br>습관 카드에서 매일 체크해주세요.</p></div>${formActions('challenge','')}</form>`);break;
 case 'mood-check':addMood(b.dataset.mood);break;
 case 'mood-edit':moodEditor();break;
 case 'mood-delete':confirmAction('이 체크인을 지울까요?','선택한 마음 기록 한 개를 삭제합니다.',()=>{state.moods=state.moods.filter(x=>x.id!==id);save();closeModal();render();});break;
 case 'note-edit':noteEditor(id,b.dataset.category||'memo');break;
 case 'journal-add':noteEditor(null,'daily');break;
 case 'collection-edit':collectionEditor(id,ui.shelfFilter==='book'?'book':ui.shelfFilter==='hobby'?'hobby':undefined);break;
 case 'shop-add':collectionEditor(null,'wishlist');break;
 case 'workout-edit':workoutEditor(id);break;
 case 'transaction-edit':transactionEditor(id);break;
 case 'transaction-paid':{const t=state.transactions.find(x=>x.id===id);if(t){t.type='income';save();render();toast('입금 완료로 기록했어요.')}break;}
 case 'collection-step':{const c=state.collections.find(x=>x.id===id);if(c){c.progress=Math.min(c.target,c.progress+(c.type==='book'?10:1));if(c.progress>=c.target)c.status='done';save();render();toast(c.progress>=c.target?'차곡차곡, 목표를 달성했어요!':'진행량을 기록했어요.')}break;}
 case 'collection-bought':{const c=state.collections.find(x=>x.id===id);if(!c)break;if(c.status==='bought'){toast('구매가 기록되어 있어요. 지출은 돌아보기에서 수정할 수 있어요.');break}const hasTx=state.transactions.some(t=>t.collectionId===id);confirmAction('구매한 물건으로 남길까요?',`${esc(c.title)}${hasTx?' · 연결된 지출이 이미 있어 추가하지 않아요.':' · ₩'+money(c.price)+'을 오늘 지출로 함께 기록해요.'}`,()=>{c.status='bought';if(!hasTx&&c.price>0)state.transactions.unshift({id:uid(),date:ui.date,title:c.title,amount:c.price,type:'expense',collectionId:c.id});save();closeModal();render();toast('구매를 기록했어요.');});break;}
 case 'select-date':ui.date=b.dataset.date;ui.month=monthKey(ui.date);render();break;
 case 'calendar-date':ui.date=b.dataset.date;ui.month=monthKey(ui.date);render();break;
 case 'date-shift':ui.date=shift(ui.date,Number(b.dataset.n));ui.month=monthKey(ui.date);render();break;
 case 'date-picker':modal('어느 하루를 볼까요?',`<form data-kind="date"><div class="form-fields">${field('날짜','date',ui.date,'date','required autofocus')}</div>${formActions('date','')}</form>`);break;
 case 'today-date':ui.date=TODAY;ui.month=monthKey(TODAY);render();break;
 case 'calendar-prev':case 'calendar-next':{const n=act==='calendar-next'?1:-1;if(ui.calendarMode==='week'){ui.date=shift(ui.date,n*7);ui.month=monthKey(ui.date);}else{const d=fromKey(ui.month+'-01');d.setMonth(d.getMonth()+n);ui.month=monthKey(dateKey(d));ui.date=dateKey(d);}render();break;}
 case 'calendar-mode':ui.calendarMode=b.dataset.mode;render();break;
 case 'record-tab':ui.recordTab=b.dataset.tab;render();break;
 case 'note-filter':ui.noteFilter=b.dataset.filter;render();break;
 case 'shelf-filter':ui.shelfFilter=b.dataset.filter;render();break;
 case 'insight-tab':ui.insightTab=b.dataset.tab;render();break;
 case 'money-view':ui.insightTab='money';navigate('insights');break;
 case 'pixel':ui.date=b.dataset.date;ui.recordTab='journal';ui.month=monthKey(ui.date);navigate('records');break;
 case 'settings':settings();break;
 case 'sync-reload':confirmAction('최신 기록을 불러올까요?','현재 입력한 내용을 먼저 백업해주세요. 이 탭의 저장되지 않은 변경 대신 기기에 저장된 최신 기록을 불러옵니다.',()=>location.reload());break;
 case 'customize':customize();break;
 case 'theme':state.profile.theme=b.dataset.theme;save();render();b.dataset.return==='settings'?settings():customize();break;
 case 'card-toggle':{const c=state.cards.find(c=>c.id===id);if(c)c.on=!c.on;save();render();customize();break;}
 case 'card-move':{const i=state.cards.findIndex(c=>c.id===id),j=i+Number(b.dataset.n);if(i>=0&&j>=0&&j<state.cards.length){[state.cards[i],state.cards[j]]=[state.cards[j],state.cards[i]];save();render();customize();}break;}
 case 'search':searchModal();break;
 case 'export':exportBackup();break;
 case 'import':$('#backupInput').click();break;
 case 'onboarding':onboarding();break;
 case 'onboard-interest':{const i=ui.onboardInterests.indexOf(id);if(i>=0)ui.onboardInterests.splice(i,1);else ui.onboardInterests.push(id);b.classList.toggle('on');b.textContent=({work:'일과 업무',life:'일상과 마음',hobby:'취미와 운동',shop:'쇼핑과 지출'}[id])+(ui.onboardInterests.includes(id)?' ✓':'');break;}
 case 'budget-edit':modal('이번 달의 기준 세우기',`<form data-kind="budget"><p class="sheet-description">월 예산은 모든 달에 공통으로 적용돼요.<br>수입과 지출은 각 달의 기록으로 계산합니다.</p>${field('월 지출 예산 · 원','budget',state.profile.budget,'number','required min="0" max="99999999999"')} ${formActions('budget','')}</form>`);break;
 case 'demo-reset':confirmAction('샘플 공간으로 바꿀까요?','현재 기록을 샘플로 대체합니다. 내보내기로 백업한 뒤 진행해주세요.',()=>{state=seedState();persisted=true;storageIssue='';save();closeModal();ui.date=TODAY;ui.month=monthKey(TODAY);navigate('today');});break;
 case 'delete':{const key=b.dataset.kind;confirmAction('이 기록을 지울까요?','선택한 기록 한 개를 삭제합니다. '+(key==='collections'?'연결된 구매 지출은 수입·지출 목록에서 따로 관리할 수 있어요.':key==='transactions'?'구매 보관함의 구매 상태는 그대로 유지돼요.':''),()=>{if(!['tasks','notes','habits','collections','workouts','transactions'].includes(key))return;state[key]=state[key].filter(x=>x.id!==id);save();closeModal();render();toast('기록을 삭제했어요.');});break;}
 case 'confirm-action':{const fn=pendingAction;pendingAction=null;fn?.();break;}
 case 'timer-toggle':{if(state.timer.running){state.timer.remaining=timerRemaining();state.timer.running=false;state.timer.endAt=null;}else{state.timer.endAt=Date.now()+state.timer.remaining*1000;state.timer.running=true;state.timer.date=ui.date;}save();updateTimerUI();break;}
 case 'timer-reset':state.timer={running:false,remaining:state.timer.sessionMinutes*60,endAt:null,sessionMinutes:state.timer.sessionMinutes};save();updateTimerUI();break;
 case 'timer-length':if(state.timer.running){toast('집중 중에는 시간을 바꿀 수 없어요. 잠시 멈춰주세요.');break}state.timer.sessionMinutes=({15:25,25:50,50:15}[state.timer.sessionMinutes]);state.timer.remaining=state.timer.sessionMinutes*60;save();render();break;
 case 'remove-photo':ui.photo='';$('#photoPreview').src='';$('#photoPreview').classList.add('hidden');$('#removePhoto').classList.add('hidden');$('#photoInput').value='';{const form=$('#modalContent form');if(form?.dataset.kind==='note'&&!form.dataset.id){state.draft=draftFromForm(form);save();}}break;
 }});
document.addEventListener('keydown',e=>{if(['Enter',' '].includes(e.key)&&e.target.matches('.month-cell[data-act]')){e.preventDefault();e.target.click()}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();searchModal()}});
$('#backupInput').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>20*1024*1024)throw new Error('20MB 이하의 DAYFORM 백업 파일을 골라주세요.');const imported=JSON.parse(await file.text());if(!validState(imported))throw new Error('올바른 DAYFORM 백업이 아니거나 기록 형식이 손상됐어요.');imported.draft=null;confirmAction('백업의 기록으로 바꿀까요?',`일정 ${imported.tasks.length}개, 기록 ${imported.notes.length}개, 보관함 ${imported.collections.length}개가 들어 있어요.<br>현재 기록을 대체하니 필요하면 먼저 백업해주세요.`,()=>{state=imported;persisted=true;storageIssue='';const ok=save();closeModal();render();if(ok)toast('백업의 기록을 불러왔어요.');});}catch(err){toast(err instanceof SyntaxError?'JSON 백업 파일을 읽을 수 없어요.':err.message)}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!==ui.view){ui.view=v;render();window.scrollTo({top:0,behavior:'instant'})}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const other=JSON.parse(e.newValue);if(validState(other)&&other.updatedAt>state.updatedAt){if($('#modal').open){toast('다른 탭의 변경이 있어요. 입력을 마친 뒤 새로고침해주세요.');return}state=other;baseRevision=Number(other.updatedAt)||0;render();toast('다른 탭의 변경을 반영했어요.')}}catch(_){}}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)timerTick()});
window.addEventListener('pagehide',()=>{clearTimeout(draftTimeout);if(persisted&&state.draft)save()});
$('#searchButton').innerHTML=icon('search',18);$('#customizeButton').innerHTML=icon('sliders',17);$('#settingsButton').innerHTML=icon('settings',18);$('#sideSettings').innerHTML=icon('settings',15);$('#floatingAdd').innerHTML=icon('plus',23);
render();if(persisted&&!storageIssue){try{if(!localStorage.getItem(KEY))save()}catch(_){}}timerTick();setInterval(timerTick,1000);
// 한 파일 실행판에서는 별도 서비스 워커를 등록하지 않습니다.
</script>
</body>
</html>

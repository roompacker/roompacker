/* ===== [v1.2] 모바일 디자인 다듬기 ===== */
@keyframes pc-sheet-up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:600px){
/* 1. 장식용 영어 문구 정리 (작아서 안 읽히던 것들) */
.page-kicker,.ticker,.hero-serial,.hero-eyebrow,.folder-num,.folder-bottom b,.section-heading h2 span,.note-label,.note-spark{display:none}
/* 2. 홈 첫 화면: 대문을 작게 → 내 보관함이 바로 보이게 */
.hero{grid-template-columns:1fr 128px;margin-bottom:26px;box-shadow:3px 3px 0 var(--ink)}
.hero-copy{min-height:0;padding:18px 16px;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:34px;margin-bottom:10px}
.hero p{font-size:12px;line-height:1.6}
.hero-art{width:118px;height:118px;margin:0}
.hero-sticker{width:42px;height:42px;font-size:7px;top:6px;right:5px}
/* 3. 글자 크기: 휴대폰에서 읽기 편하게 */
.section-heading h2{font-size:20px}
.text-btn{font-size:13px}
.folder-card{min-height:112px}
.folder-name{font-size:16px;line-height:1.3}
.folder-bottom{font-size:12px;margin-top:4px}
.card-body{padding:11px 11px 12px}
.card-meta{font-size:11px;gap:5px}
.demo-badge{font-size:10px;padding:1px 5px}
.card-title{font-size:14px;line-height:1.4;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-right:0;min-height:2.8em}
.card-footer{font-size:11px}
.note-head{font-size:18px;padding-right:38px}
.note-preview{font-size:12px;line-height:1.6}
.card-sticker{font-size:9px}
.blog-body p,.blog-body .check-line{font-size:15px;line-height:1.9}
.blog-topline,.blog-card footer{font-size:12px}
.folder-banner p{font-size:12px}
.settings-section p{font-size:13px;line-height:1.7}
.toast{font-size:13px}
/* 4. 손가락으로 누르기 쉽게 (최소 44px) */
.filters{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;width:100%;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filter{font-size:13px;padding:9px 13px;min-height:40px}
.control-right .sort{font-size:13px}
.view-toggle button{padding:9px}
.view-toggle svg{width:16px;height:16px}
.card-star{top:8px;right:8px;bottom:auto;width:36px;height:36px;box-shadow:1px 1px 0 var(--ink)}
.card-star svg{width:17px;height:17px}
.card-bought{top:auto;bottom:8px;right:auto;left:8px;font-size:11px}
.square-btn{width:40px;height:40px}
.square-btn svg{width:18px;height:18px}
.close{width:40px;height:40px}
.close svg{width:20px;height:20px}
/* 5. 하단 메뉴 */
.mobile-nav{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.mobile-nav>button{font-size:11px;min-width:56px;min-height:46px;justify-content:center}
.mobile-nav>button svg{width:23px;height:23px}
.mobile-nav>button.mobile-add{width:56px;height:50px;min-width:56px;border-radius:12px;transform:translateY(-12px)}
.mobile-nav>button.mobile-add svg{width:28px;height:28px}
/* 6. 팝업창 → 아래에서 올라오는 시트로 (화면 꽉 차게) */
.dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:18px 18px 0 0;border-bottom:0;max-height:94dvh;box-shadow:0 -4px 0 var(--ink)}
.dialog[open]{animation:pc-sheet-up .22s ease-out}
.dialog-top{padding:10px 14px 10px 18px;border-radius:18px 18px 0 0}
.dialog-top strong{font-size:15px}
.dialog-content{padding:20px 18px 26px}
/* 7. 기록 보기 화면 버튼: 2칸씩 반듯하게 */
.reader-title{font-size:24px}
.reader-meta{font-size:12px}
.reader-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reader-buttons>*{font-size:14px!important;padding:12px 8px!important;min-height:48px;white-space:nowrap;width:100%}
/* 8. 기록 담기 화면 */
.editor-title{font-size:22px}
.kind-picker button{flex-direction:column;gap:5px;font-size:12px;padding:11px 2px;white-space:nowrap;min-height:60px}
.kind-picker svg{width:19px;height:19px}
.form-input,.block-text{font-size:15px}
.editor-actions>*{flex:1;min-height:46px;font-size:14px}
.editor-foot{padding:12px 15px calc(12px + env(safe-area-inset-bottom))}
.editor-foot small{display:none}
.editor-foot .foot-buttons{width:100%;display:grid;grid-template-columns:1fr 1.6fr}
.editor-foot .outline-btn,.editor-foot .solid-btn{font-size:15px;min-height:50px;white-space:nowrap}
/* 9. 설정 버튼 */
.settings-buttons{display:grid;grid-template-columns:1fr 1fr}
.settings-buttons button{font-size:13px;min-height:48px;white-space:nowrap}
.settings-section>.outline-btn{width:100%;min-height:48px;font-size:14px}
}

/* ================================================= */
/* ===== [v1.3] plm 스타일 테마 (모눈종이 + 파스텔) ===== */
/* ================================================= */
:root{--ink:#222;--cream:#f3f2ee;--paper:#fdfcf9;--pink:#f6bfd0;--orange:#f6bfd0;--yellow:#f1dc8a;--blue:#a8d4dd;--green:#a9c97e;--muted:#77746c;--line:1.5px solid var(--ink);--shadow:none;--grid:#e2e0d9;--serif:'DM Serif Display','Noto Serif KR',serif;--sans:'IBM Plex Sans KR','Apple SD Gothic Neo',sans-serif;font-family:var(--sans);background:var(--cream)}
*{box-shadow:none!important}
body{background:var(--cream)}
.app{background-color:var(--cream);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;border-color:#cfccc3}
/* 맨 위 안내 띠 */
.plm-strip{font-size:10px;text-align:center;padding:6px 10px;border-bottom:1.5px dashed #9c988e;background:var(--paper);letter-spacing:.3px}
/* 헤더: 흰색 알약 바 */
.topbar{background:var(--paper);border:var(--line);border-radius:8px;margin:10px 12px 0;height:58px}
.brand-mark{display:none}
.brand-word{font-family:var(--serif);font-size:30px;font-weight:400;letter-spacing:-1px;line-height:1}
.brand-word em{font-style:normal;color:#e58aa8}
.top-note{display:none}
.avatar{background:var(--paper);color:var(--ink);border:var(--line)}
.top-search input{background:var(--paper);border-radius:999px}
/* 공통 버튼: 알약 + 핑크 점 */
.plm-pill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:var(--line);border-radius:999px;padding:10px 20px;font-weight:700;font-size:14px}
.plm-pill i{width:8px;height:8px;border-radius:50%;background:#ee8fae;display:block}
.plm-pill.sm{padding:6px 13px;font-size:12px;margin-top:auto}
.solid-btn{background:var(--ink);color:#fff;border:var(--line);border-radius:999px}
.outline-btn{border-radius:999px;background:var(--paper)}
.add-btn{border-radius:999px!important;background:var(--paper)!important;color:var(--ink)!important;border:var(--line)!important}
/* 대문 */
.plm-hero{position:relative;text-align:center;padding:46px 14px 38px}
.plm-hero h1{margin:0 0 18px;display:flex;flex-direction:column;align-items:center;line-height:1.12}
.plm-hero .l1{font-family:var(--sans);font-weight:700;font-size:clamp(34px,9.6vw,72px);letter-spacing:-1.5px;background:linear-gradient(transparent 52%,var(--pink) 52%,var(--pink) 92%,transparent 92%);padding:0 8px}
.plm-hero .l2{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(36px,10.4vw,76px);letter-spacing:-2px;margin-top:4px}
.plm-hero .l3{font-family:var(--serif);font-size:clamp(38px,11vw,84px);letter-spacing:-1.5px;margin-top:2px;white-space:nowrap}
.plm-float{position:absolute;pointer-events:none}
.plm-float.cherry{font-size:30px;top:22px;left:22%;transform:rotate(-12deg)}
.plm-float.bubble{top:28px;right:16%;background:var(--paper);border:var(--line);border-radius:14px 14px 14px 3px;padding:0 10px;font-size:18px;line-height:24px;letter-spacing:2px;transform:rotate(8deg)}
.plm-float.disco{width:34px;height:34px;border-radius:50%;right:8%;top:47%;border:1.5px solid #555;background:radial-gradient(circle at 35% 30%,#fff 0 12%,transparent 13%),repeating-linear-gradient(0deg,#bbb 0 4px,#eee 4px 8px),#ccc;background-blend-mode:normal,multiply}
.plm-sticker{display:inline-block;background:var(--blue);border:1px solid #3d6e78;color:#244a52;font-size:9px;line-height:1.35;padding:5px 8px;letter-spacing:.2px;position:relative;margin:0 auto 18px;transform:rotate(-3deg);text-align:left;display:table}
.plm-sticker.pink{background:var(--pink);border-color:#b0607a;color:#6d2a40;position:absolute;right:12px;left:auto;top:auto;bottom:-12px;margin:0;transform:rotate(2deg);z-index:3}
/* 초록 흐르는 띠 */
.plm-marquee{background:var(--green);border-top:var(--line);border-bottom:var(--line);overflow:hidden;white-space:nowrap}
.plm-marquee-in{display:inline-block;font-size:11px;font-weight:700;line-height:30px;animation:plm-flow 40s linear infinite}
@keyframes plm-flow{to{transform:translateX(-50%)}}
/* 환영 문구 (흰 띠) */
.plm-welcome{position:relative;background:var(--paper);text-align:center;padding:34px 18px 30px;border-bottom:1px solid var(--grid)}
.plm-kicker{font-size:10px;letter-spacing:1px;color:#555}
.plm-welcome h2{font-size:20px;line-height:1.45;margin:12px 0 10px;letter-spacing:-.6px;font-weight:700}
.plm-welcome p{font-size:13px;color:var(--muted);margin:0}
/* 좌우 카드 */
.plm-carousel{position:relative;background:var(--paper);padding:26px 0 30px}
.plm-track-x{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 calc(50% - 125px);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.plm-track-x::-webkit-scrollbar{display:none}
.plm-card{flex:0 0 250px;scroll-snap-align:center;display:flex;flex-direction:column;border:var(--line);border-radius:6px;overflow:hidden;background:var(--c,var(--pink));text-align:center;padding:0;min-height:330px}
.plm-card-img{height:150px;border-bottom:var(--line);background:var(--paper);display:grid;place-items:center;overflow:hidden}
.plm-card-img img{width:100%;height:100%;object-fit:cover}
.plm-card-body{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 16px 18px;flex:1}
.plm-card-body b{font-size:17px;letter-spacing:-.4px}
.plm-card-body small{font-size:12px;line-height:1.6;color:#3d3b36}
.plm-card-new{background:var(--paper);border-style:dashed}
.plm-card-new .plm-card-img{background:repeating-linear-gradient(45deg,#f1efe9 0 8px,#fdfcf9 8px 16px)}
.plm-card-new .plm-card-img svg{width:44px;height:44px}
.plm-arrow{position:absolute;top:50%;z-index:2;width:38px;height:38px;border-radius:50%;background:var(--paper);border:var(--line);display:grid;place-items:center;transform:translateY(-50%)}
.plm-arrow.prev{left:8px}.plm-arrow.prev svg{transform:rotate(180deg)}
.plm-arrow.next{right:8px}
.plm-arrow svg{width:18px;height:18px}
/* 분홍 띠: 내가 아끼는 것들 */
.plm-band{background:var(--pink);background-image:radial-gradient(#e9a2b8 1px,transparent 1.2px);background-size:10px 10px;border-top:var(--line);border-bottom:var(--line);padding:26px 0 6px;margin-bottom:30px}
.plm-band h2{text-align:center;font-size:20px;margin:0 0 4px;letter-spacing:-.5px}
.plm-band.empty{padding-bottom:26px;text-align:center}.plm-band.empty p{font-size:13px;margin:6px 0 0}
.plm-band .plm-carousel{background:none}
.plm-band .plm-track-x{padding:0 calc(50% - 85px)}
.plm-member{flex:0 0 170px;scroll-snap-align:center;background:var(--paper);border:var(--line);border-radius:6px;padding:18px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.plm-avatar{width:76px;height:76px;border-radius:50%;border:var(--line);overflow:hidden;background:var(--c);display:grid;place-items:center;margin-bottom:4px}
.plm-avatar img{width:100%;height:100%;object-fit:cover}
.plm-avatar svg{width:30px;height:30px}

:root{--ink:#20130D;--cream:#f1ece5;--paper:#fbf8f4;--pink:#efc9c4;--blue:#b9dcc4;--green:#7BBA91;--carmine:#91010F;--licorice:#20130D;--grid:transparent}

function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window)){reject(new Error('이 브라우저는 저장 기능을 지원하지 않아요. Chrome에서 열어주세요.'));return}const req=indexedDB.open('pocket-club',1);req.onupgradeneeded=()=>{const d=req.result;d.createObjectStore('folders',{keyPath:'id'});d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('meta',{keyPath:'key'})};req.onsuccess=()=>{req.result.onversionchange=()=>req.result.close();resolve(req.result)};req.onerror=()=>reject(req.error);req.onblocked=()=>toast('다른 창의 보관함을 닫고 새로고침해주세요.')})}
function readAll(store){return new Promise((resolve,reject)=>{const req=db.transaction(store).objectStore(store).getAll();req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function meta(key){return new Promise((resolve,reject)=>{const req=db.transaction('meta').objectStore('meta').get(key);req.onsuccess=()=>resolve(req.result?.value);req.onerror=()=>reject(req.error)})}
function write(stores,callback){return new Promise((resolve,reject)=>{const tx=db.transaction(stores,'readwrite');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('저장하지 못했어요.'));try{callback(tx)}catch(e){tx.abort();reject(e)}})}
async function setMeta(key,value){await write(['meta'],tx=>tx.objectStore('meta').put({key,value}))}
function storageError(e){console.error('Pocket Club:',e?.name||'Error');return e?.name==='QuotaExceededError'?'저장 공간이 부족해요. 백업한 뒤 불필요한 사진을 정리해주세요.':'저장하지 못했어요. 작성 내용은 열어 둔 채로 다시 시도해주세요.'}
function toast(message,action){clearTimeout(toastTimer);const host=$$('dialog[open]').at(-1)||document.body;if(toastNode.parentElement!==host)host.append(toastNode);toastNode.innerHTML=`<span>${esc(message)}</span>${action?`<button id="toast-action">${esc(action.label)}</button>`:''}`;toastNode.hidden=false;if(action)$('#toast-action').addEventListener('click',()=>{try{action.run()}catch(err){console.error(err)}toastNode.hidden=true});toastTimer=setTimeout(()=>toastNode.hidden=true,action?8000:4200)}

function shortDate(t){const d=new Date(t);return isNaN(d)?'':new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit',timeZone:'Asia/Seoul'}).format(d).replace(/\.\s*$/,'')}
function money(v){return v!==''&&v!=null&&Number.isFinite(Number(v))?'₩ '+new Intl.NumberFormat('ko-KR').format(Number(v)):''}

let zooming=false;
document.addEventListener('click',e=>{
  const card=e.target.closest('[data-action="zoom-folder"]');if(!card||zooming)return;
  const id=card.dataset.id;
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||!card.animate){navigate('folder',id);return}
  zooming=true;
  try{
    const r=card.getBoundingClientRect();const cs=getComputedStyle(card);
    const ghost=document.createElement('div');ghost.className='cin-ghost';ghost.innerHTML=card.innerHTML;ghost.style.color=cs.color;
    Object.assign(ghost.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',margin:'0',zIndex:'60',background:cs.backgroundColor,borderRadius:cs.borderRadius,padding:cs.padding});
    document.body.append(ghost);card.style.visibility='hidden';
    const grow=ghost.animate([{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',borderRadius:'24px'},{left:'0px',top:'0px',width:innerWidth+'px',height:innerHeight+'px',borderRadius:'0px'}],{duration:460,easing:'cubic-bezier(.7,0,.2,1)',fill:'forwards'});
    grow.onfinish=()=>{
      navigate('folder',id);
      const fade=ghost.animate([{opacity:1},{opacity:0}],{duration:260,easing:'ease-out',fill:'forwards'});
      fade.onfinish=()=>{ghost.remove();card.style.visibility='';zooming=false};
    };
  }catch(err){console.error(err);zooming=false;navigate('folder',id)}
});

"edit-folder" data-id="${esc(folder.id)}" aria-label="보관함 수정">${icon('edit')}</button></div>`:''}</section>`}
if(!folderView&&!home){const results=filtered();html+=`<section><div class="section-heading recent-heading"><h2>${state.query?`검색 결과 <span>${results.length} FINDS</span>`:home?'요즘 모은 것들':`담아둔 기록 <span>${results.length} FINDS</span>`}</h2>${state.view!=='trash'?`<button class="add-btn" data-action="add">${icon('plus')} 기록 담기</button>`:''}</div>${state.query?`<div class="search-banner">“${esc(state.query)}”<button data-action="clear-search">검색 지우기</button></div>`:''}<div class="controls"><div class="filters" role="group" aria-label="종류별 필터">${[['all','전체'],...Object.entries(kinds).map(([k,v])=>[k,v.name])].map(([k,n])=>`<button class="filter ${state.kind===k?'active':''}" data-action="filter" data-kind="${k}">${n}</button>`).join('')}</div><div class="control-right"><select class="sort" id="sort" aria-label="기록 정렬"><option value="recent" ${state.sort==='recent'?'selected':''}>최근 수정순</option><option value="old" ${state.sort==='old'?'selected':''}>오래된 순</option><option value="title" ${state.sort==='title'?'selected':''}>이름순</option></select><div class="view-toggle" role="group" aria-label="보기 방식"><button data-action="layout" data-layout="grid" class="${state.layout==='grid'?'active':''}" aria-label="썸네일 보기" aria-pressed="${state.layout==='grid'}">${icon('grid')}</button><button data-action="layout" data-layout="blog" class="${state.layout==='blog'?'active':''}" aria-label="블로그 보기" aria-pressed="${state.layout==='blog'}">${icon('blog')}</button></div></div></div><div class="${state.layout==='blog'?'blog-list':'items-grid'}">${results.length?results.map(state.layout==='blog'?blogCard:itemCard).join(''):emptyState()}</div></section>${results.some(x=>x.demo)?'<p class="sample-help">EXAMPLE COLLECTION · 예시 기록이에요. + 기록 담기로 나만의 컬렉션을 시작해보세요.</p>':''}`}html+=`<footer class="page-foot"><span class="foot-logo">pocket.</span><span>작은 취향이 모여, 나다운 하루가 되도록.<br><b>MADE FOR YOUR LITTLE THINGS.</b></span></footer>`;$('#main').innerHTML=html}
function emptyState(){return `<div class="empty">${icon(state.query?'search':state.view==='trash'?'trash':'box')}<h3>${state.query?'찾는 기록이 없어요':state.view==='trash'?'휴지통이 비어 있어요':state.view==='favorites'?'소중한 기록에 별을 달아보세요':'첫 번째 기록을 기다리고 있어요'}</h3><p>${state.query?'다른 단어로 검색하거나 필터를 바꿔보세요.':state.view==='trash'?'삭제한 기록은 이곳에서 다시 꺼낼 수 있어요.':'사진 한 장, 떠오른 생각 한 줄부터 담아보세요.'}</p>${!state.query&&!['trash','favorites'].includes(state.view)?`<button class="solid-btn" data-action="add">${icon('plus')} 첫 기록 담기</button>`:''}</div>`}
function itemCard(it){const k=kinds[it.kind];const im=it.blocks.find(b=>b.type==='image');const text=bodyText(it);return `<article class="item-card" style="--c:${k.color}"><button class="card-open" data-action="open" data-id="${esc(it.id)}" aria-label="${esc(it.title)} 열기">${im?`<div class="card-thumb"><img src="${blockUrl(im)}" alt="${esc(im.caption||it.title)}" loading="lazy">${it.kind==='wish'?'<span class="card-sticker mono">WANT THIS!</span>':''}${it.blocks.filter(b=>b.type==='image').length>1?`<span class="card-image-count">${icon('photo').replace('width="24" height="24"','width="10" height="10" style="display:inline"')} ${it.blocks.filter(b=>b.type==='image').length}</span>`:''}${it.purchased?'<span class="card-bought">구매 완료 ✓</span>':''}</div>`:`<div class="card-note" style="--note-color:${k.color}"><span class="note-label">${k.en}</span><span class="note-head">${esc(it.title)}</span><span class="note-preview">${esc(text)}</span></div>`}<div class="card-body"><div class="card-meta"><span class="type-dot" style="background:${k.color}"></span>${esc(folderBy(it.folderId)?.name||'미분류')}${it.demo?'<span class="demo-badge">예시</span>':''}</div><h3 class="card-title">${esc(it.title)}</h3><div class="card-footer"><span class="${it.kind==='wish'&&money(it.price)?'card-price':'card-tags'}">${it.kind==='wish'&&money(it.price)?money(it.price):esc((it.tags||[]).slice(0,2).map(t=>'#'+t).join(' '))||k.name}</span><time>${shortDate(it.updatedAt)}</time></div><span class="plm-pill sm card-pill"><i></i>열어보기</span></div></button><button class="card-star ${it.favorite?'on':''}" data-action="star" data-id="${esc(it.id)}" aria-label="${it.favorite?'즐겨찾기 해제':'즐겨찾기 추가'}" aria-pressed="${!!it.favorite}">${icon('star')}</button></article>`}
function renderText(text){return String(text||'').split(/\n\n+/).map(p=>{if(p.startsWith('# '))return `<p class="body-heading">${esc(p.slice(2))}</p>`;if(p.split('\n').every(l=>/^(□|☐|-\s|\[ \])/.test(l)))return p.split('\n').map(l=>`<div class="check-line">${esc(l.replace(/^(□|☐|-\s|\[ \])\s*/,''))}</div>`).join('');return `<p>${esc(p)}</p>`}).join('')}

function blogCard(it){return `<article class="blog-card" style="--note-color:${kinds[it.kind].color}"><div class="blog-topline"><span>${esc(folderBy(it.folderId)?.name||'미분류')} / ${kinds[it.kind].en}</span><span>${it.demo?'예시 · ':''}${formatDate(it.updatedAt)}</span></div><header><h2>${esc(it.title)}</h2></header><div class="blog-body">${productHtml(it)}${bodyHtml(it)}</div><footer><span>${esc((it.tags||[]).map(t=>'#'+t).join(' '))}</span><button data-action="open" data-id="${esc(it.id)}">${state.view==='trash'?'복원 · 관리':'열기 · 수정'} ${icon('arrow')}</button></footer></article>`}
function navigate(view,folder=null){state.view=view;state.folder=folder;state.kind='all';state.query='';$('#search').value='';$('#search-wrap').classList.remove('expanded');state.layout=view==='folder'&&['note','idea'].includes(folderBy(folder)?.kind)?'blog':'grid';renderNav();renderMain();window.scrollTo({top:0,behavior:'instant'})}
function safeUrl(v){if(!v)return '';try{const u=new URL(v);return['http:','https:'].includes(u.protocol)?u.href:''}catch{return ''}}

function confirmBox(message,label='확인',danger=false){return new Promise(resolve=>{confirmResolve=resolve;$('#confirm').innerHTML=`<div class="dialog-top"><strong>한 번만 확인해주세요</strong><button class="close" data-action="confirm-no" aria-label="취소">${icon('close')}</button></div><div class="dialog-content"><p class="confirm-message">${esc(message)}</p><div class="confirm-actions"><button class="outline-btn" data-action="confirm-no">취소</button><button class="solid-btn ${danger?'danger':''}" data-action="confirm-yes">${esc(label)}</button></div></div>`;showDialog('#confirm')})}

async function purgeItem(id){if(!await confirmBox('이 기록을 영구 삭제할까요?\n포함된 사진도 삭제되며 되돌릴 수 없어요.','영구 삭제',true))return;try{await write(['items'],tx=>tx.objectStore('items').delete(id));closeReader();await refresh();notify();toast('기록을 영구 삭제했어요.')}catch(e){toast(storageError(e))}}
function textBlock(text=''){return{id:uid(),type:'text',text}}

async function openEditor(id=null){if(busy)return;closeReader();clearTimeout(saveTimer);const it=id?state.items.find(x=>x.id===id):null;let draft=await meta('draft');const savedDraft=draft?state.items.find(x=>x.id===draft.id):null;if(savedDraft&&(!draft.draftAt||draft.draftAt<=savedDraft.updatedAt)){draft=null;await setMeta('draft',null)}if(it){editorState=structuredClone(it);editorState.baseUpdatedAt=it.updatedAt;editorState.isNew=false;if(draft?.id===id){editorState={...draft,isNew:false,baseUpdatedAt:draft.baseUpdatedAt??it.updatedAt};toast('이전에 작성하던 수정 내용을 불러왔어요.')}}else if(draft){editorState=savedDraft?{...draft,isNew:false,baseUpdatedAt:draft.baseUpdatedAt??savedDraft.updatedAt}:draft;toast('작성 중인 초안을 이어서 열었어요.')}else{const kind=state.view==='folder'?(folderBy(state.folder)?.kind||'note'):'note';editorState={id:uid(),isNew:true,title:'',kind,folderId:defaultFolder(kind),price:'',url:'',purchased:false,tags:[],blocks:[textBlock()],favorite:false,createdAt:Date.now()}}renderEditor();showDialog('#editor');setTimeout(()=>$('#edit-title')?.focus(),80)}
function renderEditor(){const it=editorState;if(!it)return;$('#editor').innerHTML=`<div class="dialog-top"><strong id="editor-heading">${it.isNew?'NEW FIND · 새 기록 담기':'EDIT FIND · 기록 수정'}</strong><span class="dialog-status" id="draft-status">작성 중</span><button class="close" data-action="close-editor" aria-label="초안 보관 후 닫기">${icon('close')}</button></div><div class="dialog-content"><input class="editor-title" id="edit-title" placeholder="기억하고 싶은 제목" value="${esc(it.title)}" maxlength="200" aria-label="기록 제목"><label class="form-label">어떤 기록인가요?</label><div class="kind-picker">${Object.entries(kinds).map(([k,v])=>`<button data-action="editor-kind" data-kind="${k}" class="${it.kind===k?'active':''}">${icon(v.icon)} ${v.name}</button>`).join('')}</div><div class="form-row"><div><label class="form-label" for="edit-folder">보관함</label><select class="form-input" id="edit-folder"><option value="" ${!it.folderId?'selected':''}>미분류</option>${state.folders.map(f=>`<option value="${esc(f.id)}" ${it.folderId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div><div><label class="form-label" for="edit-tags">태그 <span style="font-weight:400;color:#9a8b75">(쉼표로 구분)</span></label><input class="form-input" id="edit-tags" placeholder="일상, 취향, 영감" value="${esc(it.tags.join(', '))}" maxlength="300"></div></div><div class="product-fields" ${it.kind!=='wish'?'hidden':''}><div class="form-row"><div><label class="form-label" for="edit-price">가격 <span style="font-weight:400">(원)</span></label><input class="form-input" id="edit-price" type="number" inputmode="numeric" min="0" max="999999999999" placeholder="예: 89000" value="${esc(it.price??'')}"></div><div><label class="form-label" for="edit-url">상품 링크</label><input class="form-input" id="edit-url" type="url" placeholder="https://" value="${esc(it.url||'')}" maxlength="4000"></div></div><label style="font-size:12px;display:flex;gap:7px;align-items:center;margin-top:14px"><input type="checkbox" id="edit-bought" ${it.purchased?'checked':''}> 구매 완료한 상품이에요</label></div><label class="form-label">사진과 이야기</label><div id="editor-blocks">${it.blocks.map(editorBlock).join('')}</div><div class="editor-actions"><button class="outline-btn" data-action="attach">${icon('photo')} 사진 넣기</button><button class="outline-btn" data-action="add-text">${icon('note')} 글 단락</button></div><p class="helper-text">사진과 글을 원하는 순서로 배치해요. ↑↓로 순서를 바꿀 수 있어요.<br>닫으면 초안으로 보관되며, ‘보관하기’를 누르면 목록에 저장돼요.</p></div><div class="editor-foot"><small>내 기기의 브라우저에 저장돼요.<br>소중한 기록은 백업해주세요.</small><div class="foot-buttons"><button class="outline-btn" data-action="discard">초안 삭제</button><button class="solid-btn" id="save-record" data-action="save">${icon('save')} 보관하기</button></div></div>`}
function editorBlock(b,index){return `<div class="editor-block" data-block-id="${esc(b.id)}"><div class="block-toolbar"><span>${b.type==='image'?'PHOTO':'TEXT'} ${String(index+1).padStart(2,'0')}</span><button class="block-tool" data-action="block-up" data-id="${esc(b.id)}" aria-label="${index+1}번 단락 위로">↑</button><button class="block-tool" data-action="block-down" data-id="${esc(b.id)}" aria-label="${index+1}번 단락 아래로">↓</button><button class="block-tool" data-action="block-remove" data-id="${esc(b.id)}" aria-label="${index+1}번 단락 삭제">${icon('close')}</button></div>${b.type==='image'?`<img class="editor-image" src="${blockUrl(b)}" alt="첨부한 사진"><input class="caption" data-field="caption" data-id="${esc(b.id)}" placeholder="사진 설명을 남겨보세요 (선택)" maxlength="500" value="${esc(b.caption||'')}">`:`<textarea class="block-text" data-field="text" data-id="${esc(b.id)}" maxlength="100000" aria-label="${index+1}번 글 단락" placeholder="오늘의 생각, 기억하고 싶은 순간…\n자유롭게 적어보세요.">${esc(b.text)}</textarea>`}</div>`}
function syncEditor(){if(!editorState||!$('#editor').open)return;editorState.title=$('#edit-title').value;editorState.folderId=$('#edit-folder').value||null;editorState.tags=[...new Set($('#edit-tags').value.split(/[,#]/).map(x=>x.trim()).filter(Boolean))].slice(0,20);editorState.price=$('#edit-price').value;editorState.url=$('#edit-url').value.trim();editorState.purchased=$('#edit-bought').checked;$$('#editor [data-field]').forEach(el=>{const b=editorState.blocks.find(x=>x.id===el.dataset.id);if(b)b[el.dataset.field]=el.value})}
function meaningfulDraft(){if(!editorState)return false;return!!(editorState.title.trim()||editorState.url||editorState.blocks.some(b=>b.type==='image'||b.text?.trim()))}
async function persistDraft(){clearTimeout(saveTimer);if(!editorState||busy)return;try{syncEditor();if(meaningfulDraft()){await setMeta('draft',{...structuredClone(editorState),draftAt:Date.now()});if($('#draft-status'))$('#draft-status').textContent='초안 저장됨'}else await setMeta('draft',null)}catch(e){if($('#draft-status'))$('#draft-status').textContent='초안 저장 실패';toast(storageError(e));throw e}}

async function saveItem(){if(busy||!editorState)return;syncEditor();const it=editorState;if(!it.title.trim()){toast('기억하고 싶은 제목을 적어주세요.');$('#edit-title').focus();return}if(!it.blocks.some(b=>b.type==='image'||b.text?.trim())&&!it.url){toast('사진이나 내용, 상품 링크 중 하나를 담아주세요.');return}if(it.url&&!safeUrl(it.url)){toast('상품 링크는 https:// 또는 http://로 시작해야 해요.');$('#edit-url').focus();return}if(it.price!==''&&(!Number.isFinite(Number(it.price))||Number(it.price)<0||Number(it.price)>999999999999)){toast('가격을 0원 이상 숫자로 입력해주세요.');$('#edit-price').focus();return}const entry={id:it.id,title:it.title.trim(),kind:it.kind,folderId:folderBy(it.folderId)?it.folderId:null,tags:it.tags,price:it.price===''?'':Number(it.price),url:safeUrl(it.url),purchased:!!it.purchased,favorite:!!it.favorite,demo:false,createdAt:it.createdAt||Date.now(),updatedAt:Date.now(),deletedAt:null,blocks:it.blocks.filter(b=>b.type==='image'||b.text?.trim()).map(b=>b.type==='text'?{id:b.id,type:'text',text:b.text}:{id:b.id,type:'image',...(b.blob?{blob:b.blob}:{art:b.art}),caption:b.caption||'',name:b.name||''})};busy=true;$('#save-record').disabled=true;try{clearTimeout(saveTimer);await new Promise((resolve,reject)=>{const tx=db.transaction(['items','meta'],'readwrite');let conflict=false;tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(conflict?new Error('CONFLICT'):tx.error);const store=tx.objectStore('items');const req=store.get(entry.id);req.onsuccess=()=>{const previous=req.result;if(previous&&!it.isNew&&previous.updatedAt!==it.baseUpdatedAt){conflict=true;tx.abort();return}store.put(entry);tx.objectStore('meta').put({key:'draft',value:null})}});$('#editor').close();editorState=null;await refresh();notify();toast('내 보관함에 담았어요.');if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{})}catch(e){toast(e.message==='CONFLICT'?'다른 창에서 수정된 기록이에요. 작성 내용을 복사한 뒤 다시 열어주세요.':storageError(e));$('#save-record').disabled=false}finally{busy=false}}

// ===== [v1.1 추가] 사진 저장 방식 (가볍게 / 원본) =====
const PHOTO_MODE_KEY='pocket-club-사진저장방식';
function photoMode(){try{return localStorage.getItem(PHOTO_MODE_KEY)||'compact'}catch(e){return 'compact'}}
// 가볍게 모드: 긴 변 2000px, JPEG 85% 품질로 줄여서 저장 (실패하면 원본 저장)
async function prepImage(f){
  if(photoMode()!=='compact'||/gif|svg/i.test(f.type))return f;
  try{
    const bmp=await createImageBitmap(f,{imageOrientation:'from-image'});
    const max=2000,r=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const w=Math.round(bmp.width*r),h=Math.round(bmp.height*r);
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,w,h);g.drawImage(bmp,0,0,w,h);
    if(bmp.close)bmp.close();
    const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.85));
    if(!blob||blob.size>=f.size)return f;
    return new File([blob],f.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg',lastModified:f.lastModified||Date.now()});
  }catch(e){console.warn('사진 줄이기 실패 → 원본으로 저장',e);return f}
}
// 설정 화면의 저장 방식 버튼
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action="photo-mode"]');if(!b)return;
  try{localStorage.setItem(PHOTO_MODE_KEY,b.dataset.mode)}catch(err){console.error(err)}
  openSettings().then(()=>toast(b.dataset.mode==='compact'?'앞으로 사진을 가볍게 저장해요.':'앞으로 사진을 원본 그대로 저장해요.'));
});
async function addFiles(files,quick=false){if(!files.length)return;const accepted=[];for(const f of files){if(!f.type.startsWith('image/')){toast('사진 파일을 선택해주세요.');continue}if(f.size>30*1024*1024){toast(f.name+' 사진은 30MB보다 커서 추가하지 못했어요.');continue}accepted.push(f)}if(!accepted.length)return;if(photoMode()==='compact')toast('사진을 가볍게 정리하는 중…');for(let i=0;i<accepted.length;i++)accepted[i]=await prepImage(accepted[i]);if(quick){const now=Date.now();const folderId=state.view==='folder'?state.folder:defaultFolder('photo');const items=accepted.map((f,i)=>({id:uid(),title:f.name.replace(/\.[^.]+$/,''),kind:'photo',folderId,tags:[],price:'',url:'',purchased:false,favorite:false,demo:false,blocks:[{id:uid(),type:'image',blob:f,name:f.name,caption:''}],createdAt:now+i,updatedAt:now+i,deletedAt:null}));try{await write(['items'],tx=>items.forEach(x=>tx.objectStore('items').put(x)));await refresh();notify();toast(`${items.length}장의 사진을 보관했어요.`)}catch(e){toast(storageError(e))}}else if(editorState){syncEditor();editorState.blocks.push(...accepted.map(f=>({id:uid(),type:'image',blob:f,name:f.name,caption:''})));if(editorState.blocks.length>1&&editorState.blocks[0].type==='text'&&!editorState.blocks[0].text.trim())editorState.blocks.shift();$('#editor-blocks').innerHTML=editorState.blocks.map(editorBlock).join('');scheduleDraft();toast(`${accepted.length}장의 사진을 추가했어요.`)}}
function moveBlock(id,delta){syncEditor();const i=editorState.blocks.findIndex(b=>b.id===id);const j=i+delta;if(j<0||j>=editorState.blocks.length)return;[editorState.blocks[i],editorState.blocks[j]]=[editorState.blocks[j],editorState.blocks[i]];$('#editor-blocks').innerHTML=editorState.blocks.map(editorBlock).join('');scheduleDraft()}
function openFolderEditor(id=null){folderEdit=id?folderBy(id):null;folderColor=folderEdit?.color||palette[state.folders.length%palette.length];$('#folder-dialog').innerHTML=`<div class="dialog-top"><strong id="folder-heading">${folderEdit?'EDIT FOLDER · 보관함 수정':'NEW FOLDER · 새 보관함'}</strong><button class="close" data-action="close-folder" aria-label="닫기">${icon('close')}</button></div><form id="folder-form" class="dialog-content"><label class="form-label" style="margin-top:0" for="folder-name">보관함 이름</label><input class="form-input" id="folder-name" required maxlength="40" placeholder="예: 여행에서 주운 것들" value="${esc(folderEdit?.name||'')}"><label class="form-label" for="folder-kind">기본 기록 종류</label><select class="form-input" id="folder-kind">${Object.entries(kinds).map(([k,v])=>`<option value="${k}" ${folderEdit?.kind===k?'selected':''}>${v.name}</option>`).join('')}</select><p class="helper-text">메모·아이디어는 블로그 보기로 열려요.<br>어떤 종류의 기록이든 함께 넣을 수 있어요.</p><label class="form-label">보관함 색상</label><div class="color-picker">${palette.map((c,i)=>`<button type="button" class="color-choice ${folderColor===c?'active':''}" style="background:${c}" data-action="folder-color" data-color="${c}" aria-label="${['블루그레이','스카이','세이지','민트','웜그레이','그레이'][i]}" aria-pressed="${folderColor===c}"></button>`).join('')}</div><div style="display:flex;align-items:center;justify-content:space-between;gap:10px">${folderEdit?`<button type="button" class="text-btn danger" data-action="delete-folder" data-id="${esc(id)}">보관함 삭제</button>`:'<span></span>'}<button type="submit" class="solid-btn">${icon('folder')} ${folderEdit?'변경 저장':'보관함 만들기'}</button></div></form>`;showDialog('#folder-dialog');setTimeout(()=>$('#folder-name').focus(),60)}
async function saveFolder(){const name=$('#folder-name').value.trim();if(!name)return;const f={id:folderEdit?.id||uid(),name,kind:$('#folder-kind').value,color:folderColor,order:folderEdit?.order??state.folders.length};try{await write(['folders'],tx=>tx.objectStore('folders').put(f));$('#folder-dialog').close();await refresh();notify();toast(folderEdit?'보관함을 수정했어요.':'새 보관함을 만들었어요.')}catch(e){toast(storageError(e))}}
async function deleteFolder(id){if(!await confirmBox('이 보관함을 삭제할까요?\n안에 있는 기록은 삭제되지 않고 ‘모든 기록’의 미분류로 옮겨져요.','보관함 삭제',true))return;try{await write(['folders','items'],tx=>{tx.objectStore('folders').delete(id);state.items.filter(it=>it.folderId===id).forEach(it=>tx.objectStore('items').put({...it,folderId:null}))});$('#folder-dialog').close();state.view='all';state.folder=null;await refresh();notify();toast('보관함을 삭제했어요. 기록은 모두 유지돼요.')}catch(e){toast(storageError(e))}}
async function openSettings(){let estimate={};try{estimate=await navigator.storage?.estimate()||{}}catch{}const used=(estimate.usage||0)/1024/1024;const lastBackup=await meta('lastBackup');$('#settings').innerHTML=`<div class="dialog-top"><strong id="settings-heading">MY SPACE · 설정과 백업</strong><button class="close" data-action="close-settings" aria-label="설정 닫기">${icon('close')}</button></div><div class="dialog-content"><section class="settings-section"><h3>내 취향, 내 기기에</h3><div class="settings-note">사진과 기록은 <b>지금 사용하는 기기의 브라우저</b>에 저장돼요. 다른 휴대폰이나 브라우저와 자동 동기화되지는 않아요.</div><p>브라우저의 사이트 데이터를 지우거나 기기를 바꾸기 전에는 꼭 백업해주세요. 사진은 아래 ‘사진 저장 방식’에 따라 보관해요. 사진 선택으로 넣은 파일만 읽으며, 휴대폰 사진첩 전체를 자동으로 가져오지 않아요.</p><p><b>기록 ${liveItems().length}개 · 보관함 ${state.folders.length}개</b> · 이 사이트 사용량 약 ${used.toFixed(1)} MB</p></section><section class="settings-section"><h3>백업과 복원</h3><p>사진과 모든 메모, 보관함을 JSON 파일 하나로 백업해요. 복원은 현재 기록을 유지하면서 없는 기록을 추가하는 방식이에요.</p><div class="settings-buttons"><button class="solid-btn" data-action="backup">${icon('download')} 전체 백업받기</button><button class="outline-btn" data-action="import">${icon('upload')} 백업 불러오기</button></div><p id="backup-info">${lastBackup?'마지막 백업 파일 생성: '+formatDate(lastBackup):'아직 백업 파일을 만들지 않았어요.'}</p></section><section class="settings-section"><h3>사진을 빠르게 담기</h3><p>사진 여러 장을 선택하면 각 사진이 하나의 기록으로 저장돼요.</p><button class="outline-btn" data-action="quick-photos">${icon('photo')} 사진 여러 장 가져오기</button></section><section class="settings-section"><h3>사진 저장 방식</h3><p><b>가볍게(추천)</b>는 화질은 거의 그대로, 용량은 약 1/5~1/10로 줄여 저장해요. 휴대폰 저장공간과 백업 파일이 훨씬 가벼워져요. <b>원본 그대로</b>는 찍은 파일 그대로 보관해요. 이미 저장된 사진은 바뀌지 않아요.</p><div class="settings-buttons"><button class="${photoMode()==='compact'?'solid-btn':'outline-btn'}" data-action="photo-mode" data-mode="compact">${icon('check')} 가볍게 (추천)</button><button class="${photoMode()==='original'?'solid-btn':'outline-btn'}" data-action="photo-mode" data-mode="original">${icon('photo')} 원본 그대로</button></div></section><section class="settings-section"><h3>휴대폰 홈화면에 두기</h3><button class="outline-btn" data-action="install">${icon('plus')} 홈화면에 추가하기</button><div id="install-guide" class="install-guide" ${installPrompt?'hidden':''}>Android Chrome에서 이 주소를 열고, 오른쪽 위 <b>⋮ 메뉴 → 홈 화면에 추가</b>를 선택해주세요. iPhone은 Safari의 <b>공유 → 홈 화면에 추가</b>를 이용해주세요.</div><p>다운로드한 HTML보다 같은 실행 주소를 계속 사용하는 것이 좋아요. 주소나 브라우저가 바뀌면 다른 보관함으로 열려요.</p></section><section class="settings-section"><h3>보관함 정리</h3><div class="settings-buttons"><button class="outline-btn" data-action="trash-view">${icon('trash')} 휴지통 보기</button><button class="outline-btn" data-action="remove-examples">예시 기록 정리</button></div><p>예시 기록만 휴지통으로 옮겨요. 직접 저장한 기록은 유지돼요.</p></section><p class="mono" style="font-size:10px;border-top:1px solid #c9bda5;padding-top:18px">POCKET CLUB® / PERSONAL ARCHIVE / V2.0</p></div>`;showDialog('#settings')}
async function backup(){if(busy)return;busy=true;const button=$('[data-action="backup"]');if(button){button.disabled=true;button.textContent='백업 파일 만드는 중…'}try{const [folders,items]=await Promise.all([readAll('folders'),readAll('items')]);const out=[];for(const it of items){const copy={...it,blocks:[]};for(const b of it.blocks){if(b.type==='image'&&b.blob){const {blob,...rest}=b;copy.blocks.push({...rest,dataUrl:await blobToData(blob)})}else copy.blocks.push(b)}out.push(copy)}const data={app:'POCKET_CLUB',version:1,exportedAt:new Date().toISOString(),folders,items:out};downloadBlob(new Blob([JSON.stringify(data)],{type:'application/json'}),'pocket-club-backup-'+new Date().toISOString().slice(0,10)+'.json');await setMeta('lastBackup',Date.now());if($('#backup-info'))$('#backup-info').textContent='백업 파일을 만들었어요. 다운로드 폴더에서 확인해주세요.';toast('사진과 기록이 담긴 백업 파일을 만들었어요.')}catch(e){toast('백업 파일을 만들지 못했어요. '+storageError(e))}finally{busy=false;if(button){button.disabled=false;button.innerHTML=icon('download')+' 전체 백업받기'}}}
function blobToData(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)})}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.style.display='none';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function validateBackup(data){if(!data||data.app!=='POCKET_CLUB'||data.version!==1||!Array.isArray(data.folders)||!Array.isArray(data.items))throw new Error('FORMAT');if(data.folders.length>1000||data.items.length>10000)throw new Error('LIMIT');const seen=new Set();const ids=new Set();const folders=data.folders.map((f,i)=>{if(!f||typeof f.id!=='string'||f.id.length>200||!f.id||ids.has(f.id)||typeof f.name!=='string'||!f.name.trim()||f.name.length>100)throw new Error('FORMAT');ids.add(f.id);return{id:f.id,name:f.name,kind:kinds[f.kind]?f.kind:'note',color:palette.includes(tone(f.color))?tone(f.color):palette[0],order:Number.isFinite(f.order)?f.order:i}});const items=data.items.map(it=>{if(!it||typeof it.id!=='string'||!it.id||it.id.length>200||seen.has(it.id)||typeof it.title!=='string'||it.title.length>200||!kinds[it.kind]||!Array.isArray(it.blocks)||it.blocks.length>500)throw new Error('FORMAT');seen.add(it.id);const blocks=it.blocks.map(b=>{if(b.type==='text'){if(typeof b.text!=='string'||b.text.length>100000)throw new Error('FORMAT');return{id:uid(),type:'text',text:b.text}}if(b.type!=='image')throw new Error('FORMAT');const block={id:uid(),type:'image',caption:String(b.caption||'').slice(0,500),name:String(b.name||'').slice(0,500)};if(arts[b.art])block.art=b.art;else{if(typeof b.dataUrl!=='string'||!/^data:image\/[\w.+-]+;base64,[A-Za-z0-9+/=\r\n]+$/.test(b.dataUrl)||b.dataUrl.length>42*1024*1024)throw new Error('FORMAT');const [header,base64]=b.dataUrl.split(',');let bin;try{bin=atob(base64)}catch{throw new Error('FORMAT')}const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));block.blob=new Blob([bytes],{type:header.slice(5).split(';')[0]})}return block});return{id:it.id,title:it.title,kind:it.kind,folderId:typeof it.folderId==='string'?it.folderId:null,tags:Array.isArray(it.tags)?it.tags.filter(t=>typeof t==='string').map(t=>t.slice(0,100)).slice(0,20):[],price:it.price!==''&&Number.isFinite(Number(it.price))&&Number(it.price)>=0?Math.min(Number(it.price),999999999999):'',url:safeUrl(it.url),purchased:!!it.purchased,favorite:!!it.favorite,demo:!!it.demo,createdAt:Number.isFinite(it.createdAt)?it.createdAt:Date.now(),updatedAt:Number.isFinite(it.updatedAt)?it.updatedAt:Date.now(),deletedAt:Number.isFinite(it.deletedAt)?it.deletedAt:null,blocks}});return{folders,items}}
async function importBackup(file){if(!file||busy)return;if(file.size>250*1024*1024){toast('250MB 이하의 백업 파일을 선택해주세요.');return}busy=true;try{const data=validateBackup(JSON.parse(await file.text()));const proceed=await confirmBox(`보관함 ${data.folders.length}개, 기록 ${data.items.length}개가 담긴 백업이에요.\n현재 기록은 유지하고, 없는 기록만 추가할까요?`,'백업 합치기');if(!proceed)return;const currentFolders=new Set(state.folders.map(x=>x.id));const currentItems=new Set(state.items.map(x=>x.id));const folders=data.folders.filter(x=>!currentFolders.has(x.id));const items=data.items.filter(x=>!currentItems.has(x.id));const allFolders=new Set([...currentFolders,...folders.map(x=>x.id)]);items.forEach(x=>{if(!allFolders.has(x.folderId))x.folderId=null});await write(['folders','items'],tx=>{folders.forEach(x=>tx.objectStore('folders').put(x));items.forEach(x=>tx.objectStore('items').put(x))});await refresh();notify();if($('#backup-info'))$('#backup-info').textContent=`기록 ${items.length}개, 보관함 ${folders.length}개를 추가했어요. 기존 기록은 유지됐어요.`;toast(`${items.length}개의 기록과 ${folders.length}개의 보관함을 추가했어요.`)}catch(e){toast(e.message==='FORMAT'||e.message==='LIMIT'||e instanceof SyntaxError?'올바른 POCKET CLUB 백업 파일이 아니에요.':storageError(e))}finally{busy=false}}
async function removeExamples(){const examples=liveItems().filter(x=>x.demo);if(!examples.length){toast('정리할 예시 기록이 없어요.');return}if(!await confirmBox(`예시 기록 ${examples.length}개를 휴지통으로 옮길까요?\n직접 만든 기록은 그대로 유지돼요.`,'예시 정리'))return;await write(['items'],tx=>examples.forEach(it=>tx.objectStore('items').put({...it,deletedAt:Date.now()})));await refresh();notify();toast('예시 기록을 휴지통으로 옮겼어요.')}
async function install(){if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null}else{$('#install-guide').hidden=false;$('#install-guide').scrollIntoView({block:'nearest',behavior:'smooth'})}}
async function copyItem(id){const it=state.items.find(x=>x.id===id);if(!it)return;const content=[it.title,bodyText(it),it.url].filter(Boolean).join('\n\n');try{if(navigator.clipboard)await navigator.clipboard.writeText(content);else{const t=document.createElement('textarea');t.value=content;document.body.append(t);t.select();document.execCommand('copy');t.remove()}toast('글 내용을 복사했어요.')}catch{toast('복사 권한을 허용하거나 글을 길게 눌러 복사해주세요.')}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,id=el.dataset.id;try{switch(a){case'nav':navigate(el.dataset.view);break;case'folder':navigate('folder',id);break;case'filter':state.kind=el.dataset.kind;renderMain();break;case'layout':state.layout=el.dataset.layout;renderMain();break;case'clear-search':state.query='';$('#search').value='';$('#search-wrap').classList.remove('expanded');renderMain();break;case'add':await openEditor();break;case'open':renderReader(id);break;case'edit':await openEditor(id);break;case'close-reader':closeReader();break;case'star':await toggleStar(id);break;case'delete':await deleteItem(id);break;case'restore':await restoreItem(id);break;case'purge':await purgeItem(id);break;case'copy':await copyItem(id);break;case'download-photo':{const item=state.items.find(x=>x.id===id);const block=item?.blocks.find(x=>x.id===el.dataset.blockId);if(block){const blob=block.blob||new Blob([arts[block.art]],{type:'image/svg+xml'});const extension=blob.type==='image/svg+xml'?'svg':(blob.type.split('/')[1]||'jpg').replace('jpeg','jpg');downloadBlob(blob,block.name||item.title+'.'+extension);toast('사진 원본 파일을 내려받았어요.')}break;}case'close-editor':await closeEditor();break;case'discard':await discardDraft();break;case'save':await saveItem();break;case'editor-kind':syncEditor();const priorDefault=state.folders.find(f=>f.kind===editorState.kind)?.id;editorState.kind=el.dataset.kind;if(editorState.isNew&&state.view!=='folder'&&editorState.folderId===priorDefault){editorState.folderId=state.folders.find(f=>f.kind===editorState.kind)?.id||editorState.folderId;$('#edit-folder').value=editorState.folderId||''}$$('.kind-picker button').forEach(b=>b.classList.toggle('active',b.dataset.kind===editorState.kind));$('.product-fields').hidden=editorState.kind!=='wish';scheduleDraft();break;case'attach':$('#block-files').click();break;case'add-text':syncEditor();editorState.blocks.push(textBlock());$('#editor-blocks').innerHTML=editorState.blocks.map(editorBlock).join('');$$('.block-text').at(-1)?.focus();scheduleDraft();break;case'block-up':moveBlock(id,-1);break;case'block-down':moveBlock(id,1);break;case'block-remove':syncEditor();editorState.blocks=editorState.blocks.filter(b=>b.id!==id);if(!editorState.blocks.length)editorState.blocks=[textBlock()];$('#editor-blocks').innerHTML=editorState.blocks.map(editorBlock).join('');scheduleDraft();break;case'new-folder':openFolderEditor();break;case'edit-folder':openFolderEditor(id);break;case'close-folder':$('#folder-dialog').close();break;case'folder-color':folderColor=el.dataset.color;$$('.color-choice').forEach(b=>{b.classList.toggle('active',b.dataset.color===folderColor);b.setAttribute('aria-pressed',b.dataset.color===folderColor)});break;case'delete-folder':await deleteFolder(id);break;case'settings':await openSettings();break;case'close-settings':$('#settings').close();break;case'backup':await backup();break;case'import':$('#backup-file').click();break;case'quick-photos':$('#quick-files').click();break;case'trash-view':$('#settings').close();navigate('trash');break;case'remove-examples':await removeExamples();break;case'install':await install();break;case'confirm-yes':finishConfirm(true);break;case'confirm-no':finishConfirm(false);break;case'tag-search':closeReader();state.query=el.dataset.tag;state.view='all';state.kind='all';$('#search').value=state.query;$('#search-wrap').classList.add('expanded');renderNav();renderMain();break}}catch(err){toast(storageError(err))}});
document.addEventListener('submit',async e=>{if(e.target.id==='folder-form'){e.preventDefault();await saveFolder()}});
document.addEventListener('input',e=>{if(e.target.closest('#editor'))scheduleDraft();if(e.target.id==='search'){state.query=e.target.value.trim();if(state.view==='folders')state.view='all';renderMain()}});
document.addEventListener('change',async e=>{if(e.target.id==='sort'){state.sort=e.target.value;renderMain()}if(e.target.id==='block-files'){await addFiles([...e.target.files]);e.target.value=''}if(e.target.id==='quick-files'){await addFiles([...e.target.files],true);e.target.value=''}if(e.target.id==='backup-file'){await importBackup(e.target.files[0]);e.target.value=''}if(e.target.closest('#editor'))scheduleDraft()});
$('#search').addEventListener('focus',()=>$('#search-wrap').classList.add('expanded'));
$('#search').addEventListener('blur',()=>{if(!$('#search').value)$('#search-wrap').classList.remove('expanded')});
$('#editor').addEventListener('cancel',e=>{e.preventDefault();closeEditor()});$('#reader').addEventListener('close',()=>readerId=null);$('#confirm').addEventListener('cancel',e=>{e.preventDefault();finishConfirm(false)});
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable;if(e.key==='/'&&!typing&&!$$('dialog').some(d=>d.open)){e.preventDefault();$('#search').focus()}if((e.ctrlKey||e.metaKey)&&e.key==='s'&&$('#editor').open){e.preventDefault();saveItem()}});
window.addEventListener('beforeunload',e=>{if(!busy&&editorState&&meaningfulDraft()){syncEditor();setMeta('draft',{...structuredClone(editorState),draftAt:Date.now()}).catch(()=>{});if($('#draft-status')?.textContent!=='초안 저장됨'){e.preventDefault();e.returnValue=''}}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&editorState&&!busy)persistDraft().catch(()=>{})});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(state.view==='home')renderMain()});window.addEventListener('appinstalled',()=>{installPrompt=null;if(state.view==='home')renderMain();toast('앱으로 설치했어요! 휴대폰 홈 화면에서 열어보세요.')});
if(channel)channel.onmessage=()=>{if(!editorState)refresh().catch(()=>{});else toast('다른 창에서 기록이 바뀌었어요. 수정 중인 글은 유지하고 있어요.')};
$('#brand-icon').innerHTML=icon('box');$('#search-icon').outerHTML=icon('search');
(async()=>{try{db=await openDB();const marker=await meta('initialized');if(!marker){const [folders,items]=await Promise.all([readAll('folders'),readAll('items')]);if(!folders.length&&!items.length)await seed();else await setMeta('initialized',true)}initializing=false;await refresh();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./pocket-club-sw.js',{scope:'./pocket-club.html'}).catch(()=>{});const estimate=await navigator.storage?.estimate();if(estimate?.quota&&$('#storage-progress'))$('#storage-progress').style.width=Math.max(2,Math.min(100,estimate.usage/estimate.quota*100))+'%'}catch(e){initializing=false;$('#main').innerHTML=`<div class="error-box"><b>보관함 저장 공간을 열지 못했어요.</b><p>${esc(e.message||'브라우저의 저장 기능을 확인해주세요.')}</p>시크릿 모드를 종료하거나 Chrome에서 실행 주소를 다시 열어주세요. 기존 기록은 자동으로 삭제하지 않아요.<p><button class="outline-btn" onclick="location.reload()">다시 열기</button></p></div>`}})();

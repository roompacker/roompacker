<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9e9e6">
<title>투디 - 할 일·가계부</title>
<style>
/* ===================== 1. 투디 색상·기본 ===================== */
:root{
  --canvas:#FFF7EE; --paper:#FFFBF5; --ink:#2B2B33; --muted:#75757f; --line:#2b2b331f; --pink:#FF8FB1; --mint:#3DBE8B; --pink2:#FFD7E3; --mint2:#CDEFDF;
  --lemon:#FFD7E3; --sage:#CDEFDF; --blue:#DCE8F5; --beige:#FFEAD8; --lav:#FFE3EC; --white:#ffffff; --alert:#842c29; --yellow:#F2CE3E;
  --r:24px;
  
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--canvas);color:var(--ink);font-family:Pretendard,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;letter-spacing:-.03em;-webkit-font-smoothing:antialiased}
body{padding-bottom:30px;min-height:100vh}
body.fit{overflow:hidden;padding-bottom:0;height:100dvh}
button,input{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer}
.wrap{max-width:520px;margin:0 auto;padding:0 15px}
#gl{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}

/* ===================== 2. 상단 바 (고정) ===================== */
.topbar{position:sticky;top:0;z-index:55;background:var(--canvas);border-bottom:1px solid var(--line)}
.topbar .in{max-width:520px;margin:0 auto;padding:0 15px;height:58px;display:flex;align-items:center;justify-content:space-between}
.wordmark{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:900;letter-spacing:-.06em}
.logo{width:28px;height:28px;border-radius:9px;display:grid;grid-template-columns:repeat(2,5px);grid-template-rows:repeat(2,5px);gap:3px;place-content:center;background:var(--ink);transform:rotate(-6deg)}
.logo i{background:var(--lemon);border-radius:3px}.logo i:first-child{grid-row:span 2}.logo i:last-child{opacity:.55}
.steps-pill{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;background:#f2f2ed}

/* ===================== 3. 페이지 제목 + 제목 캐릭터 ===================== */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:20px 2px 14px}
.overline{font-size:12px;font-weight:650;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.head h1{font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.09em}
.head .sub{font-size:12px;color:var(--muted);margin-top:6px}
.title-slot{width:84px;height:96px;flex:none;border-radius:22px;background:var(--paper)}
.mbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);display:inline-grid;place-items:center;font-size:15px}

/* ===================== 4. 카드 공통 ===================== */
.card{background:var(--paper);border-radius:var(--r);padding:18px;margin-bottom:12px;min-width:0}
.card.lemon{background:var(--lemon)}.card.sage{background:var(--sage)}.card.blue{background:var(--blue)}.card.beige{background:var(--beige)}.card.lav{background:var(--lav)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.card-top h2{font-size:18px;font-weight:760;letter-spacing:-.06em}
.small{font-size:12px;color:var(--muted);line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 15px;border-radius:99px;background:var(--ink);color:var(--white);font-size:13px;font-weight:700;white-space:nowrap}
.btn.outline{background:transparent;color:var(--ink);border:1px solid #20221e40}
.btn.tiny{min-height:34px;padding:0 12px;font-size:12px}
.chip{border:1px solid var(--line);border-radius:99px;min-height:32px;padding:0 12px;font-size:12px;font-weight:680;background:transparent}
.chip.on{background:var(--ink);color:var(--white);border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.meter{height:6px;border-radius:99px;background:#20221e14;overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint);border-radius:inherit;transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.num{font-variant-numeric:tabular-nums}

/* 입력창 (말하듯 쓰기) */
.quick{display:flex;gap:7px;background:var(--white);border-radius:99px;padding:5px 5px 5px 16px;border:1px solid var(--line)}
.quick input{flex:1;border:none;outline:none;background:none;min-width:0;font-size:15px}
.quick button{width:40px;height:40px;border-radius:50%;background:var(--pink);color:#fff;font-size:22px;flex:none}
.preview{font-size:12px;color:var(--muted);padding:7px 10px 0;min-height:24px}
.preview b{color:var(--ink)}

/* ===================== 5. 플랜 ===================== */
.hero{display:grid;grid-template-columns:1.15fr 1fr;gap:6px;padding:0;overflow:hidden;min-height:210px}
.hero .copy{padding:18px;display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.hero .label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:720}
.hero .label i{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--lemon);display:inline-grid;place-items:center;font-style:normal;font-size:13px}
.hero h2{font-size:24px;line-height:1.25;letter-spacing:-.08em;margin:12px 0 6px;word-break:keep-all}
.hero h2.fin{text-decoration:line-through;text-decoration-thickness:1.6px}
.hero .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.hero-slot{min-height:210px;background:#dfe0a0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{border-radius:14px;padding:7px 0 5px;display:grid;gap:3px;justify-items:center;font-size:11px}
.wd b{font-size:16px}.wd.on{background:var(--ink);color:var(--white)}
.wd i{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0}.wd i.on{opacity:.6}
.task{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.task .slot{width:86px;height:96px;flex:none;background:transparent!important}
.title-slot{background:transparent!important}
.tx .slot{width:64px;height:70px;flex:none;background:transparent!important}
.task .tt{flex:1;min-width:0}
.task .tt strong{display:block;font-size:15px;font-weight:700;line-height:1.3;word-break:keep-all}
.task .tt .small{display:block;margin-top:3px}
.task .tt .mot{display:inline-block;margin-top:5px;font-size:11px;border:1px solid #20221e55;border-radius:99px;padding:1px 8px}
.task.done .tt strong{color:var(--muted);text-decoration:line-through}
.task.done .tt .mot{background:var(--ink);color:var(--lemon);border-color:var(--ink)}
.chk{width:36px;height:36px;border-radius:50%;border:1.6px solid var(--ink);flex:none;display:grid;place-items:center;font-weight:900}
.task.done .chk{background:var(--mint);border-color:var(--mint);color:#fff}
.ico{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--muted)}
.ico.on{color:var(--ink)}
.empty{padding:22px 0;text-align:center;color:var(--muted);font-size:13px}
.focus-wrap{display:grid;grid-template-columns:118px 1fr;gap:14px;align-items:center}
.focus-slot{height:138px;border-radius:20px;background:#c6cfdd}
.timer{font-size:44px;font-weight:780;letter-spacing:-.07em;line-height:1}

/* ===================== 6. 머니 ===================== */
.big-money{font-size:40px;font-weight:800;letter-spacing:-.08em;line-height:1.05}
.big-money small{font-size:15px;margin-left:3px}
.big-money.over{color:var(--alert)}
.rail{display:flex;height:7px;background:#ffffffcc;border-radius:99px;overflow:hidden;margin:12px 0 10px}
.rail .s{background:var(--pink)}.rail .p{background:repeating-linear-gradient(-45deg,#535f50,#535f50 1px,#eff2de 1px,#eff2de 4px)}
.brk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.brk b{display:block;font-size:14px;margin-top:2px}
.seg{display:flex;background:var(--white);border-radius:99px;padding:3px;border:1px solid var(--line);margin-bottom:8px;width:max-content}
.seg button{padding:7px 16px;border-radius:99px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.donut-wrap{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.donut{width:132px;height:132px;border-radius:50%;position:relative;display:grid;place-items:center;text-align:center;background:#d5d68b}
.donut::before{content:"";position:absolute;inset:17%;border-radius:50%;background:var(--lemon)}
.donut div{position:relative;font-size:11px;color:var(--muted)}.donut b{display:block;font-size:15px;color:var(--ink)}
.legend li{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:650;margin:6px 0;list-style:none}
.legend li span:nth-child(2){flex:1}
.sw{width:10px;height:10px;border-radius:50%;border:1px solid #20221e22}
.save-wrap{display:grid;grid-template-columns:1fr 104px;gap:10px;align-items:center}
.save-slot{height:120px;border-radius:20px;background:#e6d6c0}
.tx{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:none}
.tx .k{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:15px;flex:none}
.tx .tt{flex:1;min-width:0}.tx .tt strong{display:block;font-size:14px}
.tx .amt{font-weight:760;font-size:14px;white-space:nowrap}.tx .amt.in{color:#315638}

/* ===================== 7. 친구 (키링) ===================== */
.stage{height:330px;border-radius:20px;background:#efe3d3;position:relative}
.stage-cap{text-align:center;padding-top:10px}
.steps li{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:9px;min-height:44px;border-top:1px solid var(--line);list-style:none}
.steps li span.i{width:28px;height:28px;border-radius:50%;background:#f7f8ef9c;display:grid;place-items:center;font-size:13px}
.steps li strong{font-size:13px}
.friends{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.friend{border-radius:16px;padding:6px;background:#f6f2f7a8;text-align:center;font-size:12px;font-weight:700}
.friend .art{aspect-ratio:1;border-radius:12px;background:var(--fbg) var(--fimg) center/cover no-repeat;margin-bottom:5px}
.friend.lock .art{background-color:#e4e0dc}
.friend .small{display:block;font-weight:400}
.album{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.album button,.album span{border-radius:14px;min-height:76px;display:grid;place-items:center;align-content:center;gap:4px;padding:6px 2px;font-size:11px;text-align:center;background:#e9dfcd;font-weight:650}
.album span{background:#efede7;color:var(--muted);font-weight:400}
.album em{font-style:normal;font-size:20px}

/* ===================== 8. 하단 탭 ===================== */
.tabbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:55;display:flex;gap:2px;background:var(--ink);border-radius:99px;padding:5px;box-shadow:0 10px 30px #20221e40}
.tabbar button{white-space:nowrap;color:#9a9c92;font-size:12px;font-weight:700;padding:9px 18px;border-radius:99px;display:flex;align-items:center;gap:6px}
.tabbar button.on{background:var(--lemon);color:var(--ink)}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:6px 0 10px}
/* ===== 한 화면 레이아웃 ===== */
.screen{height:calc(100dvh - 59px);display:flex;flex-direction:column;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.screen>.card{margin-bottom:9px;flex:none}
.head.c{padding:10px 2px 8px;align-items:center}
.head.c h1{font-size:29px}
.head.c .title-slot{width:84px;height:92px}
.wk{display:flex;align-items:center;gap:2px;margin:0 0 9px}
.wk .week{flex:1}
.wk .wd{padding:5px 0 4px}
.card.in{padding:8px 8px 4px}
.card.in .preview{padding:5px 10px 2px;min-height:20px}
.card.list{flex:1!important;min-height:0;display:flex;flex-direction:column;margin-bottom:0!important;padding:13px 14px 2px}
.card.list .card-top{margin-bottom:6px}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0 -6px;padding:0 6px;-webkit-overflow-scrolling:touch}
.screen .task{padding:5px 0;gap:8px}
.screen .task .slot{width:78px;height:86px}
.task.pin{background:linear-gradient(90deg,#FFD7E3cc,#FFD7E300 85%);border-radius:14px;padding-left:8px;margin:2px -6px 2px;padding-right:6px}
.sum{padding:13px 16px}
.sum .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.sum .big-money{font-size:32px}
.sum .rail{margin:9px 0 6px}
.sum .mini{display:flex;gap:12px;font-size:11.5px;color:var(--muted)}.sum .mini b{color:var(--ink)}
.inrow{display:flex;gap:6px;align-items:center}
.inrow .seg{margin:0;flex:none}
.inrow .quick{flex:1;min-width:0}
.inrow .seg button{padding-left:12px;padding-right:12px}
/* ===== 로고·홈 ===== */
.logo-top{display:flex;align-items:center;gap:8px}
.logo-top svg{width:44px;height:44px;display:block;margin:-4px 0}
.dr-top .lg svg{width:92px;height:92px;display:block}
.home .hrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.home .hrow:last-child{border-bottom:none}
.home .hrow strong{flex:1;min-width:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.home .hrow .small{flex:none}
.home .chk{width:30px;height:30px;background:#fff}
.home .hrow.done strong{opacity:.45;text-decoration:line-through}
.home .hrow.done .chk{background:var(--mint);border-color:var(--mint);color:#fff}
.home .go{font-size:12.5px;font-weight:800;color:var(--ink);background:#ffffffb3;border-radius:99px;padding:6px 11px}
.home .cta{display:flex;gap:8px;margin-bottom:9px;flex:none}
.home .cta button{flex:1;min-height:46px;border-radius:16px;font-weight:800;font-size:14.5px;color:#fff;box-shadow:0 3px 0 #2b2b3326}
/* ===== 숨김 메뉴(서랍) ===== */
.menu-btn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;margin-left:-6px}
.menu-btn i{display:block;width:20px;height:2.5px;border-radius:2px;background:var(--ink);box-shadow:0 -6px 0 var(--ink),0 6px 0 var(--ink)}
.tl{display:flex;align-items:center;gap:4px}
#drawer{position:fixed;inset:0;z-index:70;pointer-events:none}
#drawer .dim{position:absolute;inset:0;background:rgba(32,34,30,.42);opacity:0;transition:opacity .25s}
#drawer .sheet{position:absolute;top:0;bottom:0;left:0;width:min(82vw,330px);background:var(--paper);border-radius:0 28px 28px 0;transform:translateX(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));box-shadow:10px 0 40px #20221e33}
#drawer.on{pointer-events:auto}#drawer.on .dim{opacity:1}#drawer.on .sheet{transform:none}
.dr-top{display:flex;align-items:center;gap:10px;padding:4px 6px 14px}
.dr-top img{width:58px;height:72px;object-fit:contain;filter:drop-shadow(0 4px 6px #20221e30)}
.dr-top b{display:block;font-size:22px}
.dr-sec{font-size:11px;font-weight:800;color:var(--muted);padding:12px 10px 6px;letter-spacing:.02em}
.dr-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 10px;border-radius:16px;font-weight:700;font-size:15px}
.dr-item .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--white);font-size:17px;box-shadow:0 2px 0 #20221e14}
.dr-item small{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:1px}
.dr-item.on{background:var(--lemon)}
#drawer .foot{margin-top:auto}
/* ===== 3D 글씨 (투디처럼 말랑한 입체) ===== */
.t3d{font-weight:900;color:#ffd84a;text-shadow:0 1px 0 #f2c232,0 2px 0 #e8b526,0 3px 0 #dba71c,0 4px 0 #cc9813,0 5px 1px #b5840d,0 7px 10px rgba(90,60,0,.32);-webkit-text-stroke:.6px #f6c93a}
/* ===== 덜어낸 디자인: 흰 카드 + 큰 숫자 + 아래 탭 ===== */
.card,.card.lemon,.card.sage,.card.blue,.card.beige,.card.lav{background:#fff;box-shadow:0 1px 0 #2b2b3312}
.menu-btn{display:none}
.steps-pill{background:#fff}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.fit{padding-bottom:0}
.screen{height:calc(100dvh - 59px - 66px - env(safe-area-inset-bottom));padding-bottom:10px}
.tabbar2{position:fixed;left:0;right:0;bottom:0;z-index:56;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:flex}
.tabbar2 button{flex:1;display:grid;place-items:center;align-content:center;gap:2px;font-size:11.5px;font-weight:800;color:#a6a6ae}
.tabbar2 button i{font-style:normal;font-size:21px;line-height:1}
.tabbar2 button.on{color:var(--ink)}
#drawer{z-index:70}
.toast{bottom:calc(84px + env(safe-area-inset-bottom))}
.hd2{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:4px 4px 6px;flex:none}
.hd2 .overline{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.hd2 h1{font-size:27px;line-height:1.25;font-weight:900;letter-spacing:-.05em}
.hd2 h1 em{font-style:normal;color:var(--mint)}
.hd2 .title-slot{width:104px;height:118px;flex:none;background:transparent!important;margin-bottom:-4px}
.hd2.s h1{font-size:25px}.hd2.s .title-slot{width:84px;height:94px}
.tiles{display:flex;gap:10px;margin-bottom:10px;flex:none}
.tile{flex:1;min-width:0;background:#fff;border-radius:20px;padding:12px 14px;box-shadow:0 1px 0 #2b2b3312;text-align:left;display:block}
.tile small{display:block;font-size:12.5px;color:var(--muted);font-weight:700}
.tile b{display:block;font-size:23px;font-weight:900;margin-top:2px;letter-spacing:-.04em;white-space:nowrap}
.tile b u{text-decoration:none;font-size:13.5px;font-weight:700}
.tile .bar{height:6px;border-radius:9px;background:#f1ece4;margin-top:8px;overflow:hidden}.tile .bar i{display:block;height:100%;border-radius:9px;transition:width .4s}
.lcard{flex:1;min-height:0;background:#fff;border-radius:22px;box-shadow:0 1px 0 #2b2b3312;display:flex;flex-direction:column;overflow:hidden;position:relative}
.lcard .scroll{margin:0;padding:2px 16px}
.trow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #2b2b3312;position:relative}
.trow:last-child{border-bottom:none}
.trow .tx1{flex:1;min-width:0;text-align:left;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .25s}
.trow .tm{font-size:13px;color:#9a9aa3;flex:none}
.trow .chk{width:28px;height:28px;border:2px solid #cfcfd6;background:#fff;color:#fff;font-size:14px;transition:all .2s}
.trow.done .chk{background:var(--mint);border-color:var(--mint)}
.trow.done .tx1{color:#b5b5bd;text-decoration:line-through}
.trow .acts{display:flex;gap:6px;flex:none}
.trow .acts button{font-size:12px;font-weight:800;border-radius:99px;padding:6px 10px;background:#f4efe8}
.trow .acts .del{background:#ffe3e3;color:#a33}
.addbar{flex:none;margin-top:10px;background:#fff;border-radius:999px;padding:7px 7px 7px 18px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 14px #2b2b331a}
.addbar input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:15px;font-weight:600}
.addbar>button{width:42px;height:42px;border-radius:50%;background:var(--pink);color:#fff;font-size:24px;flex:none}
.addbar .seg{margin:0;flex:none}
.addhint{flex:none;font-size:12px;color:var(--muted);padding:5px 16px 0;min-height:20px}
.fab{position:fixed;right:18px;bottom:calc(82px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--pink);color:#fff;font-size:32px;display:grid;place-items:center;box-shadow:0 6px 16px #ff8fb166;z-index:40}
.wk{margin:0 0 10px}
/* ===== 가운데 ＋ 탭 + 스르륵 숨는 메뉴바 ===== */
.tabbar2{transition:transform .28s cubic-bezier(.2,.8,.2,1);overflow:visible}
.tabbar2 .plus{flex:0 0 78px;position:relative}
.tabbar2 .plus span{position:absolute;left:50%;top:-24px;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:var(--pink);color:#fff;font-size:34px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 16px #ff8fb166;border:5px solid var(--canvas);transition:transform .2s}
body.add-open .tabbar2 .plus span{transform:translateX(-50%) rotate(45deg)}
#addChoice{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px) scale(.9);display:flex;gap:8px;z-index:57;opacity:0;pointer-events:none;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
body.add-open #addChoice{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#addChoice button{border-radius:999px;padding:12px 18px;font-size:14.5px;font-weight:800;white-space:nowrap;box-shadow:0 5px 14px #2b2b3333;color:#fff}
#navHandle{position:fixed;left:50%;bottom:calc(5px + env(safe-area-inset-bottom));transform:translateX(-50%);width:132px;height:22px;z-index:55;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s}
#navHandle i{display:block;width:46px;height:5px;border-radius:5px;background:#2b2b3340}
.screen{transition:height .28s cubic-bezier(.2,.8,.2,1)}
body.nav-hide .tabbar2{transform:translateY(calc(100% + 30px))}
body.nav-hide #navHandle{opacity:1;pointer-events:auto}
body.nav-hide .screen{height:calc(100dvh - 59px - 26px - env(safe-area-inset-bottom))}
body.nav-hide #addChoice{display:none}
/* ===== 메뉴(서랍): 화면보다 길면 안에서 넘겨 볼 수 있게 + 간격 줄이기 ===== */
#drawer .sheet{bottom:auto;height:100dvh;max-height:100dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.dr-top{padding:0 6px 6px;flex:none}
.dr-top .lg svg{width:62px;height:62px}
.dr-top img{width:44px;height:54px}
.dr-sec{padding:9px 10px 3px;flex:none}
.dr-item{padding:7px 10px;flex:none}
.dr-item .ic{width:34px;height:34px}
#drawer .foot{margin-top:10px;flex:none;padding:6px 0 0}
/* ===== 설정 ===== */
.set h2{font-size:17px;margin-bottom:4px}
.set .srow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.set .srow:first-of-type{border-top:none}
.set .srow>div{flex:1;min-width:0}
.set .srow strong{display:block;font-size:15px}
.set .srow span.small{display:block;margin-top:2px;line-height:1.4}
.set .sbtn{flex:none;border-radius:99px;padding:9px 14px;font-size:13px;font-weight:800;background:#f4efe8;white-space:nowrap}
.set .sbtn.mint{background:var(--mint);color:#fff}.set .sbtn.pink{background:var(--pink);color:#fff}.set .sbtn.red{background:#ffe3e3;color:#a33}
.sw2{flex:none;width:52px;height:30px;border-radius:99px;background:#d9d6d0;position:relative;transition:background .2s}
.sw2 i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:left .2s}
.sw2.on{background:var(--mint)}.sw2.on i{left:25px}
/* 완료 순간에만 나타나는 투디 */
.todi-run{position:fixed;height:78px;pointer-events:none;z-index:57;transition:opacity .35s}
.todi-tag{position:fixed;z-index:58;box-shadow:0 2px 8px #2b2b3322;background:var(--mint2);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:800;transform:scale(0);transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .3s;white-space:nowrap}
.foot button{text-decoration:underline;font-size:11px;color:var(--muted);margin-left:6px}

/* ===================== 9. 만화 컷 (완료 카드) ===================== */
#cut{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(32,34,30,.6)}
#cut.on{display:flex}
.panel{position:relative;width:min(92vw,420px);height:min(76vh,620px);border:5px solid var(--ink);border-radius:24px;overflow:hidden;animation:panelIn .55s cubic-bezier(.34,1.56,.64,1) both;box-shadow:8px 8px 0 var(--ink)}
.panel::before{content:"";position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.55) 0deg 2.2deg,rgba(255,255,255,0) 2.2deg 10deg);animation:spin 14s linear infinite}
.panel .headline{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:44px;font-weight:900;color:var(--yellow);-webkit-text-stroke:2.5px var(--ink);text-shadow:4px 4px 0 var(--ink);transform:rotate(-5deg);animation:wordIn .5s .15s cubic-bezier(.34,1.8,.64,1) both;z-index:2}
#cutSlot{position:absolute;left:0;right:0;top:70px;bottom:92px}
.panel .bubble{position:absolute;left:18px;right:18px;bottom:18px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-size:15px;font-weight:700;text-align:center;z-index:2;animation:wordIn .4s .35s cubic-bezier(.34,1.56,.64,1) both}
.panel .bubble small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.panel .stepbadge{position:absolute;top:84px;right:14px;z-index:2;background:var(--ink);color:var(--lemon);border-radius:99px;padding:5px 10px;font-size:12px;font-weight:800;animation:wordIn .4s .6s both}
@keyframes panelIn{0%{transform:scale(.3) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(-1.5deg);opacity:1}}
@keyframes wordIn{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

.task.flash,.tx.flash{animation:rowFlash 1.6s ease-out}
@keyframes rowFlash{0%{background:var(--lemon);box-shadow:0 0 0 8px var(--lemon)}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
body.cuton .topbar,body.cuton .tabbar{opacity:0;pointer-events:none}
/* 알림 · 입력 창 */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--white);padding:11px 16px;border-radius:14px;font-size:13px;max-width:calc(100% - 32px);display:none}
.toast.on{display:block;animation:wordIn .3s both}
dialog{width:min(100% - 30px,400px);border:1px solid var(--line);border-radius:22px;padding:22px;background:var(--paper);color:var(--ink)}
dialog::backdrop{background:#21241f6b}
dialog h3{font-size:20px;letter-spacing:-.06em;margin-bottom:12px}
dialog label{display:grid;gap:5px;font-size:13px;font-weight:650;margin-bottom:10px}
dialog input{min-height:46px;border:1px solid #20221e38;border-radius:11px;padding:8px 10px;background:var(--white);font-size:16px}
dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
</style>
</head>

<header class="topbar"><div class="in">
  <div class="tl"><button class="menu-btn" id="menuBtn" aria-label="메뉴 열기"><i></i></button><div class="logo-top" data-tab="home"><span id="logoTop"></span><span style="font-size:15px;font-weight:800;color:var(--muted)" id="pageName">홈</span></div></div>
  <div class="steps-pill" id="stepsPill">👣 오늘 0걸음</div>
</div></header>

<main class="wrap" id="main"></main>
<nav class="tabbar2" id="tabbar2"></nav>
<div id="addChoice"><button data-act="addGo" data-to="plan" style="background:var(--mint)">✓ 할 일 적기</button><button data-act="addGo" data-to="money" style="background:var(--pink)">₩ 지출 적기</button></div>
<button id="navHandle" aria-label="메뉴바 보이기"><i></i></button>
<div id="drawer"><div class="dim" id="drawerDim"></div><nav class="sheet" id="drawerNav"></nav></div>

<div id="cut">
  <div class="panel" id="panel">
    <div class="headline" id="cutHead">해냈다!</div>
    <div class="stepbadge" id="cutStep" hidden>+1걸음</div>
    <div id="cutSlot"></div>
    <div class="bubble" id="cutBubble"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<dialog id="ask"><form method="dialog" id="askForm">
  <h3 id="askTitle"></h3>
  <div id="askFields"></div>
  <div class="acts"><button class="btn outline" value="cancel" type="submit">취소</button><button class="btn" value="ok" type="submit">저장</button></div>
</form></dialog>
<canvas id="gl"></canvas>

function parseTodo(text){
  let s = ' '+text+' ', date = today(), time = '';
  try{
    const rel = {'오늘':0,'내일':1,'모레':2};
    s = s.replace(/(오늘|내일|모레)/, m=>{ date = addDays(today(), rel[m]); return ' '; });
    s = s.replace(/(다음\s?주\s*)?([월화수목금토일])요일/, (_,next,w)=>{
      const tg = WD.indexOf(w), now = new Date().getDay();
      let diff = (tg-now+7)%7; if(diff===0) diff = 7; if(next) diff = (tg-now+7)%7+7;
      date = addDays(today(), diff); return ' ';
    });
    s = s.replace(/(오전|오후|아침|저녁|밤)?\s*(\d{1,2})시\s*(반|(\d{1,2})분)?/, (_,ap,h,half,mi)=>{
      h = +h; const m = half==='반' ? 30 : (mi ? +mi : 0);
      if((ap==='오후'||ap==='저녁'||ap==='밤') && h<12) h += 12;
      if(!ap && h>=1 && h<=6) h += 12;
      time = `${pad(Math.min(h,23))}:${pad(m)}`; return ' ';
    });
  }catch(e){ console.error('해석 오류', e); }
  return {title: s.replace(/\s+/g,' ').trim() || text.trim(), date, time};
}
function parseMoney(text, typeSel){
  let amount = 0, s = text;
  const m = s.match(/(\d+(?:[.,]\d+)*)\s*(만\s*원?|천\s*원?|원)?/);
  if(m){
    let n = parseFloat(m[1].replace(/,/g,''));
    if(m[2] && m[2].startsWith('만')) n *= 10000; else if(m[2] && m[2].startsWith('천')) n *= 1000;
    amount = Math.round(n); s = s.replace(m[0],' ');
  }
  const title = s.replace(/\s+/g,' ').trim() || '기록';
  let type = typeSel;
  if(['월급','수입','입금','용돈','정산','환급','부수입'].some(w=>title.includes(w))) type = 'in';
  let cat = '기타';
  for(const [n,v] of Object.entries(MCATS)) if(v.k.some(w=>title.toLowerCase().includes(w))){ cat = n; break; }
  return {amount, title, type, cat};
}

function logoSVG(){
  const PK='#FF8FB1', GR='#3DBE8B', INK='#2B2B33';
  const L = {T:'M-22,-30 H22 M0,-30 V30', O:'M0,-30 A20,30 0 1 1 -0.1,-30 Z', D:'M-15,-30 V30 H-5 A21,30 0 0 0 -5,-30 Z', I:'M0,-30 V30'};
  const pos = [['T',-84,6,-10],['O',-30,-8,-3],['D',30,-8,4],['I',84,6,10]];
  const layer = (dx,dy,col,w)=>pos.map(([ch,x,y,r])=>`<path d="${L[ch]}" transform="translate(${150+x+dx} ${150+y+dy}) rotate(${r})" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`).join('');
  const arc = (r,a0,a1,col,w)=>{ const p = a=>[150+r*Math.cos(a*Math.PI/180), 150+r*Math.sin(a*Math.PI/180)], [x0,y0]=p(a0), [x1,y1]=p(a1);
    const d = `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
    return `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w+8}" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`; };
  return `<svg viewBox="0 0 300 300" aria-label="TODI"><circle cx="150" cy="150" r="118" fill="${PK}" stroke="${INK}" stroke-width="5"/>
    ${arc(132,200,340,GR,13)}${arc(132,20,160,GR,13)}${arc(104,215,325,'#fff',7)}${arc(104,35,145,'#fff',7)}
    ${layer(7,9,GR,38)}${layer(0,0,INK,38)}${layer(0,0,'#fff',24)}</svg>`;
}

function rowCelebrate(id, cat){
  try{
    if(!S.opt.motion) return;
    const row = document.querySelector(`[data-row="${id}"]`); if(!row) return;
    // 카드 안이 아니라 화면 전체 위에 띄워서, 어느 줄에서도 투디가 잘리지 않게 함
    const rb = row.getBoundingClientRect(), H = 78;
    const y = Math.max(62, rb.bottom - H - 2), stopX = Math.min(window.innerWidth - 150, rb.right - 140);
    const t = document.createElement('img'); t.className = 'todi-run'; t.alt = ''; t.style.height = H+'px'; t.style.top = y+'px'; t.style.left = '-80px'; t.src = TODI_IMG.dash_0; document.body.appendChild(t);
    const t0 = performance.now(), D = 650;
    (function step(now){
      const u = Math.min(1,(now-t0)/D), e = 1-Math.pow(1-u,2);
      t.style.left = (-80 + (stopX+80)*e)+'px'; t.src = TODI_IMG['dash_'+(Math.floor((now-t0)/66)%10)];
      if(u < 1) return requestAnimationFrame(step);
      t.src = TODI_IMG.idle_0;

function monthData(m){
  const rec = S.tx.filter(x=>x.date.startsWith(m));
  const spent = rec.filter(x=>x.type==='out').reduce((a,b)=>a+b.amount,0);
  const income = rec.filter(x=>x.type==='in').reduce((a,b)=>a+b.amount,0);
  const unpaid = S.bills.filter(b=>!(S.paid[m]||{})[b.id]).reduce((a,b)=>a+b.amount,0);
  const budget = S.budget[m];
  return {rec, spent, income, unpaid, budget, remaining: budget==null ? null : budget-spent-unpaid};
}

let cutTimer = null, toastTimer = null;
function openCut(cat, title, stepGot){
  const c = CATS[cat]||CATS.etc;
  $('panel').style.background = c.bg;
  $('cutHead').textContent = c.head;
  $('cutBubble').innerHTML = `${esc(title)}<small>${c.done}</small>`;
  $('cutStep').hidden = !stepGot;
  ['panel','cutHead','cutBubble','cutStep'].forEach(id=>{ const el=$(id); el.style.animation='none'; void el.offsetWidth; el.style.animation=''; });
  $('cut').classList.add('on'); document.body.classList.add('cuton');
  try{ if(S.opt.vibrate && navigator.vibrate) navigator.vibrate([30,40,60]); }catch(e){}
  if(!S.seen.includes(cat) && ALBUM.includes(cat)){ S.seen.push(cat); save(); }
  if(window.Engine) Engine.playCut(cat);
  clearTimeout(cutTimer); cutTimer = setTimeout(closeCut, 4300);
}
/* 제자리 완료행동: 그 줄(칸)의 캐릭터가 바로 완료 모션 */
function celebrate(slotId, cat, msg, stepGot){
  if(window.Engine) Engine.celebrate(slotId, cat);
  try{ if(S.opt.vibrate && navigator.vibrate) navigator.vibrate([30,40,60]); }catch(e){}
  if(!S.seen.includes(cat) && ALBUM.includes(cat)){ S.seen.push(cat); save(); }
  const el = document.querySelector(`[data-slot="${slotId}"]`);
  const row = el && el.closest('.task,.tx'); if(row){ row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }
  const c = CATS[cat]||CATS.etc;
  toast(`${c.emoji} ${c.head} ${msg||''}${stepGot?' · 👣 +1걸음':''}`);
}
function closeCut(){ $('cut').classList.remove('on'); document.body.classList.remove('cuton'); clearTimeout(cutTimer); if(window.Engine) Engine.stopCut(); render(); }
$('cut').addEventListener('click', closeCut);
function toast(msg){ const t=$('toast'); t.textContent = msg; t.classList.remove('on'); void t.offsetWidth; t.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('on'), 3000); }

function startEngine(){
const T = THREE;
const canvas = $('gl');
const renderer = new T.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = T.sRGBEncoding;
renderer.toneMapping = T.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.setClearColor(0x000000, 0);
renderer.autoClear = false;
function resize(){ renderer.setSize(window.innerWidth, window.innerHeight, false); }
window.addEventListener('resize', resize); resize();

const scene = new T.Scene();
const camera = new T.PerspectiveCamera(30, 1, 0.1, 100);

// --- 조명: 부드러운 스튜디오 + 뒤쪽 테두리빛(만화 느낌) ---
scene.add(new T.HemisphereLight('#FFF6EA', '#B89A7C', 0.9));

}

// 그림 일부만 쓰는 판 만들기 (u0~u1, v0~v1 = 그림 안의 비율)
function cropGeo(u0,u1,v0,v1){
  const g = new T.PlaneGeometry(1,1), uv = g.attributes.uv;
  for(let i=0;i<uv.count;i++){ uv.setXY(i, uv.getX(i) ? u1 : u0, uv.getY(i) ? v1 : v0); }
  uv.needsUpdate = true; return g;
}
const FULL_GEO = sprUp.geometry;
const SPR = {}; const sprLoader = new T.TextureLoader();
Object.entries(TODI_IMG).forEach(([k,src])=>{
  const tex = sprLoader.load(src, t=>{ SPR[k].aspect = t.image.width / t.image.height; });
  tex.encoding = T.sRGBEncoding; tex.anisotropy = 4;
  const rig = null;   // 다리 분리는 어색해서 끔 → 통통 뛰기 방식
  const o = {tex, aspect:0.7, h:(TODI_H[k] || 2.45) * SPR_SCALE, rig};
  if(rig){
    const ext = 0.07;                                   // 다리 윗부분을 몸 속으로 조금 숨김
    o.up = cropGeo(0, 1, 0.0 + (1 - rig.hem), 1);       // 몸통 (후드 밑단까지)
    o.legs = rig.legs.map(([a,b])=>({geo:cropGeo(a, b, 0, 1 - rig.hem + ext), cx:(a+b)/2 - 0.5, w:b-a}));
    o.ext = ext;
  }
  SPR[k] = o;
});
function applySprite(p, slot){
  const imgMode = !(window.DECO && window.DECO.style === '3d');
  rig.visible = !imgMode; sprPivot.visible = imgMode;
  if(!imgMode) return;
  squasher.scale.set(1,1,1);   // 그림 투디는 멈춰 있을 때 늘었다 줄었다 하지 않음
  if(!(p.run > 0.05 || p.walk > 0.05)){ squasher.position.y = 0; spinner.rotation.set(0, p.turn, 0); }   // 멈춰 있을 땐 뛰기·기울기도 없음
  PROPS.dog.visible = false; dogBlob.visible = false; PROPS.leash.visible = false; PROPS.shuttle.visible = false;
  // 1) 그림 고르기: 할 일 종류마다 정해진 투디 한 명 (중간에 다른 모습으로 바뀌지 않음)
  let key = 'run';   // 옛 그림은 모두 지움 → 어디서나 곰돌이 투디
  if(slot && slot.ph == null) slot.ph = Math.random()*10;
  const tR = performance.now()/1000 + (slot ? slot.ph : 0);
  // 달리기 투디: 움직일 땐 옆모습 4컷을 넘겨서 진짜로 달리고, 완료 땐 앞모습으로 제자리 뛰기
  let frameAnim = false, faceLeft = false;
  if(key === 'run'){
    if(p.run > 0.05 || p.walk > 0.05){
      const tired = p.sad > 0.3 || curOutfit === 'spend';
      // 달리기 = 헐레벌떡 달리는 장면, 걷기 = 걷는 장면, 시무룩·지출 = 터벅터벅 장면
      const set = tired ? 'tired_' : (p.run >= p.walk ? 'dash_' : 'todi_');
      key = set + (Math.floor(tR*(tired ? 8 : p.run >= p.walk ? 15 : 9)) % 10); frameAnim = true; faceLeft = p.turn < -0.3; }
    else {                                     // 대기: 정면으로 서 있다가 가끔 눈 깜빡 + 머리 긁적 (영상 장면 넘기기)
      const cyc = 7.0, u = tR % cyc, fi = Math.floor(u*8) + 1;
      key = fi < TODI_IDLE_N ? 'idle_' + fi : TODI_IDLE;
    }
  }
  const s = SPR[key] || SPR[TODI_IDLE]; if(!s) return;
  if(sprMat.map !== s.tex){ sprMat.map = s.tex; sprMat.needsUpdate = true; }
  const t = tR;
  const h = s.h, w = h * s.aspect;

  // 2) 걸음 리듬: 달리기는 빠르고 크게, 걷기는 느리고 작게
  const run = Math.min(1, p.run), walk = Math.min(1, p.walk), mv = Math.max(run, walk*0.7);
  const freq = run >= walk ? 13 : 8, c = t*freq;
  let rz = 0, by = 0, sx = 1, sy = 1, swing = 0;
  if(frameAnim){ rz += -0.05*run; }
  else if(mv > 0.02){
    const hp = Math.abs(Math.sin(c*0.5));                                       // 한 번 통~ 뛰는 높이(0~1)
    by += hp * (0.14*run + 0.07*walk);
    const air = (hp - 0.3) * (0.07*run + 0.04*walk);                             // 공중에선 길쭉, 착지 땐 납작
    sy *= 1 + air; sx *= 1 - air*0.7;
    rz += -0.10*run + Math.cos(c*0.5)*0.04*mv;
  }

  // 3) 방향: 카드 뒤집듯 부드럽게
  const fx = faceLeft ? -1 : 1;
  sprPivot.rotation.set(0, -p.turn, rz * Math.sign(fx));
  sprBody.scale.set(fx*sx, sy, 1);
  sprBody.position.y = by;

  // 4) 몸통 + 다리 배치
  if(s.rig && s.up){
    const hem = s.rig.hem, upH = hem*h, legH = (1 - hem + s.ext)*h, hipY = (1 - hem)*h;
    sprUp.geometry = s.up; sprUp.scale.set(w, upH, 1); sprUp.position.set(0, hipY + upH/2, 0.01);
    [[sHipL,sLegL,0,1],[sHipR,sLegR,1,-1]].forEach(([hip,leg,i,dir])=>{
      const L = s.legs[i]; hip.visible = true;
      hip.position.set(L.cx*w, hipY + s.ext*h, 0);
      leg.geometry = L.geo; leg.scale.set(L.w*w, legH, 1); leg.position.set(0, -legH/2, 0);
      hip.rotation.z = swing*dir;
      // 뒤로 차는 다리는 살짝 들기

const INK = '#2E2925';

function canvasTex(key, w, h, draw){
  if(texCache[key]) return texCache[key];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); draw(x, w, h);
  const t = new T.CanvasTexture(c); t.encoding = T.sRGBEncoding;
  return texCache[key] = {tex:t, aspect:w/h};
}

    x.lineWidth = 26; x.strokeStyle = INK; x.strokeText(txt, w/2+6, h/2+8);   // 뒤 그림자

}

}

  return canvasTex('pill:'+txt+color, 512, 256, (x,w,h)=>{

    while(x.measureText(txt).width > 380 && fs > 40){ fs -= 6; x.font = `800 ${fs}px ${FF}`; }
    const tw = x.measureText(txt).width, pw = Math.min(w-24, tw + fs*0.9), ph = fs*1.55, px = (w-pw)/2, py = (h-ph)/2, r = ph/2;

  obj.userData.fx = Object.assign({life:0, max:1, v:null, g:0, pop:false, size:1, grow:0, spin:null, fade:true}, o);

}

const confGeo = new T.BoxGeometry(0.07,0.02,0.11);
const confMats = ['#F2CE3E','#8FA8CF','#F0A6A0','#9BC48A','#FFFFFF','#E0623F'].map(c=>new T.MeshStandardMaterial({color:c, roughness:.6}));

function updateFx(slot, dt){
  const kids = slot.fx.children;
  for(let i=kids.length-1;i>=0;i--){
    const o = kids[i], f = o.userData.fx; f.life += dt;
    if(f.v){ if(f.g) f.v.y += f.g*dt; o.position.addScaledVector(f.v, dt); }
    if(f.mesh && o.position.y < 0.02){ o.position.y = 0.02; f.v.multiplyScalar(0.35); f.v.y = Math.abs(f.v.y)*0.4; }
    if(f.spin){ o.rotation.x += f.spin.x*dt; o.rotation.y += f.spin.y*dt; o.rotation.z += f.spin.z*dt; }
    if(o.isSprite){
      let sc = 1;
      if(f.pop){ const q = Math.min(1, f.life/0.2); sc = easeBack(q); }
      if(f.grow) sc *= 1 + f.grow*(f.life/f.max);
      const w = f.wobble ? 1 + Math.sin(f.life*25)*0.08*(1-f.life/f.max) : 1;
      o.scale.set(f.size*(f.aspect||1)*sc*w, f.size*sc*w, 1);
      if(f.fade){ const r = f.life/f.max; o.material.opacity = r>0.65 ? Math.max(0,1-(r-0.65)/0.35) : 1; }
    } else if(f.life > f.max-0.3){ o.scale.setScalar(Math.max(0.01,(f.max-f.life)/0.3)); }
    if(f.life >= f.max){ slot.fx.remove(o); if(o.isSprite) o.material.dispose(); }
  }
}

/* =========================================================
   7. 애니메이션 엔진 (키프레임 + 만화 원칙)
   ========================================================= */
const easeBack = q => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(q-1,3) + c1*Math.pow(q-1,2); };
const EASE = {
  lin: q=>q,
  io: q=> q<.5 ? 4*q*q*q : 1-Math.pow(-2*q+2,3)/2,
  o:  q=> 1-Math.pow(1-q,3),
  i:  q=> q*q*q,
  back: easeBack,
  step: q=> q<1 ? 0 : 1
};
// 기본 자세 (모든 값의 출발점)
const BASE = {x:0,y:0,turn:0,lean:0,tilt:0,bend:0,sq:1,hx:0,hy:0,hz:0,
  aLx:0,aLz:-0.12,aRx:0,aRz:0.12,lLx:0,lRx:0,lLz:0,lRz:0,eye:1,happy:0,dot:1,
  pigX:0,pigY:0,pigR:0,shakeP:0,coinY:-1,bookOpen:1,bookX:0,bookY:0,bottle:0,rk:0,bulb:0,
  dogSit:0,dogUp:0,dogHead:0,dogTail:1,dogWalk:0,dogY:0,
  walk:0,run:0,tie:0,scratch:0,trem:0,hop:0,pat:0,wave:0,sway:0,stamp:0,pant:0,xeye:0,sad:0};
const STEP = {happy:1};
const NUM = Object.keys(BASE);

function K(t, p, e){ return {t, p:p||{}, e:e||'io'}; }
function motion(dur, loop, keys, events, extra){
  // 앞 키의 값을 뒤로 이어받아 "완성된 자세"를 미리 계산
  const full = []; let prev = Object.assign({}, BASE);
  keys.forEach(k=>{ prev = Object.assign({}, prev, k.p); full.push(prev); });
  return Object.assign({dur, loop, keys, full, events:events||[], props:[], cam:{x:0,far:0}}, extra||{});
}
function sample(m, t){
  const ks = m.keys;
  if(t <= ks[0].t) return Object.assign({}, m.full[0]);
  for(let i=0;i<ks.length-1;i++){
    if(t < ks[i+1].t){
      const a = m.full[i], b = m.full[i+1];
      const q = EASE[ks[i+1].e]((t-ks[i].t)/(ks[i+1].t-ks[i].t));
      const p = {};
      for(const k of NUM){ p[k] = STEP[k] ? (q<1 ? a[k] : b[k]) : a[k] + (b[k]-a[k])*q; }
      return p;
    }
  }
  return Object.assign({}, m.full[ks.length-1]);
}

/* ---------- 7-2. 계속 움직이는 부분 (걷기·달리기·떨림 등) ---------- */
function proc(p, t){
  if(p.run>0){ const w = Math.sin(t*22); p.lLx += w*1.0*p.run; p.lRx -= w*1.0*p.run; p.aLx -= w*0.9*p.run; p.aRx += w*0.9*p.run; p.y += Math.abs(w)*0.08*p.run; }
  if(p.walk>0){ const w = Math.sin(t*7); p.lLx += w*.45*p.walk; p.lRx -= w*.45*p.walk; p.aLx -= w*.4*p.walk; p.y += Math.abs(w)*.035*p.walk; }
  if(p.tie>0){ const w = Math.sin(t*18); p.aLz += w*.12*p.tie; p.aRz -= w*.12*p.tie; }
  if(p.scratch>0){ p.aRx += Math.sin(t*24)*.12*p.scratch; p.hz += Math.sin(t*24)*.025*p.scratch; }
  if(p.trem>0){ p.x += Math.sin(t*60)*.014*p.trem; }
  if(p.hop>0){ p.y += Math.abs(Math.sin(t*9))*p.hop; }
  if(p.pat>0){ p.aRx += Math.sin(t*8)*.14*p.pat; p.dogHead += Math.max(0,Math.sin(t*8))*.1*p.pat; }
  if(p.wave>0){ p.aRz += Math.sin(t*12)*.32*p.wave; }
  if(p.pant>0){ const w = Math.sin(t*14); p.sq += w*.035*p.pant; p.hx += w*.07*p.pant; p.aLz -= w*.03*p.pant; p.aRz += w*.03*p.pant; }
  if(p.sway>0){ p.hz += Math.sin(t*2.6)*.18*p.sway; p.tilt += Math.sin(t*2.6)*.05*p.sway; p.y += Math.abs(Math.sin(t*2.6))*.03*p.sway; }
  p.sq *= 1 + Math.sin(t*2.2)*0.01;   // 숨쉬기
}

  legL.rotation.set(p.lLx, 0, p.lLz); legR.rotation.set(p.lRx, 0, p.lRz);

  if(fk === 'N'){ const blink = slot.blinkT < 0.12 && p.eye > 0.9 && p.eye < 1.1 ? 0.1 : 1; const big = Math.max(1,p.eye);
    eyes.forEach(e=>e.scale.set(big, Math.max(0.05, Math.min(1,p.eye)*big*blink), 0.4)); }
  dot.scale.setScalar(p.dot); M.dot.emissiveIntensity = Math.max(0, p.dot-1)*0.9;

    PROPS.dogHead.rotation.x = p.dogHead + Math.sin(slot.t*12)*0.05*p.dogWalk;
    PROPS.dogTail.rotation.z = Math.sin(slot.t*14*p.dogTail)*0.6;
    PROPS.dogEars.forEach((e,i)=>e.rotation.z = (i?1:-1)*(0.3 + Math.sin(slot.t*12)*0.12*(p.dogWalk+p.dogUp)));
    dogBlob.position.set(DOG0.x, 0.006, DOG0.z); const ds = 0.75/(1+p.dogY*2); dogBlob.scale.set(ds*1.2, ds, 1);
  }
  PROPS.leash.visible = pr.includes('leash');
  PROPS.phones.visible = pr.includes('phones');
  PROPS.receipt.visible = pr.includes('receipt'); PROPS.receipt.position.copy(RC0); PROPS.stampMark.visible = p.stamp > 0.5;

function setTube(mesh, curve, r){ mesh.geometry.dispose(); mesh.geometry = new T.TubeGeometry(curve, 30, r, 6, false); }

/* =========================================================
   8. 칸(슬롯) 관리 & 그리기
   ========================================================= */
const slots = {};
function getSlot(id){
  if(!slots[id]) slots[id] = {id, key:'', t:0, lastT:-1e-6, fx:new T.Group(), spr:{x:0,v:0}, prevY:0, shake:0,
    blinkT:2+Math.random()*3, pose:Object.assign({},BASE), racketPos:new T.Vector3(), shHit:new T.Vector3()};
  return slots[id];
}
let cut = null;   // 지금 재생 중인 만화 컷
window.Engine = {
  replay(id){ const s = getSlot(id); s.epoch = window.ARRIVE_EPOCH; s.arriveStart = performance.now(); },
  poke(id){ const s = getSlot(id); s.pokeUntil = performance.now() + 850; },
  celebrate(id, cat){ const s = getSlot(id); s.celeb = {cat: MO[cat] ? cat : 'etc', start: performance.now()}; s.epoch = window.ARRIVE_EPOCH; s.arriveStart = 0; s.pokeUntil = 0; },
  playCut(cat){ const s = getSlot('__cut'); s.key = ''; s.outfit = cat; cut = {cat}; },
  stopCut(){ cut = null; const s = slots['__cut']; if(s){ s.fx.clear(); } }
};

function fireEvents(slot, m, a, b){
  const run = (ev)=>{ try{ const [ , kind, arg, opt] = ev; if(kind==='text') FX.text(slot, arg, opt||{}); else if(FX[kind]) FX[kind](slot, arg); }catch(e){ console.error('효과 오류', e); } };
  m.events.forEach(ev=>{
    const te = ev[0];
    if(m.loop){
      const A = a % m.dur, B = b % m.dur;
      if(a < 0){ if(te <= B) run(ev); }
      else if(B >= A){ if(te > A && te <= B) run(ev); }
      else if(te > A || te <= B) run(ev);
    } else if(te > a && te <= b) run(ev);
  });
}

function drawSlot(slot, rect, clip, cat, mode, view, dt, expand){
  const m = MO[cat][mode];
  const k = cat+'.'+mode;
  if(slot.key !== k){ slot.key = k; slot.t = 0; slot.lastT = -1e-6; slot.fx.clear(); }
  const prevT = slot.lastT; slot.t += dt;
  const lt = m.loop ? slot.t % m.dur : Math.min(slot.t, m.dur);
  const p = sample(m, lt); proc(p, slot.t);
  // 따라오는 움직임: 몸이 튀면 머리가 한 박자 늦게 끄덕
  const vy = (p.y - slot.prevY)/Math.max(dt,1e-3); slot.prevY = p.y;
  const target = Math.max(-0.35, Math.min(0.35, -vy*0.035));
  slot.spr.v += ((target - slot.spr.x)*180 - slot.spr.v*14)*dt; slot.spr.x += slot.spr.v*dt;
  slot.blinkT -= dt; if(slot.blinkT < -0.05) slot.blinkT = 2+Math.random()*3.5;
  slot.pose = p;
  setOutfit(slot.outfit || cat); CUR_MODE = mode; CUR_VIEW = view; applyPose(p, slot, m);
  root.add(slot.fx);
  root.updateMatrixWorld(true);
  PROPS.racketHead.getWorldPosition(slot.racketPos); root.worldToLocal(slot.racketPos);
  // 셔틀콕 (라켓 실제 위치로 날아와서 맞고 날아감)
  if(m.shuttle){
    const s = m.shuttle, t = lt;
    if(t < s.tHit){ const q = t/s.tHit; PROPS.shuttle.visible = true; PROPS.shuttle.position.lerpVectors(SH_START, slot.racketPos, q); PROPS.shuttle.position.y += Math.sin(q*Math.PI)*0.8; slot.shHit.copy(slot.racketPos); }
    else if(t < s.tEnd){ const q = (t-s.tHit)/(s.tEnd-s.tHit); PROPS.shuttle.visible = true; PROPS.shuttle.position.lerpVectors(slot.shHit, SH_END, EASE.o(q)); PROPS.shuttle.position.y += Math.sin(q*Math.PI)*1.0; }
    PROPS.shuttle.rotation.z = slot.t*10;
  }
  // 목줄
  if(PROPS.leash.visible){
    handR.getWorldPosition(va); root.worldToLocal(va);
    PROPS.collar.getWorldPosition(vb); root.worldToLocal(vb);
    vc.copy(va).add(vb).multiplyScalar(0.5); vc.y -= 0.22;
    setTube(PROPS.leash, new T.QuadraticBezierCurve3(va.clone(), vc.clone(), vb.clone()), 0.014);
  }
  fireEvents(slot, m, prevT, slot.t); slot.lastT = slot.t;
  updateFx(slot, dt);
  slot.shake *= Math.exp(-dt*6);
  // 카메라
  const cam = m.cam || {x:0,far:0};
  const sh = slot.shake*0.12;
  if(view==='cut'){
    camera.fov = 36;
    camera.position.set(cam.x+1.0+(Math.random()-.5)*sh, 1.1+(Math.random()-.5)*sh, 5.6+cam.far);
    camera.aspect = rect.width/rect.height; camera.updateProjectionMatrix();
    camera.lookAt(cam.x*0.7, 1.55, 0);
  } else if(view==='big'){
    camera.fov = 32;
    camera.position.set(cam.x+0.6+(Math.random()-.5)*sh, 1.55+(Math.random()-.5)*sh, 6.6+cam.far);
    camera.aspect = rect.width/rect.height; camera.updateProjectionMatrix();
    camera.lookAt(cam.x*0.8, 1.45, 0);
  } else {
    camera.fov = 30;
    camera.position.set(cam.x+(Math.random()-.5)*sh, 1.62, 6.0+cam.far);
    camera.aspect = rect.width/rect.height; camera.updateProjectionMatrix();
    camera.lookAt(cam.x, 1.36, 0);
  }
  // 칸 위치에만 그리기 (expand면 같은 크기로 주변까지 넓혀서 효과가 칸 밖으로 튀어나옴)
  const H = window.innerHeight;
  let vr = rect;
  if(expand){
    const mg = Math.min(110, rect.height*1.0);
    vr = {left:rect.left-mg, top:rect.top-mg, width:rect.width+mg*2, height:rect.height+mg*2, bottom:rect.bottom+mg};
    camera.fov = 2*Math.atan(Math.tan(camera.fov*Math.PI/360)*vr.height/rect.height)*180/Math.PI;
    camera.aspect = vr.width/vr.height; camera.updateProjectionMatrix();
  }
  renderer.setViewport(vr.left, H-vr.bottom, vr.width, vr.height);
  const top = Math.max(vr.top, clip.top), bot = Math.min(vr.bottom, clip.bottom);
  renderer.setScissor(vr.left, H-bot, vr.width, Math.max(0, bot-top));
  renderer.clearDepth();
  renderer.render(scene, camera);
  root.remove(slot.fx);
}

/* ---------- 매 프레임 ---------- */
const clock = new T.Clock();
function frame(){
  requestAnimationFrame(frame);
  try{
    const dt = Math.min(clock.getDelta(), 0.05);
    renderer.setScissorTest(false); renderer.clear(); renderer.setScissorTest(true);
    const H = window.innerHeight, now = performance.now();
    if(cut){
      const r = $('cutSlot').getBoundingClientRect();
      if(r.width > 0) drawSlot(getSlot('__cut'), r, {top:0,bottom:H}, cut.cat, 'done', 'cut', dt);
    } else {
      let order = 0;
      document.querySelectorAll('[data-slot]').forEach(el=>{
        const r = el.getBoundingClientRect();
        const s = getSlot(el.dataset.slot);
        // 새로 나타난 칸은 위에서부터 차례로(0.18초 간격) 달려오기
        if(el.dataset.arrive && s.epoch !== window.ARRIVE_EPOCH){ s.epoch = window.ARRIVE_EPOCH; s.arriveStart = now + (order++)*180; }
        const cc = el.closest('[data-clip]'), cr = cc ? cc.getBoundingClientRect() : null;
        const clip = cr ? {top:Math.max(0,cr.top), bottom:Math.min(H,cr.bottom)} : {top:0,bottom:H};
        if(r.bottom < clip.top || r.top > clip.bottom || r.width < 2) return;   // 보이지 않는 칸은 건너뜀
        let cat = el.dataset.cat, mode = el.dataset.mode || 'prep'; s.outfit = cat;
        let expand = false;
        if(s.celeb){
          const mm = MO[s.celeb.cat].done, el2 = (now - s.celeb.start)/1000;
          if(el2 < mm.dur + 0.5){
            const kk = s.celeb.cat + '.done';
            if(s.key !== kk){ s.key = kk; s.fx.clear(); s.lastT = -1e-6; }
            s.t = el2 - dt; cat = s.celeb.cat; s.outfit = s.celeb.cat; mode = 'done'; expand = true;
          } else s.celeb = null;
        }
        if(s.celeb){}
        else if(s.pokeUntil && s.pokeUntil > now){ cat = 'poke'; mode = 'done'; }
        else if(s.arriveStart && now < s.arriveStart + 2700){
          expand = true;
          // 달려오기: 출발 시각 기준으로 시간을 맞춤 (기다리는 동안은 화면 밖)
          if(s.key !== 'arrive.done'){ s.key = 'arrive.done'; s.fx.clear(); s.lastT = -1e-6; }
          s.t = (now - s.arriveStart)/1000 - dt;
          cat = 'arrive'; mode = 'done';
        }
        if(!MO[cat]) cat = 'etc';
        const vw = el.dataset.view || 'mini';
        drawSlot(s, r, clip, cat, mode, vw, dt, expand && vw === 'mini');
      });
    }
  }catch(e){ console.error('그리기 오류', e); }
}
frame();
}
</script>

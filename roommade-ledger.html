<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>룸메이드 음성 장부</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Gothic+A1:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================
   1. 브랜드 색상
   ============================================ */
:root{
  --cream:#EDEEE7; --navy:#1D4468; --paper:#F7F8F4;
  --line:rgba(29,68,104,.16); --muted:rgba(29,68,104,.62);
  --live:#C2543D; --ok:#2E7D5B;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);color:var(--navy);
  font-family:'Gothic A1','Apple SD Gothic Neo',sans-serif;padding-bottom:70px;
}
.head{padding:24px 20px 16px;border-bottom:1px solid var(--line);}
.ver{
  display:inline-block;background:var(--navy);color:var(--cream);
  font-size:10px;font-weight:800;letter-spacing:.14em;padding:4px 10px;border-radius:999px;margin-bottom:11px;
}
.head h1{font-family:'Jost',sans-serif;font-weight:500;font-size:25px;letter-spacing:.03em;margin:0 0 8px;}
.head p{font-size:13px;line-height:1.65;color:var(--muted);margin:0;}

.dataBar{
  margin:16px 20px 0;padding:14px 15px;border-radius:12px;
  background:#fff;border:1px solid var(--line);font-size:12.5px;line-height:1.7;
}
.dataBar.good{border-color:rgba(46,125,91,.45);background:rgba(46,125,91,.07);}
.dataBar.bad{border-color:rgba(194,84,61,.4);background:rgba(194,84,61,.07);}
.dataBar b{font-weight:800;}

/* ============================================
   2. 마이크
   ============================================ */
.micWrap{padding:26px 20px 20px;text-align:center;}
.mic{
  width:132px;height:132px;border-radius:50%;border:none;
  background:var(--navy);color:var(--cream);cursor:pointer;
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  font-family:inherit;font-size:13px;font-weight:700;
  box-shadow:0 8px 26px rgba(29,68,104,.22);
}
.mic svg{width:33px;height:33px;}
.mic.live{background:var(--live);animation:pulse 1.3s ease-in-out infinite;}
.mic:focus-visible{outline:3px solid var(--navy);outline-offset:4px;}
@keyframes pulse{
  0%,100%{box-shadow:0 8px 26px rgba(194,84,61,.28);}
  50%{box-shadow:0 8px 26px rgba(194,84,61,.6),0 0 0 16px rgba(194,84,61,.09);}
}
.status{font-size:13px;color:var(--muted);margin:16px 0 0;min-height:20px;}

/* ============================================
   3. 대화
   ============================================ */
.io{padding:0 20px;display:flex;flex-direction:column;gap:14px;}
.box{border-radius:16px;padding:18px;border:1px solid var(--line);}
.box .cap{
  font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--muted);margin:0 0 10px;
}
.box.heard{background:var(--paper);}
.box.heard .txt{font-size:18px;font-weight:600;line-height:1.5;margin:0;min-height:25px;}
.box.heard .txt.empty{color:var(--muted);font-weight:400;}
.box.answer{background:var(--navy);border-color:var(--navy);color:var(--cream);}
.box.answer .cap{color:rgba(237,238,231,.6);}
.box.answer .txt{font-size:19px;font-weight:700;line-height:1.6;margin:0;}
.box.answer .big{
  font-family:'Jost',sans-serif;font-size:38px;font-weight:500;
  letter-spacing:-.01em;margin:12px 0 0;line-height:1.1;
}
.box.answer .big small{font-size:19px;margin-left:4px;font-weight:400;}
.box.answer .detail{
  margin:14px 0 0;padding-top:14px;border-top:1px solid rgba(237,238,231,.24);font-size:14.5px;
}
.box.answer .detail .ln{
  padding:7px 0;display:flex;justify-content:space-between;gap:12px;align-items:baseline;
}
.box.answer .detail .ln span:last-child{font-weight:700;flex:none;}
.replay{
  margin-top:14px;background:rgba(237,238,231,.14);border:none;border-radius:10px;
  color:var(--cream);font-family:inherit;font-size:13px;font-weight:600;padding:11px 16px;cursor:pointer;
}

/* ============================================
   4. 예시 / 설정
   ============================================ */
.chips{padding:24px 20px 0;}
.chips .label{font-size:12px;color:var(--muted);margin:0 0 12px;}
.chipRow{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:10px 15px;font-family:inherit;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;
}
.chip:active{background:var(--navy);color:var(--cream);}

.sec{padding:28px 20px 0;}
.sec h2{font-size:14px;font-weight:800;margin:0 0 12px;}
.row{
  display:flex;align-items:center;gap:11px;background:#fff;
  border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:9px;
}
.row input[type=checkbox]{width:20px;height:20px;accent-color:var(--navy);flex:none;}
.row span{font-size:13.5px;font-weight:600;}
#log{
  background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:12px;font-size:11.5px;line-height:1.7;max-height:200px;overflow:auto;
  white-space:pre-wrap;word-break:break-all;font-family:'Courier New',monospace;margin-top:10px;
}
.note{
  margin:26px 20px 0;padding:14px 16px;border-radius:12px;
  background:rgba(29,68,104,.06);font-size:12.5px;line-height:1.75;color:var(--muted);
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;}}
</style>
</head>
<body>

<header class="head">
  <span class="ver">LEDGER v1</span>
  <h1>룸메이드 음성 장부</h1>
  <p>마이크를 누르고 "이번 달 매출 얼마야" 라고 말해보세요.</p>
</header>

<div class="dataBar" id="dataBar">장부를 불러오는 중입니다…</div>

<div class="micWrap">
  <button class="mic" id="mic" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <path d="M12 19v3"/>
    </svg>
    <span id="micLabel">눌러서 말하기</span>
  </button>
  <p class="status" id="status">대기 중</p>
</div>

<div class="io">
  <div class="box heard">
    <p class="cap">들은 말</p>
    <p class="txt empty" id="heard">아직 없습니다</p>
  </div>
  <div class="box answer">
    <p class="cap">룸메이드</p>
    <p class="txt" id="answer">안녕하세요. 무엇을 알려드릴까요?</p>
    <p class="big" id="bigNum" style="display:none;"></p>
    <div class="detail" id="detail" style="display:none;"></div>
    <button class="replay" id="replay" type="button">다시 듣기</button>
  </div>
</div>

<div class="chips">
  <p class="label">눌러서도 물어볼 수 있습니다</p>
  <div class="chipRow" id="chipRow"></div>
</div>

<section class="sec">
  <h2>설정</h2>
  <label class="row"><input type="checkbox" id="speakOn" checked><span>목소리로 대답하기</span></label>
  <label class="row"><input type="checkbox" id="autoMic"><span>열자마자 마이크 켜기</span></label>
  <label class="row"><input type="checkbox" id="showLog"><span>기록창 보기</span></label>
  <div id="logWrap" style="display:none;"><div id="log"></div></div>
</section>

<p class="note">
  룸메이드 캐쉬가 이 폰에 저장해 둔 장부를 그대로 읽습니다. 새 기록이 안 보이면 룸메이드 캐쉬를 먼저 열었다 나온 뒤 새로고침해 주세요.
</p>

<script>
/* ============================================
   5. 기본값
   ============================================ */
var KEY_TX   = '룸메이드캐쉬-거래내역';
var KEY_ROOM = '룸메이드캐쉬-객실';
var KEY_SET  = 'roommade-ledger-set';

var TX = [];
var lastSpeak = '';
var listening = false;
var rec = null;

/* ============================================
   6. 기록
   ============================================ */
function log(msg){
  try{
    var box = document.getElementById('log');
    if (!box) return;
    var t = new Date();
    var d = document.createElement('div');
    d.textContent = '[' + ('0'+t.getMinutes()).slice(-2) + ':' + ('0'+t.getSeconds()).slice(-2) + '] ' + msg;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }catch(e){}
}

/* ============================================
   7. 날짜 · 돈 도구
   ============================================ */
function ymd(d){
  return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
}
function shift(n){ var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+n); return d; }
function monthStart(offset){
  var d = new Date(); d.setHours(0,0,0,0);
  d.setDate(1); d.setMonth(d.getMonth() + offset);
  return d;
}
function monthEnd(offset){
  var d = monthStart(offset + 1);
  d.setDate(0);
  return d;
}

// 큰 숫자를 사람이 읽는 말로 (12,340,000 → 1234만원)
function money(n){
  try{
    n = Math.round(Number(n) || 0);
    if (n === 0) return '0원';
    var neg = n < 0;
    n = Math.abs(n);
    var s;
    if (n >= 100000000){
      var eok = Math.floor(n / 100000000);
      var man = Math.floor((n % 100000000) / 10000);
      s = eok + '억' + (man ? ' ' + man.toLocaleString() + '만' : '') + '원';
    } else if (n >= 10000){
      var m = Math.floor(n / 10000);
      var rest = n % 10000;
      s = m.toLocaleString() + '만' + (rest ? ' ' + rest.toLocaleString() : '') + '원';
    } else {
      s = n.toLocaleString() + '원';
    }
    return (neg ? '마이너스 ' : '') + s;
  }catch(e){ return '0원'; }
}
function won(n){
  try{ return (Math.round(Number(n)||0)).toLocaleString() + '원'; }
  catch(e){ return '0원'; }
}

/* ============================================
   8. 장부 불러오기
   ============================================ */
function loadTx(){
  var bar = document.getElementById('dataBar');
  try{
    var raw = localStorage.getItem(KEY_TX);
    if (!raw){
      bar.className = 'dataBar bad';
      bar.innerHTML = '<b>장부를 찾지 못했습니다.</b><br>룸메이드 캐쉬와 같은 주소에서 열어야 합니다.';
      TX = [];
      return;
    }
    var data = JSON.parse(raw);
    if (!Array.isArray(data)) data = [];

    TX = data.filter(function(t){ return t && t.date; }).map(function(t){
      return {
        date:   String(t.date).slice(0,10),
        month:  t.billingMonth || String(t.date).slice(0,7),
        amount: Number(t.amount) || 0,
        net:    Number(t.netAmount != null ? t.netAmount : t.amount) || 0,
        tax:    Number(t.taxAmount) || 0,
        type:   t.type || '',
        branch: t.branch || '',
        paid:   t.paid === true,
        status: t.status || '',
        target: t.targetName || ''
      };
    });

    TX.sort(function(a,b){ return a.date.localeCompare(b.date); });

    var first = TX.length ? TX[0].date : '';
    var last  = TX.length ? TX[TX.length-1].date : '';
    bar.className = 'dataBar good';
    bar.innerHTML = '<b>장부 ' + TX.length + '건</b>을 읽었습니다.<br>기간: ' + first + ' ~ ' + last;
    log('장부 ' + TX.length + '건');
  }catch(e){
    bar.className = 'dataBar bad';
    bar.innerHTML = '<b>장부를 읽지 못했습니다.</b><br>' + e.message;
    TX = [];
  }
}

/* ============================================
   9. 말에서 기간 뽑기
   ============================================ */
function parseRange(text){
  var t = text.replace(/\s/g,''), m;

  m = t.match(/(\d{1,2})월/);
  if (m && !/개월/.test(t)){
    var mo = parseInt(m[1],10);
    var now = new Date();
    var y = now.getFullYear();
    if (mo > now.getMonth()+1) y = y - 1;  // 아직 안 온 달이면 작년으로
    var s = new Date(y, mo-1, 1);
    var e = new Date(y, mo, 0);
    return { from:ymd(s), to:ymd(e), label:mo + '월' };
  }

  if (/이번달|이달|당월|금월/.test(t))
    return { from:ymd(monthStart(0)), to:ymd(monthEnd(0)), label:'이번 달' };
  if (/지난달|저번달|전달/.test(t))
    return { from:ymd(monthStart(-1)), to:ymd(monthEnd(-1)), label:'지난달' };
  if (/저저번달|두달전/.test(t))
    return { from:ymd(monthStart(-2)), to:ymd(monthEnd(-2)), label:'두 달 전' };
  if (/오늘/.test(t))
    return { from:ymd(shift(0)), to:ymd(shift(0)), label:'오늘' };
  if (/어제/.test(t))
    return { from:ymd(shift(-1)), to:ymd(shift(-1)), label:'어제' };
  if (/이번주/.test(t)){
    var dow = new Date().getDay();
    return { from:ymd(shift(-dow)), to:ymd(shift(6-dow)), label:'이번 주' };
  }
  if (/지난주|저번주/.test(t)){
    var d2 = new Date().getDay();
    return { from:ymd(shift(-d2-7)), to:ymd(shift(-d2-1)), label:'지난주' };
  }
  if (/올해|금년/.test(t)){
    var y2 = new Date().getFullYear();
    return { from:y2 + '-01-01', to:y2 + '-12-31', label:'올해' };
  }
  if (/전체|다|누적|총/.test(t))
    return { from:'0000-00-00', to:'9999-99-99', label:'전체' };

  return { from:ymd(monthStart(0)), to:ymd(monthEnd(0)), label:'이번 달' };
}

function parseBranch(text){
  var t = text.replace(/\s/g,'');
  if (/영종/.test(t)) return '영종';
  if (/송도/.test(t)) return '송도';
  return null;
}

// 무엇을 묻는지
function parseWhat(text){
  var t = text.replace(/\s/g,'');
  if (/미지급|안준|못준|미정산|남은거|줄돈/.test(t)) return 'unpaid';
  if (/지출|나간돈|쓴돈|비용|인건비/.test(t))        return 'expense';
  if (/순익|순수익|남은|이익|마진/.test(t))          return 'profit';
  if (/세금|원천/.test(t))                           return 'tax';
  if (/건수|몇건|몇번|횟수/.test(t))                 return 'count';
  return 'income';
}

/* ============================================
   10. 답 만들기
   ============================================ */
function answerFor(text){
  var range  = parseRange(text);
  var branch = parseBranch(text);
  var what   = parseWhat(text);

  if (!TX.length){
    var no = '장부를 읽지 못했습니다.';
    return { speak:no, text:no, big:'', rows:[] };
  }

  var rows = TX.filter(function(t){
    if (t.date < range.from || t.date > range.to) return false;
    if (branch && String(t.branch).indexOf(branch) < 0) return false;
    return true;
  });

  var who = branch ? branch + ' ' : '';

  if (!rows.length){
    var none = range.label + ' ' + who + '기록이 없습니다.';
    return { speak:none, text:none, big:'', rows:[] };
  }

  var income  = 0, expense = 0, tax = 0, unpaid = 0, unpaidN = 0;
  var byBranch = {};

  rows.forEach(function(t){
    if (t.type === 'income'){ income += t.amount; }
    else { expense += t.amount; }
    tax += t.tax;
    if (!t.paid){ unpaid += t.amount; unpaidN++; }

    var b = t.branch || '기타';
    if (!byBranch[b]) byBranch[b] = { in:0, out:0, n:0 };
    if (t.type === 'income') byBranch[b].in += t.amount;
    else byBranch[b].out += t.amount;
    byBranch[b].n++;
  });

  var head, big, spoken, detail = [];

  if (what === 'unpaid'){
    head = range.label + ' ' + who + '미지급';
    big  = won(unpaid);
    spoken = head + '은 ' + money(unpaid) + ', ' + unpaidN + '건입니다.';
    detail.push(['미지급 건수', unpaidN + '건']);
    detail.push(['전체 건수', rows.length + '건']);
  }
  else if (what === 'expense'){
    head = range.label + ' ' + who + '지출';
    big  = won(expense);
    spoken = head + '은 ' + money(expense) + '입니다.';
    detail.push(['건수', rows.length + '건']);
  }
  else if (what === 'profit'){
    head = range.label + ' ' + who + '순익';
    big  = won(income - expense);
    spoken = head + '은 ' + money(income - expense) + '입니다.';
    detail.push(['수입', won(income)]);
    detail.push(['지출', won(expense)]);
  }
  else if (what === 'tax'){
    head = range.label + ' ' + who + '세금';
    big  = won(tax);
    spoken = head + '은 ' + money(tax) + '입니다.';
    detail.push(['건수', rows.length + '건']);
  }
  else if (what === 'count'){
    head = range.label + ' ' + who + '기록';
    big  = rows.length + '건';
    spoken = head + '은 모두 ' + rows.length + '건입니다.';
    detail.push(['수입', won(income)]);
    detail.push(['지출', won(expense)]);
  }
  else {
    head = range.label + ' ' + who + '수입';
    big  = won(income);
    spoken = head + '은 ' + money(income) + ', ' + rows.length + '건입니다.';
    detail.push(['지출', won(expense)]);
    detail.push(['순익', won(income - expense)]);
    if (unpaidN) detail.push(['미지급', won(unpaid) + ' (' + unpaidN + '건)']);
  }

  // 지점을 안 물었으면 지점별로 나눠 보여주기
  if (!branch){
    var bk = Object.keys(byBranch);
    if (bk.length > 1){
      bk.forEach(function(b){
        detail.push([b, won(byBranch[b].in) + ' / ' + byBranch[b].n + '건']);
      });
    }
  }

  return { speak:spoken, text:head, big:big, rows:detail };
}

/* ============================================
   11. 표시 + 읽어주기
   ============================================ */
function respond(text){
  try{
    var hd = document.getElementById('heard');
    hd.textContent = text; hd.classList.remove('empty');

    var res = answerFor(text);
    document.getElementById('answer').textContent = res.text;

    var bn = document.getElementById('bigNum');
    if (res.big){ bn.textContent = res.big; bn.style.display = 'block'; }
    else bn.style.display = 'none';

    var det = document.getElementById('detail');
    det.innerHTML = '';
    if (res.rows && res.rows.length){
      res.rows.forEach(function(r){
        var ln = document.createElement('div');
        ln.className = 'ln';
        var a = document.createElement('span'); a.textContent = r[0];
        var b = document.createElement('span'); b.textContent = r[1];
        ln.appendChild(a); ln.appendChild(b);
        det.appendChild(ln);
      });
      det.style.display = 'block';
    } else det.style.display = 'none';

    lastSpeak = res.speak;
    log('답변: ' + res.speak);
    if (document.getElementById('speakOn').checked) speak(res.speak);
  }catch(e){
    log('답변 실패: ' + e.message);
    setStatus('답을 만들지 못했습니다');
  }
}

function speak(msg){
  try{
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var go = function(){
      var u = new SpeechSynthesisUtterance(msg);
      u.lang = 'ko-KR'; u.rate = 1.02;
      var vs = window.speechSynthesis.getVoices();
      for (var i = 0; i < vs.length; i++){
        if (vs[i].lang && vs[i].lang.indexOf('ko') === 0){ u.voice = vs[i]; break; }
      }
      window.speechSynthesis.speak(u);
    };
    if (window.speechSynthesis.getVoices().length === 0) setTimeout(go, 350);
    else go();
  }catch(e){}
}

/* ============================================
   12. 음성인식 (on- 방식 고정)
   ============================================ */
function setStatus(s){ var el = document.getElementById('status'); if (el) el.textContent = s; }
function setLive(on){
  listening = on;
  document.getElementById('mic').classList.toggle('live', on);
  document.getElementById('micLabel').textContent = on ? '듣는 중' : '눌러서 말하기';
}

function startListen(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ setStatus('크롬으로 열어주세요.'); return; }
  try{
    if (rec){ try{ rec.abort(); }catch(e){} rec = null; }
    window.speechSynthesis && window.speechSynthesis.cancel();

    rec = new SR();
    rec.lang = 'ko-KR'; rec.continuous = false; rec.interimResults = true;

    rec.onstart = function(){ setLive(true); setStatus('말씀하세요'); };
    rec.onspeechstart = function(){ setStatus('듣는 중...'); };
    rec.onresult = function(ev){
      try{
        var txt = '', fin = false, i;
        for (i = ev.resultIndex; i < ev.results.length; i++){
          txt += ev.results[i][0].transcript;
          if (ev.results[i].isFinal) fin = true;
        }
        var hd = document.getElementById('heard');
        hd.textContent = txt; hd.classList.remove('empty');
        if (fin && txt.trim()){ setStatus('처리 중'); respond(txt.trim()); }
      }catch(e){ log('결과 오류: ' + e.message); }
    };
    rec.onerror = function(ev){
      setLive(false);
      if (ev.error === 'not-allowed')      setStatus('마이크 권한이 필요합니다.');
      else if (ev.error === 'no-speech')   setStatus('소리를 못 들었습니다. 다시 눌러주세요.');
      else if (ev.error === 'network')     setStatus('인터넷 연결을 확인해 주세요.');
      else if (ev.error === 'aborted')     setStatus('대기 중');
      else setStatus('오류: ' + ev.error);
    };
    rec.onend = function(){
      setLive(false);
      if (document.getElementById('status').textContent === '말씀하세요') setStatus('대기 중');
    };
    rec.start();
  }catch(e){ setLive(false); setStatus('다시 눌러주세요'); }
}

function toggleMic(){
  if (listening){ try{ if (rec) rec.stop(); }catch(e){} setLive(false); }
  else startListen();
}

/* ============================================
   13. 예시 질문
   ============================================ */
var EXAMPLES = [
  '이번 달 매출',
  '지난달 매출',
  '이번 달 지출',
  '이번 달 순익',
  '미지급 얼마야',
  '영종 이번 달',
  '송도 지난달',
  '이번 주 매출',
  '이번 달 몇 건',
  '올해 매출',
  '이번 달 세금',
  '7월 매출'
];

function buildChips(){
  try{
    var row = document.getElementById('chipRow');
    EXAMPLES.forEach(function(q){
      var b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = q;
      b.onclick = function(){ respond(q); };
      row.appendChild(b);
    });
  }catch(e){}
}

/* ============================================
   14. 설정 저장
   ============================================ */
function saveSet(){
  try{
    localStorage.setItem(KEY_SET, JSON.stringify({
      speakOn: document.getElementById('speakOn').checked,
      autoMic: document.getElementById('autoMic').checked,
      showLog: document.getElementById('showLog').checked
    }));
  }catch(e){}
}
function loadSet(){
  try{
    var raw = localStorage.getItem(KEY_SET);
    if (!raw) return;
    var d = JSON.parse(raw);
    document.getElementById('speakOn').checked = d.speakOn !== false;
    document.getElementById('autoMic').checked = !!d.autoMic;
    document.getElementById('showLog').checked = !!d.showLog;
  }catch(e){}
}

/* ============================================
   15. 시작
   ============================================ */
function boot(){
  try{
    loadSet();
    buildChips();
    loadTx();

    document.getElementById('mic').onclick = toggleMic;
    document.getElementById('replay').onclick = function(){ if (lastSpeak) speak(lastSpeak); };
    document.getElementById('speakOn').onchange = saveSet;
    document.getElementById('autoMic').onchange = saveSet;
    document.getElementById('showLog').onchange = function(){
      document.getElementById('logWrap').style.display = this.checked ? 'block' : 'none';
      saveSet();
    };
    if (document.getElementById('showLog').checked){
      document.getElementById('logWrap').style.display = 'block';
    }

    if (location.protocol !== 'https:') setStatus('https 주소로 열어야 마이크가 켜집니다');

    if (document.getElementById('autoMic').checked){
      setTimeout(function(){ if (!listening) startListen(); }, 900);
    }
  }catch(e){ alert('시작 실패: ' + e.message); }
}

document.addEventListener('DOMContentLoaded', boot);
</script>

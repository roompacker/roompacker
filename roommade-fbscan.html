<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Firebase 탐색기 v2</title>
<style>
:root{
  --cream:#EDEEE7; --navy:#1D4468; --paper:#F7F8F4;
  --line:rgba(29,68,104,.18); --muted:rgba(29,68,104,.62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);color:var(--navy);
  font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding-bottom:50px;
}
.head{padding:24px 18px 18px;border-bottom:1px solid var(--line);}
.ver{
  display:inline-block;background:var(--navy);color:var(--cream);
  font-size:11px;font-weight:800;letter-spacing:.1em;padding:4px 10px;border-radius:999px;margin-bottom:11px;
}
.head h1{font-size:20px;font-weight:800;margin:0 0 8px;}
.head p{font-size:13px;line-height:1.65;color:var(--muted);margin:0;}

.sec{padding:22px 18px 0;}
.sec h2{font-size:14px;font-weight:800;margin:0 0 6px;}
.sec .why{font-size:12px;line-height:1.6;color:var(--muted);margin:0 0 11px;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px;}
.field input{
  width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;
  background:#fff;color:var(--navy);font-family:inherit;font-size:13.5px;
}
.field input:focus{outline:2px solid var(--navy);outline-offset:-1px;}
.big{
  width:100%;border:none;border-radius:13px;background:var(--navy);color:var(--cream);
  font-family:inherit;font-size:15px;font-weight:800;padding:16px;cursor:pointer;margin-top:8px;
}
.big.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
.big:active{opacity:.82;}
.big[disabled]{opacity:.5;}
.big:focus-visible{outline:3px solid var(--navy);outline-offset:2px;}

#out{
  background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:14px;font-size:12px;line-height:1.75;margin-top:14px;
  min-height:150px;max-height:65vh;overflow:auto;
  white-space:pre-wrap;word-break:break-all;font-family:'Courier New',monospace;
}
.note{
  margin:24px 18px 0;padding:14px 16px;border-radius:12px;
  background:rgba(29,68,104,.06);font-size:12.5px;line-height:1.75;color:var(--muted);
}
</style>
</head>
<body>

<header class="head">
  <span class="ver">SCAN v2</span>
  <h1>Firebase 탐색기</h1>
  <p>예약이 실제로 어디에 몇 건 들어있는지 찾아냅니다. 손님 이름 같은 개인정보는 자동으로 가려집니다.</p>
</header>

<section class="sec">
  <h2>1. 폰 저장분 전체 뒤지기</h2>
  <p class="why">가장 유력한 방법입니다. 저장된 모든 항목을 열어 예약처럼 생긴 것을 찾습니다.</p>
  <button class="big" id="run1" type="button">예약 찾기</button>
</section>

<section class="sec">
  <h2>2. 파일 속 firebase 부분 보기</h2>
  <p class="why">룸메이드원이 클라우드와 어떻게 대화하는지 그 부분만 꺼내 봅니다.</p>
  <div class="field">
    <label for="file">파일 이름</label>
    <input id="file" type="text" value="roommade-one.html">
  </div>
  <button class="big alt" id="run2" type="button">해당 부분 보기</button>
</section>

<section class="sec">
  <button class="big alt" id="copy" type="button">결과 복사</button>
  <div id="out">여기에 결과가 나옵니다.</div>
</section>

<p class="note">
  1번을 먼저 눌러주세요. 여기서 예약이 많이 나오면 클라우드 연결 없이도 해결됩니다.
</p>

<script>
/* ============================================
   1. 출력
   ============================================ */
var out = [];
function p(m){
  out.push(m);
  var box = document.getElementById('out');
  box.textContent = out.join('\n');
  box.scrollTop = box.scrollHeight;
}
function clear(){ out = []; document.getElementById('out').textContent = ''; }

/* ============================================
   2. 예약처럼 생겼는지 판단
   ============================================ */
function looksLikeEvent(o){
  try{
    if (!o || typeof o !== 'object' || Array.isArray(o)) return false;
    var hasDate = !!(o.start || o.checkInDate || o.checkin || o.date || o.from || o.시작일);
    var hasRoom = !!(o.property || o.room || o.roomName || o.객실 || o.name);
    var hasTime = !!(o.checkIn || o.checkOut);
    return hasDate && (hasRoom || hasTime);
  }catch(e){ return false; }
}

function flatten(data, depth, acc){
  acc = acc || [];
  if (!data || depth > 5) return acc;
  if (looksLikeEvent(data)){ acc.push(data); return acc; }
  if (Array.isArray(data)){
    data.forEach(function(x){
      if (looksLikeEvent(x)) acc.push(x);
      else if (x && typeof x === 'object') flatten(x, depth+1, acc);
    });
    return acc;
  }
  if (typeof data === 'object'){
    Object.keys(data).forEach(function(k){
      var v = data[k];
      if (looksLikeEvent(v)) acc.push(v);
      else if (v && typeof v === 'object') flatten(v, depth+1, acc);
    });
  }
  return acc;
}

function normDate(v){
  if (!v) return '';
  var m = String(v).match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})/);
  if (m) return m[1] + '-' + ('0'+m[2]).slice(-2) + '-' + ('0'+m[3]).slice(-2);
  return '';
}

/* ============================================
   3. 폰 저장분 전체 뒤지기
   ============================================ */
function scanLocal(){
  var btn = document.getElementById('run1');
  clear();
  p('=== 1. 폰 저장분 전체 뒤지기 ===');
  p('');
  btn.disabled = true;
  btn.textContent = '찾는 중...';

  try{
    var keys = [], i;
    for (i = 0; i < localStorage.length; i++){
      var k = localStorage.key(i);
      if (k) keys.push(k);
    }
    keys.sort();
    p('저장된 항목: ' + keys.length + '개');
    p('');

    var best = null;

    keys.forEach(function(key){
      var raw = '';
      try{ raw = localStorage.getItem(key) || ''; }catch(e){ return; }
      var kb = Math.round(raw.length/1024*10)/10;

      var data;
      try{ data = JSON.parse(raw); }
      catch(e){ p(key + '  (' + kb + ' KB) → 글자자료, 건너뜀'); return; }

      var list = flatten(data, 0, []);
      if (!list.length){
        p(key + '  (' + kb + ' KB) → 예약 없음');
        return;
      }

      // 날짜 범위 계산
      var dates = [];
      var props = {};
      list.forEach(function(e){
        var d = normDate(e.start || e.checkInDate || e.date || e.from);
        if (d) dates.push(d);
        var pr = e.property || e.room || e.roomName || e.객실 || '';
        if (pr) props[String(pr)] = (props[String(pr)] || 0) + 1;
      });
      dates.sort();

      p('');
      p('★ ' + key + '  (' + kb + ' KB)');
      p('   예약 ' + list.length + '건');
      if (dates.length) p('   기간: ' + dates[0] + ' ~ ' + dates[dates.length-1]);

      var pk = Object.keys(props);
      p('   객실 종류: ' + pk.length + '개');
      pk.slice(0, 12).forEach(function(n){
        p('     - ' + n + ' (' + props[n] + '건)');
      });
      if (pk.length > 12) p('     … 외 ' + (pk.length-12) + '개');

      // 첫 예약의 항목 이름만
      var f = list[0];
      p('   기록 항목: ' + Object.keys(f).slice(0,20).join(', '));

      if (!best || list.length > best.n) best = { key:key, n:list.length };
    });

    p('');
    p('--------------------------------');
    if (best) p('가장 유력한 곳: ' + best.key + ' (' + best.n + '건)');
    else p('예약을 찾지 못했습니다.');
    p('=== 1번 끝 ===');

  }catch(e){
    p('실패: ' + e.message);
  }

  btn.disabled = false;
  btn.textContent = '예약 찾기';
}

/* ============================================
   4. 파일 속 firebase 부분 보기
   ============================================ */
function peekFile(){
  var btn = document.getElementById('run2');
  var file = (document.getElementById('file').value || '').trim();

  p('');
  p('=== 2. 파일 속 firebase 부분 ===');
  p('파일: ' + file);

  btn.disabled = true;
  btn.textContent = '읽는 중...';

  fetch(file, { cache:'no-store' }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function(html){
    p('크기: ' + Math.round(html.length/1024) + ' KB');
    p('');

    // firebase 주변 문맥
    p('[firebase 라는 글자 주변]');
    var idx = -1, cnt = 0;
    while ((idx = html.toLowerCase().indexOf('firebase', idx + 1)) >= 0 && cnt < 6){
      cnt++;
      var s = Math.max(0, idx - 140);
      var e = Math.min(html.length, idx + 200);
      p('  ── ' + cnt + '번째 ──');
      p('  ' + clean(html.slice(s, e)));
      p('');
    }
    if (!cnt) p('  없음');

    // .json 요청 부분
    p('[.json 이 나오는 곳]');
    var re = /.{100}\.json.{60}/g, m, n = 0;
    while ((m = re.exec(html)) !== null && n < 6){
      n++;
      p('  ── ' + n + ' ──');
      p('  ' + clean(m[0]));
      p('');
    }
    if (!n) p('  없음 → 클라우드에 직접 요청하지 않습니다');

    // 다른 서버로 보내는지
    p('[바깥으로 보내는 주소]');
    var urls = html.match(/https:\/\/[a-zA-Z0-9._\-]+\.[a-z]{2,}[^"'`\s)]*/g) || [];
    var uniq = {};
    urls.forEach(function(u){
      var host = u.split('/')[2];
      if (/fonts|gstatic|cdnjs|jsdelivr|unpkg|w3\.org/.test(host)) return;
      uniq[host] = 1;
    });
    var uk = Object.keys(uniq);
    if (uk.length) uk.slice(0,15).forEach(function(u){ p('  ' + u); });
    else p('  없음');

    p('');
    p('=== 2번 끝. 결과 복사해 주세요 ===');
  }).catch(function(err){
    p('읽기 실패: ' + err.message);
  }).then(function(){
    btn.disabled = false;
    btn.textContent = '해당 부분 보기';
  });

  // 줄바꿈 정리 + 긴 열쇠값 가리기
  function clean(s){
    try{
      return String(s)
        .replace(/\s+/g, ' ')
        .replace(/AIza[0-9A-Za-z_\-]{20,}/g, 'AIza****가림****')
        .replace(/[A-Za-z0-9_\-]{40,}/g, '****긴값가림****')
        .trim();
    }catch(e){ return ''; }
  }
}

/* ============================================
   5. 복사
   ============================================ */
function copyOut(){
  try{
    var text = out.join('\n');
    if (!text){ alert('먼저 분석을 실행해 주세요.'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ alert('복사했습니다.'); })
        .catch(function(){ alert('복사 실패. 화면을 캡처해 주세요.'); });
    } else alert('복사 기능을 쓸 수 없습니다. 화면을 캡처해 주세요.');
  }catch(e){ alert('복사 실패. 화면을 캡처해 주세요.'); }
}

/* ============================================
   6. 시작
   ============================================ */
function boot(){
  try{
    document.getElementById('run1').onclick = scanLocal;
    document.getElementById('run2').onclick = peekFile;
    document.getElementById('copy').onclick = copyOut;
  }catch(e){ alert('시작 실패: ' + e.message); }
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>

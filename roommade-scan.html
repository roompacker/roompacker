<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>데이터 구조 분석기</title>
<style>
:root{
  --cream:#EDEEE7; --navy:#1D4468; --paper:#F7F8F4;
  --line:rgba(29,68,104,.18); --muted:rgba(29,68,104,.62);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);color:var(--navy);
  font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  padding-bottom:50px;
}
.head{padding:26px 18px 20px;border-bottom:1px solid var(--line);}
.head h1{font-size:21px;font-weight:800;margin:0 0 8px;}
.head p{font-size:13px;line-height:1.65;color:var(--muted);margin:0;}

.sec{padding:22px 18px 0;}
.sec h2{font-size:14px;font-weight:800;margin:0 0 11px;}
select{
  width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;
  background:#fff;color:var(--navy);font-family:inherit;font-size:14.5px;font-weight:600;
}
.big{
  width:100%;border:none;border-radius:13px;background:var(--navy);color:var(--cream);
  font-family:inherit;font-size:15.5px;font-weight:800;padding:17px;cursor:pointer;margin-top:12px;
}
.big.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
.big:active{opacity:.82;}
.big:focus-visible{outline:3px solid var(--navy);outline-offset:2px;}

#out{
  background:#fff;border:1px solid var(--line);border-radius:13px;
  padding:14px;font-size:12px;line-height:1.75;margin-top:14px;
  min-height:140px;max-height:60vh;overflow:auto;
  white-space:pre-wrap;word-break:break-all;
  font-family:'Courier New',monospace;
}
.note{
  margin:24px 18px 0;padding:14px 16px;border-radius:12px;
  background:rgba(29,68,104,.06);font-size:12.5px;line-height:1.75;color:var(--muted);
}
</style>
</head>
<body>

<header class="head">
  <h1>데이터 구조 분석기</h1>
  <p>예약 데이터가 어떤 모양으로 저장돼 있는지만 뽑아냅니다. 손님 이름·연락처 같은 개인정보는 자동으로 가려집니다.</p>
</header>

<section class="sec">
  <h2>1. 분석할 항목 고르기</h2>
  <select id="pick"></select>
  <button class="big" id="run" type="button">구조 분석하기</button>
  <button class="big alt" id="copy" type="button">결과 복사</button>
  <div id="out">여기에 결과가 나옵니다.</div>
</section>

<p class="note">
  결과를 복사해서 클로에게 붙여넣어 주세요. 값이 아니라 <b>형식</b>만 보면 됩니다.
</p>

<script>
/* ============================================
   1. 개인정보 가리기
   ============================================ */
var SECRET = /(이름|성명|name|guest|고객|연락처|전화|폰|phone|tel|mobile|이메일|email|주소|address|메모|memo|비밀|password|token|key)/i;

function maskValue(key, v){
  try{
    if (v === null) return 'null';
    var t = typeof v;

    if (t === 'number')  return '숫자 (예: ' + v + ')';
    if (t === 'boolean') return '참거짓 (예: ' + v + ')';

    if (t === 'string'){
      // 사진 데이터는 통째로 생략
      if (v.indexOf('data:image') === 0) return '사진데이터 (길이 ' + v.length + ')';
      if (v.length > 300) return '긴글 (길이 ' + v.length + ')';
      if (SECRET.test(key)) return '개인정보 (가림, 길이 ' + v.length + ')';
      if (v.length > 40) return '글자 (길이 ' + v.length + ')';
      return '글자 "' + v + '"';
    }

    if (Array.isArray(v)) return '목록 [' + v.length + '개]';
    if (t === 'object')   return '묶음 {' + Object.keys(v).length + '개 항목}';
    return t;
  }catch(e){ return '알수없음'; }
}

/* ============================================
   2. 구조 뽑기
   ============================================ */
function describe(obj, indent, out, depth){
  var pad = new Array(indent + 1).join('  ');

  if (depth > 3){ out.push(pad + '… (더 깊은 곳 생략)'); return; }

  if (Array.isArray(obj)){
    out.push(pad + '목록: 모두 ' + obj.length + '개');
    if (obj.length === 0) return;
    out.push(pad + '첫 번째 것의 모양 ↓');
    describe(obj[0], indent + 1, out, depth + 1);
    return;
  }

  if (obj && typeof obj === 'object'){
    var keys = Object.keys(obj);
    keys.slice(0, 30).forEach(function(k){
      var v = obj[k];
      if (Array.isArray(v)){
        out.push(pad + k + ' : 목록 [' + v.length + '개]');
        if (v.length && typeof v[0] === 'object' && depth < 3){
          out.push(pad + '  └ 항목 하나의 모양 ↓');
          describe(v[0], indent + 2, out, depth + 1);
        }
      } else if (v && typeof v === 'object'){
        out.push(pad + k + ' : 묶음');
        if (depth < 3) describe(v, indent + 1, out, depth + 1);
      } else {
        out.push(pad + k + ' : ' + maskValue(k, v));
      }
    });
    if (keys.length > 30) out.push(pad + '… 외 ' + (keys.length - 30) + '개 더');
    return;
  }

  out.push(pad + maskValue('', obj));
}

/* ============================================
   3. 실행
   ============================================ */
var lastResult = '';

function run(){
  try{
    var key = document.getElementById('pick').value;
    var box = document.getElementById('out');
    if (!key){ box.textContent = '항목을 골라주세요.'; return; }

    var raw = localStorage.getItem(key);
    if (raw === null){ box.textContent = '내용이 없습니다.'; return; }

    var out = [];
    out.push('항목 이름: ' + key);
    out.push('크기: ' + Math.round(raw.length / 1024 * 10) / 10 + ' KB');
    out.push('');

    var data;
    try{
      data = JSON.parse(raw);
    }catch(e){
      out.push('형식: 그냥 글자 (JSON 아님)');
      out.push('내용: ' + raw.slice(0, 200));
      finish(out);
      return;
    }

    out.push('형식: ' + (Array.isArray(data) ? '목록' : typeof data));
    out.push('--------------------------------');
    describe(data, 0, out, 0);

    // 날짜처럼 보이는 값 찾아주기
    out.push('--------------------------------');
    out.push('날짜 형식 찾기:');
    var m = raw.match(/"\d{4}-\d{2}-\d{2}"/);
    if (m) out.push('  발견: ' + m[0] + '  (예: 2026-08-23 모양)');
    else {
      var m2 = raw.match(/"\d{4}[./]\d{1,2}[./]\d{1,2}"/);
      if (m2) out.push('  발견: ' + m2[0]);
      else out.push('  못 찾음');
    }

    finish(out);
  }catch(e){
    document.getElementById('out').textContent = '분석 실패: ' + e.message;
  }

  function finish(arr){
    lastResult = arr.join('\n');
    document.getElementById('out').textContent = lastResult;
  }
}

/* ============================================
   4. 목록 채우기
   ============================================ */
function fillPicker(){
  try{
    var sel = document.getElementById('pick');
    var items = [], i, k, v;
    for (i = 0; i < localStorage.length; i++){
      k = localStorage.key(i);
      if (!k) continue;
      try{ v = localStorage.getItem(k) || ''; }catch(e){ v = ''; }
      items.push({ k:k, size:v.length });
    }
    // 큰 것부터 (예약 데이터일 확률이 높음)
    items.sort(function(a,b){ return b.size - a.size; });

    if (!items.length){
      var o = document.createElement('option');
      o.value = ''; o.textContent = '저장된 자료가 없습니다';
      sel.appendChild(o);
      return;
    }

    items.forEach(function(it){
      var o = document.createElement('option');
      o.value = it.k;
      o.textContent = it.k + '  (' + Math.round(it.size/1024*10)/10 + ' KB)';
      sel.appendChild(o);
    });
  }catch(e){
    document.getElementById('out').textContent = '목록 불러오기 실패: ' + e.message;
  }
}

/* ============================================
   5. 복사
   ============================================ */
function copyOut(){
  try{
    if (!lastResult){ alert('먼저 구조 분석하기를 눌러주세요.'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(lastResult).then(function(){
        alert('복사했습니다. 클로에게 붙여넣어 주세요.');
      }).catch(function(){ alert('복사 실패. 화면을 캡처해 주세요.'); });
    } else {
      alert('복사 기능을 쓸 수 없습니다. 화면을 캡처해 주세요.');
    }
  }catch(e){ alert('복사 실패. 화면을 캡처해 주세요.'); }
}

/* ============================================
   6. 시작
   ============================================ */
function boot(){
  try{
    fillPicker();
    document.getElementById('run').onclick = run;
    document.getElementById('copy').onclick = copyOut;
  }catch(e){
    alert('시작 실패: ' + e.message);
  }
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
